al-2022-26","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":26,"question":"厚生労働省の「労働災害の防止のための業務に従事する者に対する能力向上 教育に関する指針」における能力向上教育及びその実施に当たっての留意事項 に関する次の記述のうち、適切でないものはどれか。","options":["この指針による能力向上教育の対象者には、衛生管理者、安全衛生推進者、 衛生推進者のほか、作業主任者、元方安全衛生管理者、店社安全衛生管理者 が含まれる。","能力向上教育の実施者は事業者であるが、事業者自らが行うほか、安全衛 生団体等に委託して実施することができる。","事業場において機械設備等に大幅な変更があった時に行う随時の能力向上 教育を実施した場合には、社会経済情勢の変化に対応して一定期間ごとに行 う定期の能力向上教育を実施したものとみなして取り扱うことができる。","衛生管理者については、衛生管理者免許の取得により衛生管理者の業務に 必要な最小限度の能力を有していることから、当該免許の取得から初めて衛 生管理者に選任されるまでの期間が６か月以内の場合は、初任時の能力向上 教育は要しないものとされている。","作業主任者については、労働災害の防止のための業務が比較的限定される ことから、初任時の能力向上教育は要しないものとされているが、資格取得 から初めて作業主任者に選任されるまでの期間が長期に及ぶ場合は、選任時 に定期又は随時の能力向上教育を実施する。"],"correctIndex":3,"tags":["安全衛生管理・教育"],"examLawDate":"2022-04-01","category":"安全衛生管理・教育","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理・教育","point":"公式公表正答は（4）。論点は「安全衛生管理・教育」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（4）。","choicesExplain":"（1）— 非正答肢\n　この指針による能力向上教育の対象者には、衛生管理者、安全衛生推進者、 衛生推進者のほか、作業主任者、元方安全衛生管理者、店社安全衛生管理者 が含まれる。\n\n（2）— 非正答肢\n　能力向上教育の実施者は事業者であるが、事業者自らが行うほか、安全衛 生団体等に委託して実施することができる。\n\n（3）— 非正答肢\n　事業場において機械設備等に大幅な変更があった時に行う随時の能力向上 教育を実施した場合には、社会経済情勢の変化に対応して一定期間ごとに行 う定期の能力向上教育を実施したものとみなして取り扱うことができる。\n\n（4）◎ 公式公表正答\n　衛生管理者については、衛生管理者免許の取得により衛生管理者の業務に 必要な最小限度の能力を有していることから、当該免許の取得から初めて衛 生管理者に選任されるまでの期間が６か月以内の場合は、初任時の能力向上 教育は要しないものとされている。\n\n（5）— 非正答肢\n　作業主任者については、労働災害の防止のための業務が比較的限定される ことから、初任時の能力向上教育は要しないものとされているが、資格取得 から初めて作業主任者に選任されるまでの期間が長期に及ぶ場合は、選任時 に定期又は随時の能力向上教育を実施する。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws. 任の安全担当者 を配置して、安全対策はスタッフ部門が企画し、これを生産ラインを通じて 実施するものである。\n\n（5）— 非正答肢\n　労働災害を防止するためには、事業場トップが、まず自らの安全衛生に対 する姿勢を明確にし、それを安全衛生方針という形で表明することが重要で ある。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/gen-question28/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/gen-question28/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2022-29","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":29,"question":"労働安全衛生マネジメントシステムの運用に関する次の記述のうち、厚生労 働省の「労働安全衛生マネジメントシステムに関する指針」及びその関係通達 に定められているものはどれか。","options":["労働安全衛生マネジメントシステムに従って行う措置は、建設業において は、店社及び建設工事現場をそれぞれ一つの単位として実施することを基本 とする。","システム監査の実施者は監査対象部署における安全衛生計画の実施状況等 の実情を承知していることが必要なので、実施者として監査対象部署の労働 者を参加させることが望ましい。","安全衛生方針の作成、安全衛生目標の設定並びに安全衛生計画の作成、実 施、評価及び改善に当たっては、安全衛生委員会を通じて労働者の意見を反 映するようにする。","労働安全衛生マネジメントシステムに従って行う措置の実施に関し、安全 衛生計画の実施状況、システム監査の結果等の必要な事項を記録する。","労働災害や事故が発生した場合に、その原因の調査及び問題点の把握を行 う際には、背景要因ではなく、直接の原因の解明を行うことが重要である。"],"correctIndex":3,"tags":["安全衛生管理・教育"],"examLawDate":"2022-04-01","category":"安全衛生管理・教育","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理・教育","point":"公式公表正答は（4）。論点は「安全衛生管理・教育」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（4）。","choicesExplain":"（1）— 非正答肢\n　労働安全衛生マネジメントシステムに従って行う措置は、建設業において は、店社及び建設工事現場をそれぞれ一つの単位として実施することを基本 とする。\n\n（2）— 非正答肢\n　システム監査の実施者は監査対象部署における安全衛生計画の実施状況等 の実情を承知していることが必要なので、実施者として監査対象部署の労働 者を参加させることが望ましい。\n\n（3）— 非正答肢\n　安全衛生方針の作成、安全衛生目標の設定並びに安全衛生計画の作成、実 施、評価及び改善に当たっては、安全衛生委員会を通じて労働者の意見を反 映するようにする。\n\n（4）◎ 公式公表正答\n　労働安全衛生マネジメントシステムに従って行う措置の実施に関し、安全 衛生計画の実施状況、システム監査の結果等の必要な事項を記録する。\n\n（5）— 非正答肢\n　労働災害や事故が発生した場合に、その原因の調査及び問題点の把握を行 う際には、背景要因ではなく、直接の原因の解明を行うことが重要である。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/gen-question29/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/gen-question29/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2022-30","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":30,"question":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指 針」に関する次のイ～ホの記述について、誤っているものの組合せは（１）～ （５）のうちどれか。 イ リスクの見積りの方法として、化学物質等への労働者のばく露濃度を 測定し、測定結果を当該化学物質についての日本産業衛生学会の許容濃 度と比較する方法がある。 ロ リスクの見積りにおいては、過去に発生した最も重篤な負傷又は疾病 の重篤度を見積もる。 ハ 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もっ た結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減 措置を検討する必要はない。 ニ リスクとは、 する労働組合又は労働者の過半数を代表する者の意 見を聴取しなければならない。","産業医は、労働者の健康管理等を行うのに必要な医学に関する知識及び能 力の維持向上に努め、事業者の指示に基づいて誠実にその職務を行わなけれ ばならない。","産業医は、労働者の健康を確保するため事業者に対し勧告する必要がある と認めるときは、あらかじめ、勧告の内容について事業者の意見を求めて、 労働者の健康管理等について必要な勧告を行うことができる。","事業者は、産業医の選任を要する事業場において、産業医が辞任したとき 又は産業医を解任したときは、遅滞なく、その旨及びその理由を記載した報 告書を所轄労働基準監督署長に提出しなければならない。"],"correctIndex":3,"tags":["安全衛生管理体制"],"examLawDate":"2022-04-01","category":"安全衛生管理体制","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理体制","point":"公式公表正答は（4）。論点は「安全衛生管理体制」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（4）。","choicesExplain":"（1）— 非正答肢\n　事業者は、常時使用する労働者数が300人の造船業の事業場においては、 総括安全衛生管理者を選任するほか、元方事業者である当該事業者の労働者 とその請負人の労働者が同一の場所で作業を行い、これらの労働者数が常時 30人以上となる場合は、統括安全衛生責任者を選任しなければならない。\n\n（2）— 非正答肢\n　事業者は、常時100人以上の労働者を使用する運送業の事業場においては、 総括安全衛生管理者を衛生委員会の議長として委員に指名するほか、議長以 外の委員の半数については、その指名に当たって、あらかじめ、当該事業場 の労働者の過半数で組織する労働組合又は労働者の過半数を代表する者の意 見を聴取しなければならない。\n\n（3）— 非正答肢\n　産業医は、労働者の健康管理等を行うのに必要な医学に関する知識及び能 力の維持向上に努め、事業者の指示に基づいて誠実にその職務を行わなけれ ばならない。\n\n（4）◎ 公式公表正答\n　産業医は、労働者の健康を確保するため事業者に対し勧告する必要がある と認めるときは、あらかじめ、勧告の内容について事業者の意見を求めて、 労働者の健康管理等について必要な勧告を行うことができる。\n\n（5）— 非正答肢\n　事業者は、産業医の選任を要する事業場において、産業医が辞任したとき 又は産業医を解任したときは、遅滞なく、その旨及びその理由を記載した報 告書を所轄労働基準監督署長に提出しなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"安衛法","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"安衛則","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"安衛令","url":"https://laws.e-gov.go.jp/law/347CO0000000318?occasion_date=20220401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/low-question01/"}],"au ds":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"鉛則","url":"https://laws.e-gov.go.jp/law/347M50002000037?occasion_date=20220401"},{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"厚生労働省 SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"厚生労働省 化学物質の自律的管理","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121_00005.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/low-question09/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question09/","sourceType":"公表問題（公式正答・原文照合済）","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"id":"law-2022-10","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":10,"question":"特定化学物質障害予防規則に定める特別管理物質に関する次の記述のうち、 特定化学物質障害予防規則上、誤っているものはどれか。","options":["特別管理物質を製造する特定化学設備については、２年を超える期間使用 しない場合を除き、２年以内ごとに１回、定期に、自主検査を行い、所定の 事項を記録し、これを30年間保存するものとされている。","特別管理物質を製造する屋内作業場については、６か月以内ごとに１回、 定期に、作業環境測定を行い、所定の事項を記録し、これを30年間保存する ものとされている。","特別管理物質を製造する作業場において常時作業に従事する労働者につい ては、１か月を超えない期間ごとに、従事した作業の概要及び期間等の所定 の事項を記録し、これを30年間保存するものとされている。","特別管理物質を製造する業務に常時従事する労働者に対して、６か月以内 ごとに１回、定期に、所定の項目について医師による健康診断を行い、その 結果に基づき作成した特定化学物質健康診断個人票については、これを30年 間保存するものとされている。","特別管理物質を製造し、又は取り扱う事業者が、事業を廃止しようとする ときは、特別管理物質等関係記録等報告書に所定の書類を添えて、所轄労働 基準監督署長に提出するものとされている。"],"correctIndex":0,"tags":["特別管理物質"],"examLawDate":"2022-04-01","category":"特別管理物質","cluster":"化学物質管理","explanation":{"title":"特別管理物質","point":"公式公表正答は（1）。論点は「特別管理物質」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（1）。","choicesExplain":"（1）◎ 公式公表正答\n　特別管理物質を製造する特定化学設備については、２年を超える期間使用 しない場合を除き、２年以内ごとに１回、定期に、自主検査を行い、所定の 事項を記録し、これを30年間保存するものとされている。\n\n（2）— 非正答肢\n　特別管理物質を製造する屋内作業場については、６か月以内ごとに１回、 定期に、作業環境測定を行い、所定の事項を記録し、これを30年間保存する ものとされている。\n\n（3）— 非正答肢\n　特別管理物質を製造する作業場において常時作業に従事する労働者につい ては、１か月を超えない期間ごとに、従事した作業の概要及び期間等の所定 の事項を記録し、これを30年間保存するものとされている。\n\n（4）— 非正答肢\n　特別管理物質を製造する業務に常時従事する労働者に対して、６か月以内 ごとに１回、定期に、所定の項目について医師による健康診断を行い、その 結果に基づき作成した特定化学物質健康診断個人票については、これを30年 間保存するものとされている。\n\n（5）— 非正答肢\n　特別管理物質を製造し、又は取り扱う事業者が、事業を廃止しようとする ときは、特別管理物質等関係記録等報告書に所定の書類を添えて、所轄労働 基準監督署長に提出するものとされている。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"特化則","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20220401"},{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"厚生労働省 SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"厚生労働省 化学物質の自律的管理","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121_00005.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/low-question10/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question10/","so 🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question11/","sourceType":"公表問題（公式正答・原文照合済）","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"id":"law-2022-12","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":12,"question":"酸素欠乏症等の防止に関する次の記述のうち、酸素欠乏症等防止規則上、誤 っているものはどれか。","options":["事業者は、酸素欠乏危険作業に労働者を従事させるときは、労働者を当該 作業を行う場所に入場させ、及び退場させる時に、人員を点検しなければな らない。","事業者は、酸素欠乏症等にかかった労働者を酸素欠乏等の場所において救 出する作業に労働者を従事させるときは、当該救出作業に従事する労働者に 空気呼吸器、酸素呼吸器又は送気マスクを使用させなければならない。","事業者は、酸素欠乏症等にかかった労働者に、直ちに医師の診察又は処置 を受けさせなければならない。","事業者は、その内部の空気を吸引する配管（その内部の空気を換気するた めのものを除く。）に通ずるタンク、反応塔その他密閉して使用する施設又 は設備の内部における作業に労働者を従事させるときは、労働者が作業して いる間、当該施設又は設備の出入口のふた又は扉が締まらないような措置を 講じなければならない。","事業者は、不活性気体を送給する配管のバルブ若しくはコック又はこれら を操作するためのスイッチ、押しボタン等については、これらの誤操作によ る不活性気体の漏出を防止するため、配管内の不活性気体の名称、温度及び 圧力を表示しなければならない。"],"correctIndex":4,"tags":["酸素欠乏症等防止規則"],"examLawDate":"2022-04-01","category":"酸素欠乏症等防止規則","cluster":"酸欠・高気圧","explanation":{"title":"酸素欠乏症等防止規則","point":"公式公表正答は（5）。論点は「酸素欠乏症等防止規則」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（5）。","choicesExplain":"（1）— 非正答肢\n　事業者は、酸素欠乏危険作業に労働者を従事させるときは、労働者を当該 作業を行う場所に入場させ、及び退場させる時に、人員を点検しなければな らない。\n\n（2）— 非正答肢\n　事業者は、酸素欠乏症等にかかった労働者を酸素欠乏等の場所において救 出する作業に労働者を従事させるときは、当該救出作業に従事する労働者に 空気呼吸器、酸素呼吸器又は送気マスクを使用させなければならない。\n\n（3）— 非正答肢\n　事業者は、酸素欠乏症等にかかった労働者に、直ちに医師の診察又は処置 を受けさせなければならない。\n\n（4）— 非正答肢\n　事業者は、その内部の空気を吸引する配管（その内部の空気を換気するた めのものを除く。）に通ずるタンク、反応塔その他密閉して使用する施設又 は設備の内部における作業に労働者を従事させるときは、労働者が作業して いる間、当該施設又は設備の出入口のふた又は扉が締まらないような措置を 講じなければならない。\n\n（5）◎ 公式公表正答\n　事業者は、不活性気体を送給する配管のバルブ若しくはコック又はこれら を操作するためのスイッチ、押しボタン等については、これらの誤操作によ る不活性気体の漏出を防止するため、配管内の不活性気体の名称、温度及び 圧力を表示しなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"安衛法","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"安衛則","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"酸素欠乏症等防止規則","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20220401"},{"label":"高気圧作業安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000040?occasion_date=20220401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/low-question12/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question12/","sourceType":"公表問題（公式正答・原文照合済）","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"id":"law-2022-13","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":13,"question":"事務室の環境管理について事業者が講ずべき措置に関する次のイ～ニの記述 について、事務所衛生基準規則上、正しいものの組合せは（１）～（５）のう ちどれか。 イ 労働者を常時就業させる室における二酸化炭素の含有率（１気圧、温 度25度とした場合の空気中に占める当該ガスの容積の割合をいう。）を 100万分の500以下としなければならない。 ロ 空気調和設備を設けている場合は、労働者を常時就業させる室の温度 が18度以上28度以下及び相対湿度が40パーセント以上70パーセント以下 になるように努めなければならない。 ハ ホルムアルデヒドの量の測定は、労働者を常時就業させる室の通常の 使用時間中に、当該室の中央部の床上50センチメートル以上150センチ メートル以下の位置において行うものとする。 ニ 労働者を常時就業させる室の照明設備について、３か月以内ごとに１ 回、定期に、点検しなければならない。","options":["イ ロ","イ ハ","イ ニ","ロ ハ","ハ ニ"],"correctIndex":3,"tags":["事務所衛生基準"],"examLawDate":"2022-04-01","category":"事務所衛生基準","cluster":"事務所衛生","explanation":{"title":"事務所衛生基準","point":"公式公表正答は（4）。論点は「事務所衛生基準」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（4）。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ハ\n\n（3）— 非正答肢\n　イ ニ\n\n（4）◎ 公式公表正答\n　ロ ハ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"事務所則","url":"https://laws.e-gov.go.jp/law/347M50002000043?occasion_date=20220401"},{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/low-question13/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question13/","sourceType":"公表問題（公式正答・原文照合済）","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"id":"law-2022-14","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":14,"question":"建築物の解体作業を行うときにあらかじめ行う石綿等の使用の有無について の事前調査及び分析調査に関する次の記述のうち、石綿障害予防規則上、正し いものはどれか。","options":["事前調査及び分析調査は、建築物の解体工事に係る部分の床面積の合計が 80平方メートル未満である場合には、行わなくてもよい。","解体の対象となる建築物に石綿等が使用されているものとみなして、労働 安全衛生関係法令に規定する措置を講ずるときは、事前調査及び分析調査を 行わなくてもよい。","事前調査又は分析調査を行ったときは、その結果に基づき、事業者の名称、 住所及び電話番号その他所定の事項について記録を作成し、これを調査終了 日から３年間保存するものとされている。","事前調査又は分析調査の結果、石綿等が使用されていないことが明らかと なったときを除き、解体作業を行う作業場の作業に従事する労働者が見やす い箇所に、調査結果の概要を掲示しなければならない。","事前調査又は分析調査の結果、石綿等が使用されていることが明らかとな ったときは、事業者の名称、住所及び電話番号その他所定の事項を所轄労働 基準監督署長に報告しなければならない。"],"correctIndex":2,"tags":["石綿障害予防規則"],"examLawDate":"2022-04-01","category":"石綿障害予防規則","cluster":"粉じん・石綿・じん肺","explanation":{"title":"石綿障害予防規則","point":"公式公表正答は（3）。論点は「石綿障害予防規則」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（3）。","choicesExplain":"（1）— 非正答肢\n　事前調査及び分析調査は、建築物の解体工事に係る部分の床面積の合計が 80平方メートル未満である場合には、行わなくてもよい。\n\n（2）— 非正答肢\n　解体の対象となる建築物に石綿等が使用されているものとみなして、労働 安全衛生関係法令に規定する措置を講ずるときは、事前調査及び分析調査を 行わなくてもよい。\n\n（3）◎ 公式公表正答\n　事前調査又は分析調査を行ったときは、その結果に基づき、事業者の名称、 住所及び電話番号その他所定の事項について記録を作成し、これを調査終了 日から３年間保存するものとされている。\n\n（4）— 非正答肢\n　事前調査又は分析調査の結果、石綿等が使用されていないことが明らかと なったときを除き、解体作業を行う作業場の作業に従事する労働者が見やす い箇所に、調査結果の概要を掲示しなければならない。\n\n（5）— 非正答肢\n　事前調査又は分析調査の結果、石綿等が使用されていることが明らかとな ったときは、事業者の名称、住所及び電話番号その他所定の事項を所轄労働 基準監督署長に報告しなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"石綿則","url":"https://laws.e-gov.go.jp/law/417M60000100021?occasion_date=20220401"},{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20220401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20220401"},{"label":"厚生労働省 石綿対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/sekimen/topics/tp050729-1.html"},{"label":"じん肺法","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20220401"},{"label":"粉じん障害防止規則","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20220401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/low-question14/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question14/","sourceType":"公表問題（公式正答・原文照合済）","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"id":"law-2022-15","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":15,"question":"粉じんによる健康障害の防止のための設備、健康管理等の措置に関する次の 記述のうち、じん肺法令上又は粉じん障害防止規則上、正しいものはどれか。","options":["屋内作業場において、研磨材の吹き付けにより、金属を研磨する箇所には、 粉じんの発散を防止するため、局所排気装置の設置若しくはプッシュプル型 換気装置の設置又はこれと同等以上の措置を講じなければならない。","屋内作業場において、粉状の鉱石を原料として使用するものを製造する工 程において、粉状の鉱石を混合する箇所に設けるプッシュプル型換気装置に ついては、ろ過除じん方式又は電気除じん方式による除じん装置を付設した ものを除き、その排出口は屋外に設けなければならない。","常時特定粉じん作業が行われ、土石、岩石又は鉱物の粉じんを著しく発散 する屋内作業場及び坑内作業場については、６か月以内ごとに１回、定期に、 当該作業場における空気中の粉じんの濃度及び当該粉じん中の遊離けい酸の 含有率を測定しなければならない。","常時粉じん作業に従事する労働者でじん肺管理区分が管理２又は管理３で あるもの及び常時粉じん作業に従事させたことがあり、現に粉じん作業以外 の作業に常時従事している労働者でじん肺管理区分が管理３であるものにつ いては、１年以内ごとに１回、定期的に、じん肺健康診断を行わなければな らない。","常時粉じん作業に従事する労働者について定期のじん肺健康診断を行った ときは、所定の提出書に受診した全労働者のじん肺健康診断結果証明書及び エックス線写真を添えて所轄都道府県労働局長に提出し、じん肺管理区分の 決定を受けなければならない。"],"correctIndex":3,"tags":["じん肺・粉じん"],"examLawDate":"2022-04-01","category":"じん肺・粉じん","cluster":"粉じん・石綿・じん肺","explanation":{"title":"じん肺・粉じん","point":"公式公表正答は（4）。論点は「じん肺・粉じん」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（4）。","choicesExplain":"（1）— 非正答肢\n　屋内作業場において、研磨材の吹き付けにより、金属を研磨する箇所には、 粉じんの発散を防止するため、局所排気装置の設置若しくはプッシュプル型 換気装置の設置又はこれと同等以上の措置を講じなければならない。\n\n（2）— 非正答肢\n　屋内作業場において、粉状の鉱石を原料として使用するものを製造する工 程において、粉状の鉱石を混合する箇所に設けるプッシュプル型換気装置に ついては、ろ過除じん方式又は電気除じん方式による除じん装置を付設した ものを除き、その排出口は屋外に設けなければならない。\n\n（3）— 非正答肢\n　常時特定粉じん作業が行われ、土石、岩石又は鉱物の粉じんを著しく発散 する屋内作業場及び坑内作業場については、６か月以内ごとに１回、定期に、 当該作業場における空気中の粉じんの濃度及び当該粉じん中の遊離けい酸の 含有率を測定しなければならない。\n\n（4）◎ 公式公表正答\n　常時粉じん作業に従事する労働者でじん肺管理区分が管理２又は管理３で あるもの及び常時粉じん作業に従事させたことがあり、現に粉じん作業以外 の作業に常時従事している労働者でじん肺管理区分が管理３であるものにつ いては、１年以内ごとに１回、定期的に、じん肺健康診断を行わなければな らない。\n\n（5）— 非正答肢\n　常時粉じん作業に従事する労働者について定期のじん肺健康診断を行った ときは、所定の提出書に受診した全労働者のじん肺健康診断結果証明書及び エックス線写真を添えて所轄都道府県労働局長に提出し、じん肺管理区分の 決定を受けなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同 "cluster":"人間工学・作業態様","explanation":{"title":"その他","point":"公式公表正答は（4）。論点は「その他」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（4）。","choicesExplain":"（1）— 非正答肢\n　「寝だめ」をしようとして無理に必要以上に眠ろうとすると、かえって睡 眠が浅くなってしまう。\n\n（2）— 非正答肢\n　夜勤明けは、入眠開始時間が遅くなると睡眠が取りにくくなるため、でき るだけ早く睡眠を取るようにする。 そしやく\n\n（3）— 非正答肢\n　夜勤においてガムの咀嚼、ラジオ聴取、冷風にあたる、軽い運動をするこ とは、主観的な眠気を減らす効果はあるが、作業成績を改善する効果はあま りない。\n\n（4）◎ 公式公表正答\n　夜勤に従事する者は、生活リズムが一定となるように、夜勤にのみ専従す るのがよい。\n\n（5）— 非正答肢\n　睡眠時間と労働災害の起こりやすさの調査によれば、普段の睡眠時間が７ 時間の群に比べて、睡眠が６時間から短くなるにつれて、労働災害は起こり やすい。","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"厚生労働省 職場における腰痛予防対策指針","url":"https://www.mhlw.go.jp/content/11300000/001376468.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/gen-question23/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/gen-question23/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2021-24","subject":"労働衛生一般","year":2021,"yearLabel":"令和3年度","round":49,"number":24,"question":"作業に伴う健康障害などに関する次の記述のうち、適切でないものはどれか。","options":["非災害性腰痛とは、重量物運搬中の転倒や腰部への予想以上の過重な負荷 などにより突然発症する腰痛のことをいう。 けい くび","頸肩腕症候群とは、上肢の繰り返し運動によって生じる頸から手にかけて の運動器障害のことをいう。","長時間・過重な負荷がかかった場合、負荷がなくなっても、生体は元の状 態に戻ることができず、疲労として残存、蓄積する。","作業関連疾患とは、作業要因と個人的要因が関与して発現する健康障害の ことをいう。","職業性疾病は、一定の職業に従事し、その職業上の有害な因子にさらされ ることによって起きる。"],"correctIndex":0,"tags":["人間工学・腰痛"],"examLawDate":"2021-04-01","category":"人間工学・腰痛","cluster":"人間工学・作業態様","explanation":{"title":"人間工学・腰痛","point":"公式公表正答は（1）。論点は「人間工学・腰痛」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（1）。","choicesExplain":"（1）◎ 公式公表正答\n　非災害性腰痛とは、重量物運搬中の転倒や腰部への予想以上の過重な負荷 などにより突然発症する腰痛のことをいう。 けい くび\n\n（2）— 非正答肢\n　頸肩腕症候群とは、上肢の繰り返し運動によって生じる頸から手にかけて の運動器障害のことをいう。\n\n（3）— 非正答肢\n　長時間・過重な負荷がかかった場合、負荷がなくなっても、生体は元の状 態に戻ることができず、疲労として残存、蓄積する。\n\n（4）— 非正答肢\n　作業関連疾患とは、作業要因と個人的要因が関与して発現する健康障害の ことをいう。\n\n（5）— 非正答肢\n　職業性疾病は、一定の職業に従事し、その職業上の有害な因子にさらされ ることによって起きる。","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"厚生労働省 職場における腰痛予防対策指針","url":"https://www.mhlw.go.jp/content/11300000/001376468.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/gen-question24/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/gen-question24/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2021-25","subject":"労働衛生一般","year":2021,"yearLabel":"令和3年度","round":49,"number":25,"question":"労働衛生保護具に関する次の記述のうち、誤っているものはどれか。","options":["化学物質のばく露限界濃度にかかわらず、臭気を感知するかどうかという 知覚の有無を、防毒マスクの吸収缶の交換時期の判断基準としてはならない。","アンモニア用防毒マスクの吸収缶の色は、緑色である。","放射性物質による汚染のおそれがある区域内の作業で、オイルミストが混 在する場合に使用する防じんマスクの性能の区分はＲＬ３である。","一酸化炭素用防毒マスクの吸収缶は、使用する環境の湿度が高いほど破過 時間が短くなる傾向にある。","アーク溶接作業に用いられる遮光保護具は、レーザー機器取扱作業におい て保護めがねとして使用してはならない。"],"correctIndex":0,"tags":["保護具","放射線・有害光線","化学物質管理","労働衛生管理総論"],"examLawDate":"2021-04-01","category":"保護具","cluster":"化学物質管理","explanation":{"title":"保護具","point":"公式公表正答は（1）。論点は「保護具」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（1）。","choicesExplain":"（1）◎ 公式公表正答\n　化学物質のばく露限界濃度にかかわらず、臭気を感知するかどうかという 知覚の有無を、防毒マスクの吸収缶の交換時期の判断基準としてはならない。\n\n（2）— 非正答肢\n　アンモニア用防毒マスクの吸収缶の色は、緑色である。\n\n（3）— 非正答肢\n　放射性物質による汚染のおそれがある区域内の作業で、オイルミストが混 在する場合に使用する防じんマスクの性能の区分はＲＬ３である。\n\n（4）— 非正答肢\n　一酸化炭素用防毒マスクの吸収缶は、使用する環境の湿度が高いほど破過 時間が短くなる傾向にある。\n\n（5）— 非正答肢\n　アーク溶接作業に用いられる遮光保護具は、レーザー機器取扱作業におい て保護めがねとして使用してはならない。","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"電離放射線障害防止規則","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20210401"},{"label":"厚生労働省 SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"厚生労働省 化学物質の自律的管理","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121_00005.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/gen-question25/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/gen-question25/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2021-26","subject":"労働衛生一般","year":2021,"yearLabel":"令和3年度","round":49,"number":26,"question":"厚生労働省の「安全衛生教育等推進要綱」に関する次の記述のうち、当該要 綱に定められていないものはどれか。","options":["総括安全衛生管理者に対して、随時に、労働災害の現状と防止対策等に関 する事項について、安全衛生セミナーを実施する。","就業制限業務に従事する作業者に対して、おおむね 45 歳に達した時に、 高年齢者の心身機能の特性と労働災害に関すること等の事項について、高齢 時教育を実施する。","産業医に対して、随時に、業務に必要な専門的知識等のうち技術革新の進 展等社会経済情勢及び職場環境の変化等に対 ed":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2021-27","subject":"労働衛生一般","year":2021,"yearLabel":"令和3年度","round":49,"number":27,"question":"労働衛生管理統計に関する次のイ～ホの記述について、適切なもののみを全 て挙げたものは（１）～（５）のうちどれか。 イ 健康管理統計において、「一定期間に有所見等が発生した人数の割 合」を発生率といい、このデータを静態データという。 ロ 疾病休業統計における「病休度数率」は、在籍労働者の100 万延べ実 労働時間当たりの疾病休業件数である。 ハ 健康診断における検査のスクリーニングレベルを低く設定すると、偽 陽性率は低くなる。 ニ 疾病の診断における検査の敏感度は、有疾病者数の中の陽性者数の割 合である。 ホ 二つの健康事象の間に相関がみられる場合は、この二つの健康事象の 間には常に因果関係が認められる。","options":["イ ロ ハ","イ ロ ニ","ロ ニ","ハ ホ","ニ ホ"],"correctIndex":2,"tags":["健康診断・健康管理","疫学・統計","労働衛生管理総論"],"examLawDate":"2021-04-01","category":"健康診断・健康管理","cluster":"健康診断・健康管理","explanation":{"title":"健康診断・健康管理","point":"公式公表正答は（3）。論点は「健康診断・健康管理」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（3）。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ロ ニ\n\n（3）◎ 公式公表正答\n　ロ ニ\n\n（4）— 非正答肢\n　ハ ホ\n\n（5）— 非正答肢\n　ニ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"健康診断結果に基づく措置指針","url":"https://www.mhlw.go.jp/hourei/doc/kouji/K170417K0020.pdf"},{"label":"厚生労働省 労働統計","url":"https://www.mhlw.go.jp/toukei/list/index.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/gen-question27/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/gen-question27/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2021-28","subject":"労働衛生一般","year":2021,"yearLabel":"令和3年度","round":49,"number":28,"question":"事業場における安全活動に関する次の記述のうち、適切でないものはどれか。","options":["４Ｓ活動とは、職場の整理、整頓、清掃、清潔を徹底させる活動であり、 整理とは、要るものと要らないものを分けて要らないものを捨てることを意 味し、整頓とは、要るものをいつでも取り出せるようにすることを意味する。","安全パトロールにおいては、年間を通じて計画的に職場を巡視し、その結 果に基づいて必要な改善を行うとともに、その改善状態の確認まで行うこと が必要である。","危険予知活動とは、危険が予想される不安全箇所について、管理者のリー ダーシップのもとで、関係作業者全員に、その対策、安全措置の考案等の提 出を求め、これを実行することである。","ツールボックスミーティングは、作業開始前や作業の切替え時に短時間で、 監督者を中心にその日の作業の範囲、段取り、分担、安全衛生のポイントな どを現場で話し合う活動である。","安全提案制度によって作業者から安全についての提案を求めることは、具 体的な安全対策を立てる上で役立つのみならず、提案の過程を通じ安全意識 を向上させることにもなる。"],"correctIndex":2,"tags":["安全衛生管理・教育"],"examLawDate":"2021-04-01","category":"安全衛生管理・教育","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理・教育","point":"公式公表正答は（3）。論点は「安全衛生管理・教育」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（3）。","choicesExplain":"（1）— 非正答肢\n　４Ｓ活動とは、職場の整理、整頓、清掃、清潔を徹底させる活動であり、 整理とは、要るものと要らないものを分けて要らないものを捨てることを意 味し、整頓とは、要るものをいつでも取り出せるようにすることを意味する。\n\n（2）— 非正答肢\n　安全パトロールにおいては、年間を通じて計画的に職場を巡視し、その結 果に基づいて必要な改善を行うとともに、その改善状態の確認まで行うこと が必要である。\n\n（3）◎ 公式公表正答\n　危険予知活動とは、危険が予想される不安全箇所について、管理者のリー ダーシップのもとで、関係作業者全員に、その対策、安全措置の考案等の提 出を求め、これを実行することである。\n\n（4）— 非正答肢\n　ツールボックスミーティングは、作業開始前や作業の切替え時に短時間で、 監督者を中心にその日の作業の範囲、段取り、分担、安全衛生のポイントな どを現場で話し合う活動である。\n\n（5）— 非正答肢\n　安全提案制度によって作業者から安全についての提案を求めることは、具 体的な安全対策を立てる上で役立つのみならず、提案の過程を通じ安全意識 を向上させることにもなる。","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20210401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20210401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health 、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"作業環境測定法","url":"https://laws.e-gov.go.jp/law/350AC0000000028?occasion_date=20210401"},{"label":"厚生労働省 作業環境測定・評価資料","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"厚生労働省 SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"厚生労働省 化学物質の自律的管理","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121_00005.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/gen-question30/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/gen-question30/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2021-01","subject":"労働衛生関係法令","year":2021,"yearLabel":"令和3年度","round":49,"number":1,"question":"事業場の安全衛生管理体制に関する次の記述のうち、労働安全衛生法令上、 正しいものはどれか。 なお、（５）において法定労働時間は、休憩時間を除き１日について８時間、 １週間について 40 時間であり、時間外・休日労働時間は、休憩時間を除き１ 週間当たり 40 時間を超えて労働させた場合におけるその超えた時間とする。","options":["常時使用する労働者が 300人又はこれを超えることとなった自動車整備業 の事業場では、事業の実施を統括管理する者又はこれに準ずる者のうちから 総括安全衛生管理者を選任する必要があり、その選任は総括安全衛生管理者 を選任すべき事由が発生した日から 14 日以内に行わなければならない。","常時 50 人以上の労働者を使用する事業場において選任すべき産業医は、 医師であって厚生労働大臣の指定する大学等が行う産業医研修等を修了した 者又は保健衛生若しくは労働衛生工学の区分により労働衛生コンサルタント 試験に合格した者でなければならない。","常時 250 人の労働者を使用する医療業の事業場では、衛生管理者を２人以 上選任することが必要で、その衛生管理者は原則として当該事業場に専属で あって、第一種衛生管理者免許若しくは衛生工学衛生管理者免許を有する者 又は医師、歯科医師若しくは労働衛生コンサルタントでなければならない。","常時使用する労働者が 100 人で、安全衛生委員会を設置した事業場では、 当該委員会を毎月１回以上開催し、その開催の都度、委員会の意見及び当該 意見を踏まえて講じた措置の内容に係る記録を作成して、これを各作業場に 備え付ける等の方法で、遅滞なく、労働者に周知しなければならない。","事業者は、労働者の健康管理等を適切に行うため、産業医に対し、法定労 働時間を超えて労働させた全ての労働者について、その氏名及び時間外・休 日労働時間に関する情報を提供するとともに、労働者の業務に関する情報で 産業医が必要と認めるものを提供しなければならない。"],"correctIndex":2,"tags":["安全衛生管理体制"],"examLawDate":"2021-04-01","category":"安全衛生管理体制","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理体制","point":"公式公表正答は（3）。論点は「安全衛生管理体制」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（3）。","choicesExplain":"（1）— 非正答肢\n　常時使用する労働者が 300人又はこれを超えることとなった自動車整備業 の事業場では、事業の実施を統括管理する者又はこれに準ずる者のうちから 総括安全衛生管理者を選任する必要があり、その選任は総括安全衛生管理者 を選任すべき事由が発生した日から 14 日以内に行わなければならない。\n\n（2）— 非正答肢\n　常時 50 人以上の労働者を使用する事業場において選任すべき産業医は、 医師であって厚生労働大臣の指定する大学等が行う産業医研修等を修了した 者又は保健衛生若しくは労働衛生工学の区分により労働衛生コンサルタント 試験に合格した者でなければならない。\n\n（3）◎ 公式公表正答\n　常時 250 人の労働者を使用する医療業の事業場では、衛生管理者を２人以 上選任することが必要で、その衛生管理者は原則として当該事業場に専属で あって、第一種衛生管理者免許若しくは衛生工学衛生管理者免許を有する者 又は医師、歯科医師若しくは労働衛生コンサルタントでなければならない。\n\n（4）— 非正答肢\n　常時使用する労働者が 100 人で、安全衛生委員会を設置した事業場では、 当該委員会を毎月１回以上開催し、その開催の都度、委員会の意見及び当該 意見を踏まえて講じた措置の内容に係る記録を作成して、これを各作業場に 備え付ける等の方法で、遅滞なく、労働者に周知しなければならない。\n\n（5）— 非正答肢\n　事業者は、労働者の健康管理等を適切に行うため、産業医に対し、法定労 働時間を超えて労働させた全ての労働者について、その氏名及び時間外・休 日労働時間に関する情報を提供するとともに、労働者の業務に関する情報で 産業医が必要と認めるものを提供しなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"安衛法","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20210401"},{"label":"安衛則","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20210401"},{"label":"安衛令","url":"https://laws.e-gov.go.jp/law/347CO0000000318?occasion_date=20210401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/low-question01/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/low-question01/","sourceType":"公表問題（公式正答・原文照合済）","lawLinks" ","choicesExplain":"（1）— 非正答肢\n　新たに常時粉じん作業に従事することとなった労働者で、当該作業に従事 することとなった日前１年以内にじん肺健康診断を受けて、じん肺管理区分 が管理３ロと決定された者に対しては、その就業の際、じん肺健康診断を行 わなくてもよい。\n\n（2）◎ 公式公表正答\n　常時粉じん作業に従事する労働者でじん肺管理区分が管理３であるものが、 離職の際にじん肺健康診断を行うように求めた場合でも、当該労働者を離職 の日までに使用していた期間が１年以内であるときは、じん肺健康診断を行 わなくてもよい。\n\n（3）— 非正答肢\n　研磨材を用いて可搬式動力工具により金属を裁断する作業を行う箇所に、 局所排気装置を設置することが困難な屋内作業場では、当該箇所に湿潤な状 態に保つための設備を設置して粉じんの発散を防止し、作業を行うようにし なければならない。\n\n（4）— 非正答肢\n　屋内作業場において、金属を溶断し、又はアークを用いてガウジングする 作業に常時従事させる労働者に対しては、その就業の際、粉じんの発散防止 及び作業場の換気の方法等の所定の科目について、特別の教育を行わなけれ ばならない。\n\n（5）— 非正答肢\n　じん肺法及び粉じん障害防止規則において、粉じん障害の防止対策、健康 管理等の措置を講ずべき作業として粉じん作業を定めているが、同法令のい ずれも、粉じん作業は、有機粉じんを除き、石綿以外の鉱物性粉じんに係る 作業を対象としている。","trap":"","keywords":"","related":"","current":"【出題当時】2021-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"じん肺法","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20210401"},{"label":"粉じん則","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20210401"},{"label":"労働安全衛生法（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20210401"},{"label":"労働安全衛生規則（e-Gov・出題時点）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20210401"},{"label":"石綿障害予防規則","url":"https://laws.e-gov.go.jp/law/417M60000100021?occasion_date=20210401"},{"label":"厚生労働省 石綿対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/sekimen/topics/tp050729-1.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2021/low-question15/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2021/low-question15/","sourceType":"公表問題（公式 function cleanQuestionDisplay(s){
  s=String(s??'').replace(/\r/g,'');
  s=s.replace(/(^|\s)(ふく|くう|すい|ぜん|せすじ|かかと|し|か)(?=\s|$)/g,'$1');
  for(let k=0;k<3;k++)s=s.replace(/([\u3040-\u30ff\u3400-\u9fff々〆ヶ])[ \t]+([\u3040-\u30ff\u3400-\u9fff々〆ヶ])/g,'$1$2');
  s=s.replace(/[ \t]{2,}/g,' ').replace(/[ \t]+([。、，．）」』】])/g,'$1');
  return s.trim();
}
function structureQuestionText(s){
  s=String(s??'').replace(/\r/g,'');
  const km=s.match(/イ[～〜\-－]([ニホ])/);
  let kana=km?(km[1]==='ホ'?'イロハニホ':'イロハニ'):'';
  if(!kana && /次のイの記述[\s\S]*次のロの記述/.test(s))kana='イロ';
  const am=s.match(/([ＡA])[～〜\-－]([Ｄ-ＩD-I])/);
  let alpha='';
  if(am){const full='ＡＢＣＤＥＦＧＨＩ',half='ABCDEFGHI';const chars=am[1]==='Ａ'?full:half,end=chars.indexOf(am[2]);if(end>=0)alpha=chars.slice(0,end+1);}
  s=s.replace(/[ \t]*\n[ \t]*/g,'\n');
  function splitMarkers(chars){
    if(!chars)return;
    const re=new RegExp('(^|\\n|[。！？][ \\t]*|[ \\t]+)(['+chars+'])(?=[：:　 \\t「『（A-Za-z0-9\\u3040-\\u30ff\\u3400-\\u9fff])','g');
    s=s.replace(re,(all,prefix,mark)=>{if(prefix==='')return mark+'　';if(prefix==='\n')return '\n'+mark+'　';if(/^[。！？]/.test(prefix))return prefix.trimEnd()+'\n'+mark+'　';return '\n'+mark+'　';});
  }
  splitMarkers(kana);
  if(alpha){const ar=new RegExp('(^|\\n)(['+alpha+'])(?=[：:　 \\t「『（A-Za-z0-9\\u3040-\\u30ff\\u3400-\\u9fff【])','g');s=s.replace(ar,(all,prefix,mark)=>prefix+mark+'　');}
  const markerChars=kana+alpha;
  s=s.split('\n').map(line=>{if(markerChars){const mr=line.match(new RegExp('^(['+markerChars+'])(?:[　 \\t:：]*)([\\s\\S]*)$'));if(mr)return mr[1]+'　'+cleanQuestionDisplay(mr[2]);}return cleanQuestionDisplay(line);}).filter(Boolean).join('\n');
  if(!kana)s=s.replace(/\s+([イロハニホヘトチリヌルヲ])[　 ]+/g,'\n$1　');
  s=s.replace(/\n{3,}/g,'\n\n');
  return s.trim();
}
function formatQuestionHtml(s){
  const t=structureQuestionText(s), paras=t.split(/\n{2,}/).filter(Boolean); let out='';
  const markerRe=/^([イロハニホヘトチリヌルヲ]|[Ａ-ＩA-I]|[１２３４５])(?:[　\s:：]|(?=[\u3040-\u30ff\u3400-\u9fff]))/;
  function renderLead(lines){if(!lines.length)return '';return lines.map(line=>`<div class="${/^ただし、?/.test(line)?'q-note':'q-stem'}">${nl(line)}</div>`).join('');}
  for(const p of paras){
    const lines=p.split('\n').map(x=>x.trim()).filter(Boolean);
    if(lines.length&&lines.every(x=>x.includes('｜'))){out+='<div class="q-table">'+lines.map(line=>{const a=line.indexOf('｜');const l=line.slice(0,a),r=line.slice(a+1);const h=/^【/.test(l)&&/^【/.test(r);return `<div class="q-table-row${h?' header':''}"><div class="q-table-cell">${esc(l)}</div><div class="q-table-cell">${esc(r)}</div></div>`}).join('')+'</div>';continue;}
    const firstMarker=lines.findIndex(x=>markerRe.test(x));
    if(firstMarker>=0&&lines.slice(firstMarker).every(x=>markerRe.test(x))){out+=renderLead(lines.slice(0,firstMarker));out+='<div class="q-list">'+lines.slice(firstMarker).map(x=>`<div class="q-list-item">${esc(x)}</div>`).join('')+'</div>';continue;}
    out+=renderLead(lines);
  }
  return out;
}
function formatOptionText(s,q){
  let t=String(s??'').replace(/\r/g,'').trim();
  t=t.replace(/[ \t]*\n[ \t]*/g,'\n');
  for(let k=0;k<3;k++)t=t.replace(/([\u3040-\u30ff\u3400-\u9fff々〆ヶ])[ \t]+([\u3040-\u30ff\u3400-\u9fff々〆ヶ])/g,'$1$2');
  t=t.replace(/[ \t]{2,}/g,' ');
  const am=String(q?.question||'').match(/([ＡA])[～〜\-－]([Ｄ-ＩD-I])/);
  if(am&&/[／/]/.test(t)){const full='ＡＢＣＤＥＦＧＨＩ',half='ABCDEFGHI',chars=am[1]==='Ａ'?full:half,end=chars.indexOf(am[2]),labels=end>=0?chars.slice(0,end+1).split(''):[],parts=t.split(/[／/]/).map(x=>x.trim());if(labels.length===parts.length)t=parts.map((p,i)=>labels[i]+'：'+p).join('\n');}
  t=t.replace(/\s+([Ａ-ＩA-I][:：])/g,'\n$1').replace(/\s+([イロハニホヘトチリヌルヲ][:：])/g,'\n$1');
  const compactCombo=/^[イロハニホヘトチリヌルヲＡ-ＩA-I0-9０-９()（）・\s]+$/;
  if(!compactCombo.test(t)&&t.length>58&&!t.includes('\n'))t=t.replace(/。(?=.)/g,'。\n');

function buildLawSets(){let g={};DATA.questions.forEach(q=>lawFamilies(q).filter(k=>!['安衛法','安衛令','安衛則'].includes(k)).forEach(k=>(g[k]??=[]).push(q)));return g}
function sortStudyQs(qs){return [...qs].sort((a,b)=>b.year-a.year||a.subject.localeCompare(b.subject,'ja')||a.number-b.number)}
function startSimilarSet(key){let xs=sortStudyQs(DATA.questions.filter(q=>similarSetKey(q)===key));if(!xs.length)return alert('対象問題がありません。');startQuiz(xs,`${key}｜類題セット`)}
function startLawSet(law){let xs=sortStudyQs(DATA.questions.filter(q=>lawFamilies(q).includes(law)));if(!xs.length)return alert('対象問題がありません。');startQuiz(xs,`${law}｜法令別類題`)}
function similarScore(q,x){if(q.id===x.id)return -999;let s=0,ql=lawFamilies(q),xl=lawFamilies(x),commonL=ql.filter(k=>xl.includes(k));let specific=commonL.filter(k=>!['安衛法','安衛令','安衛則'].includes(k)).length,generic=commonL.length-specific;if(similarSetKey(q)===similarSetKey(x))s+=70;if(primaryTopic(q)===primaryTopic(x))s+=35;if(q.category===x.category)s+=24;if(q.cluster===x.cluster)s+=6;s+=specific*35+generic*3;s+=sharedCount(q.tags||[],x.tags||[])*10;if(q.subject===x.subject)s+=2;if(q.year!==x.year)s+=3;return s}
function similarTo(q){return DATA.questions.map(x=>({q:x,score:similarScore(q,x)})).filter(o=>o.score>=24).sort((a,b)=>b.score-a.score||Number(a.q.year===q.year)-Number(b.q.year===q.year)||b.q.year-a.q.year).slice(0,15).map(o=>o.q)}
function startSimilarTo(id){let q=qById(id),xs=similarTo(q);if(!xs.length)return alert('十分に近い関連問題がありません。');startQuiz(xs,`${similarSetKey(q)}｜厳密類題`)}
function startTopic(topic){let xs=sortStudyQs(DATA.questions.filter(q=>primaryTopic(q)===topic));startQuiz(xs,`${topic}｜5年横断`)}
function setPreview(qs){return sortStudyQs(qs).slice(0,5).map(q=>`<span>${esc(q.yearLabel)} ${q.subject==='労働衛生一般'?'一般':'法令'} 問${q.number}｜${esc(q.explanation?.title||q.category)}</span>`).join('')}

function setQuestions(key){return DATA.questions.filter(q=>similarSetKey(q)===key)}
function isWeakQ(q){let x=astate(q);return !!(x&&(x.everWrong||(x.attempts>=2&&x.correct/x.attempts<.8)))}
function isDueQ(q){let x=astate(q);return !!(x?.nextReview&&new Date(x.nextReview).getTime()<=Date.now())}
function itemParts(key){let a=String(key).split('｜');return {topic:a[0]||'その他',item:a.slice(1).join('｜')||'総合'}}
function itemStats(key,qs){qs=qs||setQuestions(key);let attempts=0,correct=0,done=0,weak=0,due=0;qs.forEach(q=>{let x=astate(q);if(x?.attempts){done++;attempts+=x.attempts||0;correct+=x.correct||0}if(isWeakQ(q))weak++;if(isDueQ(q))due++});let acc=attempts?Math.round(correct/attempts*100):null,status='未学習',cls='status-unstarted';if(done){status='学習中';cls='status-learning'}if(due){status='復習待ち';cls='status-due'}if(weak||(acc!==null&&acc<80)){status='要強化';cls='status-weak'}if(done===qs.length&&weak===0&&due===0&&acc!==null&&acc>=80){status='定着候補';cls='status-good'}return {total:qs.length,done,attempts,correct,acc,weak,due,status,cls}}
function isFocusSet(key){return !!(state.focusSets&&state.focusSets[key])}
function toggleFocusSet(key){state.focusSets=state.focusSets||{};if(state.focusSets[key])delete state.focusSets[key];else state.focusSets[key]={since:new Date().toISOString()};save();renderSimilar()}
function startWeakSet(key){let xs=setQuestions(key).filter(isWeakQ);if(!xs.length)return alert('この項目には現在、弱点問題がありません。');startQuiz(sortStudyQs(xs),`${key}｜弱点強化`)}
function startDueSet(key){let xs=setQuestions(key).filter(isDueQ);if(!xs.length)return alert('この項目には現在、復習期限が来ている問題はありません。');startQuiz(sortStudyQs(xs),`${key}｜復習`)}
function priorityScore(q){let x=astate(q),s=0;if(isDueQ(q))s+=100;if(isWeakQ(q))s+=75;if(!x?.attempts)s+=45;if(x?.bookmarked)s+=15;if(x?.attempts){let a=x.correct/x.attempts;s+=Math.round((1-a)*40);if(x.lastCorrect===false)s+=20}else s+=10;return s}
function priorityItems(qs,limit=12){return [...qs].sort((a,b)=>priorityScore(b)-priorityScore(a)||a.year-b.year||a.number-b.number).slice(0,Math.min(limit,qs.length))}
function startPrioritySet(key){let xs=priorityItems(setQuestions(key),12);if(!xs.length)return alert('対象問題がありません。');startQuiz(xs,`${key}｜重点学習`)}
function focusKeys(){return Object.keys(state.focusSets||{}).filter(k=>setQuestions(k).length)}
function startAllFocusSets(){let seen=new Set(),xs=[];focusKeys().forEach(k=>priorityItems(setQuestions(k),12).forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);xs.push(q)}}));xs=xs.sort((a,b)=>priorityScore(b)-priorityScore(a));if(!xs.length)return alert('重点項目がまだ登録されていません。');startQuiz(xs.slice(0,30),'重点項目まとめ学習')}
function itemCard(key,qs){let p=itemParts(key),st=itemStats(key,qs),focus=isFocusSet(key),enc=encodeURIComponent(key);return `<div class="item-card ${focus?'focus-card':''}"><div class="split"><div><div class="item-kicker">${esc(p.topic)} ＞ 項目</div><h3>${esc(p.item)}</h3></div><div><span class="status-badge ${st.cls}">${st.status}</span>${focus?'<span class="pill update">★重点</span>':''}</div></div><div class="metric-row"><div class="metric"><b>${st.done}/${st.total}</b><small>学習済み</small></div><div class="metric"><b>${st.acc==null?'—':st.acc+'%'}</b><small>正答率</small></div><div class="metric"><b>${st.weak}</b><small>弱点</small></div><div class="metric"><b>${st.due}</b><small>復習期限</small></div></div><div class="progress"><span style="width:${st.total?Math.round(st.done/st.total*100):0}%"></span></div><div class="actions item-actions" style="margin-top:10px"><button class="btn mint" onclick="startSimilarSet(decodeURIComponent('${enc}'))">全問</button><button class="btn rose" onclick="startWeakSet(decodeURIComponent('${enc}'))" ${st.weak?'':'disabled'}>弱点強化${st.weak?' '+st.weak+'問':''}</button><button class="btn amber" onclick="startDueSet(decodeURIComponent('${enc}'))" ${st.due?'':'disabled'}>復習${st.due?' '+st.due+'問':''}</button><button class="btn primary" onclick="startPrioritySet(decodeURIComponent('${enc}'))">重点学習</button><button class="btn soft ${focus?'focus-star':''}" onclick="toggleFocusSet(decodeURIComponent('${enc}'))">${focus?'★ 重点解除':'☆ 重点項目'}</button></div><div class="preview">${setPreview(qs)}</div></div>`}
function renderSimilar(){let fine=buildSimilarSets(),laws=buildLawSets(),broad={};DATA.questions.forEach(q=>(broad[primaryTopic(q)]??=[]).push(q));let fineEntries=Object.entries(fine).filter(([,qs])=>qs.length>=2).sort((a,b)=>{let ap=itemParts(a[0]),bp=itemParts(b[0]);return ap.topic.localeCompare(bp.topic,'ja')||ap.item.localeCompare(bp.item,'ja')});let lawEntries=Object.entries(laws).filter(([,qs])=>qs.length>=2).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'ja'));let grouped={};fineEntries.forEach(([k,qs])=>{let p=itemParts(k);(grouped[p.topic]??=[]).push([k,qs])});let fkeys=focusKeys();let focusHtml=fkeys.length?`<section class="card focus-summary"><div class="split"><div><h2>⭐ 重点項目</h2><div class="muted">自分で重点指定した項目をまとめて学習できます。</div></div><button class="btn primary" onclick="startAllFocusSets()">重点項目をまとめて学習</button></div><div class="filters" style="margin-top:10px">${fkeys.map(k=>{let st=itemStats(k);return `<span class="pill update">${esc(k)}｜弱点${st.weak}・復習${st.due}</span>`}).join('')}</div></section>`:'';document.getElementById('app').innerHTML=`<h1 class="page-title">類題・項目別学習</h1><p class="sub">類題を「分野 ＞ 項目」に分け、項目ごとに全問・弱点強化・復習・重点学習を選べます。</p><section class="card"><div class="callout"><b>おすすめの使い方：</b> 間違えた項目は「弱点強化」、復習期限が来た項目は「復習」、試験前に集中的に回したい項目は「★重点項目」に登録して「重点学習」を使います。重点学習は、復習期限 → 誤答・低正答率 → 未着手の順に優先します。</div></section>${focusHtml}<h2 class="section-label">🧩 項目別の類題セット</h2><p class="mini-note">同じ分野・同じ法律・近い論点をできるだけ同じ項目にまとめています。各項目に学習状況を表示します。</p>${Object.entries(grouped).map(([topic,entries])=>`<section class="item-group"><div class="item-group-head"><h2>${esc(topic)}</h2><span class="pill">${entries.length}項目</span></div><div class="set-grid">${entries.map(([k,qs])=>itemCard(k,qs)).join('')}</div></section>`).join('')}<h2 class="section-label">⚖️ 法令別の横断学習</h2><p class="mini-note">一般問題と法令問題をまたいで、同じ個別法令に関係する問題をまとめます。</p><div class="set-grid">${lawEntries.map(([g,qs])=>`<div class="set-card"><span class="pill law">${esc(g)}</span><span class="pill">${qs.length}問</span><h3>${esc(g)}に関係する問題</h3><button class="btn soft" onclick="startLawSet('${g.replace(/'/g,"\\'")}')">この法令で解く</button><div class="preview">${setPreview(qs)}</div></div>`).join('')}</div><h2 class="section-label">📚 分野別セット</h2><p class="mini-note">項目より広い範囲をまとめて確認したいときに使います。</p>${Object.entries(broad).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([g,qs])=>{let ls=[...new Set(qs.flatMap(q=>lawFamilies(q)).filter(k=>!['安衛法','安衛令','安衛則'].includes(k)))];return `<section class="card"><div class="split"><div><h2>${esc(g)}</h2><div class="muted">${qs.length}問・${new Set(qs.map(q=>q.year)).size}年度 ${ls.length?`｜関連法令：${ls.map(esc).join('・')}`:''}</div></div><button class="btn mint" onclick="startTopic('${g.replace(/'/g,"\\'")}')">この分野を解く</button></div><div class="tiny">${[2025,2024,2023,2022,2021].map(y=>`${YEAR(y)} ${qs.filter(q=>q.year===y).length}問`).join(' ｜ ')}</div></section>`}).join('')}`}
function renderReview(){let w=weakQs(),d=dueQs(),b=bookmarked(),sets=buildSimilarSets();let ranks=Object.entries(sets).filter(([,qs])=>qs.length>=2).map(([k,qs])=>({k,qs,st:itemStats(k,qs)})).filter(o=>o.st.done>0||o.st.weak||o.st.due).sort((a,b)=>b.st.weak-a.st.weak||b.st.due-a.st.due||(a.st.acc??101)-(b.st.acc??101));document.getElementById('app').innerHTML=`<h1 class="page-title">間違い直し・苦手強化</h1><p class="sub">個別問題だけでなく、どの「項目」が弱いかも自動で見えるようにしています。</p><div class="grid3"><div class="stat"><div class="num">${w.length}</div><small>苦手問題</small></div><div class="stat"><div class="num">${d.length}</div><small>期限到来</small></div><div class="stat"><div class="num">${b.length}</div><small>保存</small></div></div><section class="card"><h2>項目別の弱点</h2><p class="muted">弱点数 → 復習期限 → 正答率の低さの順で表示します。ここから直接「弱点強化」「重点学習」ができます。</p>${ranks.slice(0,20).map(o=>{let p=itemParts(o.k),enc=encodeURIComponent(o.k);return `<div class="weak-rank"><div><div class="name">${esc(p.topic)} ＞ ${esc(p.item)}</div><div class="subline">${o.st.done}/${o.st.total}問学習・${o.st.status}</div></div><div><b>${o.st.acc==null?'—':o.st.acc+'%'}</b><div class="tiny">正答率</div></div><div><b>${o.st.weak}</b><div class="tiny">弱点</div></div><div class="actions"><button class="btn rose" onclick="startWeakSet(decodeURIComponent('${enc}'))" ${o.st.weak?'':'disabled'}>弱点強化</button><button class="btn primary" onclick="startPrioritySet(decodeURIComponent('${enc}'))">重点</button></div></div>`}).join('')||'<div class="empty">項目別の学習データはまだありません。</div>'}</section><section class="card"><h2>個別問題の復習</h2><div class="actions"><button class="btn rose" onclick="startQuiz(weakQs(),'苦手問題')" ${w.length?'':'disabled'}>苦手を全部</button><button class="btn amber" onclick="startQuiz(dueQs(),'期限到来')" ${d.length?'':'disabled'}>期限到来だけ</button><button class="btn soft" onclick="startQuiz(bookmarked(),'保存問題')" ${b.length?'':'disabled'}>保存問題</button></div>${w.slice(0,80).map(q=>{let x=astate(q);return `<div class="review-item">${yearPill(q)}${subjectPill(q)}<span class="pill">問${q.number}</span><b>${esc(q.explanation?.title||q.category)}</b><small class="muted">正答 ${x.correct}/${x.attempts}｜項目：${esc(similarSetKey(q))}</small><div><button class="btn soft" style="margin-top:8px" onclick="startQuiz([qById('${q.id}')],'復習')">解き直す</button></div></div>`}).join('')||'<div class="empty">まだ苦手問題はありません。</div>'}</section>${renderStatsBlock()}`}
function renderStatsBlock(){let groups={};DATA.questions.forEach(q=>{let g=q.cluster;groups[g]??={items:0,attempts:0,correct:0,done:0};let x=astate(q);groups[g].items++;if(x){groups[g].attempts+=x.attempts;groups[g].correct+=x.correct;if(x.attempts)groups[g].done++}});return `<section class="card"><h2>分野別の正答率</h2>${Object.entries(groups).map(([g,x])=>{let a=x.attempts?Math.round(x.correct/x.attempts*100):null;return `<div class="barrow"><span>${esc(g)}<small class="muted"> ${x.done}/${x.items}</small></span><div class="progress"><span style="width:${a??0}%"></span></div><b>${a==null?'—':a+'%'}</b></div>`}).join('')}</section>`}
function renderUpdates(){document.getElementById('app').innerHTML=`<h1 class="page-title">法改正・現在との差分</h1><p class="sub">確認基準日：${DATA.meta.verifiedAsOf}。過去問の採点は出題当時、現在の制度は別カードで確認します。</p><section class="callout"><b>この版で特に重要：</b>令和4年度 法令問1は、2026-08-01施行の安衛則改正により産業医の辞任等の監督署報告が義務化され、現在の条文で読むと出題当時の第5肢も正しくなります。</section>${DATA.updates.map(u=>`<section class="card update-item ${u.status==='施行予定'?'future':''}"><span class="pill update">${esc(u.status)}</span><span class="pill">${esc(u.date)}</span><h2 style="margin-top:8px">${esc(u.title)}</h2><p>${esc(u.summary)}</p><div class="tiny">関連：${u.affected.map(id=>{let q=qById(id);return q?`${q.yearLabel} ${q.subject==='労働衛生一般'?'一般':'法令'}問${q.number}`:id}).join('、')}</div><p><a href="${esc(u.url)}" target="_blank">一次資料を開く ↗</a></p></section>`).join('')}`}
function renderSettings(){let swOk='serviceWorker' in navigator&&location.protocol!=='file:',standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;document.getElementById('app').innerHTML=`<h1 class="page-title">設定・収載情報</h1><section class="card pwa-section"><h2>📱 アプリ・オフライン</h2><p><b>${standalone?'アプリとして起動中':'ブラウザで起動中'}</b><br>${navigator.onLine?'オンライン':'オフライン'}｜${swOk?'Service Worker利用可能':'この開き方ではService Workerは利用できません'}</p><div class="actions"><button class="btn primary" id="settingsInstallBtn" onclick="installPwa()">アプリをインストール</button><button class="btn soft" onclick="checkForAppUpdate()">更新を確認</button></div><div class="callout" style="margin-top:12px"><b>オフライン利用：</b>HTTPSまたはlocalhostで一度オンライン起動すると、index.html・問題データ・アイコンを端末に保存します。その後は通信がない場所でも過去問演習と学習履歴の保存ができます。<br><b>注意：</b>HTMLファイルを直接 file:// で開いた場合はPWAインストールとService Workerが使えません。</div></section><section class="card"><h2>収載</h2><p>令和7～3年度：各年度 一般30問＋法令15問<br><b>合計225問</b>（一般150／法令75）<br>類題は「分野 ＞ 項目」で整理し、項目別の弱点強化・復習・重点学習に対応</p><p>現行法確認基準：${DATA.meta.verifiedAsOf}<br>Version ${DATA.meta.version}</p><div class="tiny">${esc(DATA.meta.sourceNote)}</div></section><section class="card"><h2>学習履歴</h2><p class="muted">この端末のブラウザ内（localStorage）に保存します。PWAを更新しても通常は保持されます。</p><div class="actions"><button class="btn primary" onclick="exportState()">JSON書き出し</button><label class="btn soft">読み込み<input type="file" hidden accept="application/json" onchange="importState(event)"></label><button class="btn rose" onclick="resetState()">リセット</button></div></section><section class="card"><h2>参考</h2><a href="${esc(DATA.oshIndex)}" target="_blank">OSH-Management 労働衛生コンサルタント過去問解説一覧 ↗</a><div class="tiny" style="margin-top:8px">解説の構成・論点整理を参考にしていますが、サイト本文を転載するのではなく、問題・公表正答・一次資料を基に学習用に整理しています。</div></section>`;updateInstallButtons()}
function exportState(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='労コンStudy_過去5年_学習履歴.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importState(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=Object.assign(emptyState(),JSON.parse(r.result));save();alert('読み込みました');render()}catch(err){alert('読み込み失敗')}};r.readAsText(f)}function resetState(){if(confirm('学習履歴をすべて削除しますか？')){state=emptyState();save();render()}}

let deferredInstallPrompt=null,swRegistration=null;
function updateOnlineStatus(){let on=navigator.onLine,dot=document.getElementById('pwaDot'),txt=document.getElementById('pwaStatusText');if(dot)dot.classList.toggle('off',!on);if(txt)txt.textContent=on?'オンライン':'オフライン'}
function updateInstallButtons(){let standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true,show=!!deferredInstallPrompt&&!standalone;['installBtn','settingsInstallBtn'].forEach(id=>{let b=document.getElementById(id);if(!b)return;if(id==='installBtn')b.hidden=!show;else{b.disabled=standalone;b.textContent=standalone?'インストール済み':(show?'アプリをインストール':'インストール案内')}})}
async function installPwa(){let standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;if(standalone)return alert('すでにアプリとして起動しています。');if(deferredInstallPrompt){deferredInstallPrompt.prompt();let r=await deferredInstallPrompt.userChoice;if(r.outcome==='accepted')deferredInstallPrompt=null;updateInstallButtons();return}alert('インストールボタンが表示されない場合は、ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を選んでください。iPhone/iPadはSafariの共有メニュー →「ホーム画面に追加」です。')}
function showPwaToast(message,worker){let el=document.getElementById('pwaToast');if(!el)return;el.innerHTML=`<span>${esc(message)}</span>${worker?'<button id="pwaUpdateBtn">更新</button>':''}`;el.classList.add('show');if(worker){document.getElementById('pwaUpdateBtn').onclick=()=>worker.postMessage({type:'SKIP_WAITING'})}else setTimeout(()=>el.classList.remove('show'),3500)}
async function checkForAppUpdate(){if(!swRegistration)return alert(location.protocol==='file:'?'file:// では更新確認できません。HTTPSで公開したURLから開いてください。':'Service Workerの準備中です。');try{await swRegistration.update();showPwaToast('更新を確認しました。新しい版があれば更新ボタンを表示します。')}catch(e){alert('更新確認に失敗しました。通信状態を確認してください。')}}
async function registerPwa(){updateOnlineStatus();if(!('serviceWorker' in navigator)||location.protocol==='file:')return;try{let reg=await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});swRegistration=reg;if(reg.waiting)showPwaToast('新しいアプリ版があります。',reg.waiting);reg.addEventListener('updatefound',()=>{let nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showPwaToast('新しいアプリ版があります。',nw)})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}catch(e){console.warn('Service Worker registration failed',e)}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButtons()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButtons();showPwaToast('労コンStudyをインストールしました。')});
window.addEventListener('online',updateOnlineStatus);window.addEventListener('offline',updateOnlineStatus);
render();registerPwa();updateInstallButtons();

</script></body></html>
