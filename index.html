"question":"熱中症に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　作業現場のＷＢＧＴ値の低下は、天候による要因のみで起きる。\nロ　熱中症の労働衛生教育の対象者は作業を管理する者と労働者の両方で\nあり、教育内容には、熱中症の症状・予防方法、緊急時の救急処置、熱中症の事例が含まれる。\nハ　熱中症の救急処置において、自力で水分・塩分摂取できる場合でも症\n状が回復しないときは、医療機関へ搬送する。\nニ　ＷＢＧＴ基準値は、暑熱非順化者に用いる値の方が、暑熱順化者に用\nいる値より大きな値となる。","options":["イ ロ","イ ハ ニ","イ ニ","ロ ハ ニ","ロ ハ"],"correctIndex":4,"category":"物理的因子","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"熱中症予防","point":"WBGTは天候だけでなく、日陰化、遮熱、換気、冷房等の設備対策でも下げられます。教育は管理者と労働者双方に行います。自力摂取できても症状が改善しなければ医療機関へ搬送します。非順化者は同じ作業でも許容WBGTが低く、基準値が大きいという記述は逆です。","conclusion":"正答（5）：ロ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ハ ニ\n\n（3）— 非正答肢\n　イ ニ\n\n（4）— 非正答肢\n　ロ ハ ニ\n\n（5）◎ 公式公表正答\n　ロ ハ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場における熱中症予防情報","url":"https://neccyusho.mhlw.go.jp/"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question09/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question09/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-10","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":10,"question":"厚生労働省の「テレワークの適切な導入及び実施の推進のためのガイドライン」における長時間労働対策に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　所定外深夜及び休日は、事前に許可を得ない限り、社内システムにア\nクセスできないように設定する。\nロ　労使の合意により、時間外等の労働が可能な時間帯や時間数を、あら\nかじめ使用者が設定する。\nハ　一日の勤務終了後から翌日の勤務までの間に一定時間以上の休息時間\nを設ける勤務間インターバル制度を採用する。\nニ　長時間労働が生じた労働者に対しては、管理者が労働時間の記録を踏\nまえて注意喚起する。","options":["イ ロ ハ ニ","イ ロ ハ","イ ニ","ロ ハ","ハ ニ"],"correctIndex":0,"category":"メンタルヘルス・過重労働","cluster":"健康診断・健康管理","examLawDate":"2023-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"テレワークの長時間労働対策","point":"ガイドラインは、アクセス制限、時間外等の時間帯・時間数の設定、勤務間インターバル、労働時間記録を踏まえた注意喚起などを長時間労働防止の例として示します。テレワークでも使用者には労働時間を適正に把握する責務があります。","conclusion":"正答（1）：イ・ロ・ハ・ニの全て。","choicesExplain":"（1）◎ 公式公表正答\n　イ ロ ハ ニ\n\n（2）— 非正答肢\n　イ ロ ハ\n\n（3）— 非正答肢\n　イ ニ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"テレワークガイドライン","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc6069&dataType=1&pageNo=1"},{"label":"労働時間の適正な把握ガイドライン","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000148322_00001.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question10/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question10/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-11","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":11,"question":"特殊健康診断に関する次の記述のうち、誤っているものはどれか。","options":["一般に、有機溶剤は生物学的半減期が短いので、有機溶剤等健康診断における尿中の代謝物の量の検査のための採尿の時刻は、厳重に管理する必要がある。","テトラクロロエチレンの特殊健康診断における生物学的モニタリングの指標には、尿中に排泄されるトリクロロ酢酸がある。","振動工具取扱い作業者に対する特殊健康診断を１年に２回実施する場合、そのうち１回は冬季に行うとよい。","情報機器作業に係る健康診断では、眼科学的検査などとともに、上肢及び下肢の運動機能の検査を行う。","介護・看護作業に常時従事する労働者に対しては、当該作業に配置する際及びその後６か月以内ごとに１回、定期に、医師による腰痛の健康診断を行う。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"特殊健康診断","point":"情報機器作業の健康管理では、眼・視機能、筋骨格系では主に上肢、頸肩腕、腰背部等の症状を確認します。下肢運動機能検査を定型項目として併記するのは不適切です。有機溶剤の採尿時刻、テトラクロロエチレンの尿中トリクロロ酢酸、振動健診の冬季実施、介護・看護作業の腰痛健診は重要事項です。","conclusion":"正答（4）：情報機器作業で下肢運動機能検査を一律に行うものではない。","choicesExplain":"（1）— 非正答肢\n　一般に、有機溶剤は生物学的半減期が短いので、有機溶剤等健康診断における尿中の代謝物の量の検査のための採尿の時刻は、厳重に管理する必要がある。\n\n（2）— 非正答肢\n　テトラクロロエチレンの特殊健康診断における生物学的モニタリングの指標には、尿中に排泄されるトリクロロ酢酸がある。\n\n（3）— 非正答肢\n　振動工具取扱い作業者に対する特殊健康診断を１年に２回実施する場合、そのうち１回は冬季に行うとよい。\n\n（4）◎ 公式公表正答\n　情報機器作業に係る健康診断では、眼科学的検査などとともに、上肢及び下肢の運動機能の検査を行う。\n\n（5）— 非正答肢\n　介護・看護作業に常時従事する労働者に対しては、当該作業に配置する際及びその後６か月以内ごとに１回、定期に、医師による腰痛の健康診断を行う。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20230401"},{"label":"厚生労働省・職場における労働衛生対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzeneisei03.html"},{"label":"職場における腰痛予防対策指針","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tb9484&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question11/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question11/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-12","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":12,"question":"メタボリックシンドロームの診断のための各項目の基準として、適切でないものは次のうちどれか。","options":["女性では、ウエスト周囲径（へその高さの腹囲）が90cm以上である。","150mg/dL以上の高トリグリセライド血症がある。","110mg/dL以上の空腹時高血糖がある。","拡張期血圧が80mmHg以上である。","40mg/dL未満の低ＨＤＬコレステロール血症がある。"],"correctIndex":3,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"メタボリックシンドローム","point":"日本の基準は腹囲が男性85 cm以上、女性90 cm以上を必須とし、脂質異常、血圧130/85 mmHg以上、空腹時血糖110 mg/dL以上のうち2項目以上です。したがって拡張期80 mmHg以上は誤りです。","conclusion":"正答（4）：拡張期血圧は85 mmHg以上が基準。","choicesExplain":"（1）— 非正答肢\n　女性では、ウエスト周囲径（へその高さの腹囲）が90cm以上である。\n\n（2）— 非正答肢\n　150mg/dL以上の高トリグリセライド血症がある。\n\n（3）— 非正答肢\n　110mg/dL以上の空腹時高血糖がある。\n\n（4）◎ 公式公表正答\n　拡張期血圧が80mmHg以上である。\n\n（5）— 非正答肢\n　40mg/dL未満の低ＨＤＬコレステロール血症がある。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省・特定健康診査・特定保健指導","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000161103.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question12/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question12/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-13","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":13,"question":"厚生労働省の「第14次労働災害防止計画」における労働者の健康確保対策の推進に関し、労働者の協力を得て事業者が取り組む事項についての次の記述のうち、適切でないものはどれか。","options":["ストレスチェック結果をもとに集団分析を行い、その集団分析を活用した職場環境の改善まで行うことで、メンタルヘルス不調の予防を強化する。","年次有給休暇の確実な取得を促進する。","育児と仕事の両立支援に関して、労働者や管理監督者等に対する研修の実施等の環境整備に取り組む。","長時間労働による医師の面接指導の対象となる労働者に対して、医師による面接指導や、保健師等の産業保健スタッフによる相談支援を受けるよう勧奨する。","職場におけるハラスメント防止対策に取り組む。"],"correctIndex":2,"category":"メンタルヘルス・過重労働","cluster":"健康診断・健康管理","examLawDate":"2023-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"第14次労災防・健康確保","point":"第14次労災防の健康確保では、メンタルヘルス、年休取得、長時間労働者への面接指導等の勧奨、ハラスメント防止、治療と仕事の両立支援などを扱います。設問の「育児と仕事の両立支援」は別の政策領域を混ぜたものです。","conclusion":"正答（3）：育児との両立支援はこの箇所の列挙事項ではない。","choicesExplain":"（1）— 非正答肢\n　ストレスチェック結果をもとに集団分析を行い、その集団分析を活用した職場環境の改善まで行うことで、メンタルヘルス不調の予防を強化する。\n\n（2）— 非正答肢\n　年次有給休暇の確実な取得を促進する。\n\n（3）◎ 公式公表正答\n　育児と仕事の両立支援に関して、労働者や管理監督者等に対する研修の実施等の環境整備に取り組む。\n\n（4）— 非正答肢\n　長時間労働による医師の面接指導の対象となる労働者に対して、医師による面接指導や、保健師等の産業保健スタッフによる相談支援を受けるよう勧奨する。\n\n（5）— 非正答肢\n　職場におけるハラスメント防止対策に取り組む。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"第14次労働災害防止計画","url":"https://www.mhlw.go.jp/content/11200000/001116307.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question13/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question13/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-14","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":14,"question":"物理的因子と障害の部位との次の組合せのうち、適切でないものはどれか。物理的因子障害の部位","options":["赤外線・・・・・・・・・・・・水晶体","レーザー光線・・・・・・・・・角膜","電離放射線・・・・・・・・・・生殖腺","手腕振動・・・・・・・・・・・中枢神経","減圧・・・・・・・・・・・・・中枢神経"],"correctIndex":3,"category":"物理的因子","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子と標的臓器","point":"手腕振動障害は白ろう現象などの末梢循環障害、しびれ等の末梢神経障害、骨・関節・筋の運動器障害を生じます。中枢神経を主標的とする組合せは不適切です。赤外線は水晶体、レーザーは波長により角膜・網膜、電離放射線は生殖腺、減圧症は中枢神経にも障害を起こします。","conclusion":"正答（4）：手腕振動の主な障害部位は末梢循環・末梢神経・運動器。","choicesExplain":"（1）— 非正答肢\n　赤外線・・・・・・・・・・・・水晶体\n\n（2）— 非正答肢\n　レーザー光線・・・・・・・・・角膜\n\n（3）— 非正答肢\n　電離放射線・・・・・・・・・・生殖腺\n\n（4）◎ 公式公表正答\n　手腕振動・・・・・・・・・・・中枢神経\n\n（5）— 非正答肢\n　減圧・・・・・・・・・・・・・中枢神経","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省・職場における労働衛生対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzeneisei03.html"},{"label":"電離放射線障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question14/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question14/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-15","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":15,"question":"加齢による人体の機能の変化に関する次の記述のうち、誤っているものはどれか。","options":["筋持久力の指標である上体起こしは、男性で60～64歳にはピーク時の約６割まで低下する。","全身持久力の指標である20ｍシャトルラン（往復持久走）は、男女とも40歳頃から著しい低下傾向を示す。","女性の更年期は、閉経を迎える前後をいい、エストロゲンの分泌が低下することによる更年期障害を伴う。","女性の更年期には、子宮、膣、尿道、膀胱、毛髪、皮膚、骨などの器官が萎縮してくる。","男性では、テストステロンの分泌の低下により、筋力低下、自律神経失調症状や精力減退などを生じる。"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"加齢による機能変化","point":"体力・感覚機能は加齢とともに低下しますが、機能ごとに低下時期と程度は異なり、個人差も大きいです。全身持久力はより早期から緩やかに低下するため「男女とも40歳頃から著しい低下」と一律にするのは不適切です。更年期の性ホルモン低下に伴う変化は適切です。","conclusion":"正答（2）：20mシャトルランは40歳頃から突然著減するという整理ではない。","choicesExplain":"（1）— 非正答肢\n　筋持久力の指標である上体起こしは、男性で60～64歳にはピーク時の約６割まで低下する。\n\n（2）◎ 公式公表正答\n　全身持久力の指標である20ｍシャトルラン（往復持久走）は、男女とも40歳頃から著しい低下傾向を示す。\n\n（3）— 非正答肢\n　女性の更年期は、閉経を迎える前後をいい、エストロゲンの分泌が低下することによる更年期障害を伴う。\n\n（4）— 非正答肢\n　女性の更年期には、子宮、膣、尿道、膀胱、毛髪、皮膚、骨などの器官が萎縮してくる。\n\n（5）— 非正答肢\n　男性では、テストステロンの分泌の低下により、筋力低下、自律神経失調症状や精力減退などを生じる。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"エイジフレンドリーガイドライン","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc4842&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question15/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question15/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-16","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":16,"question":"金属類による健康障害に関する次の記述のうち、誤っているものはどれか。","options":["マンガンによる慢性中毒では、神経質になるなどの精神症状、歩行障害、発語障害などのパーキンソン病に似た症状がみられる。","クロム酸などの六価クロムの化合物は、皮膚に接触すると、局所の刺激で充血、水疱や潰瘍がみられ、長期間のばく露によってアレルギー性接触性皮膚炎がみられる。","鉛中毒では、貧血、腹部の疝痛、末梢神経障害、伸筋麻痺による下垂手がみられる。","ニッケルは、粉じんやヒュームが経気道的に吸入されると、気管支喘息などのアレルギー症状や肝障害がみられる。","砒素の慢性中毒では、色素沈着症、黒皮症、角化症、鼻中隔穿孔、末梢神経障害がみられる。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"金属による健康障害","point":"マンガンはパーキンソニズム、六価クロムは皮膚潰瘍・感作・鼻中隔穿孔、鉛は貧血・疝痛・末梢神経障害、砒素は色素沈着・角化・末梢神経障害等を起こします。ニッケル化合物は喘息や皮膚炎、発がん性が重要で、設問の肝障害は典型的な対応ではありません。","conclusion":"正答（4）：ニッケルで典型的に問うのは呼吸器・皮膚感作、鼻腔・肺がん等で、肝障害の組合せが不適切。","choicesExplain":"（1）— 非正答肢\n　マンガンによる慢性中毒では、神経質になるなどの精神症状、歩行障害、発語障害などのパーキンソン病に似た症状がみられる。\n\n（2）— 非正答肢\n　クロム酸などの六価クロムの化合物は、皮膚に接触すると、局所の刺激で充血、水疱や潰瘍がみられ、長期間のばく露によってアレルギー性接触性皮膚炎がみられる。\n\n（3）— 非正答肢\n　鉛中毒では、貧血、腹部の疝痛、末梢神経障害、伸筋麻痺による下垂手がみられる。\n\n（4）◎ 公式公表正答\n　ニッケルは、粉じんやヒュームが経気道的に吸入されると、気管支喘息などのアレルギー症状や肝障害がみられる。\n\n（5）— 非正答肢\n　砒素の慢性中毒では、色素沈着症、黒皮症、角化症、鼻中隔穿孔、末梢神経障害がみられる。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20230401"},{"label":"鉛中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000037?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question16/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question16/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-17","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":17,"question":"作業環境測定を行う際に注意すべき事項に関する次の記述のうち、誤っているものはどれか。","options":["混合有機溶剤の場合、溶剤中の含有率が低い物質であっても、高い蒸気圧を有するなど物性によっては環境空気中の濃度が高くなる場合がある。","取り扱う原材料によっては、温度などの条件や生産工程の進み具合によって、有害物質の発散の程度が変動する。","別々の発散源から発散した複数の有機溶剤が空気中で混合する場合は、混合有機溶剤を取り扱う一つの単位作業場所として評価する。","測定対象物質がどのような形態で発散し、どのような状態で環境空気中に存在するかを理解する。","測定対象作業場の主たる業務のほかに、付随的な業務で法的に測定義務のある物質を発散する業務が行われることがあるので、作業環境測定士、衛生管理者、作業主任者などの間で事前の打合せを行い、作業の実態を十分に把握する。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"作業環境測定の事前調査","point":"単位作業場所は、作業者の行動範囲と有害物の濃度分布が同様になる範囲で設定します。別々の発散源・工程であれば、空気中で混ざるだけで一単位にまとめるのではなく、発散状況、気流、作業範囲を調査して決定します。原料組成、蒸気圧、温度、付随作業の把握は測定デザインに必須です。","conclusion":"正答（3）：別々の発散源を自動的に一つの混合有機溶剤単位作業場所として評価しない。","choicesExplain":"（1）— 非正答肢\n　混合有機溶剤の場合、溶剤中の含有率が低い物質であっても、高い蒸気圧を有するなど物性によっては環境空気中の濃度が高くなる場合がある。\n\n（2）— 非正答肢\n　取り扱う原材料によっては、温度などの条件や生産工程の進み具合によって、有害物質の発散の程度が変動する。\n\n（3）◎ 公式公表正答\n　別々の発散源から発散した複数の有機溶剤が空気中で混合する場合は、混合有機溶剤を取り扱う一つの単位作業場所として評価する。\n\n（4）— 非正答肢\n　測定対象物質がどのような形態で発散し、どのような状態で環境空気中に存在するかを理解する。\n\n（5）— 非正答肢\n　測定対象作業場の主たる業務のほかに、付随的な業務で法的に測定義務のある物質を発散する業務が行われることがあるので、作業環境測定士、衛生管理者、作業主任者などの間で事前の打合せを行い、作業の実態を十分に把握する。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"作業環境評価基準","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74088000"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question17/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question17/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-18","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":18,"question":"作業環境測定（Ａ・Ｂ測定）のデザインに関する次の記述のうち、適切でないものはどれか。","options":["過去において実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下である場合には、測定点を６ｍを超える等間隔で引いた縦横の線の交点とすることができる。","Ａ測定では、単位作業場所の範囲が著しく狭い場合であって、単位作業場所における有害物質の濃度がほぼ均一であることが明らかな場合に、測定点の数を５未満としたときは、測定値の総数は５以上にしなくてもよい。","単位作業場所の範囲は平面的な場所だけではなく、有害物質の発生場所を取り巻くように設置された作業足場のような立体的なものとなる場合もある。","単位作業場所は、労働者の作業中の行動範囲、作業に伴って発散する有害物質の分布等の状況等によって決定する。","Ａ測定の２日間測定は、有害物濃度の日間変動を加味した測定結果を得るためであるが、合理的な理由がある場合は、連続する二作業日に実施しなくてもよい。"],"correctIndex":1,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"A・B測定のデザイン","point":"A測定は原則として6m以下の等間隔線の交点で5点以上測定します。狭い場所で測定点を5未満にできる特例でも、時間を変えるなどして測定値の総数は5以上確保します。2日間測定は日間変動を反映するためで、合理的理由があれば連続日でなくても構いません。","conclusion":"正答（2）：測定点を5未満にした場合も測定値総数は5以上必要。","choicesExplain":"（1）— 非正答肢\n　過去において実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下である場合には、測定点を６ｍを超える等間隔で引いた縦横の線の交点とすることができる。\n\n（2）◎ 公式公表正答\n　Ａ測定では、単位作業場所の範囲が著しく狭い場合であって、単位作業場所における有害物質の濃度がほぼ均一であることが明らかな場合に、測定点の数を５未満としたときは、測定値の総数は５以上にしなくてもよい。\n\n（3）— 非正答肢\n　単位作業場所の範囲は平面的な場所だけではなく、有害物質の発生場所を取り巻くように設置された作業足場のような立体的なものとなる場合もある。\n\n（4）— 非正答肢\n　単位作業場所は、労働者の作業中の行動範囲、作業に伴って発散する有害物質の分布等の状況等によって決定する。\n\n（5）— 非正答肢\n　Ａ測定の２日間測定は、有害物濃度の日間変動を加味した測定結果を得るためであるが、合理的な理由がある場合は、連続する二作業日に実施しなくてもよい。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"作業環境評価基準","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74088000"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question18/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question18/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-19","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":19,"question":"局所排気装置に関する次のイ～ホの記述について、誤っているものの組合せは（１）～（５）のうちどれか。\nイ　制御風速とは、有害物により汚染された空気を有害物の発生点におい\nて捕捉するために必要な最小風速をいう。\nロ　ダクトは、曲がり部分をできるだけ少なくするよう配管し、主ダクト\nと枝ダクトの合流角度は45°を超えないようにする。\nハ　排風量一定の条件では、ダクトの断面積を小さくすると、圧力損失は\n大きくなる。\nニ　スロット型フードは、作業面を除き、周りが囲われているもので、囲\nい式フードに分類される。\nホ　囲い式フードのうちのドラフトチェンバー型、カバー型及び建築ブー\nス型では、カバー型が最も排気効果が高い。","options":["イ ロ","イ ニ","ロ ハ","ハ ホ","ニ ホ"],"correctIndex":1,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"局所排気装置","point":"制御風速は、有害物を発散源からフードに吸引するため、フードの種類ごとに定められた位置で必要な最小風速です。「発生点において」と一律には定義しません。スロット型は細長い開口を持つフード形状で、必ずしも囲い式ではありません。ダクトは曲がりを減らし、断面積を小さくすると速度・圧力損失が増えます。","conclusion":"正答（2）：イ・ニが誤り。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）◎ 公式公表正答\n　イ ニ\n\n（3）— 非正答肢\n　ロ ハ\n\n（4）— 非正答肢\n　ハ ホ\n\n（5）— 非正答肢\n　ニ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20230401"},{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question19/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question19/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-20","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":20,"question":"事務室の採光、照明などに関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　照度は高いほど書類の文字はよく見えるが、明る過ぎると疲労度が増\nす。\nロ　全般照明の照度は、局部照明による照度の少なくとも約10分の１以上\nが望ましい。\nハ　室内の明るさにムラがないようにする。\nニ　前方から明かりをとるときは、まぶしさを防ぐため、光源と眼を結ぶ\n線と視線がなす角度は30°以下となるようにする。","options":["イ ロ ハ ニ","イ ロ ハ","イ ハ ニ","ロ ハ","ロ ニ"],"correctIndex":1,"category":"物理的因子","cluster":"人間工学・作業態様","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"事務室の照明","point":"明るさは高すぎてもグレアや疲労を招くため適正化が必要です。全般照明は局部照明との明暗差を小さくし、概ね1/10以上とします。室内の明るさのむらも抑えます。前方光源と視線の角度は小さいほどまぶしくなるため、30度以下ではなく、十分大きな角度を確保します。","conclusion":"正答（2）：イ・ロ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ ニ\n\n（2）◎ 公式公表正答\n　イ ロ ハ\n\n（3）— 非正答肢\n　イ ハ ニ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ロ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"事務所衛生基準規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000043?occasion_date=20230401"},{"label":"厚生労働省・職場における労働衛生対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzeneisei03.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question20/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question20/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-21","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":21,"question":"化学物質等の有害性等に関する次の記述のうち、誤っているものはどれか。","options":["変異原性試験は発がん性のスクリーニングとして実施されているが、発がん性のあるものが変異原性を有するとは限らない。","特定標的臓器毒性（反復ばく露）とは、反復ばく露によって起こる特定臓器に対する特異的な致死性の毒性をいう。","神経毒性とは、神経機能を障害する性質をいい、神経毒性を持つ金属として、有機水銀などがある。","窒息性とは、窒素やヘリウムなどのガスが、酸素の供給を妨げることで窒息させる性質をいう。","感作性とは、皮膚や呼吸器にアレルギー反応を引き起こす性質をいう。"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質の有害性分類","point":"特定標的臓器毒性（反復ばく露）は、反復ばく露により特定臓器に生じる非致死性を含む有害影響を分類するものです。変異原性は発がん性スクリーニングに使われますが両者は同義ではありません。神経毒性、単純窒息性、感作性の説明は適切です。","conclusion":"正答（2）：特定標的臓器毒性は「致死性」に限られない。","choicesExplain":"（1）— 非正答肢\n　変異原性試験は発がん性のスクリーニングとして実施されているが、発がん性のあるものが変異原性を有するとは限らない。\n\n（2）◎ 公式公表正答\n　特定標的臓器毒性（反復ばく露）とは、反復ばく露によって起こる特定臓器に対する特異的な致死性の毒性をいう。\n\n（3）— 非正答肢\n　神経毒性とは、神経機能を障害する性質をいい、神経毒性を持つ金属として、有機水銀などがある。\n\n（4）— 非正答肢\n　窒息性とは、窒素やヘリウムなどのガスが、酸素の供給を妨げることで窒息させる性質をいう。\n\n（5）— 非正答肢\n　感作性とは、皮膚や呼吸器にアレルギー反応を引き起こす性質をいう。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場のあんぜんサイト・GHS","url":"https://anzeninfo.mhlw.go.jp/user/anzen/kag/ankgc07.htm"},{"label":"厚生労働省・SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question21/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question21/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-22","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":22,"question":"安全データシート（SDS）に用いられる絵表示A～Cと、それらが表す危険有害性クラス・区分の組合せについて、正しいものはどれか。\nA：どくろ（急性毒性）\nB：感嘆符\nC：健康有害性（胸部に星形）","options":["急性毒性（区分1）／急性毒性（区分4）／呼吸器感作性（区分1）","急性毒性（区分1）／皮膚腐食性（区分1）／皮膚感作性（区分1）","発がん性（区分1）／呼吸器感作性（区分1）／生殖細胞変異原性（区分1）","発がん性（区分1）／発がん性（区分2）／誤えん有害性（区分1）","生殖毒性（区分1）／生殖毒性（区分2）／皮膚腐食性（区分1）"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"SDSのGHS絵表示","point":"どくろは急性毒性の強い区分、感嘆符は急性毒性区分4や皮膚刺激等、胸に星形のある「健康有害性」は発がん性・呼吸器感作性・特定標的臓器毒性等を示します。絵表示だけで区分全てが一意に決まるわけではないため、危険有害性情報と併せて読みます。","conclusion":"正答（1）：A＝どくろ（急性毒性区分1）、B＝感嘆符（急性毒性区分4）、C＝健康有害性（呼吸器感作性区分1）。","choicesExplain":"（1）◎ 公式公表正答\n　急性毒性（区分1）／急性毒性（区分4）／呼吸器感作性（区分1）\n\n（2）— 非正答肢\n　急性毒性（区分1）／皮膚腐食性（区分1）／皮膚感作性（区分1）\n\n（3）— 非正答肢\n　発がん性（区分1）／呼吸器感作性（区分1）／生殖細胞変異原性（区分1）\n\n（4）— 非正答肢\n　発がん性（区分1）／発がん性（区分2）／誤えん有害性（区分1）\n\n（5）— 非正答肢\n　生殖毒性（区分1）／生殖毒性（区分2）／皮膚腐食性（区分1）","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省・SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"職場のあんぜんサイト・GHS","url":"https://anzeninfo.mhlw.go.jp/user/anzen/kag/ankgc07.htm"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question22/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question22/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-23","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":23,"question":"高年齢労働者の感覚や反応に関する次の記述のうち、適切でないものはどれか。","options":["加齢による聴力低下では、高い周波数から聞こえにくくなる。","静止視力は、動体視力よりも加齢により著しく低下する。","加齢により、単純反応時間及び選択反応時間は、ともに長くなる。","加齢に伴う明暗順応の遅延は、明順応よりも暗順応の方が顕著である。","平衡機能は加齢により徐々に低下し、60歳代以降に大きく低下する。"],"correctIndex":1,"category":"人間工学・作業態様","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["人間工学・作業態様"],"explanation":{"title":"高年齢労働者の感覚・反応","point":"加齢では高音域聴力、暗順応、動体視力、平衡機能、反応速度などが低下します。特に移動する対象を追う動体視力は静止視力より低下が大きく、危険認知から回避行動までの時間も長くなります。","conclusion":"正答（2）：動体視力の方が静止視力より加齢の影響を受けやすい。","choicesExplain":"（1）— 非正答肢\n　加齢による聴力低下では、高い周波数から聞こえにくくなる。\n\n（2）◎ 公式公表正答\n　静止視力は、動体視力よりも加齢により著しく低下する。\n\n（3）— 非正答肢\n　加齢により、単純反応時間及び選択反応時間は、ともに長くなる。\n\n（4）— 非正答肢\n　加齢に伴う明暗順応の遅延は、明順応よりも暗順応の方が顕著である。\n\n（5）— 非正答肢\n　平衡機能は加齢により徐々に低下し、60歳代以降に大きく低下する。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"エイジフレンドリーガイドライン","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc4842&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question23/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question23/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-24","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":24,"question":"厚生労働省の「職場における腰痛予防対策指針」に関する次の記述のうち、適切でないものはどれか","options":["長時間の車両運転作業では、一連続運転時間の長さを適切に管理することが重要となる。","介護作業では、不自然な姿勢を取らざるを得ない場合、壁に手をつく、床やベッドの上に膝を着く等により体を支える。","２人以上で重量物を取り扱う作業は、身長差の少ない者にて行う。","椅座位姿勢は、長い時間続けると背部筋の疲労によって後傾姿勢となることから、適宜、前傾姿勢をとるようにする。","立ち作業では、おおむね１時間につき１～２回程度の小休止・休息をとるようにする。"],"correctIndex":3,"category":"人間工学・作業態様","cluster":"人間工学・作業態様","examLawDate":"2023-04-01","tags":["人間工学・作業態様"],"explanation":{"title":"腰痛予防対策指針","point":"長時間座位では姿勢を固定せず、背もたれを使用し、立位や軽い運動を取り入れて姿勢を変えます。前傾姿勢を続けると腰部負担が増すため、単に前傾を勧めません。車両運転の連続時間管理、介護時の支持、複数人作業の体格配慮、立ち作業の小休止は適切です。","conclusion":"正答（4）：後傾を防ぐために前傾姿勢を勧めるのは不適切。","choicesExplain":"（1）— 非正答肢\n　長時間の車両運転作業では、一連続運転時間の長さを適切に管理することが重要となる。\n\n（2）— 非正答肢\n　介護作業では、不自然な姿勢を取らざるを得ない場合、壁に手をつく、床やベッドの上に膝を着く等により体を支える。\n\n（3）— 非正答肢\n　２人以上で重量物を取り扱う作業は、身長差の少ない者にて行う。\n\n（4）◎ 公式公表正答\n　椅座位姿勢は、長い時間続けると背部筋の疲労によって後傾姿勢となることから、適宜、前傾姿勢をとるようにする。\n\n（5）— 非正答肢\n　立ち作業では、おおむね１時間につき１～２回程度の小休止・休息をとるようにする。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場における腰痛予防対策指針","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tb9484&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question24/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question24/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-25","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":25,"question":"労働衛生保護具に関する次の記述のうち、誤っているものはどれか。","options":["直結式小型防毒マスクは、大気中で対象ガス又は蒸気の濃度が0.1％以下で使用する。","酸性ガス用防毒マスクの吸収缶の色は灰色で、シアン化水素用防毒マスクの吸収缶の色は青色である。","放射性物質がこぼれたとき等による汚染のおそれがある区域内の作業においてオイルミストが混在しない場合は、ろ過材の種類がＲＬ３の防じんマスクは使用できない。","取替え式防じんマスクの密着性を確認する方法には、陰圧法と陽圧法がある。","酸素濃度が18％未満の場所でも使用できる呼吸用保護具には、送気マスク、空気呼吸器、酸素呼吸器がある。"],"correctIndex":2,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"呼吸用保護具","point":"RLは液体粒子用の取替え式ろ過材で、RL3は高性能区分です。オイルミストがないから使えないという記述は逆です。防毒マスクは酸素濃度18％未満では使用不可で、送気マスク・空気呼吸器・酸素呼吸器など給気式が必要です。シールチェックには陰圧法・陽圧法があります。","conclusion":"正答（3）：RL3はオイルミストが混在しない放射性粉じん作業で使用可能。","choicesExplain":"（1）— 非正答肢\n　直結式小型防毒マスクは、大気中で対象ガス又は蒸気の濃度が0.1％以下で使用する。\n\n（2）— 非正答肢\n　酸性ガス用防毒マスクの吸収缶の色は灰色で、シアン化水素用防毒マスクの吸収缶の色は青色である。\n\n（3）◎ 公式公表正答\n　放射性物質がこぼれたとき等による汚染のおそれがある区域内の作業においてオイルミストが混在しない場合は、ろ過材の種類がＲＬ３の防じんマスクは使用できない。\n\n（4）— 非正答肢\n　取替え式防じんマスクの密着性を確認する方法には、陰圧法と陽圧法がある。\n\n（5）— 非正答肢\n　酸素濃度が18％未満の場所でも使用できる呼吸用保護具には、送気マスク、空気呼吸器、酸素呼吸器がある。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"呼吸用保護具の選択・使用","url":"https://www.mhlw.go.jp/content/11300000/001107730.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question25/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question25/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-26","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":26,"question":"派遣労働者に対する安全衛生教育に関する次のイ～ホの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、ホにおいて、特別教育とは、危険又は有害な業務で、厚生労働省令で定めるものに労働者を就かせるときに行う当該業務に関する安全又は衛生のための特別の教育をいうものとする。\nイ　派遣先事業者は、派遣労働者を受け入れたときは、派遣元事業者によ\nる雇入れ時の安全衛生教育について、当該派遣労働者が従事する業務に関する安全又は衛生を確保するために必要な内容の教育が実施されているか等、その実施結果を派遣元事業者に書面等により確認する。\nロ　派遣元事業者は、派遣先事業者に対して派遣労働者の雇入れ時の安全\n衛生教育の実施を委託した場合は、その実施結果を書面等により確認する。\nハ　派遣元事業者は、派遣労働者の派遣先事業場を変更する等その作業内\n容を変更したときは、当該派遣労働者に対し、作業内容変更時の安全衛生教育を実施する。\nニ　派遣元事業者は、派遣先事業場において派遣労働者を異なる作業に転\n換したとき等派遣労働者の作業内容の変更を把握した場合には、派遣先事業者が行った作業内容変更時の安全衛生教育の実施結果を書面等により確認する。\nホ　派遣先事業者は、特別教育が必要な業務に派遣労働者を従事させると\nきは、当該派遣労働者が当該業務に関する特別教育を既に受けた者かどうか等を確認し、当該派遣労働者に対し、必要な特別教育を適切に行うとともに、その実施結果を派遣元事業者に書面等により報告する。","options":["イ ロ ハ ニ ホ","イ ロ ハ ニ","イ ロ ニ ホ","イ ハ ニ","ロ ハ ホ"],"correctIndex":0,"category":"健康管理・健康診断","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["健康管理・健康診断"],"explanation":{"title":"派遣労働者の安全衛生教育","point":"雇入れ時教育の主体は派遣元ですが、派遣先は業務固有の情報を提供し、実施状況を確認します。作業内容変更時は、変更を生じさせた側を中心に双方が連携します。特別教育が必要な業務では、派遣先が資格・受講歴を確認し、不足分を実施して派遣元へ結果を報告します。","conclusion":"正答（1）：イ～ホの全て。","choicesExplain":"（1）◎ 公式公表正答\n　イ ロ ハ ニ ホ\n\n（2）— 非正答肢\n　イ ロ ハ ニ\n\n（3）— 非正答肢\n　イ ロ ニ ホ\n\n（4）— 非正答肢\n　イ ハ ニ\n\n（5）— 非正答肢\n　ロ ハ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question26/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question26/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-27","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":27,"question":"1,200人を対象とした疾病スクリーニング検査で、精密検査により疾病あり50人（検査陽性45、陰性5）、疾病なし1,150人（検査陽性100、陰性1,050）であった。感度と特異度の組合せとして適切なものはどれか。","options":["31.0％／99.5％","31.0％／91.3％","90.0％／91.3％","90.0％／87.5％","99.5％／87.5％"],"correctIndex":2,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"スクリーニング検査","point":"感度＝真陽性／疾病あり＝45／(45＋5)＝90.0％。特異度＝真陰性／疾病なし＝1,050／(1,050＋100)＝91.3％です。感度は病気の人を陽性にできる割合、特異度は病気でない人を陰性にできる割合です。","conclusion":"正答（3）：感度90.0％、特異度91.3％。","choicesExplain":"（1）— 非正答肢\n　31.0％／99.5％\n\n（2）— 非正答肢\n　31.0％／91.3％\n\n（3）◎ 公式公表正答\n　90.0％／91.3％\n\n（4）— 非正答肢\n　90.0％／87.5％\n\n（5）— 非正答肢\n　99.5％／87.5％","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省・職場における労働衛生対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzeneisei03.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question27/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question27/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-28","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["労働災害防止は事業者の責務であり、この責務を全うするには、何よりも事業場トップが労働者の安全と健康の確保を自らの課題として認識し、率先してこれに取り組むことが必要である。","４Ｓ活動は、職場の「整理」、「整頓」、「清掃」、「清潔」を行う活動であり、そのうち「清掃」とは、通路、作業床から機械設備、治工具、作業用具に至るまで、汚れ、くず、ほこりのない状態にすることであるとともに、「整理」、「整頓」の仕上げの役目も持っている。","労働災害の直接原因は、労働者の不安全な行動という人的原因と、設備、原材料、環境等の不安全な状態という物的原因とに分けることができる。","国の労働災害防止計画は、産業災害や職業性疾病の急増を踏まえ、1958年（昭和33年）に第１次の計画が策定された。","第14次労働災害防止計画では、計画の重点事項の取組の成果として、労働者の協力の下、事業者において実施される事項をアウトカム指標として定め、また、事業者がアウトカム指標に定める事項を実施した結果として期待される事項をアウトプット指標として定めている。"],"correctIndex":4,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"安全管理と第14次労災防","point":"アウトプット指標は、事業者が実施する取組の実施状況を示します。アウトカム指標は、その取組によって期待される災害・健康状態などの成果です。トップのリーダーシップ、4S、不安全行動・不安全状態の整理、労災防止計画の歴史に関する他の記述は適切です。","conclusion":"正答（5）：アウトプットとアウトカムが逆。","choicesExplain":"（1）— 非正答肢\n　労働災害防止は事業者の責務であり、この責務を全うするには、何よりも事業場トップが労働者の安全と健康の確保を自らの課題として認識し、率先してこれに取り組むことが必要である。\n\n（2）— 非正答肢\n　４Ｓ活動は、職場の「整理」、「整頓」、「清掃」、「清潔」を行う活動であり、そのうち「清掃」とは、通路、作業床から機械設備、治工具、作業用具に至るまで、汚れ、くず、ほこりのない状態にすることであるとともに、「整理」、「整頓」の仕上げの役目も持っている。\n\n（3）— 非正答肢\n　労働災害の直接原因は、労働者の不安全な行動という人的原因と、設備、原材料、環境等の不安全な状態という物的原因とに分けることができる。\n\n（4）— 非正答肢\n　国の労働災害防止計画は、産業災害や職業性疾病の急増を踏まえ、1958年（昭和33年）に第１次の計画が策定された。\n\n（5）◎ 公式公表正答\n　第14次労働災害防止計画では、計画の重点事項の取組の成果として、労働者の協力の下、事業者において実施される事項をアウトカム指標として定め、また、事業者がアウトカム指標に定める事項を実施した結果として期待される事項をアウトプット指標として定めている。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"第14次労働災害防止計画","url":"https://www.mhlw.go.jp/content/11200000/001116307.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question28/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question28/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-29","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」の内容及びこれに基づく労働安全衛生マネジメントシステムの運用に関する次の記述のうち、適切でないものはどれか。","options":["事業者は、あらかじめ、労働災害発生の急迫した危険がある状態（緊急事態）が生ずる可能性を評価し、緊急事態が発生した場合に労働災害を防止するための措置として、被害を最小限に食い止め、かつ、拡大を防止するための措置等を定める。","指針の内容は、労働安全衛生法の規定に基づき機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものではない。","事業場外部の者によるシステム監査は、事業場内部の者によるシステム監査に比べて、事業場の規程や基準等と実態との乖離を具体的に見つけだすことができる。","事業者は、安全衛生計画を実施する手順や日常的な点検、改善を実施する手順については、いつ、誰が、何を、どのようにするか等について文書により定める。","法人が同一である複数の事業場を一の単位として労働安全衛生マネジメントシステムに従って行う措置を実施する場合、システム各級管理者には、当該単位においてその事業の実施を統括管理する者が含まれる。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"労働安全衛生マネジメントシステム","point":"システム監査は、仕組みが計画どおり実施・維持されているかを客観的に評価します。内部監査には現場事情を詳しく把握できる利点があり、外部監査には独立性の利点がありますが、一方が常に優れるとは限りません。緊急事態対応、文書化、複数事業場の統合運用は指針に沿います。","conclusion":"正答（3）：外部監査が必ず内部監査より具体的な乖離を見つけるとはいえない。","choicesExplain":"（1）— 非正答肢\n　事業者は、あらかじめ、労働災害発生の急迫した危険がある状態（緊急事態）が生ずる可能性を評価し、緊急事態が発生した場合に労働災害を防止するための措置として、被害を最小限に食い止め、かつ、拡大を防止するための措置等を定める。\n\n（2）— 非正答肢\n　指針の内容は、労働安全衛生法の規定に基づき機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものではない。\n\n（3）◎ 公式公表正答\n　事業場外部の者によるシステム監査は、事業場内部の者によるシステム監査に比べて、事業場の規程や基準等と実態との乖離を具体的に見つけだすことができる。\n\n（4）— 非正答肢\n　事業者は、安全衛生計画を実施する手順や日常的な点検、改善を実施する手順については、いつ、誰が、何を、どのようにするか等について文書により定める。\n\n（5）— 非正答肢\n　法人が同一である複数の事業場を一の単位として労働安全衛生マネジメントシステムに従って行う措置を実施する場合、システム各級管理者には、当該単位においてその事業の実施を統括管理する者が含まれる。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生マネジメントシステム指針","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc4379&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question29/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question29/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-30","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":30,"question":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次のイ～ホの記述について、誤っているものの組合せは（１）～（５）のうちどれか。\n\nイ　リスクとは、「危険性又は有害性」のことで、ILOにおいて「危険有害要因」と表現されているものに相当する。\nロ　リスクアセスメント実施の際に入手する災害事例、災害統計等には、ヒヤリハットの記録も含まれる。\nハ　重篤度の見積りは、傷害や疾病等の種類にかかわらず、基本的に、負傷又は疾病による休業日数等を尺度として使用する。\nニ　化学物質等のばく露限界には、管理濃度、ACGIH（米国産業衛生専門家会議）のTLV-TWA等が含まれる。\nホ　個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もった結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減措置を検討する必要はない。","options":["イ・ロ","イ・ニ","ロ・ハ","ハ・ホ","ニ・ホ"],"correctIndex":1,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"化学物質リスクアセスメント","point":"リスクは危険有害要因そのものではなく、「危険有害要因により負傷・疾病が生じる可能性と重篤度の組合せ」です。ILOのhazardに相当するのは危険性・有害性です。また管理濃度は作業環境管理の評価基準であり、個人ばく露濃度と比較するばく露限界としてそのまま用いるものではありません。ヒヤリハット、休業日数による重篤度、TLV-TWA等の利用は適切です。","conclusion":"正答（2）：イ・ニが誤り。","choicesExplain":"（1）— 非正答肢\n　イ・ロ\n\n（2）◎ 公式公表正答\n　イ・ニ\n\n（3）— 非正答肢\n　ロ・ハ\n\n（4）— 非正答肢\n　ハ・ホ\n\n（5）— 非正答肢\n　ニ・ホ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"化学物質リスクアセスメント指針","url":"https://www.mhlw.go.jp/content/11300000/001091557.pdf"},{"label":"作業環境評価基準","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74088000"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question30/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question30/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-01","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":1,"question":"常時使用する労働者が600人で、有害な業務として著しく寒冷な場所における業務のみに常時40人の労働者を従事させている製造業の事業場の安全衛生管理体制に関する次の文中のＡ～Ｄに入る数値又は語句の組合せとして、労働安全衛生法令上、正しいものは（１）～（５）のうちどれか。\n\nただし、衛生管理者の選任の特例はないものとする。\n\nＡ：選任すべき衛生管理者の人数\nＢ：そのうち少なくとも1人について求められる要件\nＣ：衛生管理者が作業場等を巡視する頻度\nＤ：衛生委員会等の記録の保存期間\n\n事業者は、衛生管理者をＡ人以上選任し、そのうち少なくとも1人をＢとしなければならない。衛生管理者は、少なくともＣ1回作業場等を巡視する。また、委員会の開催の都度、所定の事項を記録し、これをＤ年間保存しなければならない。","options":["Ａ：2\nＢ：専任の衛生管理者\nＣ：毎月\nＤ：5","Ａ：2\nＢ：衛生工学衛生管理者免許を有する者\nＣ：毎週\nＤ：3","Ａ：3\nＢ：専任の衛生管理者\nＣ：毎週\nＤ：3","Ａ：3\nＢ：衛生工学衛生管理者免許を有する者\nＣ：毎週\nＤ：2","Ａ：3\nＢ：衛生工学衛生管理者免許を有する者\nＣ：毎月\nＤ：5"],"correctIndex":2,"category":"安全衛生管理・法令","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["安全衛生管理・法令"],"explanation":{"title":"安全衛生管理体制","point":"常時600人では衛生管理者は3人以上です。著しく寒冷な場所の業務に常時30人以上従事するため、少なくとも1人を専任とします。衛生管理者の巡視は少なくとも毎週1回、衛生委員会等の議事記録は3年間保存します。衛生工学衛生管理者が必要となる有害業務の範囲とは区別します。","conclusion":"正答（3）：衛生管理者3人以上、少なくとも1人は専任、巡視は毎週、委員会記録は3年。","choicesExplain":"（1）— 非正答肢\n　Ａ：2\nＢ：専任の衛生管理者\nＣ：毎月\nＤ：5\n\n（2）— 非正答肢\n　Ａ：2\nＢ：衛生工学衛生管理者免許を有する者\nＣ：毎週\nＤ：3\n\n（3）◎ 公式公表正答\n　Ａ：3\nＢ：専任の衛生管理者\nＣ：毎週\nＤ：3\n\n（4）— 非正答肢\n　Ａ：3\nＢ：衛生工学衛生管理者免許を有する者\nＣ：毎週\nＤ：2\n\n（5）— 非正答肢\n　Ａ：3\nＢ：衛生工学衛生管理者免許を有する者\nＣ：毎月\nＤ：5","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question01/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question01/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-02","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":2,"question":"労働安全衛生法令に基づき定期自主検査を行わなければならない機械等とその実施頻度に関する下表のイ～ニの組合せについて、労働安全衛生法令上、正しいもののみを挙げたものは（１）～（５）のうちどれか。\nただし、透過写真撮影用ガンマ線照射装置については、線源容器の遮蔽能力の異常の有無についての検査ではないものとする。また、有機溶剤中毒予防規則及び特定化学物質障害予防規則に基づく設備の特例や適用の除外はないものとする。\n\nイ　第二種有機溶剤等を用いて有機溶剤業務を行う作業場所に設けた局所排気装置：６か月以内ごとに１回\nロ　特定化学設備：１年以内ごとに１回\nハ　透過写真撮影用ガンマ線照射装置：１か月以内ごとに１回\nニ　シアン化ナトリウムを含有する排液の排液処理装置：１年以内ごとに１回","options":["イ　ロ","イ　ハ","ロ　ハ","ロ　ニ","ハ　ニ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"定期自主検査","point":"透過写真撮影用ガンマ線照射装置は、所定事項を1か月以内ごとに1回検査します。シアン化ナトリウムを含む排液処理装置は1年以内ごとに1回です。局所排気装置は原則1年以内ごとで、設問の6か月は誤り。特定化学設備は2年以内ごとに1回で、1年ではありません。","conclusion":"正答（5）：ハ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ　ロ\n\n（2）— 非正答肢\n　イ　ハ\n\n（3）— 非正答肢\n　ロ　ハ\n\n（4）— 非正答肢\n　ロ　ニ\n\n（5）◎ 公式公表正答\n　ハ　ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20230401"},{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20230401"},{"label":"電離放射線障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question02/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question02/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-03","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":3,"question":"危険物及び有害物に関する規制に関する次の記述のうち、労働安全衛生法令上、正しいものはどれか。","options":["ベンゼンを含有するゴムのりで、その含有するベンゼンの容量が当該ゴムのりの溶剤（希釈剤を含む。）の５パーセントを超えるものを製造しようとする者は、あらかじめ、厚生労働大臣の許可を受けなければならない。","ベリリウムの化合物を製造しようとする者は、あらかじめ、当該化合物を製造する場所を管轄する都道府県労働局長の許可を受けなければならない。","新規化学物質を試験研究のために製造しようとする者は、一つの事業場における１年間の製造量が100キログラムを超えるときは、あらかじめ、当該新規化学物質の有害性の調査（当該新規化学物質が労働者の健康に与える影響についての調査をいう。）を行い、厚生労働大臣に届け出なければならない。","名称等を表示すべき有害物を容器（一般消費者の生活の用に供するためのものを除く。）に入れ、かつ、包装して、譲渡し、又は提供する者は、その容器に名称等を表示しなければならない。","名称等を表示すべき有害物を二つ以上含有する混合物を容器（一般消費者の生活の用に供するためのものを除く。）に入れ、又は包装して、譲渡し、又は提供する者は、その容器又は包装に当該有害物の成分及び含有量を表示しなければならない。"],"correctIndex":3,"category":"化学物質管理","cluster":"安衛法・化学物質規制","examLawDate":"2023-04-01","tags":["化学物質管理","安衛法","表示・SDS","製造禁止・製造許可"],"explanation":{"title":"表示・製造許可・新規化学物質","point":"表示対象物を容器に入れ包装して譲渡・提供する場合、容器への表示が必要です。製造禁止物と製造許可物を混同しないこと。ベリリウム化合物の製造許可は厚生労働大臣であり、都道府県労働局長ではありません。SDSの成分・含有量は通知事項であり、ラベルに全成分量を表示する制度ではありません。","conclusion":"正答（4）：容器に入れ、かつ包装した場合は容器に名称等を表示する。","choicesExplain":"（1）× 誤り\n【正文化】ベンゼンを溶剤の5％を超えて含有するゴムのりは、安衛法55条・施行令16条の「製造等禁止物質」であり、原則として製造・輸入・譲渡・提供・使用をしてはならない。試験研究目的で法55条ただし書の要件を満たす場合に限り例外があり、その許可は都道府県労働局長が行う。\n\n（2）× 誤り\n【正文化】ベリリウム及びその化合物は安衛法56条・施行令17条の製造許可物質であり、製造しようとする者は、あらかじめ厚生労働大臣の許可を受けなければならない。\n\n（3）× 誤り\n【正文化】新規化学物質を試験研究のため製造し、又は輸入しようとするときは、安衛法57条の4第1項の有害性調査・届出の適用除外となる。100kg以下の厚生労働大臣確認は、試験研究目的とは別の少量新規化学物質の例外である。\n\n（4）○ 正しい\n名称等を表示すべき有害物を容器に入れ、かつ包装して譲渡・提供するときは、その容器に名称等を表示する。\n\n（5）× 誤り\n【正文化】成分及びその含有量は、安衛法57条の2に基づくSDS等による通知事項である。法57条のラベル表示事項として、混合物中の対象物質の成分及び含有量を一律に容器又は包装へ表示する義務ではない。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"労働安全衛生法施行令（e-Gov）","url":"https://laws.e-gov.go.jp/law/347CO0000000318?occasion_date=20230401"},{"label":"厚生労働省・SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question03/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":true,"auditBadge":"✅ 公式正答照合済｜✅ 各肢の正文化を個別監査済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question03/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"各肢個別監査済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-04","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":4,"question":"安全衛生教育に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。ただし、特別教育とは、危険又は有害な業務で、厚生労働省令で定めるものに労働者を就かせるときに行う当該業務に関する安全又は衛生のための特別の教育をいうものとする。","options":["事業者が労働者を雇い入れ、又は労働者の作業内容を変更したときに行う教育の事項には、事故時等における応急措置及び退避に関することが含まれる。","職長教育には、作業方法の決定及び労働者の配置に関すること、労働者に対する指導又は監督の方法に関することのほか、労働災害を防止するため必要な事項として、労働災害防止についての関心の保持及び労働者の創意工夫を引き出す方法が含まれる。","高圧室内作業に係る業務は特別教育の対象であるが、再圧室を操作する業務は特別教育の対象ではない。","強烈な騒音を発する作業に係る業務や重量物を取り扱う作業に係る業務は、特別教育の対象ではない。","事業者は、事業場における安全衛生の水準の向上を図るため、危険又は有害な業務に現に就いている者に対し、その業務に関する安全又は衛生のための教育を行うように努めなければならない。"],"correctIndex":2,"category":"物理的因子","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"安全衛生教育","point":"雇入れ時・作業内容変更時教育には応急措置・退避が含まれます。高圧室内作業、再圧室操作はいずれも特別教育対象です。強烈な騒音作業や単なる重量物取扱いは法定特別教育の対象ではありませんが、必要な教育は行います。危険有害業務従事者への能力向上教育は努力義務です。","conclusion":"正答（3）：再圧室を操作する業務も特別教育の対象。","choicesExplain":"（1）— 非正答肢\n　事業者が労働者を雇い入れ、又は労働者の作業内容を変更したときに行う教育の事項には、事故時等における応急措置及び退避に関することが含まれる。\n\n（2）— 非正答肢\n　職長教育には、作業方法の決定及び労働者の配置に関すること、労働者に対する指導又は監督の方法に関することのほか、労働災害を防止するため必要な事項として、労働災害防止についての関心の保持及び労働者の創意工夫を引き出す方法が含まれる。\n\n（3）◎ 公式公表正答\n　高圧室内作業に係る業務は特別教育の対象であるが、再圧室を操作する業務は特別教育の対象ではない。\n\n（4）— 非正答肢\n　強烈な騒音を発する作業に係る業務や重量物を取り扱う作業に係る業務は、特別教育の対象ではない。\n\n（5）— 非正答肢\n　事業者は、事業場における安全衛生の水準の向上を図るため、危険又は有害な業務に現に就いている者に対し、その業務に関する安全又は衛生のための教育を行うように努めなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"高気圧作業安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000040?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question04/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question04/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-05","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":5,"question":"労働安全衛生法令に基づき作業環境測定を行わなければならない作業場及び測定事項、実施頻度又は測定時期並びに測定を実施すべき者に関する下表のイ～ホの組合せについて、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nただし、ロ及びハについては、化学物質管理の水準が一定以上の事業場における関係規定の適用除外はないものとする。\n\nイ　放射線業務を行う作業場のうち管理区域に該当する部分における外部放射線による線量当量率又は線量当量：１か月以内ごとに１回／作業環境測定士\nロ　常時特定粉じん作業が行われる屋内作業場における空気中の粉じんの濃度：６か月以内ごとに１回／作業環境測定士\nハ　鉛ライニングの業務を行う屋内作業場における空気中の鉛の濃度：６か月以内ごとに１回／作業環境測定士\nニ　酸素欠乏危険場所において作業を行う場合の当該作業場における空気中の酸素の濃度：その日の作業を開始する前／酸素欠乏危険作業特別教育を受講した者\nホ　中央管理方式の空気調和設備を設けている建築物の室で、事務所の用に供されるものにおける一酸化炭素及び二酸化炭素の含有率：２か月以内ごとに１回／測定実施者の要件に関する規定なし","options":["イ　ロ　ニ","イ　ハ","イ　ホ","ロ　ハ　ニ","ロ　ホ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"作業環境測定の対象・頻度・実施者","point":"常時特定粉じん作業を行う屋内作業場は6か月以内ごとに作業環境測定士が測定します。中央管理方式空調の事務室はCO・CO2を2か月以内ごとに測定し、実施者の資格要件はありません。放射線の線量測定は必ずしも作業環境測定士に限定されず、鉛ライニングは測定対象業務の指定が異なります。酸素濃度測定は作業主任者等が行い、特別教育修了だけでは足りません。","conclusion":"正答（5）：ロ・ホ。","choicesExplain":"（1）— 非正答肢\n　イ　ロ　ニ\n\n（2）— 非正答肢\n　イ　ハ\n\n（3）— 非正答肢\n　イ　ホ\n\n（4）— 非正答肢\n　ロ　ハ　ニ\n\n（5）◎ 公式公表正答\n　ロ　ホ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"作業環境測定法（e-Gov）","url":"https://laws.e-gov.go.jp/law/350AC0000000028?occasion_date=20230401"},{"label":"粉じん障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20230401"},{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20230401"},{"label":"事務所衛生基準規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000043?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question05/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question05/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-06","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":6,"question":"労働安全衛生法令に基づく健康診断のうち、医師による健康診断に関する次の記述について、労働安全衛生法令上、誤っているものはどれか。","options":["事業者は、健康診断の結果（当該健康診断の項目に異常の所見があると診断された労働者に係るものに限る。）に基づき、当該労働者の健康を保持するために必要な措置について、医師の意見を聴かなければならない。","事業者は、健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は労働時間等設定改善委員会への報告その他の適切な措置を講じなければならない。","事業者は、法令に基づき選任した産業医に、健康診断の実施及びその結果に基づく労働者の健康を保持するための措置に関することについて、事業者又は総括安全衛生管理者に対して意見を述べる権限を与えなければならない。","事業者は、常時使用する労働者に対して１年以内ごとに１回、定期に行う健康診断について、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、既往歴及び業務歴の調査並びに身長、体重、腹囲、視力及び聴力の検査を省略することができる。","事業者は、重量物の取扱い等重激な業務に常時従事する労働者に対して、当該業務への配置替えの際及び６か月以内ごとに１回、定期に、健康診断を行わなければならない。"],"correctIndex":3,"category":"統計・疫学","cluster":"健康診断・健康管理","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"一般健康診断と省略","point":"一般定期健康診断では、医師判断により年齢等の基準に基づき身長、腹囲、胸部X線等の一部項目を省略できる場合がありますが、既往歴・業務歴の調査は省略不可です。異常所見者についての医師意見聴取、産業医への権限付与、重激業務従事者への6か月ごとの健診は適切です。","conclusion":"正答（4）：既往歴・業務歴の調査は省略できない。","choicesExplain":"（1）— 非正答肢\n　事業者は、健康診断の結果（当該健康診断の項目に異常の所見があると診断された労働者に係るものに限る。）に基づき、当該労働者の健康を保持するために必要な措置について、医師の意見を聴かなければならない。\n\n（2）— 非正答肢\n　事業者は、健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は労働時間等設定改善委員会への報告その他の適切な措置を講じなければならない。\n\n（3）— 非正答肢\n　事業者は、法令に基づき選任した産業医に、健康診断の実施及びその結果に基づく労働者の健康を保持するための措置に関することについて、事業者又は総括安全衛生管理者に対して意見を述べる権限を与えなければならない。\n\n（4）◎ 公式公表正答\n　事業者は、常時使用する労働者に対して１年以内ごとに１回、定期に行う健康診断について、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、既往歴及び業務歴の調査並びに身長、体重、腹囲、視力及び聴力の検査を省略することができる。\n\n（5）— 非正答肢\n　事業者は、重量物の取扱い等重激な業務に常時従事する労働者に対して、当該業務への配置替えの際及び６か月以内ごとに１回、定期に、健康診断を行わなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"健康診断結果に基づく措置指針","url":"https://www.mhlw.go.jp/hourei/doc/kouji/K170417K0020.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question06/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question06/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-07","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":7,"question":"労働安全衛生法に基づく監督等に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　厚生労働大臣、都道府県労働局長又は労働基準監督署長は、労働安全\n衛生法を施行するため必要があると認めるときは、労働安全コンサルタント及び労働衛生コンサルタントに対し、出頭を命ずることができるが、この場合は、出頭を命ずる理由及び聴取しようとする事項を通知するものとする。\nロ　事業者は、労働安全衛生法及びこれに基づく命令の要旨を常時各作業\n場の見やすい場所に掲示し、又は備え付けること、書面を労働者に交付することその他の所定の方法により、労働者に周知させなければならない。\nハ　労働安全コンサルタント及び労働衛生コンサルタントは、依頼者の氏\n名（法人にあっては、その名称）及び住所、依頼を受けた年月日等所定の事項を記載した帳簿を備え、これを記載の日から５年間保存しなければならない。\nニ　厚生労働大臣は、労働者がさらされる化学物質等又は労働者の従事す\nる作業と労働者の疾病との相関関係を把握するため必要があると認めるときは、疫学的調査その他の調査を行うことができる。","options":["イ ロ ニ","イ ハ ニ","イ ハ","ロ ハ","ロ ニ"],"correctIndex":0,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"監督・周知・コンサルタント","point":"行政機関は必要に応じコンサルタントに出頭を命じ、理由・聴取事項を通知できます。法令要旨は掲示、書面交付、電子的方法等で労働者へ周知します。厚生労働大臣は化学物質・作業と疾病の相関を把握する調査を行えます。コンサルタントの帳簿保存は5年ではなく3年です。","conclusion":"正答（1）：イ・ロ・ニ。","choicesExplain":"（1）◎ 公式公表正答\n　イ ロ ニ\n\n（2）— 非正答肢\n　イ ハ ニ\n\n（3）— 非正答肢\n　イ ハ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ロ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question07/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question07/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-08","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":8,"question":"労働安全衛生規則の衛生基準に関する次の記述のうち、誤っているものはどれか。","options":["事業者は、強烈な騒音を発する屋内作業場における業務に労働者を従事させるときは、当該作業場が強烈な騒音を発する場所であることを、見やすい箇所に標識によって明示する等の措置を講ずるとともに、耳栓その他の保護具を備えなければならない。","事業者は、著しく多湿な場所で労働者を従事させるときは、関係者以外の者が立ち入ることを禁止する旨を見やすい箇所に表示することその他の方法により、立入りを禁止しなければならない。","事業者は、多量の発汗を伴う作業場においては、屋内又は屋外にかかわらず、労働者に与えるために、塩及び飲料水を備えなければならない。","事業者は、有害物による汚染のおそれがある床及び周壁を、不浸透性の材料で塗装し、かつ、排水に便利な構造としなければならず、また、必要に応じ、洗浄しなければならない。","事業者は、身体又は被服を汚染するおそれのある業務に労働者を従事させるときは、洗眼、洗身若しくはうがいの設備、更衣設備又は洗濯のための設備を設けなければならない。"],"correctIndex":1,"category":"物理的因子","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"労働安全衛生規則の衛生基準","point":"強烈な騒音場所の標識・保護具、多量発汗作業での塩・飲料水、有害物汚染床の不浸透性・洗浄、汚染業務に必要な洗浄・更衣設備は規定されています。多湿そのものを理由として関係者以外の立入を禁止する一般規定はありません。","conclusion":"正答（2）：著しく多湿な場所について一律の立入禁止義務はない。","choicesExplain":"（1）— 非正答肢\n　事業者は、強烈な騒音を発する屋内作業場における業務に労働者を従事させるときは、当該作業場が強烈な騒音を発する場所であることを、見やすい箇所に標識によって明示する等の措置を講ずるとともに、耳栓その他の保護具を備えなければならない。\n\n（2）◎ 公式公表正答\n　事業者は、著しく多湿な場所で労働者を従事させるときは、関係者以外の者が立ち入ることを禁止する旨を見やすい箇所に表示することその他の方法により、立入りを禁止しなければならない。\n\n（3）— 非正答肢\n　事業者は、多量の発汗を伴う作業場においては、屋内又は屋外にかかわらず、労働者に与えるために、塩及び飲料水を備えなければならない。\n\n（4）— 非正答肢\n　事業者は、有害物による汚染のおそれがある床及び周壁を、不浸透性の材料で塗装し、かつ、排水に便利な構造としなければならず、また、必要に応じ、洗浄しなければならない。\n\n（5）— 非正答肢\n　事業者は、身体又は被服を汚染するおそれのある業務に労働者を従事させるときは、洗眼、洗身若しくはうがいの設備、更衣設備又は洗濯のための設備を設けなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question08/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question08/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-09","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":9,"question":"有機溶剤等の取扱いに関する次のイ～ホの記述について、労働安全衛生法令上、誤っているもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、有機溶剤中毒予防規則による適用の除外及び設備の特例はなく、イの事業者は、労働安全衛生法に基づき労働基準監督署長への機械等の設置の届出の必要がないとの所轄労働基準監督署長の認定を受けていないものとする。また、特別教育とは、危険又は有害な業務で、厚生労働省令で定めるものに労働者を就かせるときに行う当該業務に関する安全又は衛生のための特別の教育をいうものとする。\nイ　事業者は、有機溶剤中毒予防規則に基づき設置が必要な固定式の全体\n換気装置を設置しようとするときは、その計画を当該工事の開始の日の30日前までに所轄労働基準監督署長に届け出なければならない。\nロ　事業者は、タンク等の内部において第三種有機溶剤等を用いて行う有\n機溶剤業務に常時従事する労働者に対し、６か月以内ごとに１回、定期に、所定の項目について医師による健康診断を行わなければならない。\nハ　事業者は、屋内作業場等において第一種有機溶剤等を用いて行う有機\n溶剤業務に労働者を常時従事させるときは、当該労働者に対し、特別教育を行わなければならない。\nニ　事業者は、屋内作業場等において第二種有機溶剤等を用いて行う有機\n溶剤業務に労働者を従事させるときは、当該有機溶剤業務に係る有機溶剤等の区分を色分け及び色分け以外の方法により、見やすい場所に表示し、色分けによる表示は黄色としなければならない。\nホ　事業者は、有機溶剤等を屋内に貯蔵するときは、その貯蔵場所に、貯\n蔵に関係する者以外の者がその貯蔵場所に立ち入ることを防ぐ設備を設けるとともに、有機溶剤の蒸気が屋外に漏れ出ないよう、その貯蔵場所を密閉構造としなければならない。","options":["イ ロ ハ","イ ホ","ロ ニ","ハ ニ ホ","ハ ホ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"有機溶剤等の取扱い","point":"有機溶剤業務そのものは一律に法定特別教育の対象ではありません。屋内貯蔵場所は関係者以外の立入防止と換気が必要ですが、蒸気を屋外へ漏らさない密閉構造にするのではなく、蒸気を屋外へ排出する設備が必要です。健康診断や区分表示は適切です。","conclusion":"正答（5）：ハ・ホが誤り。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ホ\n\n（3）— 非正答肢\n　ロ ニ\n\n（4）— 非正答肢\n　ハ ニ ホ\n\n（5）◎ 公式公表正答\n　ハ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20230401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question09/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question09/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-10","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":10,"question":"次の特定化学物質のうち、特定化学物質障害予防規則における特別管理物質でないものはどれか。","options":["五酸化バナジウム","スチレン","トリクロロエチレン","ナフタレン","ホルムアルデヒド"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"特別管理物質","point":"特別管理物質は発がん性等を踏まえ、作業記録や掲示、健康診断記録の長期保存等が求められる物質群です。スチレン、トリクロロエチレン、ナフタレン、ホルムアルデヒドは対象ですが、五酸化バナジウムは管理第二類物質であっても特別管理物質には含まれません。","conclusion":"正答（1）：五酸化バナジウムは特別管理物質ではない。","choicesExplain":"（1）◎ 公式公表正答\n　五酸化バナジウム\n\n（2）— 非正答肢\n　スチレン\n\n（3）— 非正答肢\n　トリクロロエチレン\n\n（4）— 非正答肢\n　ナフタレン\n\n（5）— 非正答肢\n　ホルムアルデヒド","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question10/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question10/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-11","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":11,"question":"電離放射線障害を防止するため事業者が講ずべき措置に関する次のイ～ニの記述について、電離放射線障害防止規則上、正しいものの組合せは（１）～（５）のうちどれか。\nただし、放射線業務従事者は、緊急作業には従事しないものとし、また、被ばく限度に関する適用除外はないものとする。\n\nイ　外部放射線による実効線量と空気中の放射性物質による実効線量との合計が３か月間につき1.3ミリシーベルトを超えるおそれのある区域は、管理区域として標識により明示しなければならない。\nロ　放射線業務従事者の眼の水晶体に受ける等価線量が、５年間につき100ミリシーベルト及び１年間につき50ミリシーベルトを超えないようにしなければならない。\nハ　管理区域内において受ける１日における外部被ばくによる線量が１センチメートル線量当量について0.1ミリシーベルトを超えるおそれのある労働者については、外部被ばくによる線量の測定の結果を毎日確認しなければならない。\nニ　放射線業務従事者の皮膚に受ける等価線量が、１年間につき150ミリシーベルトを超えないようにしなければならない。","options":["イ・ロ","イ・ハ","イ・ニ","ロ・ハ","ハ・ニ"],"correctIndex":0,"category":"物理的因子","cluster":"放射線","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"電離放射線の管理区域・線量限度","point":"管理区域は実効線量が3か月につき1.3mSvを超えるおそれ等で設定します。水晶体等価線量限度は5年間100mSvかつ1年50mSvです。日々確認が必要となる基準は設問の0.1mSvではなく1mSv、皮膚等価線量限度は年500mSvであり150mSvではありません。","conclusion":"正答（1）：イ・ロ。","choicesExplain":"（1）◎ 公式公表正答\n　イ・ロ\n\n（2）— 非正答肢\n　イ・ハ\n\n（3）— 非正答肢\n　イ・ニ\n\n（4）— 非正答肢\n　ロ・ハ\n\n（5）— 非正答肢\n　ハ・ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"電離放射線障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question11/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question11/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-12","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":12,"question":"酸素欠乏症等の防止に関する次の記述のうち、酸素欠乏症等防止規則上、誤っているものはどれか。","options":["硫化水素中毒とは、硫化水素の濃度が100万分の10を超える空気を吸入することにより生ずる症状が認められる状態をいう。","冷蔵室、冷凍室等密閉して使用する施設の内部の作業に労働者を従事させる場合は、当該施設の出入口の扉が内部から容易に開くことができる構造のものである場合又は施設の内部に通報装置若しくは警報装置が設けられている場合を除き、労働者が作業に従事する間、出入口の扉が締まらないような措置を講じなければならない。","第二種酸素欠乏危険作業については、酸素欠乏危険作業主任者技能講習を修了した者のうちから、酸素欠乏危険作業主任者を選任しなければならない。","酸素欠乏危険作業に労働者を従事させる場合に、当該作業を行う場所の空気中の酸素の濃度を18パーセント以上に保つように換気を行うときは、純酸素を使用してはならない。","酸素欠乏危険作業に労働者を従事させるときは、常時作業の状況を監視し、異常があったときに直ちにその旨を酸素欠乏危険作業主任者及びその他の関係者に通報する者を置く等異常を早期に把握するために必要な措置を講じなければならない。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"酸素欠乏危険作業主任者","point":"第二種酸素欠乏危険作業では酸欠だけでなく硫化水素中毒の危険もあるため、上位の「酸素欠乏・硫化水素危険作業主任者技能講習」修了者を選任します。純酸素換気は禁止され、監視・連絡体制も必要です。","conclusion":"正答（3）：第二種は酸素欠乏・硫化水素危険作業主任者技能講習修了者から選任。","choicesExplain":"（1）— 非正答肢\n　硫化水素中毒とは、硫化水素の濃度が100万分の10を超える空気を吸入することにより生ずる症状が認められる状態をいう。\n\n（2）— 非正答肢\n　冷蔵室、冷凍室等密閉して使用する施設の内部の作業に労働者を従事させる場合は、当該施設の出入口の扉が内部から容易に開くことができる構造のものである場合又は施設の内部に通報装置若しくは警報装置が設けられている場合を除き、労働者が作業に従事する間、出入口の扉が締まらないような措置を講じなければならない。\n\n（3）◎ 公式公表正答\n　第二種酸素欠乏危険作業については、酸素欠乏危険作業主任者技能講習を修了した者のうちから、酸素欠乏危険作業主任者を選任しなければならない。\n\n（4）— 非正答肢\n　酸素欠乏危険作業に労働者を従事させる場合に、当該作業を行う場所の空気中の酸素の濃度を18パーセント以上に保つように換気を行うときは、純酸素を使用してはならない。\n\n（5）— 非正答肢\n　酸素欠乏危険作業に労働者を従事させるときは、常時作業の状況を監視し、異常があったときに直ちにその旨を酸素欠乏危険作業主任者及びその他の関係者に通報する者を置く等異常を早期に把握するために必要な措置を講じなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question12/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question12/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-13","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":13,"question":"事務所の衛生基準について事業者が講ずべき措置に関する次のイ～ニの記述について、事務所衛生基準規則上、正しいものの組合せは（１）～（５）のうちどれか。\nイ　燃焼器具(発熱量が著しく少ないものを除く。)を使用するときは、１\nか月以内ごとに１回、当該器具の異常の有無を点検しなければならない。\nロ　労働者を常時就業させる室の作業面の照度は、感光材料の取扱い等特\n殊な作業を行う室を除き、一般的な事務作業の場合、300ルクス以上になるようにしなければならない。\nハ　労働者を常時就業させる室の気積を、設備の占める容積及び床面から\n３メートルを超える高さにある空間を除き、労働者１人について、10立方メートル以上としなければならない。\nニ　ねずみ、昆虫等の発生場所、生息場所及び侵入経路並びにねずみ、昆\n虫等による被害の状況について、６か月以内ごとに１回、定期に、統一的に調査を実施し、当該調査の結果に基づき、ねずみ、昆虫等の発生を防止するため必要な措置を講じなければならない。","options":["イ ロ","イ ハ","ロ ニ","ロ ハ","ハ ニ"],"correctIndex":2,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"事務所衛生基準","point":"一般的な事務作業の照度は300lx以上です。ねずみ・昆虫等は6か月以内ごとに統一的調査を行います。燃焼器具の点検は1か月ではなく毎日、気積は床面から4mを超える空間を除き1人10m³以上で、3mではありません。","conclusion":"正答（3）：ロ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ハ\n\n（3）◎ 公式公表正答\n　ロ ニ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"事務所衛生基準規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000043?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question13/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question13/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2023-14","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":14,"question":"石綿等が使用されている解体等対象建築物等の解体等の作業（以下「石綿使用建築物等解体等作業」という。）を行うときに事業者が講じた措置に関する次の記述のうち、労働安全衛生法令上、違反となるものはどれか。","options":["解体等対象建築物の改修工事において、当該工事の請負代金の額が100万円未満であったため、事前調査（当該解体等対象建築物に係る石綿等の使用の有無の調査をいう。）の結果を所轄労働基準監督署長に報告しなかった。","解体等対象建築物の解体工事において、当該解体等対象建築物に吹き付けられている石綿等（石綿等が使用されている仕上げ用塗り材を除く。）の除去の作業を行う仕事について、当該工事に係る部分の床面積の合計が80平方メートル未満であったため、当該仕事に係る計画を所轄労働基準監督署長に届け出なかった。","成形された材料であって石綿等が使用されているもの（石綿含有保温材を除く。）を建築物から除去する作業において、切断、破砕等を行わずに除去することが技術上困難であったため、当該作業を行う作業場所を、当該作業以外の作業を行う作業場所からビニールシート等で隔離し、当該作業中は、当該材料を常時湿潤な状態に保つ措置を講じた上で、切断、破砕等による方法により、当該作業を実施した。","石綿等を取り扱う作業場の見やすい箇所に、石綿作業主任者の氏名及びその者に行わせる事項を掲示したが、当該作業場で作業を行う者の氏名は掲示しなかった。","法令に基づき定めた作業計画に従って石綿使用建築物等解体等作業を行わせたことについて、写真その他実施状況を確認できる方法により記録を作成するとともに、当該石綿使用建築物等解体等作業に従事した労働者の氏名及び当該労働者ごとの当該石綿使用建築物等解体等作業に従事した期間等所定の事項を記録し、これらを当該石綿使用建築物等解体等作業を終了した日から３年間保存した後、廃棄した。"],"correctIndex":1,"category":"統計・疫学","cluster":"粉じん・石綿・じん肺","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"石綿解体作業","point":"事前調査結果の報告基準（解体床面積80m²以上、改修請負額100万円以上等）と、吹付け石綿等除去の計画届は別制度です。床面積が小さくても吹付け石綿の除去は計画届対象です。作業実施記録は3年間、労働者ごとの作業記録等は40年間保存する規定があり、選択肢5は両者を一括して3年後廃棄するため本来注意が必要ですが、問題の正答表示に基づき2を正答として扱います。","conclusion":"正答（2）：吹付け石綿等の除去工事は床面積80m²未満でも計画届が必要。","choicesExplain":"（1）— 非正答肢\n　解体等対象建築物の改修工事において、当該工事の請負代金の額が100万円未満であったため、事前調査（当該解体等対象建築物に係る石綿等の使用の有無の調査をいう。）の結果を所轄労働基準監督署長に報告しなかった。\n\n（2）◎ 公式公表正答\n　解体等対象建築物の解体工事において、当該解体等対象建築物に吹き付けられている石綿等（石綿等が使用されている仕上げ用塗り材を除く。）の除去の作業を行う仕事について、当該工事に係る部分の床面積の合計が80平方メートル未満であったため、当該仕事に係る計画を所轄労働基準監督署長に届け出なかった。\n\n（3）— 非正答肢\n　成形された材料であって石綿等が使用されているもの（石綿含有保温材を除く。）を建築物から除去する作業において、切断、破砕等を行わずに除去することが技術上困難であったため、当該作業を行う作業場所を、当該作業以外の作業を行う作業場所からビニールシート等で隔離し、当該作業中は、当該材料を常時湿潤な状態に保つ措置を講じた上で、切断、破砕等による方法により、当該作業を実施した。\n\n（4）— 非正答肢\n　石綿等を取り扱う作業場の見やすい箇所に、石綿作業主任者の氏名及びその者に行わせる事項を掲示したが、当該作業場で作業を行う者の氏名は掲示しなかった。\n\n（5）— 非正答肢\n　法令に基づき定めた作業計画に従って石綿使用建築物等解体等作業を行わせたことについて、写真その他実施状況を確認できる方法により記録を作成するとともに、当該石綿使用建築物等解体等作業に従事した労働者の氏名及び当該労働者ごとの当該石綿使用建築物等解体等作業に従事した期間等所定の事項を記録し、これらを当該石綿使用建築物等解体等作業を終了した日から３年間保存した後、廃棄した。","trap":"","keywords":"","related":"","current":"【出題当時】2 診は3年以内ごとで、1年ではありません。","conclusion":"正答（5）：ロ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ・ロ\n\n（2）— 非正答肢\n　イ・ハ\n\n（3）— 非正答肢\n　イ・ニ\n\n（4）— 非正答肢\n　ロ・ハ\n\n（5）◎ 公式公表正答\n　ロ・ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"じん肺法（e-Gov）","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/low-question15/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question15/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2022-01","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":1,"question":"事業場における労働衛生に関する取組内容と、その取組が該当する労働衛生管理の種類（作業環境管理、作業管理又は健康管理）に関する下表のＡ～Ｄの組合せについて、適切なものを挙げたものは（１）～（５）のうちどれか。\n\n【記号・労働衛生に関する取組内容】｜【示されている管理の種類】\nＡ　粉じん業務に従事することが健康の保持のために適当でないと医師が認めた者を配置転換する。｜健康管理\nＢ　有機溶剤を使用する塗料を、有害性の低い水性塗料に変更する。｜作業管理\nＣ　放射線業務従事者の管理区域内において受ける外部被ばくによる個人被ばく線量を測定する。｜作業環境管理\nＤ　情報機器作業に従事する労働者の作業時間、作業休止時間などを適切に管理する。｜作業管理","options":["Ａ Ｂ","Ａ Ｃ","Ａ Ｄ","Ｂ Ｄ","Ｃ Ｄ"],"correctIndex":2,"tags":["粉じん・石綿・じん肺","放射線・有害光線","化学物質管理","健康診断・健康管理","人間工学・腰痛","労働衛生管理総論"],"examLawDate":"2022-04-01","category":"粉じん・石綿・じん肺","cluster":"化学物質管理","explanation":{"title":"粉じん・石綿・じん肺","point":"Aは健康管理で適切。Bの低有害性塗料への代替は作業環境管理なので「作業管理」は不適切。Cの個人被ばく線量測定は作業管理であり「作業環境管理」は不適切。Dの作業時間・休止時間の管理は作業管理で適切。","conclusion":"正答は（3）A・D。","choicesExplain":"（1）— 非正答肢\n　Ａ Ｂ\n\n（2）— 非正答肢\n　Ａ Ｃ\n\n（3）◎ 公式公表正答\n　Ａ Ｄ\n\n（4）— 非正答肢\n　Ｂ Ｄ\n\n（5）— 非正答肢\n　Ｃ Ｄ","tr 人間工学・腰痛","point":"公式公表正答は（3）。論点は「人間工学・腰痛」。この最終監査版では、一次資料で個別確認していない誤答肢の修正文を推測で掲載しない。","conclusion":"出題当時の公式正答は（3）。","choicesExplain":"（1）— 非正答肢\n　人力による重量物の持上げ作業は、取り扱う物の重量値を制限するだけで はなく、負担の軽い作業と組み合わせる。\n\n（2）— 非正答肢\n　全体照明に加えて局所照明を併用する場合、適切なカバーの付いた局所照 明器具を、労働者にグレアや邪魔になる影をもたらさない位置に置く。\n\n（3）◎ 公式公表正答\n　精密作業の休憩は、短く頻繁にとるのではなく、間を空けて１回の休憩で 長い時間とれるように設定する。\n\n（4）— 非正答肢\n　反復的に操作する足踏みペダルは、片方の足だけではなく、もう片方の足 でも操作できるようにする。\n\n（5）— 非正答肢\n　製造工程における製品や資材の移動は、持ち上げたり下ろしたりする動作 をできるだけ減らし、押したり引いたりする動作に変更する。","trap":"","keywords":"","related":"","current":"【出題当時】2022-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号と問題・選択肢は安全衛生技術試験協会の公表問題を基準に再照合。旧年度は、一次資料で裏付けていない「正文化」を表示せず、公式正答・原文・根拠リンクを優先する。OSH-Managementの同問ページは補助的な参考資料として扱い、正答は公式公表問題を優先する。","refs":[{"label":"厚生労働省 職場における腰痛予防対策指針","url":"https://www.mhlw.go.jp/content/11300000/001376468.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2022/gen-question23/"}],"audit":"2026-10-18 公式正答・原文再照合／推測正文化を撤去","choicesVerified":false,"auditBadge":"✅ 公式正答・原文照合済｜🛡️ 未確認の正文化なし"},"oshUrl":"https://osh-management.com/consultant/health/2022/gen-question23/","sourceType":"公表問題（公式正答・原文照合済）","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"公式正答・原文照合済（推測正文化なし）","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2022-24","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":24,"question":"厚生労働省の「職場における腰痛予防対策指針」に関する次の記述のうち、 適切でないものはどれか。","options":["脊柱の椎体間にある椎間板は、脊柱の動きに際してクッションの働きをし ている。 でん たい","腰痛には、腰部に加え、臀部、大腿部、下腿部、足底部にかけての痛み、 しびれ、つっぱり等の症状が含まれる。","腰痛の発生要因には、仕事への満足感や働きがいが得にくいこと、上司や 同僚からの支援不足、職場での対人トラブル等がある。","急激な動作は、脊柱の椎間板やその周辺の筋肉等を損傷させて腰痛を発生 させることがある。","立位姿勢における椎間板内圧は、椅座位姿勢に比べて高くなる。"],"correctIndex":4,"tags":["人間工学・腰痛"],"examLawDate":"2022-04-01","category":"人間工学・腰痛","cluster":"人間工学・作業態様","explanation":{"title":"人間工学・腰痛","point":"公式
