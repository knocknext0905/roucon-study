dge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-07","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":7,"question":"労働安全衛生法に基づく監督等に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　厚生労働大臣、都道府県労働局長又は労働基準監督署長は、労働安全\n衛生法を施行するため必要があると認めるときは、労働安全コンサルタント及び労働衛生コンサルタントに対し、出頭を命ずることができるが、この場合は、出頭を命ずる理由及び聴取しようとする事項を通知するものとする。\nロ　事業者は、労働安全衛生法及びこれに基づく命令の要旨を常時各作業\n場の見やすい場所に掲示し、又は備え付けること、書面を労働者に交付することその他の所定の方法により、労働者に周知させなければならない。\nハ　労働安全コンサルタント及び労働衛生コンサルタントは、依頼者の氏\n名（法人にあっては、その名称）及び住所、依頼を受けた年月日等所定の事項を記載した帳簿を備え、これを記載の日から５年間保存しなければならない。\nニ　厚生労働大臣は、労働者がさらされる化学物質等又は労働者の従事す\nる作業と労働者の疾病との相関関係を把握するため必要があると認めるときは、疫学的調査その他の調査を行うことができる。","options":["イ ロ ニ","イ ハ ニ","イ ハ","ロ ハ","ロ ニ"],"correctIndex":0,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（1）です。正しいのはイ・ロ・ニ。法令周知、行政の出頭命令、疫学調査の権限は認められる。コンサルタントの帳簿保存期間を5年とする記述は誤り。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：厚生労働大臣、都道府県労働局長又は労働基準監督署長は、労働安全 衛生法を施行するため必要があると認めるときは、労働安全コンサルタント及び労働衛生コンサルタントに対し、出頭を命ずることができるが、この場合は、出頭を命ずる理由及び聴取しようとする事項を通知するものとする。\nロ　正しい：記述どおり。\n　原文：事業者は、労働安全衛生法及びこれに基づく命令の要旨を常時各作業 場の見やすい場所に掲示し、又は備え付けること、書面を労働者に交付することその他の所定の方法により、労働者に周知させなければならない。\nニ　正しい：記述どおり。\n　原文：厚生労働大臣は、労働者がさらされる化学物質等又は労働者の従事す る作業と労働者の疾病との相関関係を把握するため必要があると認めるときは、疫学的調査その他の調査を行うことができる。\nハ　誤り：コンサルタント帳簿の保存期間を5年とするのは誤り。\n　原文：労働安全コンサルタント及び労働衛生コンサルタントは、依頼者の氏 名（法人にあっては、その名称）及び住所、依頼を受けた年月日等所定の事項を記載した帳簿を備え、これを記載の日から５年間保存しなければならない。\n\n【組合せ肢の確認】\n（1）イ ロ ニ：正答。求められた記述の集合と一致する。\n（2）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（1）／正しいのはイ・ロ・ニ。法令周知、行政の出頭命令、疫学調査の権限は認められる。コンサルタントの帳簿保存期間を5年とする記述は誤り。\n数値チェック：１、５、５年、5年","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question07/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-08","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":8,"question":"労働安全衛生規則の衛生基準に関する次の記述のうち、誤っているものはどれか。","options":["事業者は、強烈な騒音を発する屋内作業場における業務に労働者を従事させるときは、当該作業場が強烈な騒音を発する場所であることを、見やすい箇所に標識によって明示する等の措置を講ずるとともに、耳栓その他の保護具を備えなければならない。","事業者は、著しく多湿な場所で労働者を従事させるときは、関係者以外の者が立ち入ることを禁止する旨を見やすい箇所に表示することその他の方法により、立入りを禁止しなければならない。","事業者は、多量の発汗を伴う作業場においては、屋内又は屋外にかかわらず、労働者に与えるために、塩及び飲料水を備えなければならない。","事業者は、有害物による汚染のおそれがある床及び周壁を、不浸透性の材料で塗装し、かつ、排水に便利な構造としなければならず、また、必要に応じ、洗浄しなければならない。","事業者は、身体又は被服を汚染するおそれのある業務に労働者を従事させるときは、洗眼、洗身若しくはうがいの設備、更衣設備又は洗濯のための設備を設けなければならない。"],"correctIndex":1,"category":"物理的因子","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（2）です。誤りは、著しく多湿な場所を一律に関係者以外立入禁止とする記述。立入禁止対象は有害光線、超音波、酸欠危険等の法定場面を条文で確認する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、強烈な騒音を発する屋内作業場における業務に労働者を従事させるときは、当該作業場が強烈な騒音を発する場所であることを、見やすい箇所に標識によって明示する等の措置を講ずるとともに、耳栓その他の保護具を備えなければならない。\n\n（2）誤り：著しく多湿な場所だから直ちに関係者以外立入禁止となる一般規定はない。\n　事業者は、著しく多湿な場所で労働者を従事させるときは、関係者以外の者が立ち入ることを禁止する旨を見やすい箇所に表示することその他の方法により、立入りを禁止しなければならない。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、多量の発汗を伴う作業場においては、屋内又は屋外にかかわらず、労働者に与えるために、塩及び飲料水を備えなければならない。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、有害物による汚染のおそれがある床及び周壁を、不浸透性の材料で塗装し、かつ、排水に便利な構造としなければならず、また、必要に応じ、洗浄しなければならない。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、身体又は被服を汚染するおそれのある業務に労働者を従事させるときは、洗眼、洗身若しくはうがいの設備、更衣設備又は洗濯のための設備を設けなければならない。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（2）／誤りは、著しく多湿な場所を一律に関係者以外立入禁止とする記述。立入禁止対象は有害光線、超音波、酸欠危険等の法定場面を条文で確認する。","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question08/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-09","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":9,"question":"有機溶剤等の取扱いに関する次のイ～ホの記述について、労働安全衛生法令上、誤っているもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、有機溶剤中毒予防規則による適用の除外及び設備の特例はなく、イの事業者は、労働安全衛生法に基づき労働基準監督署長への機械等の設置の届出の必要がないとの所轄労働基準監督署長の認定を受けていないものとする。また、特別教育とは、危険又は有害な業務で、厚生労働省令で定めるものに労働者を就かせるときに行う当該業務に関する安全又は衛生のための特別の教育をいうものとする。\nイ　事業者は、有機溶剤中毒予防規則に基づき設置が必要な固定式の全体\n換気装置を設置しようとするときは、その計画を当該工事の開始の日の30日前までに所轄労働基準監督署長に届け出なければならない。\nロ　事業者は、タンク等の内部において第三種有機溶剤等を用いて行う有\n機溶剤業務に常時従事する労働者に対し、６か月以内ごとに１回、定期に、所定の項目について医師による健康診断を行わなければならない。\nハ　事業者は、屋内作業場等において第一種有機溶剤等を用いて行う有機\n溶剤業務に労働者を常時従事させるときは、当該労働者に対し、特別教育を行わなければならない。\nニ　事業者は、屋内作業場等において第二種有機溶剤等を用いて行う有機\n溶剤業務に労働者を従事させるときは、当該有機溶剤業務に係る有機溶剤等の区分を色分け及び色分け以外の方法により、見やすい場所に表示し、色分けによる表示は黄色としなければならない。\nホ　事業者は、有機溶剤等を屋内に貯蔵するときは、その貯蔵場所に、貯\n蔵に関係する者以外の者がその貯蔵場所に立ち入ることを防ぐ設備を設けるとともに、有機溶剤の蒸気が屋外に漏れ出ないよう、その貯蔵場所を密閉構造としなければならない。","options":["イ ロ ハ","イ ホ","ロ ニ","ハ ニ ホ","ハ ホ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。誤りはハ・ホ。有機溶剤業務一般に特別教育義務があるわけではなく、屋内貯蔵場所は関係者以外の立入防止と、蒸気を屋外へ排出する等の換気が必要で、完全密閉を求める趣旨ではない。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：事業者は、有機溶剤中毒予防規則に基づき設置が必要な固定式の全体 換気装置を設置しようとするときは、その計画を当該工事の開始の日の30日前までに所轄労働基準監督署長に届け出なければならない。\nロ　正しい：記述どおり。\n　原文：事業者は、タンク等の内部において第三種有機溶剤等を用いて行う有 機溶剤業務に常時従事する労働者に対し、６か月以内ごとに１回、定期に、所定の項目について医師による健康診断を行わなければならない。\nハ　誤り：有機溶剤業務一般は特別教育の法定対象ではない。\n　原文：事業者は、屋内作業場等において第一種有機溶剤等を用いて行う有機 溶剤業務に労働者を常時従事させるときは、当該労働者に対し、特別教育を行わなければならない。\nホ　誤り：貯蔵場所は立入防止と換気等を要し、蒸気を屋外へ一切漏らさない密閉構造を要求する趣旨ではない。\n　原文：事業者は、有機溶剤等を屋内に貯蔵するときは、その貯蔵場所に、貯 蔵に関係する者以外の者がその貯蔵場所に立ち入ることを防ぐ設備を設けるとともに、有機溶剤の蒸気が屋外に漏れ出ないよう、その貯蔵場所を密閉構造としなければならない。\nニ　正しい：記述どおり。\n　原文：事業者は、屋内作業場等において第二種有機溶剤等を用いて行う有機 溶剤業務に労働者を従事させるときは、当該有機溶剤業務に係る有機溶剤等の区分を色分け及び色分け以外の方法により、見やすい場所に表示し、色分けによる表示は黄色としなければならない。\n\n【組合せ肢の確認】\n（1）イ ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ハ ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ホ：正答。求められた記述の集合と一致する。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／誤りはハ・ホ。有機溶剤業務一般に特別教育義務があるわけではなく、屋内貯蔵場所は関係者以外の立入防止と、蒸気を屋外へ排出する等の換気が必要で、完全密閉を求める趣旨ではない。\n数値チェック：１、５、30日、６、１回","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question09/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-10","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":10,"question":"次の特定化学物質のうち、特定化学物質障害予防規則における特別管理物質でないものはどれか。","options":["五酸化バナジウム","スチレン","トリクロロエチレン","ナフタレン","ホルムアルデヒド"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（1）です。特別管理物質でないのは五酸化バナジウム。スチレン、トリクロロエチレン、ナフタレン、ホルムアルデヒドは特別管理物質として長期記録等が問題となる。","choicesExplain":"（1）誤り：五酸化バナジウムは本設問の特別管理物質に該当しない。\n　五酸化バナジウム\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　スチレン\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　トリクロロエチレン\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　ナフタレン\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　ホルムアルデヒド","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（1）／特別管理物質でないのは五酸化バナジウム。スチレン、トリクロロエチレン、ナフタレン、ホルムアルデヒドは特別管理物質として長期記録等が問題となる。","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question10/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-11","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":11,"question":"電離放射線障害を防止するため事業者が講ずべき措置に関する次のイ～ニの記述について、電離放射線障害防止規則上、正しいものの組合せは（１）～","options":["イ・ロ","イ・ハ","イ・ニ","ロ・ハ","ハ・ニ"],"correctIndex":0,"category":"物理的因子","cluster":"放射線","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（1）です。正しいのはイ・ロ。管理区域の基準は3か月1.3 mSv、水晶体等価線量は5年100 mSvかつ1年50 mSv。皮膚限度は150 mSvではなく、より大きい法定値である。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\nロ　正しい：記述どおり。\nハ　誤り：毎日確認を要する線量基準・対象の組合せが記述と一致しない。\nニ　誤り：皮膚の等価線量限度は年間150 mSvではない。\n\n【組合せ肢の確認】\n（1）イ・ロ：正答。求められた記述の集合と一致する。\n（2）イ・ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ・ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ・ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ・ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（1）／正しいのはイ・ロ。管理区域の基準は3か月1.3 mSv、水晶体等価線量は5年100 mSvかつ1年50 mSv。皮膚限度は150 mSvではなく、より大きい法定値である。\n数値チェック：１、3、1.3 mSv、5年、100 mSv、1年、50 mSv、150 mSv","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question11/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-12","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":12,"question":"酸素欠乏症等の防止に関する次の記述のうち、酸素欠乏症等防止規則上、誤っているものはどれか。","options":["硫化水素中毒とは、硫化水素の濃度が100万分の10を超える空気を吸入することにより生ずる症状が認められる状態をいう。","冷蔵室、冷凍室等密閉して使用する施設の内部の作業に労働者を従事させる場合は、当該施設の出入口の扉が内部から容易に開くことができる構造のものである場合又は施設の内部に通報装置若しくは警報装置が設けられている場合を除き、労働者が作業に従事する間、出入口の扉が締まらないような措置を講じなければならない。","第二種酸素欠乏危険作業については、酸素欠乏危険作業主任者技能講習を修了した者のうちから、酸素欠乏危険作業主任者を選任しなければならない。","酸素欠乏危険作業に労働者を従事させる場合に、当該作業を行う場所の空気中の酸素の濃度を18パーセント以上に保つように換気を行うときは、純酸素を使用してはならない。","酸素欠乏危険作業に労働者を従事させるときは、常時作業の状況を監視し、異常があったときに直ちにその旨を酸素欠乏危険作業主任者及びその他の関係者に通報する者を置く等異常を早期に把握するために必要な措置を講じなければならない。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。誤りは、第二種酸素欠乏危険作業の主任者を通常の酸欠主任者技能講習修了者から選ぶとする記述。第二種には酸素欠乏・硫化水素危険作業主任者技能講習が必要。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　硫化水素中毒とは、硫化水素の濃度が100万分の10を超える空気を吸入することにより生ずる症状が認められる状態をいう。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　冷蔵室、冷凍室等密閉して使用する施設の内部の作業に労働者を従事させる場合は、当該施設の出入口の扉が内部から容易に開くことができる構造のものである場合又は施設の内部に通報装置若しくは警報装置が設けられている場合を除き、労働者が作業に従事する間、出入口の扉が締まらないような措置を講じなければならない。\n\n（3）誤り：第二種酸欠危険作業では、酸素欠乏・硫化水素危険作業主任者技能講習修了者から選任する。\n　第二種酸素欠乏危険作業については、酸素欠乏危険作業主任者技能講習を修了した者のうちから、酸素欠乏危険作業主任者を選任しなければならない。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　酸素欠乏危険作業に労働者を従事させる場合に、当該作業を行う場所の空気中の酸素の濃度を18パーセント以上に保つように換気を行うときは、純酸素を使用してはならない。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　酸素欠乏危険作業に労働者を従事させるときは、常時作業の状況を監視し、異常があったときに直ちにその旨を酸素欠乏危険作業主任者及びその他の関係者に通報する者を置く等異常を早期に把握するために必要な措置を講じなければならない。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／誤りは、第二種酸素欠乏危険作業の主任者を通常の酸欠主任者技能講習修了者から選ぶとする記述。第二種には酸素欠乏・硫化水素危険作業主任者技能講習が必要。\n数値チェック：100、10、18","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question12/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-13","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":13,"question":"事務所の衛生基準について事業者が講ずべき措置に関する次のイ～ニの記述について、事務所衛生基準規則上、正しいものの組合せは（１）～（５）のうちどれか。\nイ　燃焼器具(発熱量が著しく少ないものを除く。)を使用するときは、１\nか月以内ごとに１回、当該器具の異常の有無を点検しなければならない。\nロ　労働者を常時就業させる室の作業面の照度は、感光材料の取扱い等特\n殊な作業を行う室を除き、一般的な事務作業の場合、300ルクス以上になるようにしなければならない。\nハ　労働者を常時就業させる室の気積を、設備の占める容積及び床面から\n３メートルを超える高さにある空間を除き、労働者１人について、10立方メートル以上としなければならない。\nニ　ねずみ、昆虫等の発生場所、生息場所及び侵入経路並びにねずみ、昆\n虫等による被害の状況について、６か月以内ごとに１回、定期に、統一的に調査を実施し、当該調査の結果に基づき、ねずみ、昆虫等の発生を防止するため必要な措置を講じなければならない。","options":["イ ロ","イ ハ","ロ ニ","ロ ハ","ハ ニ"],"correctIndex":2,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（3）です。正しいのはロ・ニ。一般的事務作業の照度は300 lx以上、ねずみ・昆虫等は6か月以内ごとに調査。気積の高さ除外や燃焼器具点検周期を混同しない。","choicesExplain":"【記述ごとの判定】\nイ　誤り：燃焼器具の点検周期を1か月とするのは誤り。\n　原文：燃焼器具(発熱量が著しく少ないものを除く。)を使用するときは、１ か月以内ごとに１回、当該器具の異常の有無を点検しなければならない。\nロ　正しい：記述どおり。\n　原文：労働者を常時就業させる室の作業面の照度は、感光材料の取扱い等特 殊な作業を行う室を除き、一般的な事務作業の場合、300ルクス以上になるようにしなければならない。\nハ　誤り：気積計算で除外する高さは3 mではない。\n　原文：労働者を常時就業させる室の気積を、設備の占める容積及び床面から ３メートルを超える高さにある空間を除き、労働者１人について、10立方メートル以上としなければならない。\nニ　正しい：記述どおり。\n　原文：ねずみ、昆虫等の発生場所、生息場所及び侵入経路並びにねずみ、昆 虫等による被害の状況について、６か月以内ごとに１回、定期に、統一的に調査を実施し、当該調査の結果に基づき、ねずみ、昆虫等の発生を防止するため必要な措置を講じなければならない。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ニ：正答。求められた記述の集合と一致する。\n（4）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（3）／正しいのはロ・ニ。一般的事務作業の照度は300 lx以上、ねずみ・昆虫等は6か月以内ごとに調査。気積の高さ除外や燃焼器具点検周期を混同しない。\n数値チェック：１、５、１回、300ルクス、３、１人、10立方メートル、６、300 lx、6","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question13/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-14","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":14,"question":"石綿等が使用されている解体等対象建築物等の解体等の作業（以下「石綿使用建築物等解体等作業」という。）を行うときに事業者が講じた措置に関する次の記述のうち、労働安全衛生法令上、違反となるものはどれか。","options":["解体等対象建築物の改修工事において、当該工事の請負代金の額が100万円未満であったため、事前調査（当該解体等対象建築物に係る石綿等の使用の有無の調査をいう。）の結果を所轄労働基準監督署長に報告しなかった。","解体等対象建築物の解体工事において、当該解体等対象建築物に吹き付けられている石綿等（石綿等が使用されている仕上げ用塗り材を除く。）の除去の作業を行う仕事について、当該工事に係る部分の床面積の合計が80平方メートル未満であったため、当該仕事に係る計画を所轄労働基準監督署長に届け出なかった。","成形された材料であって石綿等が使用されているもの（石綿含有保温材を除く。）を建築物から除去する作業において、切断、破砕等を行わずに除去することが技術上困難であったため、当該作業を行う作業場所を、当該作業以外の作業を行う作業場所からビニールシート等で隔離し、当該作業中は、当該材料を常時湿潤な状態に保つ措置を講じた上で、切断、破砕等による方法により、当該作業を実施した。","石綿等を取り扱う作業場の見やすい箇所に、石綿作業主任者の氏名及びその者に行わせる事項を掲示したが、当該作業場で作業を行う者の氏名は掲示しなかった。","法令に基づき定めた作業計画に従って石綿使用建築物等解体等作業を行わせたことについて、写真その他実施状況を確認できる方法により記録を作成するとともに、当該石綿使用建築物等解体等作業に従事した労働者の氏名及び当該労働者ごとの当該石綿使用建築物等解体等作業に従事した期間等所定の事項を記録し、これらを当該石綿使用建築物等解体等作業を終了した日から３年間保存した後、廃棄した。"],"correctIndex":1,"category":"統計・疫学","cluster":"粉じん・石綿・じん肺","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（2）です。違反は、吹付け石綿除去の計画届を床面積80 m²未満を理由に省略した事例。事前調査結果報告の面積・請負金額基準と、吹付け石綿等の計画届要件は別である。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　解体等対象建築物の改修工事において、当該工事の請負代金の額が100万円未満であったため、事前調査（当該解体等対象建築物に係る石綿等の使用の有無の調査をいう。）の結果を所轄労働基準監督署長に報告しなかった。\n\n（2）誤り：吹付け石綿等の除去作業の計画届は、床面積80 m²未満を理由に省略できない。\n　解体等対象建築物の解体工事において、当該解体等対象建築物に吹き付けられている石綿等（石綿等が使用されている仕上げ用塗り材を除く。）の除去の作業を行う仕事について、当該工事に係る部分の床面積の合計が80平方メートル未満であったため、当該仕事に係る計画を所轄労働基準監督署長に届け出なかった。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　成形された材料であって石綿等が使用されているもの（石綿含有保温材を除く。）を建築物から除去する作業において、切断、破砕等を行わずに除去することが技術上困難であったため、当該作業を行う作業場所を、当該作業以外の作業を行う作業場所からビニールシート等で隔離し、当該作業中は、当該材料を常時湿潤な状態に保つ措置を講じた上で、切断、破砕等による方法により、当該作業を実施した。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　石綿等を取り扱う作業場の見やすい箇所に、石綿作業主任者の氏名及びその者に行わせる事項を掲示したが、当該作業場で作業を行う者の氏名は掲示しなかった。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　法令に基づき定めた作業計画に従って石綿使用建築物等解体等作業を行わせたことについて、写真その他実施状況を確認できる方法により記録を作成するとともに、当該石綿使用建築物等解体等作業に従事した労働者の氏名及び当該労働者ごとの当該石綿使用建築物等解体等作業に従事した期間等所定の事項を記録し、これらを当該石綿使用建築物等解体等作業を終了した日から３年間保存した後、廃棄した。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（2）／違反は、吹付け石綿除去の計画届を床面積80 m²未満を理由に省略した事例。事前調査結果報告の面積・請負金額基準と、吹付け石綿等の計画届要件は別である。\n数値チェック：100、80平方メートル、３年、80 m²","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question14/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-15","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":15,"question":"じん肺法及びじん肺法施行規則に関する次のイ～ニの記述について、正しいものの組合せは（１）～（５）のうちどれか。\nイ　じん肺管理区分が管理１と決定された者に係る続発性気胸は、じん肺\n法施行規則に規定する合併症の一つであり、当該合併症にかかっている者は、療養を要するものとする。\nロ　事業者は、新たに常時粉じん作業に従事することになった労働者で、\n当該作業に従事することとなった日前６か月以内にじん肺健康診断を受けて、じん肺管理区分が管理３ロと決定されたものに対しては、その就業の際、じん肺健康診断を行わなくてもよい。\nハ　事業者は、常時粉じん作業に従事させたことのある労働者で、現に粉\nじん作業以外の作業に常時従事しているもののうち、じん肺管理区分が管理２である労働者については、１年以内ごとに１回、定期的に、じん肺健康診断を行わなければならない。\nニ　事業者は、じん肺管理区分が管理３ロである労働者が現に常時粉じん\n作業に従事しているときは、当該労働者を粉じん作業以外の作業に常時従事させることとするように努めなければならない。","options":["イ・ロ","イ・ハ","イ・ニ","ロ・ハ","ロ・ニ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。正しいのはロ・ニ。直前6か月以内の健診で管理3ロなら就業時健診を省略でき、管理3ロの粉じん作業従事者は非粉じん作業への転換に努める。管理1に合併症療養の規定を当てはめない。","choicesExplain":"【記述ごとの判定】\nイ　誤り：管理1はじん肺所見なしであり、合併症療養の扱いをそのまま適用しない。\n　原文：じん肺管理区分が管理１と決定された者に係る続発性気胸は、じん肺 法施行規則に規定する合併症の一つであり、当該合併症にかかっている者は、療養を要するものとする。\nロ　正しい：記述どおり。\n　原文：事業者は、新たに常時粉じん作業に従事することになった労働者で、 当該作業に従事することとなった日前６か月以内にじん肺健康診断を受けて、じん肺管理区分が管理３ロと決定されたものに対しては、その就業の際、じん肺健康診断を行わなくてもよい。\nハ　誤り：粉じん作業を離れた管理2の者の定期健診頻度を1年とするのは誤り。\n　原文：事業者は、常時粉じん作業に従事させたことのある労働者で、現に粉 じん作業以外の作業に常時従事しているもののうち、じん肺管理区分が管理２である労働者については、１年以内ごとに１回、定期的に、じん肺健康診断を行わなければならない。\nニ　正しい：記述どおり。\n　原文：事業者は、じん肺管理区分が管理３ロである労働者が現に常時粉じん 作業に従事しているときは、当該労働者を粉じん作業以外の作業に常時従事させることとするように努めなければならない。\n\n【組合せ肢の確認】\n（1）イ・ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ・ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ・ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ・ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ・ニ：正答。求められた記述の集合と一致する。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／正しいのはロ・ニ。直前6か月以内の健診で管理3ロなら就業時健診を省略でき、管理3ロの粉じん作業従事者は非粉じん作業への転換に努める。管理1に合併症療養の規定を当てはめない。\n数値チェック：１、５、６、３、２、１年、１回、6、3、1","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question15/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[]," してください。","trap":"古い問題ほど、現在の制度・最新統計の知識で過去問の正誤を上書きしやすい。まず出題当時で採点し、その後に現在との差分を確認する。","keywords":"正答番号だけでなく、誤肢の誤り箇所を1語で特定 → 正文化 → 類題で再確認。","related":"同じ cluster の問題を「この論点の類題」から年度横断で解くと、表現を変えた再出題に対応しやすい。","current":"【出題当時】統計問題は問題文で指定された年の公表値で判定する。\n【現在】最新統計に置き換えて過去問の正答を変更しない。学習上は「出題年の値」と「最新値」を別々に覚える。","evidence":"ユーザー提供「過去問統合版_労働衛生一般(4).pdf」の問題・正答。詳細な背景確認は、OSH-Managementの同問ページおよび厚生労働省等の一次資料を参照。"},"oshUrl":"https://osh-management.com/consultant/health/2022/gen-question27/","sourceType":"原問題（提供PDF）｜要点解説版","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"要点版"},{"id":"general-2022-28","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["建設業において、工事現場の関係請負人は、元方事業者の行う統括管理に 対して協力するとともに、連携して危険性又は有害性等の調査等を実施する こと、作業主任者、職長等による適切な作業指揮を行うことが重要である。","厚生労働省の「元方事業者による建設現場安全管理指針」では、元方事業 者は、関係請負人に対し、労働災害防止に配慮した作業手順書を作成するよ う指導することとされている。","厚生労働省の「元方事業者による建設現場安全管理指針」では、店社にお ける安全衛生管理計画は元方事業者が作成し、建設現場における安全衛生管 理計画は関係請負人が作成することとされている。","ライン・スタッフ型の安全管理は、安全業務を専ら管掌するスタッフ部門 に安全担当者を配置するとともに、生産ラインにも兼任や専任の安全担当者 を配置して、安全対策はスタッフ部門が企画し、これを生産ラインを通じて 実施するものである。","労働災害を防止するためには、事業場トップが、まず自らの安全衛生に対 する姿勢を明確にし、それを安全衛生方針という形で表明することが重要で ある。"],"correctIndex":2,"tags":["安全衛生管理・教育"],"examLawDate":"2022-04-01","category":"安全衛生管理・教育","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理・教育","point":"まず、設問が求める「正しい／誤り」「組合せ」を固定し、各肢を独立して判定する。旧年度問題では、法令・統計・指針の時点を必ず意識する。","conclusion":"出題当時の公表正答は（3）。正答肢（または正答の組合せ）は「厚生労働省の「元方事業者による建設現場安全管理指針」では、店社にお ける安全衛生管理計画は元方事業者が作成し、建設現場における安全衛生管 理計画は関係請負人が作成することとされている。」。","choicesExplain":"このR4・R3一般は、まず5年分を通して学習できるようにした要点版です。問題文・選択肢・正答は提供された統合過去問PDFを基礎に収載しています。各肢の詳しい○×理由は、下の「OSH-Management 同年度・同問」を開いて確認できます。\n\n復習時は、誤った肢を「どの語句を直せば正しいか」まで自分で言い換えてから参考解説と照合してください。","trap":"古い問題ほど、現在の制度・最新統計の知識で過去問の正誤を上書きしやすい。まず出題当時で採点し、その後に現在との差分を確認する。","keywords":"正答番号だけでなく、誤肢の誤り箇所を1語で特定 → 正文化 → 類題で再確認。","related":"同じ cluster の問題を「この論点の類題」から年度横断で解くと、表現を変えた再出題に対応しやすい。","current":"【出題当時】この問題は当該年度の出題時点の法令・指針・統計で判定する。\n【現在 ntBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"要点版"},{"id":"general-2022-30","subject":"労働衛生一般","year":2022,"yearLabel":"令和4年度","round":50,"number":30,"question":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指 針」に関する次のイ～ホの記述について、誤っているものの組合せは（１）～ （５）のうちどれか。 イ リスクの見積りの方法として、化学物質等への労働者のばく露濃度を 測定し、測定結果を当該化学物質についての日本産業衛生学会の許容濃 度と比較する方法がある。 ロ リスクの見積りにおいては、過去に発生した最も重篤な負傷又は疾病 の重篤度を見積もる。 ハ 個人ばく露濃度をばく露限界と比較する手法によりリスクを見積もっ た結果、ばく露濃度がばく露限界を相当程度下回る場合は、リスク低減 措置を検討する必要はない。 ニ リスクとは、労働者に負傷又は疾病を生じさせる潜在的な根源である 「危険性又は有害性」のことで、ＩＬＯ等においては、「ハザード」等 の用語で表現されている。 ホ 負傷又は疾病の重篤度の見積りに際しては、傷害や疾病等の種類にか かわらず、基本的に、負傷又は疾病による休業日数等を尺度として使用 する。","options":["イ ロ","イ ホ","ロ ニ","ハ ニ","ハ ホ （終 り）"],"correctIndex":2,"tags":["化学物質管理"],"examLawDate":"2022-04-01","category":"化学物質管理","cluster":"化学物質管理","explanation":{"title":"化学物質管理","point":"まず、設問が求める「正しい／誤り」「組合せ」を固定し、各肢を独立して判定する。旧年度問題では、法令・統計・指針の時点を必ず意識する。","conclusion":"出題当時の公表正答は（3）。正答肢（または正答の組合せ）は「ロ ニ」。","choicesExplain":"このR4・R3一般は、まず5年分を通して学習できるようにした要点版です。問題文・選択肢・正答は提供された統合過去問PDFを基礎に収載しています。各肢の詳しい○×理由は、下の「OSH-Management 同年度・同問」を開いて確認できます。\n\n復習時は、誤った肢を「どの語句を直せば正しいか」まで自分で言い換えてから参考解説と照合してください。","trap":"古い問題ほど、現在の制度・最新統計の知識で過去問の正誤を上書きしやすい。まず出題当時で採点し、その後に現在との差分を確認する。","keywords":"正答番号だけでなく、誤肢の誤り箇所を1語で特定 → 正文化 → 類題で再確認。","related":"同じ cluster の問題を「この論点の類題」から年度横断で解くと、表現を変えた再出題に対応しやすい。","current":"【出題当時】この問題は当該年度の出題時点の法令・指針・統計で判定する。\n【現在】統計値やガイドライン、法令は更新され得る。特に旧年度問題では、出題当時の正答と現在の知識を混ぜず、OSH同問解説の改訂注記と一次資料で確認する。","evidence":"ユーザー提供「過去問統合版_労働衛生一般(4).pdf」の問題・正答。詳細な背景確認は、OSH-Managementの同問ページおよび厚生労働省等の一次資料を参照。"},"oshUrl":"https://osh-management.com/consultant/health/2022/gen-question30/","sourceType":"原問題（提供PDF）｜要点解説版","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"要点版"},{"id":"law-2022-01","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":1,"question":"事業場の安全衛生管理体制に関する次の記述のうち、労働安全衛生法令上、正しいものはどれか。","options":["300人の造船業で総括安全衛生管理者を選任し、元方・請負労働者が同一場所で常時30人以上なら統括安全衛生責任者も選任する。","100人以上の運送業で総括安全衛生管理者を衛生委員会議長とし、議長以外の委員の半数は過半数労組等の意見を聴いて指名する。","産業医は医学知識・能力の維持向上に努め、事業者の指示に基づいて誠実に職務を行う。","産業医は健康確保のため勧告が必要と認めるとき、あらかじめ勧告内容について事業者の意見を求め、必要な勧告を行うことができる。","産業医選任義務事業場で産業医が辞任・解任したとき、遅滞なくその旨・理由を記載した報告書を所轄労基署長へ提出する。"],"correctIndex":3,"tags":["安全衛生管理体制"],"examLawDate":"2022-04-01","category":"安全衛生管理体制","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理体制","point":"産業医の独立性、勧告、総括安全衛生管理者・統括安全衛生責任者、委員会委員の指名要件を切り分ける。","conclusion":"出題当時の正答は（4）。産業医は勧告前に事業者の意見を求めることができる。","choicesExplain":"（1）誤：造船業の統括安全衛生責任者の人数基準はこの記述の30人ではない。\n（2）誤：委員の半数は「意見聴取」ではなく過半数労組等の推薦に基づく指名が原則。\n（3）誤：産業医は専門的立場から独立・中立に誠実に職務を行い、「事業者の指示に基づいて」とする点が不適切。\n（4）正。\n（5）出題当時は誤だったが、2026-08-01施行の改正で監督署長への辞任等報告が新たに義務化された。","trap":"古い問題では（5）の正誤が現在と変わる。過去問採点と現行法学習を分離する。","keywords":"造船業の統括安衛責任者／委員推薦／産業医の独立性／勧告／辞任等報告","related":"出題当時の条文でまず正誤を判定し、その後に現行条文との差分を確認する。","current":"【2022年試験当時】正答は（4）のみ。\n【2026-08-01以降】安衛則13条5項により、産業医の辞任・解任・退任があった場合、所轄労働基準監督署長への報告が新たに義務化。したがって現在の条文にそのまま当てはめると（5）も正しい。過去問の採点は（4）のまま保持する。","evidence":"安全衛生技術試験協会の公表正答を基礎とし、e-Gov法令検索及びOSH-Management同年度・同問の改訂注記を確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question01/","sourceType":"公表過去問の学習用整理","lawLinks":[{"label":"安衛法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"安衛則","url":"https://laws.e-gov.go.jp/law/347M50002000032"},{"label":"安衛令","url":"https://laws.e-gov.go.jp/law/347CO0000000318"}],"currentBadge":"⚠️ 現在は正答肢が増える","currentUpdates":["industrial_doc2026"],"detailLevel":"要点＋根拠"},{"id":"law-2022-02","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":2,"question":"機械等に関するイ～ニの記述について、法令上正しいもののみを全て挙げたものを選べ。\nイ：40cm³以上の内燃機関チェーンソーは規格具備対象。\nロ：透過写真用ガンマ線照射装置は登録個別検定機関の個別検定対象。\nハ：防じん機能を有する電動ファン付き呼吸用保護具は登録型式検定機関の型式検定対象。\nニ：硫酸含有排液の排液処理装置は6か月以内ごとに自主検査し記録7年保存。","options":["イ・ロ","イ・ハ","イ・ハ・ニ","ロ・ハ・ニ","ロ・ニ"],"correctIndex":1,"tags":["機械等の規制"],"examLawDate":"2022-04-01","category":"機械等の規制","cluster":"放射線","explanation":{"title":"機械等の規制","point":"「規格具備」「型式検定」「個別検定」「定期自主検査」を機械ごとに区別する。","conclusion":"正答は（2）イ・ハ。","choicesExplain":"イ○。ロ×（個別検定との整理が誤り）。ハ○。ニ×（検査周期・保存期間の設定が規定と一致しない）。","trap":"同じ機械に複数制度がかかる場合がある。制度名を混同しない。","keywords":"チェーンソー40cm³／PAPR型式検定／規格・検定・自主検査を分離","related":"出題当時の条文でまず正誤を判定し、その後に現行条文との差分を確認する。","current":"【出題当時】正答（2）。【現在】関連制度に改正があるため対象機械等の現行列挙はe-Govで確認するが、この学習カードでは出題当時の正答を保持する。","evidence":"安全衛生技術試験協会の公表正答を基礎とし、e-Gov法令検索及びOSH-Management同年度・同問の改訂注記を確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question02/","sourceType":"公表過去問の学習用整理","lawLinks":[{"label":"安衛法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"安衛令","url":"https://laws.e-gov.go.jp/law/347CO0000000318"}],"currentBadge":"関連改正あり","currentUpdates":[],"detailLevel":"要点＋根拠"},{"id":"law-2022-03","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":3,"question":"安全衛生教育に関する次の記述のうち、法令上正しいものはどれか。","options":["自動車整備業の新任職長及び作業主任者の双方に職長等教育を実施する。","鉛装置の破砕・溶接・溶断・切断業務は特別教育対象である。","第一種酸素欠乏危険作業の特別教育では救急そ生及び酸素濃度測定の実技教育が必須である。","潜水業務は特別教育対象である。","特別教育を行ったときは受講者・科目等の記録を作成し3年間保存する。"],"correctIndex":4,"tags":["安全衛生教育"],"examLawDate":"2022-04-01","category":"安全衛生教育","cluster":"管理・マネジメント","explanation":{"title":"安全衛生教育","point":"職長教育の対象と作業主任者の除外、特別教育対象業務、教育記録の保存を問う。","conclusion":"正答は（5）。特別教育記録は3年間保存する。","choicesExplain":"（1）作業主任者は職長等教育の対象から除かれる。ほかの肢は対象業務・教育内容の混同に注意。（5）が法定の保存規定に合致する。","trap":"似た制度の数字や主体を入れ替えた肢に注意。","keywords":"特別教育記録3年／職長等教育は作業主任者を除く","related":"出題当時の条文でまず正誤を判定し、その後に現行条文との差分を確認する。","current":"【出題当時】当該年度4月1日時点の法令で判定。\n【現在】関連条文は改正されることがあるため、e-Govの現行条文と同問解説の改訂注記を別に確認する。","evidence":"安全衛生技術試験協会の公表正答を基礎とし、e-Gov法令検索及びOSH-Management同年度・同問の改訂注記を確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2022/low-question03/","sourceType":"公表過去問の学習用整理","lawLinks":[{"label":"安衛法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"安衛則","url":"https://laws.e-gov.go.jp/law/347M50002000032"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"要点＋根拠"},{"id":"law-2022-04","subject":"労働衛生関係法令","year":2022,"yearLabel":"令和4年度","round":50,"number":4,"question":"次の作業場のうち、法令に基づき作業環境 とで、関係作業者全員に、その対策、安全措置の考案等の提 出を求め、これを実行することである。","ツールボックスミーティングは、作業開始前や作業の切替え時に短時間で、 監督者を中心にその日の作業の範囲、段取り、分担、安全衛生のポイントな どを現場で話し合う活動である。","安全提案制度によって作業者から安全についての提案を求めることは、具 体的な安全対策を立てる上で役立つのみならず、提案の過程を通じ安全意識 を向上させることにもなる。"],"correctIndex":2,"tags":["安全衛生管理・教育"],"examLawDate":"2021-04-01","category":"安全衛生管理・教育","cluster":"管理・マネジメント","explanation":{"title":"安全衛生管理・教育","point":"まず、設問が求める「正しい／誤り」「組合せ」を固定し、各肢を独立して判定する。旧年度問題では、法令・統計・指針の時点を必ず意識する。","conclusion":"出題当時の公表正答は（3）。正答肢（または正答の組合せ）は「危険予知活動とは、危険が予想される不安全箇所について、管理者のリー ダーシップのもとで、関係作業者全員に、その対策、安全措置の考案等の提 出を求め、これを実行することである。」。","choicesExplain":"このR4・R3一般は、まず5年分を通して学習できるようにした要点版です。問題文・選択肢・正答は提供された統合過去問PDFを基礎に収載しています。各肢の詳しい○×理由は、下の「OSH-Management 同年度・同問」を開いて確認できます。\n\n復習時は、誤った肢を「どの語句を直せば正しいか」まで自分で言い換えてから参考解説と照合してください。","trap":"古い問題ほど、現在の制度・最新統計の知識で過去問の正誤を上書きしやすい。まず出題当時で採点し、その後に現在との差分を確認する。","keywords":"正答番号だけでなく、誤肢の誤り箇所を1語で特定 → 正文化 → 類題で再確認。","related":"同じ cluster の問題を「この論点の類題」から年度横断で解くと、表現を変えた再出題に対応しやすい。","current":"【出題当時】この問題は当該年度の出題時点の法令・指針・統計で判定する。\n【現在】統計値やガイドライン、法令は更新され得る。特に旧年度問題では、出題当時の正答と現在の知識を混ぜず、OSH同問解説の改訂注記と一次資料で確認する。","evidence":"ユーザー提供「過去問統合版_労働衛生一般(4).pdf」の問題・正答。詳細な背景確認は、OSH-Managementの同問ページおよび厚生労働省等の一次資料を参照。"},"oshUrl":"https://osh-management.com/consultant/health/2021/gen-question28/","sourceType":"原問題（提供PDF）｜要点解説版","currentBadge":"出題当時で採点","currentUpdates":[],"detailLevel":"要点版"},{"id":"general-2021-29","subject":"労働衛生一般","year":2021,"yearLabel":"令和3年度","round":49,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」に基づく システムの運用に関する次の記述のうち、適切でないものはどれか。","options":["安全衛生目標は一定期間における達成すべき到達点を明らかにするもので あり、達成の度合いを客観的に評価できるよう、できるだけ数値で設定する。","安全衛生計画には、労働安全衛生関係法令、事業場安全衛生規程等に基づ き実施すべき事項等の他に、健康の保持増進のための活動の実施に関する事 項、健康教育の内容及び実施時期に関する事項を含める。","安全衛生計画の実施状況等の日常的な点検とは、安全衛生計画が着実に実 施されているかどうか、安全衛生目標は着実に達成されつつあるかどうかな どについて、安全衛生計画の実施事項の担当部門等が、点検を行うことであ る。","企業外部の者によるシステム監査は、企業内部の者によるシステム監査に 比べて、監査テーマを特定して、実態を詳しく調査し、評価することができ る。","システム監査の結果を踏まえ、定期的に、労働安全衛生マネジメントシス テムの妥当性及び有効性を確保するため、労働安全衛生マネジメントシステ ムの全般的な見直しを行う。"],"correctIn function load(){try{return Object.assign(emptyState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return emptyState()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nl(s){return esc(s).replace(/\n/g,'<br>')}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function qById(id){return DATA.questions.find(q=>q.id===id)}function astate(q){return state.answers[q.id]||null}
function totalAttempts(){return Object.values(state.answers).reduce((s,x)=>s+(x.attempts||0),0)}function totalCorrect(){return Object.values(state.answers).reduce((s,x)=>s+(x.correct||0),0)}function accuracy(){let a=totalAttempts();return a?Math.round(totalCorrect()/a*100):null}function attempted(){return DATA.questions.filter(q=>(astate(q)?.attempts||0)>0).length}function weakQs(){return DATA.questions.filter(q=>{let x=astate(q);return x&&(x.everWrong||x.attempts>=2&&x.correct/x.attempts<.8)})}function dueQs(){let now=Date.now();return DATA.questions.filter(q=>{let x=astate(q);return x?.nextReview&&new Date(x.nextReview).getTime()<=now})}function bookmarked(){return DATA.questions.filter(q=>astate(q)?.bookmarked)}
function qProgress(qs){let done=qs.filter(q=>(astate(q)?.attempts||0)>0).length;return {done,total:qs.length,pct:qs.length?Math.round(done/qs.length*100):0}}function subjectPill(q){return `<span class="pill ${q.subject==='労働衛生一般'?'general':'law'}">${q.subject==='労働衛生一般'?'一般':'法令'}</span>`}function yearPill(q){return `<span class="pill year">${esc(q.yearLabel)}</span>`}function detailPill(q){return `<span class="pill">${esc(q.detailLevel||'解説')}</span>`}function currentPill(q){let c=(q.currentBadge||'').includes('正答肢が増')?'due':(q.currentBadge||'').includes('改正')?'update':'ok';return `<span class="pill ${c}">${esc(q.currentBadge||'出題当時で採点')}</span>`}

function todayDashboardHtml(){let weak=weakTopItems(3),due=dueItemGroups(3),focus=focusKeys().slice(0,3),recent=recentWrongGroups(3),rec=dashboardRecommended();let weakHtml=weak.length?weak.map(o=>{let p=itemParts(o.k),enc=encodeURIComponent(o.k);return `<div class="dash-item"><div class="dash-item-main"><div class="dash-item-name">${esc(p.topic)} ＞ ${esc(p.item)}</div><div class="dash-item-meta">弱点 ${o.st.weak}問・正答率 ${o.st.acc==null?'—':o.st.acc+'%'}</div></div><button class="btn rose" onclick="startWeakSet(decodeURIComponent('${enc}'))">強化</button></div>`}).join(''):'<div class="dash-empty">弱点データはまだありません。問題を解くと自動で表示されます。</div>';let dueHtml=due.length?due.map(o=>{let p=itemParts(o.k),enc=encodeURIComponent(o.k);return `<div class="dash-item"><div class="dash-item-main"><div class="dash-item-name">${esc(p.topic)} ＞ ${esc(p.item)}</div><div class="dash-item-meta">期限到来 ${o.qs.length}問</div></div><button class="btn amber" onclick="startDueSet(decodeURIComponent('${enc}'))">復習</button></div>`}).join(''):'<div class="dash-empty">今日が期限の復習問題はありません。</div>';let focusHtml=focus.length?focus.map(k=>{let p=itemParts(k),st=itemStats(k),enc=encodeURIComponent(k);return `<div class="dash-item"><div class="dash-item-main"><div class="dash-item-name">${esc(p.topic)} ＞ ${esc(p.item)}</div><div class="dash-item-meta">弱点 ${st.weak}・復習 ${st.due}・正答率 ${st.acc==null?'—':st.acc+'%'}</div></div><button class="btn primary" onclick="startPrioritySet(decodeURIComponent('${enc}'))">重点</button></div>`}).join(''):'<div class="dash-empty">「☆重点項目」で登録すると、ここからすぐ学習できます。</div>';let recentHtml=recent.length?recent.map(o=>{let p=itemParts(o.k),enc=encodeURIComponent(o.k),x=astate(o.q);return `<div class="dash-item"><div class="dash-item-main"><div class="dash-item-name">${esc(p.topic)} ＞ ${esc(p.item)}</div><div class="dash-item-meta">最近の誤答：${esc(o.q.yearLabel)} ${o.q.subject==='労働衛生一般'?'一般':'法令'} 問${o.q.number}${o.count>1?'・直近で'+o.count+'問':''}</div></div><button class="btn soft" onclick="startPriorityS function renderHome(){let acc=accuracy(),w=weakQs(),d=dueQs();let years=[2025,2024,2023,2022,2021];document.getElementById('app').innerHTML=`<section class="hero"><span class="stamp">過去5年 225問</span><h1>年度でも、項目でも、すぐ解ける。</h1><p>令和7～3年度の一般30問＋法令15問を年度別・項目別に学習。間違えた問題は類題へつなぎ、過去問の正答は出題当時、法改正は別欄で確認します。</p><div class="grid4" style="margin-top:16px"><div class="stat"><div class="num">${attempted()}/225</div><small>挑戦済み</small></div><div class="stat"><div class="num">${acc==null?'—':acc+'%'}</div><small>通算正答率</small></div><div class="stat"><div class="num">${w.length}</div><small>苦手問題</small></div><div class="stat"><div class="num">${d.length}</div><small>復習期限</small></div></div></section>${todayDashboardHtml()}<section class="card today"><div class="split"><div><h2>今日の弱点10問</h2><div class="muted">期限到来 → 苦手 → 未着手の順に自動選出</div></div><button class="btn primary" onclick="startToday()">始める</button></div></section>${homeItemPanel()}<h2 style="margin:20px 0 6px">年度別</h2><div class="grid5">${years.map(y=>{let qs=DATA.questions.filter(q=>q.year===y),p=qProgress(qs);return `<div class="yearcard"><h3>${esc(qs[0].yearLabel)}</h3><div class="tiny">第${qs[0].round}回・45問</div><div class="progress" style="margin:10px 0"><span style="width:${p.pct}%"></span></div><div class="tiny">${p.done}/45 問</div><button class="btn soft full" style="margin-top:9px" onclick="startYear(${y})">45問を解く</button><div class="actions" style="margin-top:7px"><button class="btn mint" onclick="startYearSub(${y},'労働衛生一般')">一般</button><button class="btn soft" onclick="startYearSub(${y},'労働衛生関係法令')">法令</button></div></div>`}).join('')}</div><section class="card"><h2>解説の収載状況</h2><p><b>R7～R5：</b>各肢の○×、ひっかけ、関連知識まで入れた濃厚解説。<br><b>R4・R3：</b>まず5年通しで学習できるよう、一般は要点版＋同問詳説リンク、法令は要点＋根拠・改正差分を収載しています。</p><div class="callout"><b>重要：</b>令和4年度 法令問1は、2026年8月1日の改正により、現在の条文で読むと正しい肢が増えます。アプリは「出題当時の正答」で採点し、「現在」欄で差分を表示します。</div></section>`;homeItemChanged()}
function startToday(){let selected=[...dueQs(),...weakQs()].filter((q,i,a)=>a.findIndex(x=>x.id===q.id)===i);let un=shuffle(DATA.questions.filter(q=>!(astate(q)?.attempts))).slice(0,10);selected=[...selected,...un].filter((q,i,a)=>a.findIndex(x=>x.id===q.id)===i).slice(0,10);if(!selected.length)selected=shuffle(DATA.questions).slice(0,10);startQuiz(selected,'今日の弱点10問')}function startYear(y){startQuiz(DATA.questions.filter(q=>q.year===y),`${YEAR(y)} 45問`)}function startYearSub(y,s){startQuiz(DATA.questions.filter(q=>q.year===y&&q.subject===s),`${YEAR(y)} ${s}`)}function YEAR(y){return DATA.questions.find(q=>q.year===y)?.yearLabel||y}
function renderExam(){document.getElementById('app').innerHTML=`<h1 class="page-title">年度別・問題一覧</h1><p class="sub">年度・科目・解説レベルで絞り込み、その条件のまま連続演習できます。</p><section class="card"><input class="search" id="search" placeholder="論点・キーワードで検索" oninput="renderQuestionList()"><div class="filters" style="margin-top:10px">${['all',2025,2024,2023,2022,2021].map(y=>`<button class="filter ${String(browserYear)===String(y)?'active':''}" onclick="setYear('${y}')">${y==='all'?'全年度':YEAR(y)}</button>`).join('')}</div><div class="filters" style="margin-top:8px"><button class="filter ${browserSubject==='all'?'active':''}" onclick="setSubject('all')">両科目</button><button class="filter ${browserSubject==='労働衛生一般'?'active':''}" onclick="setSubject('労働衛生一般')">一般</button><button class="filter ${browserSubject==='労働衛生関係法令'?'active':''}" onclick="setSubject('労働衛生関係法令')">法令</button><button class="filter ${browserDetail==='濃厚'?'active':''}" onclick="setDetail('濃厚')">濃厚解説</button><button class="filter ${browserDetail==='要点'?'active':''}" onclick="setDetail('要点')">要点版</button></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="startFiltered()">この条件で連続演習</button><button class="btn soft" onclick="startQuiz(shuffle(DATA.questions).slice(0,30),'5年ミックス30問')">5年ミックス30問</button></div></section><section class="card"><div id="qlist"></div></section>`;renderQuestionList()}
function setYear(y){browserYear=y==='all'?'all':Number(y);renderExam()}function setSubject(s){browserSubject=s;renderExam()}function setDetail(d){browserDetail=browserDetail===d?'all':d;renderExam()}function filteredQuestions(){let s=(document.getElementById('search')?.value||'').trim().toLowerCase();return DATA.questions.filter(q=>(browserYear==='all'||q.year===browserYear)&&(browserSubject==='all'||q.subject===browserSubject)&&(browserDetail==='all'||(q.detailLevel||'').includes(browserDetail))&&(!s||[q.question,q.category,q.cluster,q.explanation?.title].join(' ').toLowerCase().includes(s)))}function renderQuestionList(){let el=document.getElementById('qlist');if(!el)return;let qs=filteredQuestions();el.innerHTML=`<div class="muted">${qs.length}問</div>${qs.map(q=>{let x=astate(q);return `<button class="menu-card" onclick="startQuiz([qById('${q.id}')],'単問演習')">${yearPill(q)}${subjectPill(q)}${detailPill(q)}${currentPill(q)}<span class="pill">問${q.number}</span><b>${esc(q.explanation?.title||q.category)}</b><small class="muted">${x?.attempts?`正答 ${x.correct}/${x.attempts}`:'未挑戦'}</small></button>`}).join('')}`}
function startFiltered(){let qs=filteredQuestions();if(!qs.length)return alert('対象問題がありません。');startQuiz(qs,'絞り込み演習')}
function startQuiz(items,title){if(!items.length)return alert('対象問題がありません。');quiz={items:[...items],title,index:0,score:0,answered:false,selected:null,returnQuiz:null,isRemedial:false};page='quiz';renderQuiz();window.scrollTo(0,0)}function renderQuiz(){let app=document.getElementById('app');if(!quiz)return go('home');if(quiz.index>=quiz.items.length){let pct=Math.round(quiz.score/quiz.items.length*100),isRem=!!quiz.isRemedial;app.innerHTML=`<section class="hero" style="text-align:center"><span class="stamp">${isRem?'類題復習終了':'演習終了'}</span><h1>${quiz.score}/${quiz.items.length} 問正解（${pct}%）</h1><p>${isRem?'同じ分野・法令の類題で復習しました。元の演習に戻れます。':'間違えた問題は自動で復習対象に入ります。'}</p><div class="actions" style="justify-content:center">${isRem&&quiz.returnQuiz?`<button class="btn primary" onclick="resumeParentQuiz()">元の演習に戻る</button>`:`<button class="btn primary" onclick="go('review')">間違い直しへ</button>`}<button class="btn soft" onclick="quitQuiz()">終了してホームへ</button></div></section>`;return}let q=quiz.items[quiz.index],chosen=quiz.selected;app.innerHTML=`<div class="qtop"><div class="qtoprow"><button class="btn soft" onclick="quitQuiz()">× 終了</button><div class="grow"><div class="progress"><span style="width:${Math.round((quiz.index+(quiz.answered?1:0))/quiz.items.length*100)}%"></span></div></div><b>${quiz.index+1}/${quiz.items.length}</b></div></div><section class="quiz-card">${yearPill(q)}${subjectPill(q)}${detailPill(q)}<span class="pill">問${q.number}</span>${currentPill(q)}<h2 style="margin:10px 0 8px">${esc(q.explanation?.title||q.category)}</h2><div class="question">${esc(q.question)}</div><div class="source-note">${esc(q.sourceType)}</div>${q.options.map((o,i)=>{let c='option';if(quiz.answered){if(i===q.correctIndex)c+=' correct';else if(i===chosen)c+=' wrong';else c+=' dim'}return `<button class="${c}" ${quiz.answered?'disabled':''} onclick="answer(${i})"><span class="n">${i+1}</span><span>${esc(o)}</span></button>`}).join('')}${quiz.answered?renderExplanation(q,chosen):''}</section> function isDueQ(q){let x=astate(q);return !!(x?.nextReview&&new Date(x.nextReview).getTime()<=Date.now())}
function itemParts(key){let a=String(key).split('｜');return {topic:a[0]||'その他',item:a.slice(1).join('｜')||'総合'}}
function itemStats(key,qs){qs=qs||setQuestions(key);let attempts=0,correct=0,done=0,weak=0,due=0;qs.forEach(q=>{let x=astate(q);if(x?.attempts){done++;attempts+=x.attempts||0;correct+=x.correct||0}if(isWeakQ(q))weak++;if(isDueQ(q))due++});let acc=attempts?Math.round(correct/attempts*100):null,status='未学習',cls='status-unstarted';if(done){status='学習中';cls='status-learning'}if(due){status='復習待ち';cls='status-due'}if(weak||(acc!==null&&acc<80)){status='要強化';cls='status-weak'}if(done===qs.length&&weak===0&&due===0&&acc!==null&&acc>=80){status='定着候補';cls='status-good'}return {total:qs.length,done,attempts,correct,acc,weak,due,status,cls}}
function isFocusSet(key){return !!(state.focusSets&&state.focusSets[key])}
function toggleFocusSet(key){state.focusSets=state.focusSets||{};if(state.focusSets[key])delete state.focusSets[key];else state.focusSets[key]={since:new Date().toISOString()};save();renderSimilar()}
function startWeakSet(key){let xs=setQuestions(key).filter(isWeakQ);if(!xs.length)return alert('この項目には現在、弱点問題がありません。');startQuiz(sortStudyQs(xs),`${key}｜弱点強化`)}
function startDueSet(key){let xs=setQuestions(key).filter(isDueQ);if(!xs.length)return alert('この項目には現在、復習期限が来ている問題はありません。');startQuiz(sortStudyQs(xs),`${key}｜復習`)}
function priorityScore(q){let x=astate(q),s=0;if(isDueQ(q))s+=100;if(isWeakQ(q))s+=75;if(!x?.attempts)s+=45;if(x?.bookmarked)s+=15;if(x?.attempts){let a=x.correct/x.attempts;s+=Math.round((1-a)*40);if(x.lastCorrect===false)s+=20}else s+=10;return s}
function priorityItems(qs,limit=12){return [...qs].sort((a,b)=>priorityScore(b)-priorityScore(a)||a.year-b.year||a.number-b.number).slice(0,Math.min(limit,qs.length))}
function startPrioritySet(key){let xs=priorityItems(setQuestions(key),12);if(!xs.length)return alert('対象問題がありません。');startQuiz(xs,`${key}｜重点学習`)}
function focusKeys(){return Object.keys(state.focusSets||{}).filter(k=>setQuestions(k).length)}
function startAllFocusSets(){let seen=new Set(),xs=[];focusKeys().forEach(k=>priorityItems(setQuestions(k),12).forEach(q=>{if(!seen.has(q.id)){seen.add(q.id);xs.push(q)}}));xs=xs.sort((a,b)=>priorityScore(b)-priorityScore(a));if(!xs.length)return alert('重点項目がまだ登録されていません。');startQuiz(xs.slice(0,30),'重点項目まとめ学習')}
function itemCard(key,qs){let p=itemParts(key),st=itemStats(key,qs),focus=isFocusSet(key),enc=encodeURIComponent(key);return `<div class="item-card ${focus?'focus-card':''}"><div class="split"><div><div class="item-kicker">${esc(p.topic)} ＞ 項目</div><h3>${esc(p.item)}</h3></div><div><span class="status-badge ${st.cls}">${st.status}</span>${focus?'<span class="pill update">★重点</span>':''}</div></div><div class="metric-row"><div class="metric"><b>${st.done}/${st.total}</b><small>学習済み</small></div><div class="metric"><b>${st.acc==null?'—':st.acc+'%'}</b><small>正答率</small></div><div class="metric"><b>${st.weak}</b><small>弱点</small></div><div class="metric"><b>${st.due}</b><small>復習期限</small></div></div><div class="progress"><span style="width:${st.total?Math.round(st.done/st.total*100):0}%"></span></div><div class="actions item-actions" style="margin-top:10px"><button class="btn mint" onclick="startSimilarSet(decodeURIComponent('${enc}'))">全問</button><button class="btn rose" onclick="startWeakSet(decodeURIComponent('${enc}'))" ${st.weak?'':'disabled'}>弱点強化${st.weak?' '+st.weak+'問':''}</button><button class="btn amber" onclick="startDueSet(decodeURIComponent('${enc}'))" ${st.due?'':'disabled'}>復習${st.due?' '+st.due+'問':''}</button><button class="btn primary" onclick="startPrioritySet(decodeURIComponent('${enc}'))">重点学習</button><button class="btn soft ${focus?'focus-star':''}" onclick="toggleFocusSet(decodeURIComponent('${enc}'))">${focus?'★ 重点解除':'☆ 重点項目'}</button></div><div class="preview">${setPreview(qs)}</div></div>`}
function renderSimilar(){let fine=buildSimilarSets(),laws=buildLawSets(),broad={};DATA.questions.forEach(q=>(broad[primaryTopic(q)]??=[]).push(q));let fineEntries=Object.entries(fine).filter(([,qs])=>qs.length>=2).sort((a,b)=>{let ap=itemParts(a[0]),bp=itemParts(b[0]);return ap.topic.localeCompare(bp.topic,'ja')||ap.item.localeCompare(bp.item,'ja')});let lawEntries=Object.entries(laws).filter(([,qs])=>qs.length>=2).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'ja'));let grouped={};fineEntries.forEach(([k,qs])=>{let p=itemParts(k);(grouped[p.topic]??=[]).push([k,qs])});let fkeys=focusKeys();let focusHtml=fkeys.length?`<section class="card focus-summary"><div class="split"><div><h2>⭐ 重点項目</h2><div class="muted">自分で重点指定した項目をまとめて学習できます。</div></div><button class="btn primary" onclick="startAllFocusSets()">重点項目をまとめて学習</button></div><div class="filters" style="margin-top:10px">${fkeys.map(k=>{let st=itemStats(k);return `<span class="pill update">${esc(k)}｜弱点${st.weak}・復習${st.due}</span>`}).join('')}</div></section>`:'';document.getElementById('app').innerHTML=`<h1 class="page-title">類題・項目別学習</h1><p class="sub">類題を「分野 ＞ 項目」に分け、項目ごとに全問・弱点強化・復習・重点学習を選べます。</p><section class="card"><div class="callout"><b>おすすめの使い方：</b> 間違えた項目は「弱点強化」、復習期限が来た項目は「復習」、試験前に集中的に回したい項目は「★重点項目」に登録して「重点学習」を使います。重点学習は、復習期限 → 誤答・低正答率 → 未着手の順に優先します。</div></section>${focusHtml}<h2 class="section-label">🧩 項目別の類題セット</h2><p class="mini-note">同じ分野・同じ法律・近い論点をできるだけ同じ項目にまとめています。各項目に学習状況を表示します。</p>${Object.entries(grouped).map(([topic,entries])=>`<section class="item-group"><div class="item-group-head"><h2>${esc(topic)}</h2><span class="pill">${entries.length}項目</span></div><div class="set-grid">${entries.map(([k,qs])=>itemCard(k,qs)).join('')}</div></section>`).join('')}<h2 class="section-label">⚖️ 法令別の横断学習</h2><p class="mini-note">一般問題と法令問題をまたいで、同じ個別法令に関係する問題をまとめます。</p><div class="set-grid">${lawEntries.map(([g,qs])=>`<div class="set-card"><span class="pill law">${esc(g)}</span><span class="pill">${qs.length}問</span><h3>${esc(g)}に関係する問題</h3><button class="btn soft" onclick="startLawSet('${g.replace(/'/g,"\\'")}')">この法令で解く</button><div class="preview">${setPreview(qs)}</div></div>`).join('')}</div><h2 class="section-label">📚 分野別セット</h2><p class="mini-note">項目より広い範囲をまとめて確認したいときに使います。</p>${Object.entries(broad).sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([g,qs])=>{let ls=[...new Set(qs.flatMap(q=>lawFamilies(q)).filter(k=>!['安衛法','安衛令','安衛則'].includes(k)))];return `<section class="card"><div class="split"><div><h2>${esc(g)}</h2><div class="muted">${qs.length}問・${new Set(qs.map(q=>q.year)).size}年度 ${ls.length?`｜関連法令：${ls.map(esc).join('・')}`:''}</div></div><button class="btn mint" onclick="startTopic('${g.replace(/'/g,"\\'")}')">この分野を解く</button></div><div class="tiny">${[2025,2024,2023,2022,2021].map(y=>`${YEAR(y)} ${qs.filter(q=>q.year===y).length}問`).join(' ｜ ')}</div></section>`}).join('')}`}
function renderReview(){let w=weakQs(),d=dueQs(),b=bookmarked(),sets=buildSimilarSets();let ranks=Object.entries(sets).filter(([,qs])=>qs.length>=2).map(([k,qs])=>({k,qs,st:itemStats(k,qs)})).filter(o=>o.st.done>0||o.st.weak||o.st.due).sort((a,b)=>b.st.weak-a.st.weak||b.st.due-a.st.due||(a.st.acc??101)-(b.st.acc??101));document.getElementById('app').innerHTML=`<h1 class="page-title">間違い直し・苦手強化</h1><p class="sub">個別問題だけでなく、どの「項目」が弱いかも自動で見えるようにしています。</p><div class="grid3"><div class="stat"><div class="num">${w.length}</div><small>苦手問題</small></div><div class="stat"><div class="num">${d.length}</div><small>期限到来</small></div><div class="stat"><div class="num">${b.length}</div><small>保存</small></div></div><section class="card"><h2>項目別の弱点</h2><p class="muted">弱点数 → 復習期限 → 正答率の低さの順で表示します。ここから直接「弱点強化」「重点学習」ができます。</p>${ranks.slice(0,20).map(o=>{let p=itemParts(o.k),enc=encodeURIComponent(o.k);return `<div class="weak-rank"><div><div class="name">${esc(p.topic)} ＞ ${esc(p.item)}</div><div class="subline">${o.st.done}/${o.st.total}問学習・${o.st.status}</div></div><div><b>${o.st.acc==null?'—':o.st.acc+'%'}</b><div class="tiny">正答率</div></div><div><b>${o.st.weak}</b><div class="tiny">弱点</div></div><div class="actions"><button class="btn rose" onclick="startWeakSet(decodeURIComponent('${enc}'))" ${o.st.weak?'':'disabled'}>弱点強化</button><button class="btn primary" onclick="startPrioritySet(decodeURIComponent('${enc}'))">重点</button></div></div>`}).join('')||'<div class="empty">項目別の学習データはまだありません。</div>'}</section><section class="card"><h2>個別問題の復習</h2><div class="actions"><button class="btn rose" onclick="startQuiz(weakQs(),'苦手問題')" ${w.length?'':'disabled'}>苦手を全部</button><button class="btn amber" onclick="startQuiz(dueQs(),'期限到来')" ${d.length?'':'disabled'}>期限到来だけ</button><button class="btn soft" onclick="startQuiz(bookmarked(),'保存問題')" ${b.length?'':'disabled'}>保存問題</button></div>${w.slice(0,80).map(q=>{let x=astate(q);return `<div class="review-item">${yearPill(q)}${subjectPill(q)}<span class="pill">問${q.number}</span><b>${esc(q.explanation?.title||q.category)}</b><small class="muted">正答 ${x.correct}/${x.attempts}｜項目：${esc(similarSetKey(q))}</small><div><button class="btn soft" style="margin-top:8px" onclick="startQuiz([qById('${q.id}')],'復習')">解き直す</button></div></div>`}).join('')||'<div class="empty">まだ苦手問題はありません。</div>'}</section>${renderStatsBlock()}`}
function renderStatsBlock(){let groups={};DATA.questions.forEach(q=>{let g=q.cluster;groups[g]??={items:0,attempts:0,correct:0,done:0};let x=astate(q);groups[g].items++;if(x){groups[g].attempts+=x.attempts;groups[g].correct+=x.correct;if(x.attempts)groups[g].done++}});return `<section class="card"><h2>分野別の正答率</h2>${Object.entries(groups).map(([g,x])=>{let a=x.attempts?Math.round(x.correct/x.attempts*100):null;return `<div class="barrow"><span>${esc(g)}<small class="muted"> ${x.done}/${x.items}</small></span><div class="progress"><span style="width:${a??0}%"></span></div><b>${a==null?'—':a+'%'}</b></div>`}).join('')}</section>`}
function renderUpdates(){document.getElementById('app').innerHTML=`<h1 class="page-title">法改正・現在との差分</h1><p class="sub">確認基準日：${DATA.meta.verifiedAsOf}。過去問の採点は出題当時、現在の制度は別カードで確認します。</p><section class="callout"><b>この版で特に重要：</b>令和4年度 法令問1は、2026-08-01施行の安衛則改正により産業医の辞任等の監督署報告が義務化され、現在の条文で読むと出題当時の第5肢も正しくなります。</section>${DATA.updates.map(u=>`<section class="card update-item ${u.status==='施行予定'?'future':''}"><span class="pill update">${esc(u.status)}</span><span class="pill">${esc(u.date)}</span><h2 style="margin-top:8px">${esc(u.title)}</h2><p>${esc(u.summary)}</p><div class="tiny">関連：${u.affected.map(id=>{let q=qById(id);return q?`${q.yearLabel} ${q.subject==='労働衛生一般'?'一般':'法令'}問${q.number}`:id}).join('、')}</div><p><a href="${esc(u.url)}" target="_blank">一次資料を開く ↗</a></p></section>`).join('')}`}
function renderSettings(){let swOk='serviceWorker' in navigator&&location.protocol!=='file:',standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;document.getElementById('app').innerHTML=`<h1 class="page-title">設定・収載情報</h1><section class="card pwa-section"><h2>📱 アプリ・オフライン</h2><p><b>${standalone?'アプリとして起動中':'ブラウザで起動中'}</b><br>${navigator.onLine?'オンライン':'オフライン'}｜${swOk?'Service Worker利用可能':'この開き方ではService Workerは利用できません'}</p><div class="actions"><button class="btn primary" id="settingsInstallBtn" onclick="installPwa()">アプリをインストール</button><button class="btn soft" onclick="checkForAppUpdate()">更新を確認</button></div><div class="callout" style="margin-top:12px"><b>オフライン利用：</b>HTTPSまたはlocalhostで一度オンライン起動すると、index.html・問題データ・アイコンを端末に保存します。その後は通信がない場所でも過去問演習と学習履歴の保存ができます。<br><b>注意：</b>HTMLファイルを直接 file:// で開いた場合はPWAインストールとService Workerが使えません。</div></section><section class="card"><h2>収載</h2><p>令和7～3年度：各年度 一般30問＋法令15問<br><b>合計225問</b>（一般150／法令75）<br>類題は「分野 ＞ 項目」で整理し、項目別の弱点強化・復習・重点学習に対応</p><p>現行法確認基準：${DATA.meta.verifiedAsOf}<br>Version ${DATA.meta.version}</p><div class="tiny">${esc(DATA.meta.sourceNote)}</div></section><section class="card"><h2>学習履歴</h2><p class="muted">この端末のブラウザ内（localStorage）に保存します。PWAを更新しても通常は保持されます。</p><div class="actions"><button class="btn primary" onclick="exportState()">JSON書き出し</button><label class="btn soft">読み込み<input type="file" hidden accept="application/json" onchange="importState(event)"></label><button class="btn rose" onclick="resetState()">リセット</button></div></section><section class="card"><h2>参考</h2><a href="${esc(DATA.oshIndex)}" target="_blank">OSH-Management 労働衛生コンサルタント過去問解説一覧 ↗</a><div class="tiny" style="margin-top:8px">解説の構成・論点整理を参考にしていますが、サイト本文を転載するのではなく、問題・公表正答・一次資料を基に学習用に整理しています。</div></section>`;updateInstallButtons()}
function exportState(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='労コンStudy_過去5年_学習履歴.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importState(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=Object.assign(emptyState(),JSON.parse(r.result));save();alert('読み込みました');render()}catch(err){alert('読み込み失敗')}};r.readAsText(f)}function resetState(){if(confirm('学習履歴をすべて削除しますか？')){state=emptyState();save();render()}}

let deferredInstallPrompt=null,swRegistration=null;
function updateOnlineStatus(){let on=navigator.onLine,dot=document.getElementById('pwaDot'),txt=document.getElementById('pwaStatusText');if(dot)dot.classList.toggle('off',!on);if(txt)txt.textContent=on?'オンライン':'オフライン'}
function updateInstallButtons(){let standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true,show=!!deferredInstallPrompt&&!standalone;['installBtn','settingsInstallBtn'].forEach(id=>{let b=document.getElementById(id);if(!b)return;if(id==='installBtn')b.hidden=!show;else{b.disabled=standalone;b.textContent=standalone?'インストール済み':(show?'アプリをインストール':'インストール案内')}})}
async function installPwa(){let standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;if(standalone)return alert('すでにアプリとして起動しています。');if(deferredInstallPrompt){deferredInstallPrompt.prompt();let r=await deferredInstallPrompt.userChoice;if(r.outcome==='accepted')deferredInstallPrompt=null;updateInstallButtons();return}alert('インストールボタンが表示されない場合は、ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を選んでください。iPhone/iPadはSafariの共有メニュー →「ホーム画面に追加」です。')}
function showPwaToast(message,worker){let el=document.getElementById('pwaToast');if(!el)return;el.innerHTML=`<span>${esc(message)}</span>${worker?'<button id="pwaUpdateBtn">更新</button>':''}`;el.classList.add('show');if(worker){document.getElementById('pwaUpdateBtn').onclick=()=>worker.postMessage({type:'SKIP_WAITING'})}else setTimeout(()=>el.classList.remove('show'),3500)}
async function checkForAppUpdate(){if(!swRegistration)return alert(location.protocol==='file:'?'file:// では更新確認できません。HTTPSで公開したURLから開いてください。':'Service Workerの準備中です。');try{await swRegistration.update();showPwaToast('更新を確認しました。新しい版があれば更新ボタンを表示します。')}catch(e){alert('更新確認に失敗しました。通信状態を確認してください。')}}
async function registerPwa(){updateOnlineStatus();if(!('serviceWorker' in navigator)||location.protocol==='file:')return;try{let reg=await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});swRegistration=reg;if(reg.waiting)showPwaToast('新しいアプリ版があります。',reg.waiting);reg.addEventListener('updatefound',()=>{let nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showPwaToast('新しいアプリ版があります。',nw)})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}catch(e){console.warn('Service Worker registration failed',e)}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButtons()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButtons();showPwaToast('労コンStudyをインストールしました。')});
window.addEventListener('online',updateOnlineStatus);window.addEventListener('offline',updateOnlineStatus);
render();registerPwa();updateInstallButtons();

</script></body></html>
