る「副流煙」があ る。","副流煙や呼出煙がじゅうたんや壁紙に付着して、その後、揮発・浮遊した 有害物質を吸い込むことを「二次喫煙」という。","たばこ１本から発生する発がん物質の量は、主流煙よりも副流煙の方が多 い。","受動喫煙と虚血性心疾患には、因果関係を推定する十分な科学的証拠があ る。","厚生労働省の「職場における受動喫煙防止のためのガイドライン」によれ ば、一般の事務所や工場では、原則として屋内禁煙とする。"],"tags":["化学物質管理","健康診断・健康管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":1,"category":"受動喫煙","cluster":"健康管理","explanation":{"title":"受動喫煙と三次喫煙","point":"二次喫煙（受動喫煙）は、他人の副流煙・呼出煙をその場で吸い込むことです。壁紙、衣類、じゅうたん等に残った成分が後で再放散し、それに触れたり吸入したりする現象は三次喫煙（third-hand smoke）と呼ばれます。副流煙は燃焼温度や希釈条件が異なり、主流煙より高濃度となる成分があります。","conclusion":"正答（2）：付着後に再放散した物質へのばく露は「三次喫煙」。","choicesExplain":"（1）— 非正答肢\n　たばこの煙には、喫煙者が吸う「主流煙」のほかに、喫煙者が一旦吸い込 んだ煙を吐き出す「呼出煙」、たばこの点火部から立ち上る「副流煙」があ る。\n\n（2）◎ 公式公表正答\n　副流煙や呼出煙がじゅうたんや壁紙に付着して、その後、揮発・浮遊した 有害物質を吸い込むことを「二次喫煙」という。\n\n（3）— 非正答肢\n　たばこ１本から発生する発がん物質の量は、主流煙よりも副流煙の方が多 い。\n\n（4）— 非正答肢\n　受動喫煙と虚血性心疾患には、因果関係を推定する十分な科学的証拠があ る。\n\n（5）— 非正答肢\n　厚生労働省の「職場における受動喫煙防止のためのガイドライン」によれ ば、一般の事務所や工場では、原則として屋内禁煙とする。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：職場における受動喫煙防止対策","url":"https://www.mhlw.go.jp/content/000524718.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question02/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question02/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-03","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":3,"question":"厚生労働省の労働衛生統計等に関する次のイ～ニの記述について、正しいも ののみを全て挙げたものは（１）～（５）のうちどれか。 イ 「定期健康診断結果調」によると、令和５年は、いずれかの健康診断項 目に所見のあった者の人数の割合（有所見率）は約60％で、健康診断項目 別では血糖検査の有所見率が最も高く約30％であった。 ロ 「業務上疾病調」によると、令和５年は、新型コロナウイルス感染症の 罹患によるものを除き、業務上疾病総数は約１万人であり、そのうち負傷 に起因する疾病が最も多く約7,500人、次いで多いものが物理的因子による 疾病で約1,400人であった。 ハ 「じん肺健康管理実施結果調」によると、令和５年は、じん肺健康診断 受診労働者数約30万人のうち、有所見者数は約9,000人で、そのうち管理１ であった者が管理２以上になった新規有所見者数は約1,000人であった。 ニ 「令和５年労働安全衛生調査（実態調査）」によると、調査対象事業場の うち事業場規模50人以上の事業場において、労働安全衛生法に基づくスト レスチェックを実施した事業場の割合は約80％であり、そのうち、ストレ スチェック結果の集団ごとの分析を実施した事業場の割合は約80％であっ た。","options":["イ ロ ハ","イ ハ","イ ニ","ロ ハ ニ","ロ ニ"],"tags":["粉じん・石綿・じん肺","健康診断・健康管理","疫学・統計","労働衛生管理総論"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"労働衛生統計","cluster":"疫学・統計","explanation":{"title":"労働衛生統計の読み方","point":"統計問題は「調査名・母集団・分母・年」をセットで確認します。令和5年の業務上疾病では、負傷に起因する疾病が大きな割合を占め、物理的因子による疾病が続きます。ストレスチェックは50人以上の事業場で高い実施率ですが、集団分析は法的には努力義務であり、実施率を別に押さえます。イは最も高い項目と割合、ハは新規有所見者数が不正確です。","conclusion":"正答（5）：ロ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ハ\n\n（3）— 非正答肢\n　イ ニ\n\n（4）— 非正答肢\n　ロ ハ ニ\n\n（5）◎ 公式公表正答\n　ロ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：令和5年業務上疾病発生状況等調査","url":"https://www.mhlw.go.jp/stf/newpage_42739.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question03/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question03/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-04","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":4,"question":"有害物質の性状、空気中での状態などに関する次の記述のうち、誤っている ものはどれか。","options":["固体に研磨、切削、粉砕等の機械的な作用を加えて発生した固体微粒子が 空気中に浮遊しているものを粉じんという。","金属の蒸気が空気中で凝固や化学変化を起こし、固体の微粒子となって空 気中に浮遊しているものをヒュームという。","常温、常圧で気体の状態であるものをガスという。","液体の微細な粒子が空気中に浮遊しているものをミストという。","常温、常圧で液体又は固体の物質が蒸気圧に応じて揮発又は昇華して気体 になっているものをエアロゾルという。"],"tags":["粉じん・石綿・じん肺","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"化学物質・有害因子","cluster":"化学物質","explanation":{"title":"粉じん・ヒューム・ミスト・蒸気","point":"粉じん・ヒュームは固体粒子、ミストは液体粒子で、これらが空気中に浮遊した状態はエアロゾルです。一方、常温常圧で液体又は固体の物質が揮発・昇華して気体状になったものは「蒸気」です。ガスは常温常圧で元から気体の物質です。","conclusion":"正答（5）：「蒸気」をエアロゾルとした点が誤り。","choicesExplain":"（1）— 非正答肢\n　固体に研磨、切削、粉砕等の機械的な作用を加えて発生した固体微粒子が 空気中に浮遊しているものを粉じんという。\n\n（2）— 非正答肢\n　金属の蒸気が空気中で凝固や化学変化を起こし、固体の微粒子となって空 気中に浮遊しているものをヒュームという。\n\n（3）— 非正答肢\n　常温、常圧で気体の状態であるものをガスという。\n\n（4）— 非正答肢\n　液体の微細な粒子が空気中に浮遊しているものをミストという。\n\n（5）◎ 公式公表正答\n　常温、常圧で液体又は固体の物質が蒸気圧に応じて揮発又は昇華して気体 になっているものをエアロゾルという。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法令（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20250401"},{"label":"粉じん障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question04/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question04/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-05","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":5,"question":"石綿に関する次の記述のうち、誤っているものはどれか。","options":["石綿が肺組織や胸膜などに長く滞留することが原因となって、肺がんや中 皮腫が発生すると考えられている。","石綿のばく露作業者が喫煙している場合、肺がんの罹患リスクが増大する。 り","石綿ばく露によって生じる肺がんは、通常の肺がんと比較して、発生部位、 病理組織型が大きく異なる。","中皮腫の罹患リスクは石綿の種類によって異なり、クロシドライトは他の 石綿に比べてリスクが高い。","石綿関連疾患の中で、中皮腫は潜伏期間が長く、他の石綿関連疾患に比べ て、より少ないばく露量でも罹患する。"],"tags":["粉じん・石綿・じん肺"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"石綿・じん肺","cluster":"粉じん・石綿","explanation":{"title":"石綿関連疾患","point":"石綿ばく露による肺がんは、発生部位・病理組織型だけで一般の肺がんと明瞭に区別できません。ばく露歴、胸膜プラーク、石綿小体等を総合します。喫煙と石綿ばく露は肺がんリスクを相乗的に高めます。中皮腫は長い潜伏期間を経て、比較的低いばく露でも発症し得ます。","conclusion":"正答（3）：石綿肺がんは通常の肺がんと病理学的に大きく異ならない。","choicesExplain":"（1）— 非正答肢\n　石綿が肺組織や胸膜などに長く滞留することが原因となって、肺がんや中 皮腫が発生すると考えられている。\n\n（2）— 非正答肢\n　石綿のばく露作業者が喫煙している場合、肺がんの罹患リスクが増大する。 り\n\n（3）◎ 公式公表正答\n　石綿ばく露によって生じる肺がんは、通常の肺がんと比較して、発生部位、 病理組織型が大きく異なる。\n\n（4）— 非正答肢\n　中皮腫の罹患リスクは石綿の種類によって異なり、クロシドライトは他の 石綿に比べてリスクが高い。\n\n（5）— 非正答肢\n　石綿関連疾患の中で、中皮腫は潜伏期間が長く、他の石綿関連疾患に比べ て、より少ないばく露量でも罹患する。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：石綿に関するQ&A","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/sekimen/topics/tp050729-1.html"},{"label":"石綿障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/417M60000100021?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question05/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question05/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-06","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":6,"question":"じん肺に関する次の記述のうち、適切でないものはどれか。","options":["鉱物、金属、研磨材、炭素原料等の粉じんの吸入により生じる。","肺内では線維増殖性変化が生じる。","初期にはチアノーゼなどの低酸素血症による症状が生じる。","合併症として、肺結核、原発性肺がん、続発性気胸が生じることがある。","じん肺の病変は不可逆性である。"],"tags":["粉じん・石綿・じん肺"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"石綿・じん肺","cluster":"粉じん・石綿","explanation":{"title":"じん肺の病態","point":"じん肺は粉じん吸入による肺の線維増殖性変化が主体で、病変は基本的に不可逆です。初期は無症状又は軽い咳・痰・息切れにとどまることが多く、チアノーゼなど明らかな低酸素血症の所見は進行例で問題になります。合併症として肺結核、原発性肺がん、続発性気胸等があります。","conclusion":"正答（3）：初期からチアノーゼが出るわけではない。","choicesExplain":"（1）— 非正答肢\n　鉱物、金属、研磨材、炭素原料等の粉じんの吸入により生じる。\n\n（2）— 非正答肢\n　肺内では線維増殖性変化が生じる。\n\n（3）◎ 公式公表正答\n　初期にはチアノーゼなどの低酸素血症による症状が生じる。\n\n（4）— 非正答肢\n　合併症として、肺結核、原発性肺がん、続発性気胸が生じることがある。\n\n（5）— 非正答肢\n　じん肺の病変は不可逆性である。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"じん肺法（e-Gov）","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question06/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question06/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-07","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":7,"question":"電離放射線に関する次の記述のうち、誤っているものはどれか。","options":["ベータ線は電子からなる粒子線で、１価のマイナスの電荷を持っている。","放射線防護のための線量として、吸収線量に放射線加重（荷重）係数で重 み付けした等価線量を用いる。","電離放射線が物質を透過する際に、原子又は分子から電子を放出させるこ とを電離作用という。","電磁波であるエックス線は、粒子線である中性子線より物質を透過する力 が強い。","エックス線とガンマ線の違いは波長によるものではない。"],"tags":["放射線・有害光線"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"物理因子","cluster":"物理因子","explanation":{"title":"電離放射線の種類と線量","point":"X線・γ線は電磁波、β線は電子、α線はヘリウム原子核、中性子線は電荷を持たない粒子線です。透過力はエネルギーや物質に依存しますが、「X線が中性子線より常に強い」は不適切です。等価線量は吸収線量に放射線加重係数を掛け、組織影響を考慮する実効線量ではさらに組織加重係数を用います。X線とγ線は発生起源で区別します。","conclusion":"正答（4）：中性子線は一般に透過力が強く、防護も異なる。","choicesExplain":"（1）— 非正答肢\n　ベータ線は電子からなる粒子線で、１価のマイナスの電荷を持っている。\n\n（2）— 非正答肢\n　放射線防護のための線量として、吸収線量に放射線加重（荷重）係数で重 み付けした等価線量を用いる。\n\n（3）— 非正答肢\n　電離放射線が物質を透過する際に、原子又は分子から電子を放出させるこ とを電離作用という。\n\n（4）◎ 公式公表正答\n　電磁波であるエックス線は、粒子線である中性子線より物質を透過する力 が強い。\n\n（5）— 非正答肢\n　エックス線とガンマ線の違いは波長によるものではない。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"電離放射線障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question07/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question07/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-08","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":8,"question":"潜水による健康障害に関する次の記述のうち、適切でないものはどれか。","options":["環境圧の変化に伴い、体内の閉鎖空間で体積の変化が生じ気圧外傷を起こ す。","寝不足、疲労、脱水及び肥満は、減圧症の発症リスクを高める要因となる。","減圧すると組織内に取り込まれた二酸化炭素が過飽和状態となり、気泡が 組織や血管内に形成され減圧症が生じる。","減圧時に肺が過膨脹となってガスが動脈系に入ると、末梢の組織で気泡に ちょう しょう よる動脈ガス塞栓症が生じる。","水温が低い環境で運動の負荷が大きいと、肺水腫が生じる可能性が高い。"],"tags":["高気圧・酸欠","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"高気圧・潜水","cluster":"物理因子","explanation":{"title":"潜水・減圧症","point":"高圧下では窒素が体内組織に多く溶け込み、急な減圧で過飽和となって気泡化し、減圧症を起こします。肺の過膨張でガスが動脈系に入る動脈ガス塞栓症とは機序を分けます。睡眠不足、疲労、脱水、肥満、寒冷、激しい運動等は発症リスクを高めます。","conclusion":"正答（3）：気泡の主成分は主として窒素。","choicesExplain":"（1）— 非正答肢\n　環境圧の変化に伴い、体内の閉鎖空間で体積の変化が生じ気圧外傷を起こ す。\n\n（2）— 非正答肢\n　寝不足、疲労、脱水及び肥満は、減圧症の発症リスクを高める要因となる。\n\n（3）◎ 公式公表正答\n　減圧すると組織内に取り込まれた二酸化炭素が過飽和状態となり、気泡が 組織や血管内に形成され減圧症が生じる。\n\n（4）— 非正答肢\n　減圧時に肺が過膨脹となってガスが動脈系に入ると、末梢の組織で気泡に ちょう しょう よる動脈ガス塞栓症が生じる。\n\n（5）— 非正答肢\n　水温が低い環境で運動の負荷が大きいと、肺水腫が生じる可能性が高い。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"高気圧作業安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000040?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question08/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question08/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-09","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":9,"question":"酸素欠乏症及び硫化水素中毒とその予防に関する次の記述のうち、適切でな いものはどれか。","options":["空気中の酸素濃度が約16％を下回ると脈拍数や呼吸数の増加が現れる。","酸素濃度が６％未満の空気を１回でも吸入すると、意識喪失のリスクがあ る。","酸素欠乏症の症状は、重度の筋作業中や疲労しているときに重症化する。","硫化水素は無色で腐卵臭があり、水には溶けにくい。","硫化水素濃度20～30ppmで嗅覚疲労、100～300ppmで嗅覚神経麻痺が起こる。 ひ"],"tags":["高気圧・酸欠","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"酸素欠乏・硫化水素","cluster":"物理因子","explanation":{"title":"酸素欠乏症・硫化水素中毒","point":"硫化水素は無色・腐卵臭の有毒ガスで、水に溶解します。低濃度では臭いを感じても、濃度上昇で嗅覚疲労・嗅神経麻痺が起こり、臭いを感じなくなるため「臭いで安全確認」は危険です。酸素濃度低下では判断力低下、呼吸・脈拍増加が生じ、6％未満は一呼吸でも意識消失・死亡の危険があります。","conclusion":"正答（4）：硫化水素は水に溶ける。","choicesExplain":"（1）— 非正答肢\n　空気中の酸素濃度が約16％を下回ると脈拍数や呼吸数の増加が現れる。\n\n（2）— 非正答肢\n　酸素濃度が６％未満の空気を１回でも吸入すると、意識喪失のリスクがあ る。\n\n（3）— 非正答肢\n　酸素欠乏症の症状は、重度の筋作業中や疲労しているときに重症化する。\n\n（4）◎ 公式公表正答\n　硫化水素は無色で腐卵臭があり、水には溶けにくい。\n\n（5）— 非正答肢\n　硫化水素濃度20～30ppmで嗅覚疲労、100～300ppmで嗅覚神経麻痺が起こる。 ひ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20250401"},{"label":"厚生労働省：酸素欠乏症等防止対策","url":"https://www.mhlw.go.jp/new-info/kobetu/roudou/gyousei/anzen/dl/040325-3a.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question09/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question09/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-10","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":10,"question":"騒音性難聴に関する次の記述のうち、適切でないものはどれか。","options":["著しい騒音にばく露される業務に長期間引き続き従事した際に発生する。","鼓膜や中耳に著変がない。","騒音作業を離れるとほとんど増悪しない。","初期の段階では、オージオグラムがc5dipの型を示す。","オージオグラムでは、骨導値より気導値に顕著な低下が見られる。"],"tags":["騒音・振動"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"騒音","cluster":"物理因子","explanation":{"title":"騒音性難聴","point":"騒音性難聴は内耳（蝸牛の有毛細胞）の障害による感音難聴です。鼓膜・中耳に著変がなく、気導と骨導の両方が低下し、伝音難聴のような大きな気骨導差は生じません。初期には4 kHz付近が落ち込むC5 dipが典型です。騒音ばく露を離れると通常は進行しにくい一方、失われた聴力は回復しにくいです。","conclusion":"正答（5）：気導・骨導とも低下する感音難聴。","choicesExplain":"（1）— 非正答肢\n　著しい騒音にばく露される業務に長期間引き続き従事した際に発生する。\n\n（2）— 非正答肢\n　鼓膜や中耳に著変がない。\n\n（3）— 非正答肢\n　騒音作業を離れるとほとんど増悪しない。\n\n（4）— 非正答肢\n　初期の段階では、オージオグラムがc5dipの型を示す。\n\n（5）◎ 公式公表正答\n　オージオグラムでは、骨導値より気導値に顕著な低下が見られる。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：騒音障害防止ガイドライン","url":"https://www.mhlw.go.jp/content/001195349.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question10/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question10/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-11","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":11,"question":"熱中症に関する次のイ～ニの記述について、適切なもののみを全て挙げたも のは（１）～（５）のうちどれか。 イ 熱中症の重症度分類において、Ⅳ度のみ症状に意識障害や中枢神経症状 が含まれる。 ロ 職場における熱中症による休業４日以上の死傷者数は、令和元年から令 和５年の５年間において、500人を下回った年はない。 ハ 代謝率レベルの高い作業を行うときのＷＢＧＴ基準値は、代謝率レベルの 低い作業より高くなる。 ニ 作業中の衣類は、暑熱環境において健康影響を受けるかどうかの要因に 含まれ、衣類の組合せに応じた着衣補正値をＷＢＧＴ値に加算する。","options":["イ ロ ハ","イ ハ","イ ニ","ロ ハ ニ","ロ ニ"],"tags":["暑熱・熱中症"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"暑熱・熱中症","cluster":"物理因子","expla oint":"一般健康診断の実施義務は原則として派遣元、特殊健康診断は有害業務を指揮する派遣先にあります。派遣元が一般健診結果について適切に医師の意見を聴くには、実際の勤務状況・職場環境を知る必要があるため、本人同意を得て派遣先に情報提供を依頼します。健康情報は目的を限定し、必要最小限とします。","conclusion":"正答（2）：派遣元が一般健診、派遣先の情報を同意の上で得て医師意見に活用。","choicesExplain":"（1）— 非正答肢\n　派遣元事業者からの依頼により派遣先事業者が派遣労働者に対して一般健 康診断を実施した場合には、派遣先事業者は当該一般健康診断の結果を把握 する。\n\n（2）◎ 公式公表正答\n　派遣元事業者は、派遣労働者の一般健康診断の結果について適切に医師か ら意見を聴くことができるよう、派遣先事業者に対し、当該派遣労働者の同 意を得た上で、勤務の状況又は職場環境に関する情報を提供するように依頼 する。\n\n（3）— 非正答肢\n　派遣元事業者から派遣先事業者に対して、一般健康診断の結果に基づく派 遣労働者の就業上の措置の実施について協力するよう要請があった場合は、 派遣先事業者は当該派遣労働者の変更を求めることができる。\n\n（4）— 非正答肢\n　派遣先事業場で派遣労働者の特殊健康診断が行われたときは、派遣先事業 者は、派遣元事業者の依頼があった場合に限り、特殊健康診断の結果の記録 の写しを送付する必要がある。\n\n（5）— 非正答肢\n　派遣先事業者は、派遣労働者の一般健康診断に関する健康情報について、 就業区分の決定に必要な場合に限り、当該労働者の同意を得ずに派遣元事業 者から提供を受けることができる。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：健康診断結果に基づく措置指針","url":"https://www.mhlw.go.jp/hourei/doc/kouji/K170417K0020.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question13/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question13/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-14","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":14,"question":"厚生労働省の「過重労働による健康障害を防止するため事業者が講ずべき措 置」に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは （１）～（５）のうちどれか。 イ 時間外・休日労働時間が１か月当たり45時間を超える労働者で、健康へ の配慮が必要と認めた者については、面接指導等の措置を講ずることが望 ましい。 ロ 面接指導等により労働者のメンタルヘルス不調が把握された場合は、面 接指導を行った医師、産業医等の助言を得ながら必要に応じ精神科医等と 連携を図りつつ対応する。 ハ 常時50人未満の労働者を使用する事業場における面接指導等については、 近隣に専門的知識を有する医師がいない等の理由により、事業者が自ら医 師を選任し、面接指導を実施することが困難な場合には、地域産業保健セ ンターの活用を図る。 ニ 過重労働による業務上の疾病を発生させたときは、労働時間の管理状況、 労働時間及び勤務の不規則性、健康診断及び面接指導の結果等について、 多角的に原因の究明を行う。","options":["イ ロ ハ ニ","イ ロ ハ","イ ロ ニ","イ ハ ニ","ロ ハ ニ"],"tags":["健康診断・健康管理","安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":0,"category":"過重労働・健康管理","cluster":"健康管理","explanation":{"title":"過重労働対策","point":"月45時間を超える時間外・休日労働は、健康への配慮が必要な者を選び面接指導等につなげる目安です。メンタルヘルス不調を把握した場合は、産業医等の助言を得て専門医と連携します。小規模事業場では地域産業保健センターを活用できます。疾病発生時は、労働時間だけでなく勤務の不規則性、健診、面接指導、業務内容等を多角的に検証します。","conclusion":"正答（1）：イ・ロ・ハ・ニの全て。","choicesExplain":"（1）◎ 公式公表正答\n　イ ロ ハ ニ\n\n（2）— 非正答肢\n　イ ロ ハ\n\n（3）— 非正答肢\n　イ ロ ニ\n\n（4）— 非正答肢\n　イ ハ ニ\n\n（5）— 非正答肢\n　ロ ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：過重労働による健康障害防止","url":"https://www.mhlw.go.jp/stf/newpage_07041.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question14/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question14/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-15","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":15,"question":"厚生労働省の「労働者の心の健康の保持増進のための指針」に関する次のイ ～ホの記述について、適切なものの数は（１）～（５）のうちどれか。 イ 心の健康づくり計画の策定、その実施体制の整備等の具体的な実施方策 や個人情報の保護に関する規程等の策定等に当たっては、衛生委員会等に おいて十分調査審議を行うことが必要である。 ロ 事業者は、業務を一時的なプロジェクト体制で実施する等、通常のライ ンによるケアが困難な業務形態にある場合には、実務において指揮命令系 統の上位にいる者等によりケアが行われる体制を整えるなど、ラインによ るケアと同等のケアが確実に実施されるようにする。 ハ 衛生管理者等は、心の健康づくり計画に基づき、産業医等の助言、指導 等を踏まえて、具体的な教育研修の企画及び実施、職場環境等の評価と改 善、心の健康に関する相談ができる雰囲気や体制づくりを行う。 ニ 事業者は、管理監督者による日常の職場管理や労働者からの意見聴取の 結果を通じ、また、ストレスチェック結果の集団ごとの分析の結果や面接 指導の結果等を活用して、職場環境等の具体的問題点を把握する。 ホ 事業者は、衛生委員会等において調査審議し、産業医等の助言を受けな がら職場復帰支援プログラムを策定し、休業の開始から通常業務への復帰 に至るまでの一連の標準的な流れを明らかにするとともに、それに対応す る職場復帰支援の手順、内容及び関係者の役割等について定める。","options":["一つ","二つ","三つ","四つ","五つ"],"tags":["健康診断・健康管理","安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"メンタルヘルス","cluster":"健康管理","explanation":{"title":"メンタルヘルス指針","point":"心の健康づくり計画、衛生委員会等での調査審議、4つのケア、職場環境改善、相談体制、職場復帰支援が一連の仕組みです。一時的プロジェクト等で通常のラインケアが難しい場合も、実質的な指揮命令者等によって同等のケアを確保します。個人結果だけでなく集団分析や職場の意見を用いて環境改善を行います。","conclusion":"正答（5）：五つ全て適切。","choicesExplain":"（1）— 非正答肢\n　一つ\n\n（2）— 非正答肢\n　二つ\n\n（3）— 非正答肢\n　三つ\n\n（4）— 非正答肢\n　四つ\n\n（5）◎ 公式公表正答\n　五つ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：職場のメンタルヘルス対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000055195_00002.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question15/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question15/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"関連改正あり","currentUpdates":["stress2028"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-16","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":16,"question":"物理的因子と、それにより障害を受ける部位との次の組合せのうち、適切で ないものはどれか。 物理的因子 障害を受ける部位","options":["騒音・・・・・・・・・・・・・耳小骨","振動・・・・・・・・・・・・・末梢神経 しょう","高気圧・・・・・・・・・・・・肺","レーザー光線・・・・・・・・・角膜","赤外線・・・・・・・・・・・・水晶体"],"tags":["騒音・振動","放射線・有害光線","高気圧・酸欠"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":0,"category":"物理因子","cluster":"物理因子","explanation":{"title":"物理的因子と障害部位","point":"騒音性難聴は蝸牛の有毛細胞障害です。振動は末梢循環・末梢神経・骨関節系、高気圧は肺や中耳・副鼻腔、レーザーは波長により眼（角膜・水晶体・網膜）、赤外線は水晶体（熱性白内障）等を障害します。","conclusion":"正答（1）：騒音が障害する主部位は耳小骨ではなく内耳。","choicesExplain":"（1）◎ 公式公表正答\n　騒音・・・・・・・・・・・・・耳小骨\n\n（2）— 非正答肢\n　振動・・・・・・・・・・・・・末梢神経 しょう\n\n（3）— 非正答肢\n　高気圧・・・・・・・・・・・・肺\n\n（4）— 非正答肢\n　レーザー光線・・・・・・・・・角膜\n\n（5）— 非正答肢\n　赤外線・・・・・・・・・・・・水晶体","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：騒音障害防止ガイドライン","url":"https://www.mhlw.go.jp/content/001195349.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question16/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question16/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-17","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":17,"question":"化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。","options":["フッ化水素の水溶液であるフッ酸は、金属の洗浄、半導体のエッチング等 に用いられ、ミストの吸入により眼、鼻、気道に粘膜刺激症状を生じ、肺炎、 肺気腫を生じることもある。","2,3,7,8-四塩化ジベンゾ-パラ-ジオキシン（TCDD）は、廃棄物の焼却の 際に副産物として発生し、ダイオキシン類の中でも最も毒性が強く、人に対 する発がん性が認められている。","ホルムアルデヒドは、接着剤や塗料の原料として用いられ、いわゆる「シ ックハウス症候群」の原因物質の一つで、粘膜刺激作用のほか、咳、上気道 せき 炎、流涙、接触皮膚炎などを生じる。","ナフタレンは、合成樹脂の原料や防虫剤、有機顔料などの用途に使用され、 人に対する発がん性が疑われている。","塩化ビニルは、合成樹脂の原料として用いられ、高濃度の急性ばく露では レイノー症状、指の骨の溶解（指端骨溶解）、肝血管肉腫などが見られる。"],"tags":["化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"化学物質・健康影響","cluster":"化学物質","explanation":{"title":"化学物質の標的臓器","point":"塩化ビニルの高濃度急性ばく露では中枢神経抑制等が問題になります。一方、レイノー現象、指端骨溶解、肝血管肉腫は長期ばく露に関連する代表的な慢性影響です。化学物質問題は「用途・急性作用・慢性作用・発がん臓器」を4点セットで整理します。","conclusion":"正答（5）：塩化ビニルのレイノー症状・指端骨溶解・肝血管肉腫は慢性ばく露。","choicesExplain":"（1）— 非正答肢\n　フッ化水素の水溶液であるフッ酸は、金属の洗浄、半導体のエッチング等 に用いられ、ミストの吸入により眼、鼻、気道に粘膜刺激症状を生じ、肺炎、 肺気腫を生じることもある。\n\n（2）— 非正答肢\n　2,3,7,8-四塩化ジベンゾ-パラ-ジオキシン（TCDD）は、廃棄物の焼却の 際に副産物として発生し、ダイオキシン類の中でも最も毒性が強く、人に対 する発がん性が認められている。\n\n（3）— 非正答肢\n　ホルムアルデヒドは、接着剤や塗料の原料として用いられ、いわゆる「シ ックハウス症候群」の原因物質の一つで、粘膜刺激作用のほか、咳、上気道 せき 炎、流涙、接触皮膚炎などを生じる。\n\n（4）— 非正答肢\n　ナフタレンは、合成樹脂の原料や防虫剤、有機顔料などの用途に使用され、 人に対する発がん性が疑われている。\n\n（5）◎ 公式公表正答\n　塩化ビニルは、合成樹脂の原料として用いられ、高濃度の急性ばく露では レイノー症状、指の骨の溶解（指端骨溶解）、肝血管肉腫などが見られる。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場のあんぜんサイト：SDS制度","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question17/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question17/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-18","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":18,"question":"検知管に関する次の記述のうち、誤っているものはどれか。","options":["共存ガスによる妨害は、その種類、濃度により一様ではなく、測定値にプ ラス又はマイナスの影響を及ぼす場合がある。","検知管の測定値は温度によって影響を受けるので、変色層の長さから濃度 を読み取った後、温度補正を行う。","検知管の変色層が斜めに現れたときは、変色した部分の最先端を変色層の 長さとし、濃度を決定する。","作業環境測定のＢ測定において３本の検知管を用いて測定を行うとき、３ 本目の検知管の測定中に最初の測定の開始から10分を経過した場合でも、三 つの測定値の算術平均値をＢ測定値とする。","有機溶剤混合物について、２年以上の期間、作業環境測定結果の評価で第 一管理区分が継続した単位作業場所については、所轄労働基準監督署長の許 可を受けた上で、定められた方法により当該有機溶剤の濃度の測定に検知管 を用いることができる。"],"tags":["作業環境測定","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"作業環境測定","cluster":"測定・換気","explanation":{"title":"検知管の読み方","point":"検知管は変色層の長さを濃度目盛で読み、温度補正や共存ガスの影響を考慮します。境界が斜めなら、最長部と最短部の中間を読むなど、取扱説明書に従って代表値を取ります。最先端だけを採ると過大評価しやすくなります。B測定で短時間に複数本を用いる場合の扱いは、測定基準と使用方法を確認します。","conclusion":"正答（3）：斜めの変色層は最先端だけで読まない。","choicesExplain":"（1）— 非正答肢\n　共存ガスによる妨害は、その種類、濃度により一様ではなく、測定値にプ ラス又はマイナスの影響を及ぼす場合がある。\n\n（2）— 非正答肢\n　検知管の測定値は温度によって影響を受けるので、変色層の長さから濃度 を読み取った後、温度補正を行う。\n\n（3）◎ 公式公表正答\n　検知管の変色層が斜めに現れたときは、変色した部分の最先端を変色層の 長さとし、濃度を決定する。\n\n（4）— 非正答肢\n　作業環境測定のＢ測定において３本の検知管を用いて測定を行うとき、３ 本目の検知管の測定中に最初の測定の開始から10分を経過した場合でも、三 つの測定値の算術平均値をＢ測定値とする。\n\n（5）— 非正答肢\n　有機溶剤混合物について、２年以上の期間、作業環境測定結果の評価で第 一管理区分が継続した単位作業場所については、所轄労働基準監督署長の許 可を受けた上で、定められた方法により当該有機溶剤の濃度の測定に検知管 を用いることができる。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question18/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question18/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"関連改正あり","currentUpdates":["measure2026"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-19","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":19,"question":"作業環境測定に関する次の記述のうち、適切でないものはどれか。","options":["Ｂ測定を行う場合には、最大濃度となると予測された点で測定を複数回行 い、得られた測定値の平均値をＢ測定値とする。","測定値が管理濃度の10分の１に満たない測定点がある場合には、管理濃度 の10分の１を当該測定点における測定値とみなして幾何平均値と幾何標準偏 差を計算する。","測定値が定量下限の値に満たない測定点がある場合には、当該定量下限の 値を当該測定点における測定値とみなして、管理区分の決定に用いる。","１日のみＡ測定を行った場合に、その結果から当該単位作業場所の評価を 行う際は、評価に用いる幾何平均値としては、測定日の幾何平均値をそのま ま使用する。","１日のみＡ測定を行った場合に、その結果から当該単位作業場所の評価を 行う際は、日間変動に相当する値を考慮して評価値を求める。"],"tags":["作業環境測定"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":0,"category":"作業環境測定","cluster":"測定・換気","explanation":{"title":"作業環境測定の評価","point":"B測定は、作業者のばく露が最も高くなると予測される時間・位置で行う測定です。複数測定した場合に平均してピークを薄めるのは目的に反し、通常は最大値を重視します。A測定は単位作業場所の平均的な分布を評価し、幾何平均・幾何標準偏差と日間変動を用いて評価値を求めます。定量下限未満や管理濃度の1/10未満の扱いにも規定があります。","conclusion":"正答（1）：B測定を複数回行った場合、単純平均をB測定値とはしない。","choicesExplain":"（1）◎ 公式公表正答\n　Ｂ測定を行う場合には、最大濃度となると予測された点で測定を複数回行 い、得られた測定値の平均値をＢ測定値とする。\n\n（2）— 非正答肢\n　測定値が管理濃度の10分の１に満たない測定点がある場合には、管理濃度 の10分の１を当該測定点における測定値とみなして幾何平均値と幾何標準偏 差を計算する。\n\n（3）— 非正答肢\n　測定値が定量下限の値に満たない測定点がある場合には、当該定量下限の 値を当該測定点における測定値とみなして、管理区分の決定に用いる。\n\n（4）— 非正答肢\n　１日のみＡ測定を行った場合に、その結果から当該単位作業場所の評価を 行う際は、評価に用いる幾何平均値としては、測定日の幾何平均値をそのま ま使用する。\n\n（5）— 非正答肢\n　１日のみＡ測定を行った場合に、その結果から当該単位作業場所の評価を 行う際は、日間変動に相当する値を考慮して評価値を求める。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question19/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question19/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"関連改正あり","currentUpdates":["measure2026"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-20","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":20,"question":"局所排気装置等に関する次の記述のうち、適切でないものはどれか。","options":["囲い式フードとは、発散源を囲うことにより有害物質がフード外へ流出す ることを防ぐように設けられたフードのことで、グローブボックス型やドラ フトチェンバ型などがある。","レシーバ式フードとは、発散源から一定方向の気流があって、有害物質が その気流に乗って飛散するときに気流の方向に沿って粉じん、ガス、蒸気等 を捕集するように設けたフードのことをいう。","外付け式フードで制御風速を保ちながら排風量を少なくするには、フード の開口部の周囲にフランジを付ける方法がある。","外付け式フードの制御風速は、フードの開口面から捕捉点までの距離が長 いと大きな値が必要である。","密閉式プッシュプル型換気装置は、天井、壁及び床で囲まれているブース を有するものをいい、空気の供給口と吸引口以外は全て密閉されている。"],"tags":["換気・局所排気","粉じん・石綿・じん肺","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"換気・局所排気","cluster":"測定・換気","explanation":{"title":"局所排気装置のフード","point":"外付け式フードでは、発散源とフードの距離が離れるほど吸引気流が急速に弱まり、同じ捕捉効果を得るため必要排風量が大きくなります。フランジは周囲からの無駄な空気流入を減らし、必要排風量を抑えます。制御風速はフード型式・有害物の状態等ごとに規定される性能指標で、「距離が長いから法定値自体を大きくする」とは表現しません。","conclusion":"正答（4）：距離で増えるのは必要排風量であり、法定制御風速の値そのものではない。","choicesExplain":"（1）— 非正答肢\n　囲い式フードとは、発散源を囲うことにより有害物質がフード外へ流出す ることを防ぐように設けられたフードのことで、グローブボックス型やドラ フトチェンバ型などがある。\n\n（2）— 非正答肢\n　レシーバ式フードとは、発散源から一定方向の気流があって、有害物質が その気流に乗って飛散するときに気流の方向に沿って粉じん、ガス、蒸気等 を捕集するように設けたフードのことをいう。\n\n（3）— 非正答肢\n　外付け式フードで制御風速を保ちながら排風量を少なくするには、フード の開口部の周囲にフランジを付ける方法がある。\n\n（4）◎ 公式公表正答\n　外付け式フードの制御風速は、フードの開口面から捕捉点までの距離が長 いと大きな値が必要である。\n\n（5）— 非正答肢\n　密閉式プッシュプル型換気装置は、天井、壁及び床で囲まれているブース を有するものをいい、空気の供給口と吸引口以外は全て密閉されている。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安 l":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question21/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question21/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-22","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":22,"question":"厚生労働省の「化学物質による健康障害防止のための濃度の基準の適用等に 関する技術上の指針」に関する次の記述のうち、誤っているものはどれか。","options":["濃度基準値が設定されている物質について、リスクの見積りの過程におい て、労働者がばく露される程度が濃度基準値を超えるおそれがある屋内作業 を把握した場合、確認測定を実施する。","確認測定では、労働者の呼吸域における物質の濃度を測定する。","確認測定は、労働者のばく露が最も高いと想定される均等ばく露作業にお ける、最も高いばく露を受ける労働者を選定して行う。","「労働者の呼吸域」とは、労働者が使用する呼吸用保護具の外側であって、 両耳を結んだ直線の中央を中心とした、半径１ｍの、顔の前方に広がった半 球の内側をいう。","この指針の対象となる物質であっても、人に対する発がん性が明確な物質 の場合は、「八時間濃度基準値」及び「短時間濃度基準値」のいずれも設定 されていない。"],"tags":["保護具","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"化学物質・自律的管理","cluster":"化学物質","explanation":{"title":"濃度基準値と確認測定","point":"確認測定は、濃度基準値設定物質について労働者のばく露が基準以下であることを確認する個人ばく露測定です。試料採取口は作業者の呼吸域に置きます。技術上の指針では、呼吸域は鼻又は口を中心とする半径30 cm程度の範囲として扱われ、1 mでは広すぎます。","conclusion":"正答（4）：呼吸域は鼻・口を中心とする半径約30 cmの半球状範囲。","choicesExplain":"（1）— 非正答肢\n　濃度基準値が設定されている物質について、リスクの見積りの過程におい て、労働者がばく露される程度が濃度基準値を超えるおそれがある屋内作業 を把握した場合、確認測定を実施する。\n\n（2）— 非正答肢\n　確認測定では、労働者の呼吸域における物質の濃度を測定する。\n\n（3）— 非正答肢\n　確認測定は、労働者のばく露が最も高いと想定される均等ばく露作業にお ける、最も高いばく露を受ける労働者を選定して行う。\n\n（4）◎ 公式公表正答\n　「労働者の呼吸域」とは、労働者が使用する呼吸用保護具の外側であって、 両耳を結んだ直線の中央を中心とした、半径１ｍの、顔の前方に広がった半 球の内側をいう。\n\n（5）— 非正答肢\n　この指針の対象となる物質であっても、人に対する発がん性が明確な物質 の場合は、「八時間濃度基準値」及び「短時間濃度基準値」のいずれも設定 されていない。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー /health/2025/gen-question24/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question24/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-25","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":25,"question":"呼吸用保護具の選択に関する次の記述のうち、適切でないものはどれか。","options":["濃度基準値が設定された化学物質に係る呼吸用保護具の要求防護係数は、 当該化学物質の濃度の測定結果から得られた最大値を、当該化学物質の濃度 基準値の値で除した数値である。","指定防護係数とは、訓練された着用者が、正常に機能する呼吸用保護具を 正しく着用した場合に、少なくとも得られるであろうと期待される防護係数 のことである。","指定防護係数は、呼吸用保護具の種類に応じて日本産業規格において定め られている。","指定防護係数が高いほど、呼吸用保護具内への有害物質の漏れ込みが少な いことを示している。","防毒マスクの指定防護係数の値は、面体の形状が同じであっても吸収缶の 種類によって異なる。"],"tags":["保護具","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"保護具","cluster":"化学物質","explanation":{"title":"呼吸用保護具の防護係数","point":"指定防護係数（APF）は、呼吸用保護具の種類、面体の形式（半面形・全面形）、送気・電動ファン等の方式によって定められます。吸収缶は対象ガスに適合する種類・破過時間を選びますが、同じ面体形式で吸収缶の物質別種類が変わること自体をAPFの差とするのは不適切です。実際の防護はフィット、使用時間、濃度、酸素濃度にも左右されます。","conclusion":"正答（5）：同じ面体なら吸収缶の種類で指定防護係数が決まるわけではない。","choicesExplain":"（1）— 非正答肢\n　濃度基準値が設定された化学物質に係る呼吸用保護具の要求防護係数は、 当該化学物質の濃度の測定結果から得られた最大値を、当該化学物質の濃度 基準値の値で除した数値である。\n\n（2）— 非正答肢\n　指定防護係数とは、訓練された着用者が、正常に機能する呼吸用保護具を 正しく着用した場合に、少なくとも得られるであろうと期待される防護係数 のことである。\n\n（3）— 非正答肢\n　指定防護係数は、呼吸用保護具の種類に応じて日本産業規格において定め られている。\n\n（4）— 非正答肢\n　指定防護係数が高いほど、呼吸用保護具内への有害物質の漏れ込みが少な いことを示している。\n\n（5）◎ 公式公表正答\n　防毒マスクの指定防護係数の値は、面体の形状が同じであっても吸収缶の 種類によって異なる。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：呼吸用保護具の選択・使用","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74ab7765&dataType=0&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question25/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question25/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"関連改正あり","currentUpdates":["chem2026"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-26","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":26,"question":"危険又は有害な業務で、労働者を就かせるときに当該業務に関する安全又は衛生のための特別の教育（以下「特別教育」という。）を行わなければならない業務と、当該特別教育において教育を行う科目に含まれる範囲に関する次のイ～ニの組合せについて、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\n\n【特別教育を行わなければならない危険又は有害な業務】｜【当該特別教育において教育を行う科目に含まれる範囲】\nイ　ガンマ線照射装置を用いて行う透過写真の撮影の業務｜放射性物質によって汚染された設備の汚染の除去の方法\nロ　再圧室を操作する業務｜人工蘇生法\nハ　廃棄物の焼却施設に設置された廃棄物焼却炉、集じん機等の設備の保守点検の業務｜洗身及び身体等の清潔の保持の方法\nニ　チェーンソーを用いて行う立木の伐木、かかり木の処理又は造材の業務｜振動障害の予防措置","options":["イ ロ ハ ニ","イ ロ ハ","イ ロ ニ","イ ハ ニ","ロ ハ ニ"],"tags":["騒音・振動","放射線・有害光線","高気圧・酸欠","安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"安全衛生教育","cluster":"管理・マネジメント","explanation":{"title":"特別教育","point":"特別教育は危険・有害業務に就かせる前に、業務ごとに定められた学科・実技を実施します。再圧室操作、高圧室内作業、焼却設備の保守、チェーンソー等はそれぞれ固有の教育項目があります。透過写真撮影用ガンマ線照射装置の業務では放射線防護、装置、作業方法、関係法令等が中心で、選択肢の「汚染除去」等の組合せが法定科目と合いません。","conclusion":"正答（5）：透過写真撮影業務の教育内容の組合せが不適切。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ ニ\n\n（2）— 非正答肢\n　イ ロ ハ\n\n（3）— 非正答肢\n　イ ロ ニ\n\n（4）— 非正答肢\n　イ ハ ニ\n\n（5）◎ 公式公表正答\n　ロ ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question26/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question26/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-27","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":27,"question":"労働災害の調査及び原因の分析に関する次のイ～ニの記述について、正しい もののみを全て挙げたものは（１）～（５）のうちどれか。 イ ある原因と疾病との関係の仮説に基づいて、疾病のある群とない群に分 け、各々の群で原因と考えられる事象の相違があるかどうかを調べる調査 方法は、コホート研究といわれる。 ロ 前向き調査は、後ろ向き調査に比べ、結果が出るまでの観察期間が長期 にわたり、費用や労力が大きい。 ハ 前向き調査の結果、算出される相対危険度（リスク比）は、ばく露群の 罹患率(Ie)と非ばく露群の罹患率(Iu)との比Ie/Iu を示し、この値が大きい り ほど因果関係が存在する可能性が高い。 ニ 横断研究では、ばく露と疾病との因果関係は証明できない。","options":["イ ロ","イ ニ","イ ロ ハ","ロ ハ ニ","ハ ニ"],"tags":["疫学・統計"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"疫学・統計","cluster":"疫学・統計","explanation":{"title":"疫学研究デザイン","point":"コホート研究は、ばく露群と非ばく露群を追跡して発症率を比較し、相対危険度を求めやすい研究です。症例対照研究は、患者（症例）と非患者（対照）から過去のばく露を遡り、オッズ比を用います。横断研究は一時点のばく露と疾病を同時に見るため、時間的前後関係が分かりにくいのが弱点です。","conclusion":"正答（4）：疾病の有無で群を選び過去のばく露を調べるのは症例対照研究。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ニ\n\n（3）— 非正答肢\n　イ ロ ハ\n\n（4）◎ 公式公表正答\n　ロ ハ ニ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：職場の健康管理関係資料","url":"https://www.mhlw.go.jp/hourei/doc/kouji/K170417K0020.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question27/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question27/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-28","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["ツールボックスミーティングは、作業開始前や作業の切替え時に、監督者 を中心に、短時間でその日の作業の範囲、段取り、分担、安全衛生のポイン ト等を現場で話し合うものである。","ＫＹ活動は、現場でその日の作業を開始する前に、作業の状況を描いたイ ラストシート等を用いて、危険要因やそれに対する対策を話し合って決め、 その対策を一人ひとりが実践するものである。","効果の上がる安全管理を行うには、事業場トップから各級の管理者、監督 者に至るまで、それぞれの役割、責任、権限を明らかにして安全管理のため の活動に取り組むことが必要である。","４Ｓのうちの整理とは、必要なときに必要な物をすぐ取り出せるように、 わかりやすく安全な状態で配置、収納することをいう。","安全管理体制は、業種、規模等に応じて、法令で義務付けられている事項 を満たした上で、その事業場の実態に即した安全活動を実施することができ る体制にすることが必要である。"],"tags":["安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"安全衛生管理","cluster":"管理・マネジメント","explanation":{"title":"安全衛生活動と4S","point":"4Sは整理・整頓・清掃・清潔です。整理は必要品と不要品を分け、不要品を処分すること。整頓は必要品を使いやすく戻しやすい場所に表示して配置することです。TBMは作業前の短時間打合せ、KYは潜在危険を抽出して対策・行動目標を決める活動です。","conclusion":"正答（4）：整理は不要物を区分し処分すること。","choicesExplain":"（1）— 非正答肢\n　ツールボックスミーティングは、作業開始前や作業の切替え時に、監督者 を中心に、短時間でその日の作業の範囲、段取り、分担、安全衛生のポイン ト等を現場で話し合うものである。\n\n（2）— 非正答肢\n　ＫＹ活動は、現場でその日の作業を開始する前に、作業の状況を描いたイ ラストシート等を用いて、危険要因やそれに対する対策を話し合って決め、 その対策を一人ひとりが実践するものである。\n\n（3）— 非正答肢\n　効果の上がる安全管理を行うには、事業場トップから各級の管理者、監督 者に至るまで、それぞれの役割、責任、権限を明らかにして安全管理のため の活動に取り組むことが必要である。\n\n（4）◎ 公式公表正答\n　４Ｓのうちの整理とは、必要なときに必要な物をすぐ取り出せるように、 わかりやすく安全な状態で配置、収納することをいう。\n\n（5）— 非正答肢\n　安全管理体制は、業種、規模等に応じて、法令で義務付けられている事項 を満たした上で、その事業場の実態に即した安全活動を実施することができ る体制にすることが必要である。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場のあんぜんサイト","url":"https://anzeninfo.mhlw.go.jp/"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question28/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question28/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-29","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」に基づく 労働安全衛生マネジメントシステムの運用に関する次のイ～ニの記述について、 適切でないものの組合せは（１）～（５）のうちどれか。 イ 労働安全衛生マネジメントシステムに従って行う措置は、建設業の場合 には、建設現場を一の単位として実施することが基本である。 ロ 計画―実施―評価－改善というサイクルを回すために、日常的な点検・ 改善、システム監査及び事業者による労働安全衛生マネジメントシステム の全般的な見直しという三つの評価・改善を行う。 ハ 安全衛生目標は、事業場として一定期間に達成すべき到達点を明らかに するものであるが、併せて、これを基にして部署ごとの目標も設定する。 ニ 労働災害や事故が発生した場合に、その原因の調査及び問題点の把握を 行う際には、背景要因ではなく、直接の原因の解明を行うことが重要であ る。","options":["イ ロ","イ ハ","イ ニ","ロ ハ","ロ ニ"],"tags":["安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"OSHMS","cluster":"管理・マネジメント","explanation":{"title":"労働安全衛生マネジメントシステム","point":"OSHMSは、方針→計画→実施→評価→改善のPDCAを回し、危険・有害要因を継続的に低減する仕組みです。災害調査では直接原因だけでなく、管理体制・教育・手順・設備保全等の背景要因まで掘り下げます。建設業は本店・支店・作業所等の関係を踏まえ、組織として整合的に運用します。","conclusion":"正答（3）：建設業では現場を完全に独立した単位としてのみ扱う説明が不適切。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ハ\n\n（3）◎ 公式公表正答\n　イ ニ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ロ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：OSHMS","url":"https://www.mhlw.go.jp/stf/newpage_05821.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question29/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question29/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2025-30","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":30,"question":"化学物質のリスクアセスメントにおけるリスクの見積りの方法に関する次の 記述のうち、適切でないものはどれか。","options":["マトリクス法は、危険又は健康障害の発生可能性とその重篤度をそれぞれ 縦軸と横軸とした表に、あらかじめ発生可能性と重篤度に応じたリスクを割 り付けておき、発生可能性に該当する行を選び、次に見積り対象となる危険 又は健康障害の重篤度に該当する列を選ぶことにより、リスクを見積もる方 法である。","数値化法は、危険又は健康障害の発生可能性とその重篤度を一定の尺度に よりそれぞれ数値化し、それらを数値演算（足し算、掛け算等）してリスク を見積もる方法である。","枝分かれ図を用いた方法は、危険又は健康障害の発生可能性とその重篤度 について、危険性への遭遇の頻度、回避可能性等をステップごとに分岐して いくことにより、リスクを見積もる方法である。","コントロール・バンディングは、化学物質を取り扱う作業ごとに「化学物 質の有害性」、「揮発性・飛散性」及び「ばく露量」の三つの要素の情報か ら、リスクの程度を３段階にランク分けしてリスクを見積もる方法である。","管理濃度が定められている物質についての気中濃度等の測定による方法は、 作業環境測定により測定した当該物質の第一評価値を当該物質の管理濃度と 比較する方法である。"],"tags":["作業環境測定","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"リスクアセスメント","cluster":"化学物質","explanation":{"title":"化学物質リスクアセスメント手法","point":"コントロール・バンディングは、有害性区分、使用量、揮発性又は粉じんの飛散性等を組み合わせ、推奨される管理手段（一般換気、局排、密閉等）を導く簡易手法です。実測値がない初期スクリーニングに便利ですが、特殊な作業や高毒性物質では詳細評価が必要です。「ばく露量を3段階に分類するだけ」の手法ではありません。","conclusion":"正答（4）：コントロール・バンディングの説明が不適切。","choicesExplain":"（1）— 非正答肢\n　マトリクス法は、危険又は健康障害の発生可能性とその重篤度をそれぞれ 縦軸と横軸とした表に、あらかじめ発生可能性と重篤度に応じたリスクを割 り付けておき、発生可能性に該当する行を選び、次に見積り対象となる危険 又は健康障害の重篤度に該当する列を選ぶことにより、リスクを見積もる方 法である。\n\n（2）— 非正答肢\n　数値化法は、危険又は健康障害の発生可能性とその重篤度を一定の尺度に よりそれぞれ数値化し、それらを数値演算（足し算、掛け算等）してリスク を見積もる方法である。\n\n（3）— 非正答肢\n　枝分かれ図を用いた方法は、危険又は健康障害の発生可能性とその重篤度 について、危険性への遭遇の頻度、回避可能性等をステップごとに分岐して いくことにより、リスクを見積もる方法である。\n\n（4）◎ 公式公表正答\n　コントロール・バンディングは、化学物質を取り扱う作業ごとに「化学物 質の有害性」、「揮発性・飛散性」及び「ばく露量」の三つの要素の情報か ら、リスクの程度を３段階にランク分けしてリスクを見積もる方法である。\n\n（5）— 非正答肢\n　管理濃度が定められている物質についての気中濃度等の測定による方法は、 作業環境測定により測定した当該物質の第一評価値を当該物質の管理濃度と 比較する方法である。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：化学物質リスクアセスメント指針","url":"https://www.mhlw.go.jp/content/11300000/001091557.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/gen-question30/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question30/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"関連改正あり","currentUpdates":["chem2026"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"question":"常時使用する労働者2,000人の事業場で、硝酸取扱業務に常時20人を従事させている（他の有害業務なし、試験研究ではない、衛生管理者の特例なし）。次のイ～ホのうち、法令上正しいものの組合せはどれか。\nイ 産業医を2人以上選任\nロ 専属産業医を選任\nハ 衛生管理者を5人以上選任\nニ 衛生管理者のうち1人を衛生工学衛生管理者免許者から選任\nホ 特定化学物質作業主任者を選任","options":["イ・ハ","イ・ハ・ニ","ロ・ニ・ホ","ロ・ホ","ニ・ホ"],"category":"安全衛生管理体制","cluster":"管理・マネジメント","id":"law-2025-01","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":1,"correctIndex":3,"explanation":{"title":"安全衛生管理体制","point":"常時2,000人では専属産業医が必要ですが、産業医2人以上が必要なのは常時3,000人を超える規模です。衛生管理者は2,000人規模では4人であり5人ではありません。衛生工学衛生管理者を含める要件は、一定の有害業務従事者数等により判断します。本問の硝酸取扱いは特定化学物質作業主任者の選任対象です。","conclusion":"正答（4）：ロ・ホ。","choicesExplain":"（1）— 非正答肢\n　イ・ハ\n\n（2）— 非正答肢\n　イ・ハ・ニ\n\n（3）— 非正答肢\n　ロ・ニ・ホ\n\n（4）◎ 公式公表正答\n　ロ・ホ\n\n（5）— 非正答肢\n　ニ・ホ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時 全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20250401"},{"label":"労働安全衛生法施行令（e-Gov）","url":"https://laws.e-gov.go.jp/law/347CO0000000318?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question02/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question02/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"リスクアセスメント対象物の管理に関する次の記述のうち、誤っているものはどれか。","options":["RA対象物を製造・取り扱う事業場ごとに化学物質管理者を選任する。","RAの記録は次回RAまで保存し、次回が3年以内でも起算日から3年間保存する。","がん原性物質に係る健康障害防止措置の実施状況は、1年を超えない期間ごとに記録する。","濃度基準を超えてばく露したおそれがある場合の健康診断を実施し、その結果報告書を所轄労働基準監督署長へ提出する。","RA結果等は掲示・備付け、書面交付、電子的方法等で対象業務従事者に周知する。"],"category":"化学物質・自律的管理","cluster":"化学物質","id":"law-2025-03","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":3,"correctIndex":3,"explanation":{"title":"リスクアセスメント対象物","point":"RA対象物を製造・取扱う事業場では化学物質管理者を選任し、RA記録・周知を行います。濃度基準値超過のおそれがある場合は、速やかに医師又は歯科医師が必要と認める項目の健康診断を行いますが、その結果報告書を所轄署長へ提出する一般的義務は規定されていません。がん原性物質の作業記録等は長期保存規定もあるため、記録の種類ごとに期間を確認します。","conclusion":"正答（4）：健康診断結果報告書の監督署提出まで一律に義務づける記述が誤り。","choicesExplain":"（1）— 非正答肢\n　RA対象物を製造・取り扱う事業場ごとに化学物質管理者を選任する。\n\n（2）— 非正答肢\n　RAの記録は次回RAまで保存し、次回が3年以内でも起算日から3年間保存する。\n\n（3）— 非正答肢\n　がん原性物質に係る健康障害防止措置の実施状況は、1年を超えない期間ごとに記録する。\n\n（4）◎ 公式公表正答\n　濃度基準を超えてばく露したおそれがある場合の健康診断を実施し、その結果報告書を所轄労働基準監督署長へ提出する。\n\n（5）— 非正答肢\n　RA結果等は掲示・備付け、書面交付、電子的方法等で対象業務従事者に周知する。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載 別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20250401"},{"label":"厚生労働省：作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question04/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question04/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"関連改正あり","currentUpdates":["measure2026"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"面接指導・ストレスチェック等に関する次の記述のうち、正しいものはどれか。","options":["時間外・休日労働が月80時間超で疲労蓄積があり申出た労働者には、医師による健康診断を行う。","健診結果に基づく産業医の意見に健康情報が含まれる場合、事業者への提供には本人同意が必須である。","人事異動の権限を有する監督者でも医師等の資格があれば、その労働者のストレスチェック実施事務に従事できる。","ストレスチェック後の医師面接では、検査項目、勤務状況、心理的負担、その他の心身の状況を確認する。","常時50人以上の事業者は、各労働者のストレスチェック個人結果を所轄労働基準監督署長へ提出する。"],"category":"面接指導・ストレスチェック","cluster":"健康管理","id":"law-2025-05","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":5,"correctIndex":3,"explanation":{"title":"健康保持増進・ストレスチェック","point":"長時間労働者への法定措置は「健康診断」ではなく医師による面接指導です。産業医が事業者に就業上の意見を述べることは法定の職務で、必要な健康情報を適切に扱う限り、本人同意を必須とする規定ではありません。ストレスチェックの実施者には、人事権を持つ監督者は医師等であってもなれません。面接指導では勤務状況、心理的負担、心身の状況等を確認します。個人結果は監督署に提出せず、実施状況を報告します。","conclusion":"正答（4）。","choicesExplain":"（1）— 非正答肢\n　時間外・休日労働が月80時間超で疲労蓄積があり申出た労働者には、医師による健康診断を行う。\n\n（2）— 非正答肢\n　健診結果に基づく産業医の意見に健康情報が含まれる場合、事業者への提供には本人同意が必須である。\n\n（3）— 非正答肢\n　人事異動の権限を有する監督者でも医師等の資格があれば、その労働者のストレスチェック実施事務に従事できる。\n\n（4）◎ 公式公表正答\n　ストレスチェック後の医師面接では、検査項目、勤務状況、心理的負担、その他の心身の状況を確認する。\n\n（5）— 非正答肢\n　常時50人以上の事業者は、各労働者のストレスチェック個人結果を所轄労働基準監督署長へ提出する。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20250401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question05/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question05/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"関連改正あり","currentUpdates":["stress2028"],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"次の業務のうち、作業従事者本人が都道府県労働局長の免許を受ける必要があるものはどれか。\nイ 高圧室内作業\nロ 工業用エックス線装置の使用\nハ アーク溶接\nニ 潜水器を用いる潜水業務（水深10 m未満）","options":["イ・ロ・ハ","イ・ロ","ロ・ニ","ハ・ニ","ニのみ"],"category":"就業制限・免許","cluster":"安全衛生教育","id":"law-2025-06","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":6,"correctIndex":4,"explanation":{"title":"就業制限業務と免許","point":"潜水器を用いて給気を受け水中で行う潜水業務は、水深にかかわらず潜水士免許が必要です。圧気工法の作業室内作業者全員に免許が必要なわけではなく、高圧室内作業主任者等の選任が別にあります。工業用X線装置はエックス線作業主任者、アーク溶接は特別教育であり、選択肢の「その業務に就く者全員に都道府県労働局長免許」とは異なります。","conclusion":"正答（5）：ニのみ。","choicesExplain":"（1）— 非正答肢\n　イ・ロ・ハ\n\n（2）— 非正答肢\n　イ・ロ\n\n（3）— 非正答肢\n　ロ・ニ\n\n（4）— 非正答肢\n　ハ・ニ\n\n（5）◎ 公式公表正答\n　ニのみ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20250401"},{"label":"労働安全衛生法施行令（e-Gov）","url":"https://laws.e-gov.go.jp/law/347CO0000000318?oc tion08/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"有機溶剤中毒予防規則に関するイ～ニのうち、正しいもののみを挙げた組合せはどれか。\nイ 通風不十分な屋内で第三種有機溶剤による払拭作業を行う場合も、所定の換気設備等が必要となる。\nロ 屋内で第二種有機溶剤を密閉式でない囲い式フードにより排気する場合、所定の制御風速を満たす必要がある。\nハ 地下室で第一種有機溶剤を外付け式フードで排気する場合は、必ず呼吸用保護具も併用する。\nニ 以前有機溶剤を入れていたタンク内部作業では、作業開始前にタンク容積以上の空気を送排気すれば足りる。","options":["イ・ロ","イ・ロ・ニ","イ・ハ・ニ","ロ・ハ","ハ・ニ"],"category":"有機溶剤","cluster":"化学物質","id":"law-2025-09","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":9,"correctIndex":0,"explanation":{"title":"有機溶剤中毒予防規則","point":"通風不十分な屋内で第三種有機溶剤を用いる払拭業務には、密閉、局排、プッシュプル又は全体換気を設けます。囲い式フードの制御風速0.4 m/sも規定に合います。地下室で第一種有機溶剤を扱って外付け局排が有効に機能している場合、常に防毒マスクを追加義務とする記述は不適切です。タンク内の換気は容積1回分だけでは不十分で、規則に定める換気量を確保します。","conclusion":"正答（1）：イ・ロ。","choicesExplain":"（1）◎ 公式公表正答\n　イ・ロ\n\n（2）— 非正答肢\n　イ・ロ・ニ\n\n（3）— 非正答肢\n　イ・ハ・ニ\n\n（4）— 非正答肢\n　ロ・ハ\n\n（5）— 非正答肢\n　ハ・ニ","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question09/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question09/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"特定化学物質障害予防規則に関する次の記述のうち、法令違反となるものはどれか。","options":["所定条件を満たすとして、特別有機溶剤等業務の特殊健康診断を6か月以内ごとから1年以内ごとへ一律に緩和した。","一時的な管理第二類物質の粉じん作業で、十分な湿潤化により発散を防止して局排等を設けなかった。","シアン化ナトリウムを含む排液の処理に、物質特性に適した所定の処理方式を採用した。","特化物を扱う建屋の避難設備として、所定の直接階段と非常用の避難設備を設けた。","特化物の運搬容器に名称・人体への作用・貯蔵上の注意等、法令所定事項を表示した。"],"category":"特定化学物質","cluster":"化学物質","id":"law-2025-10","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":10,"correctIndex":0,"explanation":{"title":"特定化学物質障害予防規則","point":"特殊健康診断の頻度緩和は、対象物質・作業場・健康診断結果・作業方法の安定等の厳格な要件を満たす場合に限られます。特別有機溶剤業務について、提示条件だけで一律に6か月ごとを1年ごとにすることはできません。他の選択肢は、臨時作業の湿潤化、シアン排液の処理方式、避難経路、運搬容器の表示について規則上許容される内容です。","conclusion":"正答（1）：健康診断頻度を1年ごとに緩和した措置が違反。","choicesExplain":"（1）◎ 公式公表正答\n　所定条件を満たすとして、特別有機溶剤等業務の特殊健康診断を6か月以内ごとから1年以内ごとへ一律に緩和した。\n\n（2）— 非正答肢\n　一時的な管理第二類物質の粉じん作業で、十分な湿潤化により発散を防止して局排等を設けなかった。\n\n（3）— 非正答肢\n　シアン化ナトリウムを含む排液の処理に、物質特性に適した所定の処理方式を採用した。\n\n（4）— 非正答肢\n　特化物を扱う建屋の避難設備として、所定の直接階段と非常用の避難設備を設けた。\n\n（5）— 非正答肢\n　特化物の運搬容器に名称・人体への作用・貯蔵上の注意等、法令所定事項を表示した。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question10/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question10/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"高圧室内作業に関する作業計画に示す事項として、適切でないものはどれか。","options":["送気する気体の組成","加圧開始から減圧開始までの時間","作業時間中の時間加重平均圧力","加圧・減圧の速度","減圧停止時の圧力と停止時間"],"category":"高気圧作業","cluster":"物理因子","id":"law-2025-11","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":11,"correctIndex":2,"explanation":{"title":"高気圧作業の計画","point":"高圧室内業務・潜水業務の計画には、作業方法、送気・排気、減圧、設備、救急措置等の事項を定めます。選択肢中の「高圧室内作業時の圧力を常に記録する」等は必要ですが、「作業計画に時間加重平均の圧力を定める」とする記述は法令上の所定事項ではありません。","conclusion":"正答（3）。","choicesExplain":"（1）— 非正答肢\n　送気する気体の組成\n\n（2）— 非正答肢\n　加圧開始から減圧開始までの時間\n\n（3）◎ 公式公表正答\n　作業時間中の時間加重平均圧力\n\n（4）— 非正答肢\n　加圧・減圧の速度\n\n（5）— 非正答肢\n　減圧停止時の圧力と停止時間","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"高気圧作業安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000040?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question11/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question11/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。","options":["酸素18％未満又は硫化水素10 ppm超の危険がある状態は酸素欠乏等として管理対象となる。","酸素欠乏等により墜落するおそれがあるときは、安全帯等・救命索等を使用させる。","不活性ガス等を送給する配管のバルブ等には、ガス名と開閉方向を表示する。","作業主任者は作業開始前、全員退場後の再開時、身体・換気装置等に異常があったとき等に酸素濃度等を測定する。","爆発・酸化等のため換気できず呼吸用保護具を使用する場合、その保護具は1か月以内ごとに1回点検すれば足りる。"],"category":"酸素欠乏","cluster":"物理因子","id":"law-2025-12","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":12,"correctIndex":4,"explanation":{"title":"酸素欠乏危険作業","point":"酸欠危険場所では、作業前・作業中の酸素濃度等測定、換気、立入管理、監視人、避難・救出用具、空気呼吸器等が必要です。呼吸用保護具の点検は使用前等の適切な時期に行う必要があり、「1か月以内ごとだけ行えばよい」とする説明は不十分です。","conclusion":"正答（5）。","choicesExplain":"（1）— 非正答肢\n　酸素18％未満又は硫化水素10 ppm超の危険がある状態は酸素欠乏等として管理対象となる。\n\n（2）— 非正答肢\n　酸素欠乏等により墜落するおそれがあるときは、安全帯等・救命索等を使用させる。\n\n（3）— 非正答肢\n　不活性ガス等を送給する配管のバルブ等には、ガス名と開閉方向を表示する。\n\n（4）— 非正答肢\n　作業主任者は作業開始前、全員退場後の再開時、身体・換気装置等に異常があったとき等に酸素濃度等を測定する。\n\n（5）◎ 公式公表正答\n　爆発・酸化等のため換気できず呼吸用保護具を使用する場合、その保護具は1か月以内ごとに1回点検すれば足りる。","trap":"","keywords":"","related":"","current":"【出題当時】2025-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question12/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question12/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"question":"事務所衛生基準規則に関するイ～ニのうち、正しいもののみを挙げた組合せはどれか。\nイ 直接外気に向かって開放可能な窓等の面積は原則床面積の1/20以上（十分な換気設備がある場合を除く）。\nロ 空調設備の供給空気中の浮遊粉じん量は1.5 mg/m³以下とする。\nハ 常時50人以上又は常時女性30人以上を使用する事業場では、横になれる休養設備を男女別に設ける。\nニ 空調設備の排水受けは使用開始時と6か月以内ごとに1回点検する。","options":["イ・ロ","イ・ハ","ロ・ニ","ロ・ハ","ハ・ニ"],"category":"事務所衛生基準","cluster":"作業環境管理","id":"law-2025-13","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":13,"correctIndex":1,"explanation":{"title":"事務所衛生基準規則","point":"事務室の気積は労働者1人につき10 m³以上（設備が占める容積等を除く）が原則です。一酸化炭素・二酸化炭素、室温・湿度等の基準を確認します。浮遊粉じん濃度を1.5 mg/m³とする記述は桁が誤り、空調設備の排水受け（ドレンパン）等の点検・清掃頻度も「6か月ごと」と一括できません。","conclusion":"正答（2）：イ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ・ロ\n\n（2）◎ 公式公表正答\n　イ・ハ\n\n（3）— 非正答肢\n　ロ・ニ\n\n（4）— 非正答肢\n　ロ・ハ\n\n（5）— 非正答肢\n　ハ・ニ","trap":"", el":"じん肺法（e-Gov）","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20250401"},{"label":"粉じん障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20250401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2025/low-question15/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question15/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","lawLinks":[],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済"},{"id":"general-2024-01","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":1,"question":"労働衛生管理に関する次のイ～リの措置について、該当する労働衛生の三管理（作業環境管理・作業管理・健康管理）の組合せのうち、適切なもののみを挙げたものは（１）～（５）のうちどれか。\nイ　有害業務に従事することが適当でないと医師が認めた者を配置転換する。\nロ　高温多湿作業に労働者を従事させる場合に暑熱順化期間を設ける。\nハ　騒音作業において、騒音発生源である機械に防振ゴムを取り付ける。\nニ　放射線業務において、管理区域を設定し、必要のある者以外の者を立入\n禁止とする。\nホ　情報機器作業において、間接照明等のグレア防止用照明器具を用いる。\nヘ　長時間労働者に対して、医師による面接指導を行う。\nト　疾病による休職者の職場復帰を支援する。\nチ　ずい道建設工事の掘削作業において、土石又は岩石を湿潤な状態に保つ\nための設備を設ける。\nリ　重量物取扱い作業において、人力で取り扱う重量物の重量や取扱い回数\nに制限を設ける。作業環境管理作業管理健康管理","options":["ハ ホ ト","チ ホ ロ","ニ リ ヘ","ハ イ ロ","チ リ"],"correctIndex":4,"category":"メンタルヘルス・過重労働","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"労働衛生の三管理","point":"作業環境管理は、有害要因を発生源・伝ぱ経路で抑え、作業場の状態を良好にする管理です。チの湿潤化設備は粉じんの発散抑制なので該当します。作業管理は人の作業方法や負荷を整える管理で、リの取扱重量・回数の制限が該当します。健康管理は健康診断や面接指導、就業上の措置を行う管理で、ヘが該当します。","conclusion":"正答（5）：作業環境管理＝チ、作業管理＝リ、健康管理＝ヘ。","choicesExplain":"（1）— 非正答肢\n　ハ ホ ト\n\n（2）— 非正答肢\n　チ ホ ロ\n\n（3）— 非正答肢\n　ニ リ ヘ\n\n（4）— 非正答肢\n　ハ イ ロ\n\n（5）◎ 公式公表正答\n　チ リ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と
