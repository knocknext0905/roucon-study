要な呼吸用保護具を使用させていない場合。設備対策があっても、条文が保護具使用を重ねて要求する作業では両方が必要となる。\n数値チェック：１年、１回、６","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question10/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-11","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":11,"question":"特定化学物質の製造、取扱い等に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。ただし、特定化学物質障害予防規則に定める適用の除外はないものとする。","options":["硫化水素のガスを含有する気体を排出する製造設備の排気筒には、吸収方式若しくは酸化・還元方式のいずれかの処理方式による排ガス処理装置又はこれらと同等以上の性能を有する排ガス処理装置を設けなければならない。","塩化ビニルを製造する特定化学設備又はその附属設備については、２年を超える期間使用しない場合を除き、２年以内ごとに１回、定期に、自主検査を行い、所定の事項を記録し、これを３年間保存しなければならない。","アルキル水銀化合物（アルキル基がメチル基又はエチル基であるものに限る。以下同じ。）を製造し、又は取り扱う屋内作業場については、６か月以内ごとに１回、定期に、アルキル水銀化合物の空気中における濃度を測定し、その都度所定の事項を記録し、これを３年間保存しなければならない。","ジクロロメタンを製造し、又は取り扱う作業場において常時作業に従事する労働者については、１か月を超えない期間ごとに、従事した作業の概要及び当該作業に従事した期間等の所定の事項を記録し、これを30年間保存するものとする。","エチレンオキシドを製造し、又は取り扱う業務に常時従事させたことのある労働者で、現に使用しているものに対し、６か月以内ごとに１回、定期に、医師による特別の項目についての健康診断を行わなければならない。"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。誤りはエチレンオキシドの過去従事者全員に6か月ごとの健診を求める記述。健診対象、作業記録、長期保存は特別管理物質ごとに規定が異なる。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　硫化水素のガスを含有する気体を排出する製造設備の排気筒には、吸収方式若しくは酸化・還元方式のいずれかの処理方式による排ガス処理装置又はこれらと同等以上の性能を有する排ガス処理装置を設けなければならない。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　塩化ビニルを製造する特定化学設備又はその附属設備については、２年を超える期間使用しない場合を除き、２年以内ごとに１回、定期に、自主検査を行い、所定の事項を記録し、これを３年間保存しなければならない。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　アルキル水銀化合物（アルキル基がメチル基又はエチル基であるものに限る。以下同じ。）を製造し、又は取り扱う屋内作業場については、６か月以内ごとに１回、定期に、アルキル水銀化合物の空気中における濃度を測定し、その都度所定の事項を記録し、これを３年間保存しなければならない。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　ジクロロメタンを製造し、又は取り扱う作業場において常時作業に従事する労働者については、１か月を超えない期間ごとに、従事した作業の概要及び当該作業に従事した期間等の所定の事項を記録し、これを30年間保存するものとする。\n\n（5）誤り：エチレンオキシドの過去従事者全員に6か月ごとの健診を一律に課す記述が誤り。\n　エチレンオキシドを製造し、又は取り扱う業務に常時従事させたことのある労働者で、現に使用しているものに対し、６か月以内ごとに１回、定期に、医師による特別の項目についての健康診断を行わなければならない。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／誤りはエチレンオキシドの過去従事者全員に6か月ごとの健診を求める記述。健診対象、作業記録、長期保存は特別管理物質ごとに規定が異なる。\n数値チェック：２年、１回、３年、６、１、30年、6","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question11/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-12","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":12,"question":"潜水作業において、潜水作業者が吸入する時点の気体の分圧の制限に関する次の文中のＡ～Ｄに入る数値の組合せとして、高気圧作業安全衛生規則上、正しいものは（１）～（５）のうちどれか。事業者は、潜水作業者が潜水作業に従事している間、潜水作業者が吸入する時点における次に掲げる気体の分圧が、気体の種類ごとに定められた範囲に収まるように、潜水作業者への送気、ボンベからの給気その他の必要な措置を講じなければならない。１酸素Ａキロパスカル以上Ｂキロパスカル以下（ただし、潜水作業者が溺水しないよう必要な措置を講じて浮上を行わせる場合にあっては、Ａキロパスカル以上220キロパスカル以下とする。）２窒素Ｃキロパスカル以下３炭酸ガスＤキロパスカル以下ＡＢＣＤ","options":["12 100 600 0.5","12 100 600 1.0","18 120 600 0.5","18 160 400 0.5","18 160 400 0.1"],"correctIndex":3,"category":"物理的因子","cluster":"酸欠・高気圧","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（4）です。潜水作業者が吸入する時点の分圧は、酸素18～160 kPa、窒素400 kPa以下、炭酸ガス0.5 kPa以下。浮上時の特例では酸素上限220 kPaとなる。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　12 100 600 0.5\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　12 100 600 1.0\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　18 120 600 0.5\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　18 160 400 0.5\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　18 160 400 0.1","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（4）／潜水作業者が吸入する時点の分圧は、酸素18～160 kPa、窒素400 kPa以下、炭酸ガス0.5 kPa以下。浮上時の特例では酸素上限220 kPaとなる。\n数値チェック：１、５、220、２、３、12、100、600、0.5、1.0、18、120","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question12/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-13","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":13,"question":"電離放射線障害を防止するため事業者が講ずべき措置に関する次のイ～ニの記述について、電離放射線障害防止規則上、正しいものの組合せは（１）～","options":["のうちどれか。 イ　管理区域には、必要のある者以外の者を立ち入らせてはならない。 ロ　放射線業務従事者が眼の水晶体に受ける等価線量は、緊急作業におけ る線量を含め、５年間につき100ミリシーベルト及び１年間につき50ミリシーベルトを超えないようにしなければならない。 ハ　管理区域に一時的に立ち入る労働者についても、管理区域内において 受ける外部被ばくによる線量及び内部被ばくによる線量を測定しなければならない。 ニ　放射線業務従事者の実効線量及び人体の組織別の等価線量を、所定の 期間ごとに算定し、これを見やすい場所に掲示する等の方法によって、管理区域に立ち入る者に周知させなければならない。","イ ロ","イ ハ","ロ ハ","ロ ニ　（５）ハ ニ"],"correctIndex":1,"category":"物理的因子","cluster":"放射線","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（2）です。正しいのはイ・ロ。管理区域は必要者以外の立入を禁止し、水晶体等価線量は5年100 mSvかつ1年50 mSvを超えないようにする。個人線量は掲示ではなく本人への通知・記録管理が中心。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　のうちどれか。 イ　管理区域には、必要のある者以外の者を立ち入らせてはならない。 ロ　放射線業務従事者が眼の水晶体に受ける等価線量は、緊急作業におけ る線量を含め、５年間につき100ミリシーベルト及び１年間につき50ミリシーベルトを超えないようにしなければならない。 ハ　管理区域に一時的に立ち入る労働者についても、管理区域内において 受ける外部被ばくによる線量及び内部被ばくによる線量を測定しなければならない。 ニ　放射線業務従事者の実効線量及び人体の組織別の等価線量を、所定の 期間ごとに算定し、これを見やすい場所に掲示する等の方法によって、管理区域に立ち入る者に周知させなければならない。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　イ ロ\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　イ ハ\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ロ ハ\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ロ ニ　（５）ハ ニ","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（2）／正しいのはイ・ロ。管理区域は必要者以外の立入を禁止し、水晶体等価線量は5年100 mSvかつ1年50 mSvを超えないようにする。個人線量は掲示ではなく本人への通知・記録管理が中心。\n数値チェック：１、５年、100、１年、50、５、5年、100 mSv、1年、50 mSv","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question13/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-14","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":14,"question":"酸素欠乏症等の防止に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　メタンを含有する地層に接する井戸の内部における作業、しょうゆを\n入れたことのある醸造槽の内部における作業は、どちらも第一種酸素欠乏危険作業に該当する。\nロ　第二種酸素欠乏危険作業については、その日の作業を開始する前等の\n所定の時期に、作業を行う場所の空気中の酸素及び硫化水素の濃度を、作業環境測定士に測定させなければならない。\nハ　酸素欠乏危険作業に労働者を従事させるときは、労働者を当該作業を\n行う場所に入場させ、及び退場させる時に、人員を点検しなければならない。\nニ　酸素欠乏危険作業に労働者を従事させる場合であって、爆発、酸化等\nの防止のため換気することができないときは、同時に就業する労働者の人数と同数以上の空気呼吸器、酸素呼吸器、送気マスク又は電動ファン付き呼吸用保護具を備え、労働者にこれを使用させなければならない。","options":["イ ロ ハ","イ ロ ニ","イ ハ","ロ ニ","ハ ニ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。正しいのはイ・ハ。メタン地層に接する井戸としょうゆ槽はいずれも第一種酸欠危険場所で、入退場時の人員点検が必要。測定者は作業環境測定士に限定されず、酸欠場所で電動ファン付き呼吸用保護具は使用できない。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：メタンを含有する地層に接する井戸の内部における作業、しょうゆを 入れたことのある醸造槽の内部における作業は、どちらも第一種酸素欠乏危険作業に該当する。\nロ　誤り：濃度測定者は作業環境測定士に限定されない。必要な知識・器具を用いて測定する。\n　原文：第二種酸素欠乏危険作業については、その日の作業を開始する前等の 所定の時期に、作業を行う場所の空気中の酸素及び硫化水素の濃度を、作業環境測定士に測定させなければならない。\nハ　正しい：記述どおり。\n　原文：酸素欠乏危険作業に労働者を従事させるときは、労働者を当該作業を 行う場所に入場させ、及び退場させる時に、人員を点検しなければならない。\nニ　誤り：酸欠場所では電動ファン付き呼吸用保護具を使用できない。空気呼吸器、酸素呼吸器、送気マスク等が必要。\n　原文：酸素欠乏危険作業に労働者を従事させる場合であって、爆発、酸化等 の防止のため換気することができないときは、同時に就業する労働者の人数と同数以上の空気呼吸器、酸素呼吸器、送気マスク又は電動ファン付き呼吸用保護具を備え、労働者にこれを使用させなければならない。\n\n【組合せ肢の確認】\n（1）イ ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ハ：正答。求められた記述の集合と一致する。\n（4）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／正しいのはイ・ハ。メタン地層に接する井戸としょうゆ槽はいずれも第一種酸欠危険場所で、入退場時の人員点検が必要。測定者は作業環境測定士に限定されず、酸欠場所で電動ファン付き呼吸用保護具は使用できない。\n数値チェック：１、５","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question14/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-15","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":15,"question":"じん肺法令に関する次のイの記述及び粉じん障害防止規則に関する次のロの記述について、文中のＡ～Ｄに入る期間の組合せとして、労働安全衛生法令上、正しいものは（１）～（５）のうちどれか。\nイ　事業者は、次の各号に掲げる労働者で、離職の日まで引き続き厚生労\n働省令で定める期間を超えて使用していたものが、当該離職の際にじん肺健康診断を行うように求めたときは、当該労働者に対して、じん肺健康診断を行わなければならない。ただし、当該労働者が直前にじん肺健康診断を受けた日から当該離職の日までの期間が、次の各号に掲げる労働者ごとに、次の各号に掲げる期間に満たないときは、この限りでない。１常時粉じん作業に従事する労働者（次号に掲げる者を除く。）Ａ２常時粉じん作業に従事する労働者でじん肺管理区分が管理２又は管理３であるものＢ\nロ　作業環境測定を行うべき屋内作業場における空気中の粉じんの濃度の\n測定結果の評価がＣ以上行われ、その間、当該評価の結果、第一管理区分に区分されることが継続した単位作業場所については、当該単位作業場所に係る事業場の所在地を管轄する労働基準監督署長の許可を受けた場合には、当該粉じん濃度の測定は、別に厚生労働大臣の定めるところによることができる。この場合において、事業者は、厚生労働大臣の登録を受けた者により、Ｄ以内ごとに１回、定期に較正された測定機器を使用しなければならない。ＡＢＣＤ","options":["1年／3か月／3年／2年","1年／6か月／2年／1年","1年6か月／3か月／3年／1年","1年6か月／3か月／3年／2年","1年6か月／6か月／2年／1年"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。離職時健診の除外期間は、一般の常時粉じん作業者が1年6か月、管理2・3の者が6か月。良好な管理区分継続による測定特例は2年間の継続評価と、1年以内ごとの較正機器が鍵。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　1年／3か月／3年／2年\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　1年／6か月／2年／1年\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　1年6か月／3か月／3年／1年\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　1年6か月／3か月／3年／2年\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　1年6か月／6か月／2年／1年","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／離職時健診の除外期間は、一般の常時粉じん作業者が1年6か月、管理2・3の者が6か月。良好な管理区分継続による測定特例は2年間の継続評価と、1年以内ごとの較正機器が鍵。\n数値チェック：１、５、２、３、１回、1年、3、3年、2年、6、2","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question15/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-01","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":1,"question":"事業場における労働衛生の三管理（作業環境管理、作業管理及び健康管理）について、その種類と取組内容に関する次のイ～ホの組合せについて、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。労働衛生管理の種類労働衛生に関する取組内容\nイ　作業管理・・・・・・・腰部に著しい負担のかかる作業に従事する\n労働者に対し、腰痛予防体操を実施する。\nロ　作業環境管理・・・・・アーク溶接作業を行う労働者に防じんマス\nクなどの保護具を使用させることによって、有害物質に対するばく露量を低減する。\nハ　作業管理・・・・・・・有機溶剤業務を行う作業場所に設置した局\n所排気装置のフード付近の気流の風速を測定する。\nニ　健康管理・・・・・・・健康診断結果に基づく事後措置として就業\n制限を行う。\nホ　作業環境管理・・・・・ずい道建設工事の掘削作業において、土石\n又は岩石を湿潤な状態に保つための設備を稼働する。","options":["イ ロ","イ ハ ニ","ロ ニ ホ","ハ ホ","ニ ホ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。適切なのはニ・ホ。健診後の就業制限は健康管理、湿潤化設備の稼働は作業環境管理。腰痛予防体操は健康管理、保護具使用は作業管理、フード風速測定は作業環境管理である。","choicesExplain":"【記述ごとの判定】\nイ　誤り：腰痛予防体操は健康保持増進・健康管理に位置付ける。\n　原文：作業管理・・・・・・・腰部に著しい負担のかかる作業に従事する 労働者に対し、腰痛予防体操を実施する。\nロ　誤り：防じんマスク等の保護具使用は作業管理である。\n　原文：作業環境管理・・・・・アーク溶接作業を行う労働者に防じんマス クなどの保護具を使用させることによって、有害物質に対するばく露量を低減する。\nハ　誤り：局所排気装置の風速測定は作業環境管理である。\n　原文：作業管理・・・・・・・有機溶剤業務を行う作業場所に設置した局 所排気装置のフード付近の気流の風速を測定する。\nニ　正しい：記述どおり。\n　原文：健康管理・・・・・・・健康診断結果に基づく事後措置として就業 制限を行う。\nホ　正しい：記述どおり。\n　原文：作業環境管理・・・・・ずい道建設工事の掘削作業において、土石 又は岩石を湿潤な状態に保つための設備を稼働する。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ハ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ニ ホ：正答。求められた記述の集合と一致する。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／適切なのはニ・ホ。健診後の就業制限は健康管理、湿潤化設備の稼働は作業環境管理。腰痛予防体操は健康管理、保護具使用は作業管理、フード風速測定は作業環境管理である。\n数値チェック：１、５","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question01/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-02","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":2,"question":"厚生労働省の労働衛生統計等に関する次のイ～ニの記述について、誤っているもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　厚生労働省が公表している「労働災害発生状況」によると、休業４日\n以上の死傷者数は、平成24年から令和３年までの10年間、年々減少傾向にあり、令和３年は約15万人である。\nロ　厚生労働省の「業務上疾病調」によると、令和３年の業務上疾病者数\nは、疾病別では、新型コロナウイルス感染症罹患によるものを除くと、災害性腰痛などの負傷に起因する疾病が最も多く、約6,700人となっている。\nハ　厚生労働省の「じん肺健康管理実施結果調」（随時申請によるものを\n除く。）によると、じん肺健康診断受診労働者数に対する有所見者数の割合は、平成14年以降の20年間減少傾向にあり、令和３年は約３％となっている。\nニ　厚生労働省の「労働安全衛生調査（実態調査）」によると、現在の仕\n事や職業生活に関することで、強いストレスとなっていると感じる事柄がある労働者の割合は、令和３年は約30％である。","options":["イ ロ","イ ハ ニ","イ ニ","ロ ハ","ロ ハ ニ"],"correctIndex":1,"category":"統計・疫学","cluster":"粉じん・石綿・じん肺","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（2）です。誤りはイ・ハ・ニ。令和3年の休業4日以上死傷者数は単調減少ではなく、じん肺有所見率は約3％ではない。強いストレスがある労働者は約30％より高い。","choicesExplain":"【記述ごとの判定】\nイ　誤り：死傷者数は10年間一貫して毎年減少したわけではない。\n　原文：厚生労働省が公表している「労働災害発生状況」によると、休業４日 以上の死傷者数は、平成24年から令和３年までの10年間、年々減少傾向にあり、令和３年は約15万人である。\nロ　正しい：記述どおり。\n　原文：厚生労働省の「業務上疾病調」によると、令和３年の業務上疾病者数 は、疾病別では、新型コロナウイルス感染症罹患によるものを除くと、災害性腰痛などの負傷に起因する疾病が最も多く、約6,700人となっている。\nハ　誤り：令和3年のじん肺有所見率を約3％とするのは高すぎる。\n　原文：厚生労働省の「じん肺健康管理実施結果調」（随時申請によるものを 除く。）によると、じん肺健康診断受診労働者数に対する有所見者数の割合は、平成14年以降の20年間減少傾向にあり、令和３年は約３％となっている。\nニ　誤り：強いストレスを感じる労働者は約30％ではなく、半数を超える水準である。\n　原文：厚生労働省の「労働安全衛生調査（実態調査）」によると、現在の仕 事や職業生活に関することで、強いストレスとなっていると感じる事柄がある労働者の割合は、令和３年は約30％である。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ ニ：正答。求められた記述の集合と一致する。\n（3）イ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（2）／誤りはイ・ハ・ニ。令和3年の休業4日以上死傷者数は単調減少ではなく、じん肺有所見率は約3％ではない。強いストレスがある労働者は約30％より高い。\n数値チェック：１、５、４日、24年、３年、10年、15、6、700人、14年、20年、３％","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question02/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-03","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":3,"question":"有害物質の性状等に関する次のイ～ホの記述について、誤っているものの組合せは（１）～（５）のうちどれか。\nイ　一般に、ミストはヒュームの一次粒子に比べて粒径が大きい。\nロ　メタノールは、トルエンより極性が大きい。\nハ　一般に、環境空気中の有害物質の濃度の算術平均値と、その標準偏差\nの間には相関関係はない。\nニ　粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求め\nられる。\nホ　臨界温度以下の温度において、気体として存在するものを蒸気という。","options":["イ ロ","イ ホ","ロ ハ","ハ ニ","ニ ホ"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（4）です。誤りはハ・ニ。環境濃度は対数正規分布を示すことが多く、算術平均と標準偏差には関係が生じる。空気力学相当径は沈降・慣性等の空気力学的挙動を表す径で、光学顕微鏡の幾何学径だけでは決まらない。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：一般に、ミストはヒュームの一次粒子に比べて粒径が大きい。\nロ　正しい：記述どおり。\n　原文：メタノールは、トルエンより極性が大きい。\nホ　正しい：記述どおり。\n　原文：臨界温度以下の温度において、気体として存在するものを蒸気という。\nハ　誤り：環境濃度の分布では平均値とばらつきに関係がみられることがある。\n　原文：一般に、環境空気中の有害物質の濃度の算術平均値と、その標準偏差 の間には相関関係はない。\nニ　誤り：空気力学相当径は空気中の挙動から定義され、光学顕微鏡の幾何学径だけでは求められない。\n　原文：粉じんの空気力学相当径は、光学顕微鏡による粒径測定によって求め られる。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ハ ニ：正答。求められた記述の集合と一致する。\n（5）ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（4）／誤りはハ・ニ。環境濃度は対数正規分布を示すことが多く、算術平均と標準偏差には関係が生じる。空気力学相当径は沈降・慣性等の空気力学的挙動を表す径で、光学顕微鏡の幾何学径だけでは決まらない。\n数値チェック：１、５","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question03/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-04","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":4,"question":"厚生労働省の「第10次粉じん障害防止総合対策」における粉じん障害を防止するため事業者が重点的に講ずべき措置に関する次の記述のうち、適切でないものはどれか。","options":["ずい道等建設工事に従事するじん肺有所見労働者に対し、禁煙について強く働きかける。","ずい道等建設工事において、コンクリート等を吹き付ける場所での作業では、防じん機能を有する電動ファン付き呼吸用保護具を使用させる。","「保護具着用管理責任者」を選任し、防じんマスクの適正な選択等の業務に従事させる。","じん肺健康診断を実施し、毎年じん肺健康管理実施状況報告を提出する。","粉じん作業に従事し、じん肺管理区分が管理３又は管理４の離職予定者に対し、「離職するじん肺有所見者のためのガイドブック」を配付する。"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。不適切なのは、離職予定者へのガイドブック配付対象を管理3・4に限定する記述。じん肺管理区分と離職後の健康管理を正しく対応させる。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　ずい道等建設工事に従事するじん肺有所見労働者に対し、禁煙について強く働きかける。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　ずい道等建設工事において、コンクリート等を吹き付ける場所での作業では、防じん機能を有する電動ファン付き呼吸用保護具を使用させる。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　「保護具着用管理責任者」を選任し、防じんマスクの適正な選択等の業務に従事させる。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　じん肺健康診断を実施し、毎年じん肺健康管理実施状況報告を提出する。\n\n（5）誤り：離職者向けガイドブックの配付対象を管理3・4に限定した点が不適切。管理4は療養対象であり、離職時の健康管理案内の対象整理が異なる。\n　粉じん作業に従事し、じん肺管理区分が管理３又は管理４の離職予定者に対し、「離職するじん肺有所見者のためのガイドブック」を配付する。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／不適切なのは、離職予定者へのガイドブック配付対象を管理3・4に限定する記述。じん肺管理区分と離職後の健康管理を正しく対応させる。\n数値チェック：10、３、４、3、4","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question04/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-05","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":5,"question":"電離放射線に関する次の記述のうち、誤っているものはどれか。","options":["エックス線とガンマ線の区別は発生機序の相違による。","ベータ線はアルミニウムなどの金属板を透過する。","人間の五感では感じることができない。","防護の目的に用いられる等価線量の単位は、Sv（シーベルト）である。","原子又は分子の電子を放出させる作用を持つ。"],"correctIndex":1,"category":"物理的因子","cluster":"放射線","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（2）です。誤りはベータ線が金属板を透過するとする記述。ベータ線はガンマ線より透過力が小さく、適切な厚さのプラスチックやアルミニウム等で遮蔽できる。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　エックス線とガンマ線の区別は発生機序の相違による。\n\n（2）誤り：ベータ線は透過力が比較的小さく、適切な厚さのアルミニウム等で遮蔽できるため、一般的に「透過する」とするのは不適切。\n　ベータ線はアルミニウムなどの金属板を透過する。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　人間の五感では感じることができない。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　防護の目的に用いられる等価線量の単位は、Sv（シーベルト）である。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　原子又は分子の電子を放出させる作用を持つ。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（2）／誤りはベータ線が金属板を透過するとする記述。ベータ線はガンマ線より透過力が小さく、適切な厚さのプラスチックやアルミニウム等で遮蔽できる。","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question05/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-06","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":6,"question":"高気圧障害の予防に関する次のイ～ニの記述について、正しいものの組合せは（１）～（５）のうちどれか。\nイ　呼吸ガスの酸素分圧は制限なく増加できる。\nロ　気こう室から十分離れた場所に連絡等の担当者を常時配置する。\nハ　水深40ｍを超える潜水作業では、ヘリウム混合ガスを呼吸ガスとする。\nニ　酸素ばく露量の算出の際は、ＵＰＴＤ（肺酸素毒性量単位）をその単位\nとして用いる。","options":["イ ロ","イ ハ","イ ニ","ロ ハ","ハ ニ"],"correctIndex":4,"category":"物理的因子","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（5）です。正しいのはハ・ニ。深い潜水ではヘリウム混合ガスを用い、肺酸素毒性はUPTDで管理する。酸素分圧には上限があり、連絡員は気こう室から十分離すのではなく適切な位置に置く。","choicesExplain":"【記述ごとの判定】\nイ　誤り：酸素分圧には中枢神経・肺酸素毒性を防ぐ上限がある。\n　原文：呼吸ガスの酸素分圧は制限なく増加できる。\nロ　誤り：連絡・監視担当者は気こう室との連絡が確実な位置に置く。\n　原文：気こう室から十分離れた場所に連絡等の担当者を常時配置する。\nハ　正しい：記述どおり。\n　原文：水深40ｍを超える潜水作業では、ヘリウム混合ガスを呼吸ガスとする。\nニ　正しい：記述どおり。\n　原文：酸素ばく露量の算出の際は、ＵＰＴＤ（肺酸素毒性量単位）をその単位 として用いる。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ニ：正答。求められた記述の集合と一致する。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（5）／正しいのはハ・ニ。深い潜水ではヘリウム混合ガスを用い、肺酸素毒性はUPTDで管理する。酸素分圧には上限があり、連絡員は気こう室から十分離すのではなく適切な位置に置く。\n数値チェック：１、５、40","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question06/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-07","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":7,"question":"酸素欠乏症及び硫化水素による健康障害とそれらの予防に関する次の記述のうち、適切でないものはどれか。","options":["ドライアイスが昇華すると酸素欠乏症のリスクが生じる。","酸素欠乏空気には鋭敏な人が検知できる特有の臭いがある。","硫化水素用の防毒マスクは、酸素濃度18％以上のときに使用できる。","海水が滞留している暗渠では、酸素欠乏症及び硫化水素中毒のリスクがある。","硫化水素にばく露したときの眼の症状として、結膜炎や角膜損傷が知られている。"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（2）です。不適切なのは、酸素欠乏空気に特有の臭いがあるとする記述。酸素濃度低下そのものは五感で検知できず、測定器で確認する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　ドライアイスが昇華すると酸素欠乏症のリスクが生じる。\n\n（2）誤り：酸素欠乏空気自体には臭いがなく、嗅覚で安全確認できない。\n　酸素欠乏空気には鋭敏な人が検知できる特有の臭いがある。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　硫化水素用の防毒マスクは、酸素濃度18％以上のときに使用できる。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　海水が滞留している暗渠では、酸素欠乏症及び硫化水素中毒のリスクがある。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　硫化水素にばく露したときの眼の症状として、結膜炎や角膜損傷が知られている。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（2）／不適切なのは、酸素欠乏空気に特有の臭いがあるとする記述。酸素濃度低下そのものは五感で検知できず、測定器で確認する。\n数値チェック：18％","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question07/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-08","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":8,"question":"騒音性難聴に関する次のイ～ニの記述について、正しいものの組合せは","options":["イ・ロ","イ・ハ","イ・ニ","ロ・ハ","ハ・ニ"],"correctIndex":1,"category":"物理的因子","cluster":"騒音・振動","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（2）です。正しいのはイ・ハ。騒音性難聴は内耳有毛細胞の障害による感音難聴で、初期に4,000 Hz付近のC5 dipを示す。一般に左右差は大きくなく、確立した根治治療はないため予防が重要。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\nロ　誤り：通常は両耳性で、著しい左右差は別原因も疑う。\nハ　正しい：記述どおり。\nニ　誤り：障害された有毛細胞の回復をもたらす確立した治療はなく、予防が中心。\n\n【組合せ肢の確認】\n（1）イ・ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ・ハ：正答。求められた記述の集合と一致する。\n（3）イ・ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ・ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ・ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（2）／正しいのはイ・ハ。騒音性難聴は内耳有毛細胞の障害による感音難聴で、初期に4,000 Hz付近のC5 dipを示す。一般に左右差は大きくなく、確立した根治治療はないため予防が重要。\n数値チェック：4、000 Hz","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question08/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-09","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":9,"question":"熱中症に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　作業現場のＷＢＧＴ値の低下は、天候による要因のみで起きる。\nロ　熱中症の労働衛生教育の対象者は作業を管理する者と労働者の両方で\nあり、教育内容には、熱中症の症状・予防方法、緊急時の救急処置、熱中症の事例が含まれる。\nハ　熱中症の救急処置において、自力で水分・塩分摂取できる場合でも症\n状が回復しないときは、医療機関へ搬送する。\nニ　ＷＢＧＴ基準値は、暑熱非順化者に用いる値の方が、暑熱順化者に用\nいる値より大きな値となる。","options":["イ ロ","イ ハ ニ","イ ニ","ロ ハ ニ","ロ ハ"],"correctIndex":4,"category":"物理的因子","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（5）です。適切なのはロ・ハ。教育は管理者と労働者の双方に行い、自力摂取後も回復しなければ搬送する。非順化者のWBGT基準値は順化者より低く、環境改善によるWBGT低下もあり得る。","choicesExplain":"【記述ごとの判定】\nイ　誤り：WBGTは遮熱、換気、冷房、作業場所変更等の対策でも低下させられる。\n　原文：作業現場のＷＢＧＴ値の低下は、天候による要因のみで起きる。\nロ　正しい：記述どおり。\n　原文：熱中症の労働衛生教育の対象者は作業を管理する者と労働者の両方で あり、教育内容には、熱中症の症状・予防方法、緊急時の救急処置、熱中症の事例が含まれる。\nハ　正しい：記述どおり。\n　原文：熱中症の救急処置において、自力で水分・塩分摂取できる場合でも症 状が回復しないときは、医療機関へ搬送する。\nニ　誤り：非順化者の基準値は順化者より低い。\n　原文：ＷＢＧＴ基準値は、暑熱非順化者に用いる値の方が、暑熱順化者に用 いる値より大きな値となる。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ ハ：正答。求められた記述の集合と一致する。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（5）／適切なのはロ・ハ。教育は管理者と労働者の双方に行い、自力摂取後も回復しなければ搬送する。非順化者のWBGT基準値は順化者より低く、環境改善によるWBGT低下もあり得る。\n数値チェック：１、５","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question09/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-10","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":10,"question":"厚生労働省の「テレワークの適切な導入及び実施の推進のためのガイドライン」における長時間労働対策に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　所定外深夜及び休日は、事前に許可を得ない限り、社内システムにア\nクセスできないように設定する。\nロ　労使の合意により、時間外等の労働が可能な時間帯や時間数を、あら\nかじめ使用者が設定する。\nハ　一日の勤務終了後から翌日の勤務までの間に一定時間以上の休息時間\nを設ける勤務間インターバル制度を採用する。\nニ　長時間労働が生じた労働者に対しては、管理者が労働時間の記録を踏\nまえて注意喚起する。","options":["イ ロ ハ ニ","イ ロ ハ","イ ニ","ロ ハ","ハ ニ"],"correctIndex":0,"category":"メンタルヘルス・過重労働","cluster":"健康診断・健康管理","examLawDate":"2023-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"メンタルヘルス・過重労働","point":"過重労働・メンタルヘルス対策では、労働時間把握、対象者抽出、本人申出、医師面接、医師意見、就業措置、フォローアップを区別する。ストレスチェックは一次予防が主目的で、個人結果と集団分析の取扱いを分ける。","conclusion":"正答は（1）です。イ～ニはいずれも長時間労働対策として適切。アクセス制限、時間帯・時間数の設定、勤務間インターバル、労働時間記録に基づく注意喚起を組み合わせる。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：所定外深夜及び休日は、事前に許可を得ない限り、社内システムにア クセスできないように設定する。\nロ　正しい：記述どおり。\n　原文：労使の合意により、時間外等の労働が可能な時間帯や時間数を、あら かじめ使用者が設定する。\nハ　正しい：記述どおり。\n　原文：一日の勤務終了後から翌日の勤務までの間に一定時間以上の休息時間 を設ける勤務間インターバル制度を採用する。\nニ　正しい：記述どおり。\n　原文：長時間労働が生じた労働者に対しては、管理者が労働時間の記録を踏 まえて注意喚起する。\n\n【組合せ肢の確認】\n（1）イ ロ ハ ニ：正答。求められた記述の集合と一致する。\n（2）イ ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"「健康診断」と「面接指導」を混同しない。本人申出の要否、80時間・45時間等の数値の位置付けを確認する。","keywords":"正答（1）／イ～ニはいずれも長時間労働対策として適切。アクセス制限、時間帯・時間数の設定、勤務間インターバル、労働時間記録に基づく注意喚起を組み合わせる。\n数値チェック：１、５","related":"過重労働・メンタルヘルス対策では、労働時間把握、対象者抽出、本人申出、医師面接、医師意見、就業措置、フォローアップを区別する。ストレスチェックは一次予防が主目的で、個人結果と集団分析の取扱いを分ける。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question10/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-11","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":11,"question":"特殊健康診断に関する次の記述のうち、誤っているものはどれか。","options":["一般に、有機溶剤は生物学的半減期が短いので、有機溶剤等健康診断における尿中の代謝物の量の検査のための採尿の時刻は、厳重に管理する必要がある。","テトラクロロエチレンの特殊健康診断における生物学的モニタリングの指標には、尿中に排泄されるトリクロロ酢酸がある。","振動工具取扱い作業者に対する特殊健康診断を１年に２回実施する場合、そのうち１回は冬季に行うとよい。","情報機器作業に係る健康診断では、眼科学的検査などとともに、上肢及び下肢の運動機能の検査を行う。","介護・看護作業に常時従事する労働者に対しては、当該作業に配置する際及びその後６か月以内ごとに１回、定期に、医師による腰痛の健康診断を行う。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（4）です。誤りは情報機器作業健診で下肢の運動機能まで必須とする記述。眼、頸肩腕部等の筋骨格系、自覚症状、作業状況を中心に評価する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　一般に、有機溶剤は生物学的半減期が短いので、有機溶剤等健康診断における尿中の代謝物の量の検査のための採尿の時刻は、厳重に管理する必要がある。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　テトラクロロエチレンの特殊健康診断における生物学的モニタリングの指標には、尿中に排泄されるトリクロロ酢酸がある。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　振動工具取扱い作業者に対する特殊健康診断を１年に２回実施する場合、そのうち１回は冬季に行うとよい。\n\n（4）誤り：情報機器作業健診で下肢運動機能を定型項目として行うわけではない。\n　情報機器作業に係る健康診断では、眼科学的検査などとともに、上肢及び下肢の運動機能の検査を行う。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　介護・看護作業に常時従事する労働者に対しては、当該作業に配置する際及びその後６か月以内ごとに１回、定期に、医師による腰痛の健康診断を行う。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（4）／誤りは情報機器作業健診で下肢の運動機能まで必須とする記述。眼、頸肩腕部等の筋骨格系、自覚症状、作業状況を中心に評価する。\n数値チェック：１年、２回、１回、６","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question11/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-12","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":12,"question":"メタボリックシンドロームの診断のための各項目の基準として、適切でないものは次のうちどれか。","options":["女性では、ウエスト周囲径（へその高さの腹囲）が90cm以上である。","150mg/dL以上の高トリグリセライド血症がある。","110mg/dL以上の空腹時高血糖がある。","拡張期血圧が80mmHg以上である。","40mg/dL未満の低ＨＤＬコレステロール血症がある。"],"correctIndex":3,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","conclusion":"正答は（4）です。不適切なのは拡張期血圧80 mmHg以上。メタボリックシンドロームの血圧基準は収縮期130 mmHg以上又は拡張期85 mmHg以上である。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　女性では、ウエスト周囲径（へその高さの腹囲）が90cm以上である。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　150mg/dL以上の高トリグリセライド血症がある。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　110mg/dL以上の空腹時高血糖がある。\n\n（4）誤り：拡張期血圧基準は85 mmHg以上。80 mmHgではない。\n　拡張期血圧が80mmHg以上である。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　40mg/dL未満の低ＨＤＬコレステロール血症がある。","trap":"保護具は作業環境管理ではなく作業管理。局所排気・湿潤化は作業環境管理、健診後の就業制限は健康管理である。","keywords":"正答（4）／不適切なのは拡張期血圧80 mmHg以上。メタボリックシンドロームの血圧基準は収縮期130 mmHg以上又は拡張期85 mmHg以上である。\n数値チェック：90cm、150、110、80mmHg、40、80 mmHg、130 mmHg、85 mmHg","related":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question12/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-13","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":13,"question":"厚生労働省の「第14次労働災害防止計画」における労働者の健康確保対策の推進に関し、労働者の協力を得て事業者が取り組む事項についての次の記述のうち、適切でないものはどれか。","options":["ストレスチェック結果をもとに集団分析を行い、その集団分析を活用した職場環境の改善まで行うことで、メンタルヘルス不調の予防を強化する。","年次有給休暇の確実な取得を促進する。","育児と仕事の両立支援に関して、労働者や管理監督者等に対する研修の実施等の環境整備に取り組む。","長時間労働による医師の面接指導の対象となる労働者に対して、医師による面接指導や、保健師等の産業保健スタッフによる相談支援を受けるよう勧奨する。","職場におけるハラスメント防止対策に取り組む。"],"correctIndex":2,"category":"メンタルヘルス・過重労働","cluster":"健康診断・健康管理","examLawDate":"2023-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"メンタルヘルス・過重労働","point":"過重労働・メンタルヘルス対策では、労働時間把握、対象者抽出、本人申出、医師面接、医師意見、就業措置、フォローアップを区別する。ストレスチェックは一次予防が主目的で、個人結果と集団分析の取扱いを分ける。","conclusion":"正答は（3）です。適切でないのは育児と仕事の両立支援を「労働者の健康確保対策」の取組として挙げる記述。第14次防では重点事項ごとの位置付けを読み分ける。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　ストレスチェック結果をもとに集団分析を行い、その集団分析を活用した職場環境の改善まで行うことで、メンタルヘルス不調の予防を強化する。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　年次有給休暇の確実な取得を促進する。\n\n（3）誤り：育児と仕事の両立支援は重要だが、この設問が問う第14次防の「労働者の健康確保対策」の具体項目とは位置付けが異なる。\n　育児と仕事の両立支援に関して、労働者や管理監督者等に対する研修の実施等の環境整備に取り組む。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　長時間労働による医師の面接指導の対象となる労働者に対して、医師による面接指導や、保健師等の産業保健スタッフによる相談支援を受けるよう勧奨する。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　職場におけるハラスメント防止対策に取り組む。","trap":"「健康診断」と「面接指導」を混同しない。本人申出の要否、80時間・45時間等の数値の位置付けを確認する。","keywords":"正答（3）／適切でないのは育児と仕事の両立支援を「労働者の健康確保対策」の取組として挙げる記述。第14次防では重点事項ごとの位置付けを読み分ける。\n数値チェック：14","related":"過重労働・メンタルヘルス対策では、労働時間把握、対象者抽出、本人申出、医師面接、医師意見、就業措置、フォローアップを区別する。ストレスチェックは一次予防が主目的で、個人結果と集団分析の取扱いを分ける。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question13/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-14","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":14,"question":"物理的因子と障害の部位との次の組合せのうち、適切でないものはどれか。物理的因子障害の部位","options":["赤外線・・・・・・・・・・・・水晶体","レーザー光線・・・・・・・・・角膜","電離放射線・・・・・・・・・・生殖腺","手腕振動・・・・・・・・・・・中枢神経","減圧・・・・・・・・・・・・・中枢神経"],"correctIndex":3,"category":"物理的因子","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（4）です。不適切なのは手腕振動―中枢神経。手腕振動障害の中心は末梢循環障害、末梢神経障害、骨・関節・筋等の運動器障害である。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　赤外線・・・・・・・・・・・・水晶体\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　レーザー光線・・・・・・・・・角膜\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　電離放射線・・・・・・・・・・生殖腺\n\n（4）誤り：手腕振動障害は末梢循環・末梢神経・運動器が中心で、中枢神経を代表部位としない。\n　手腕振動・・・・・・・・・・・中枢神経\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　減圧・・・・・・・・・・・・・中枢神経","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（4）／不適切なのは手腕振動―中枢神経。手腕振動障害の中心は末梢循環障害、末梢神経障害、骨・関節・筋等の運動器障害である。","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question14/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-15","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":15,"question":"加齢による人体の機能の変化に関する次の記述のうち、誤っているものはどれか。","options":["筋持久力の指標である上体起こしは、男性で60～64歳にはピーク時の約６割まで低下する。","全身持久力の指標である20ｍシャトルラン（往復持久走）は、男女とも40歳頃から著しい低下傾向を示す。","女性の更年期は、閉経を迎える前後をいい、エストロゲンの分泌が低下することによる更年期障害を伴う。","女性の更年期には、子宮、膣、尿道、膀胱、毛髪、皮膚、骨などの器官が萎縮してくる。","男性では、テストステロンの分泌の低下により、筋力低下、自律神経失調症状や精力減退などを生じる。"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","conclusion":"正答は（2）です。誤りは20 mシャトルランが男女とも40歳頃から急激に低下するとの断定。加齢変化は機能ごとに異なり、統計値の年齢層・測定方法を確認する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　筋持久力の指標である上体起こしは、男性で60～64歳にはピーク時の約６割まで低下する。\n\n（2）誤り：20 mシャトルランの年齢変化を40歳頃からの急激な低下と一律に断定するのは不適切。\n　全身持久力の指標である20ｍシャトルラン（往復持久走）は、男女とも40歳頃から著しい低下傾向を示す。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　女性の更年期は、閉経を迎える前後をいい、エストロゲンの分泌が低下することによる更年期障害を伴う。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　女性の更年期には、子宮、膣、尿道、膀胱、毛髪、皮膚、骨などの器官が萎縮してくる。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　男性では、テストステロンの分泌の低下により、筋力低下、自律神経失調症状や精力減退などを生じる。","trap":"保護具は作業環境管理ではなく作業管理。局所排気・湿潤化は作業環境管理、健診後の就業制限は健康管理である。","keywords":"正答（2）／誤りは20 mシャトルランが男女とも40歳頃から急激に低下するとの断定。加齢変化は機能ごとに異なり、統計値の年齢層・測定方法を確認する。\n数値チェック：60、64、６、20、40","related":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question15/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-16","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":16,"question":"金属類による健康障害に関する次の記述のうち、誤っているものはどれか。","options":["マンガンによる慢性中毒では、神経質になるなどの精神症状、歩行障害、発語障害などのパーキンソン病に似た症状がみられる。","クロム酸などの六価クロムの化合物は、皮膚に接触すると、局所の刺激で充血、水疱や潰瘍がみられ、長期間のばく露によってアレルギー性接触性皮膚炎がみられる。","鉛中毒では、貧血、腹部の疝痛、末梢神経障害、伸筋麻痺による下垂手がみられる。","ニッケルは、粉じんやヒュームが経気道的に吸入されると、気管支喘息などのアレルギー症状や肝障害がみられる。","砒素の慢性中毒では、色素沈着症、黒皮症、角化症、鼻中隔穿孔、末梢神経障害がみられる。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（4）です。誤りはニッケルばく露で肝障害を代表症状とする記述。ニッケルは接触皮膚炎、呼吸器感作、喘息、化合物による発がん性等が重要。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　マンガンによる慢性中毒では、神経質になるなどの精神症状、歩行障害、発語障害などのパーキンソン病に似た症状がみられる。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　クロム酸などの六価クロムの化合物は、皮膚に接触すると、局所の刺激で充血、水疱や潰瘍がみられ、長期間のばく露によってアレルギー性接触性皮膚炎がみられる。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　鉛中毒では、貧血、腹部の疝痛、末梢神経障害、伸筋麻痺による下垂手がみられる。\n\n（4）誤り：ニッケルの代表的健康影響は皮膚・呼吸器感作や発がん性で、肝障害を代表症状としない。\n　ニッケルは、粉じんやヒュームが経気道的に吸入されると、気管支喘息などのアレルギー症状や肝障害がみられる。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　砒素の慢性中毒では、色素沈着症、黒皮症、角化症、鼻中隔穿孔、末梢神経障害がみられる。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（4）／誤りはニッケルばく露で肝障害を代表症状とする記述。ニッケルは接触皮膚炎、呼吸器感作、喘息、化合物による発がん性等が重要。","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question16/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-17","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":17,"question":"作業環境測定を行う際に注意すべき事項に関する次の記述のうち、誤っているものはどれか。","options":["混合有機溶剤の場合、溶剤中の含有率が低い物質であっても、高い蒸気圧を有するなど物性によっては環境空気中の濃度が高くなる場合がある。","取り扱う原材料によっては、温度などの条件や生産工程の進み具合によって、有害物質の発散の程度が変動する。","別々の発散源から発散した複数の有機溶剤が空気中で混合する場合は、混合有機溶剤を取り扱う一つの単位作業場所として評価する。","測定対象物質がどのような形態で発散し、どのような状態で環境空気中に存在するかを理解する。","測定対象作業場の主たる業務のほかに、付随的な業務で法的に測定義務のある物質を発散する業務が行われることがあるので、作業環境測定士、衛生管理者、作業主任者などの間で事前の打合せを行い、作業の実態を十分に把握する。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。誤りは、別々の発散源から発散した複数の有機溶剤を常に一つの単位作業場所として扱う記述。労働者の行動範囲、発散状況、気流、作業工程を踏まえて単位作業場所を設定する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　混合有機溶剤の場合、溶剤中の含有率が低い物質であっても、高い蒸気圧を有するなど物性によっては環境空気中の濃度が高くなる場合がある。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　取り扱う原材料によっては、温度などの条件や生産工程の進み具合によって、有害物質の発散の程度が変動する。\n\n（3）誤り：複数発散源があるだけで一つの単位作業場所にまとめるのではなく、行動範囲・気流・発散状況で決める。\n　別々の発散源から発散した複数の有機溶剤が空気中で混合する場合は、混合有機溶剤を取り扱う一つの単位作業場所として評価する。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　測定対象物質がどのような形態で発散し、どのような状態で環境空気中に存在するかを理解する。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　測定対象作業場の主たる業務のほかに、付随的な業務で法的に測定義務のある物質を発散する業務が行われることがあるので、作業環境測定士、衛生管理者、作業主任者などの間で事前の打合せを行い、作業の実態を十分に把握する。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／誤りは、別々の発散源から発散した複数の有機溶剤を常に一つの単位作業場所として扱う記述。労働者の行動範囲、発散状況、気流、作業工程を踏まえて単位作業場所を設定する。","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question17/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-18","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":18,"question":"作業環境測定（Ａ・Ｂ測定）のデザインに関する次の記述のうち、適切でないものはどれか。","options":["過去において実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下である場合には、測定点を６ｍを超える等間隔で引いた縦横の線の交点とすることができる。","Ａ測定では、単位作業場所の範囲が著しく狭い場合であって、単位作業場所における有害物質の濃度がほぼ均一であることが明らかな場合に、測定点の数を５未満としたときは、測定値の総数は５以上にしなくてもよい。","単位作業場所の範囲は平面的な場所だけではなく、有害物質の発生場所を取り巻くように設置された作業足場のような立体的なものとなる場合もある。","単位作業場所は、労働者の作業中の行動範囲、作業に伴って発散する有害物質の分布等の状況等によって決定する。","Ａ測定の２日間測定は、有害物濃度の日間変動を加味した測定結果を得るためであるが、合理的な理由がある場合は、連続する二作業日に実施しなくてもよい。"],"correctIndex":1,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"作業環境測定・換気","point":"作業環境測定では、単位作業場所、A測定・B測定、第一・第二評価値、管理濃度、管理区分を一連の流れで理解する。局所排気装置はフード形式、制御風速、ダクト圧力損失、排気・除じん、点検頻度をセットで確認する。","conclusion":"正答は（2）です。不適切なのは、A測定点を5未満とした場合に測定値総数も5未満でよいとする記述。測定点が少なくても繰返し測定等により必要な測定値数を確保する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　過去において実施した作業環境測定の記録により、測定値の幾何標準偏差がおおむね1.2以下である場合には、測定点を６ｍを超える等間隔で引いた縦横の線の交点とすることができる。\n\n（2）誤り：測定点が5未満でも、測定値の総数は原則5以上を確保する。\n　Ａ測定では、単位作業場所の範囲が著しく狭い場合であって、単位作業場所における有害物質の濃度がほぼ均一であることが明らかな場合に、測定点の数を５未満としたときは、測定値の総数は５以上にしなくてもよい。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　単位作業場所の範囲は平面的な場所だけではなく、有害物質の発生場所を取り巻くように設置された作業足場のような立体的なものとなる場合もある。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　単位作業場所は、労働者の作業中の行動範囲、作業に伴って発散する有害物質の分布等の状況等によって決定する。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　Ａ測定の２日間測定は、有害物濃度の日間変動を加味した測定結果を得るためであるが、合理的な理由がある場合は、連続する二作業日に実施しなくてもよい。","trap":"0.4、0.5、1.0 m/sなどの数値はフード形式と一緒に覚える。測定頻度と自主検査頻度を取り違えない。","keywords":"正答（2）／不適切なのは、A測定点を5未満とした場合に測定値総数も5未満でよいとする記述。測定点が少なくても繰返し測定等により必要な測定値数を確保する。\n数値チェック：1.2、６、５、２日、5","related":"作業環境測定では、単位作業場所、A測定・B測定、第一・第二評価値、管理濃度、管理区分を一連の流れで理解する。局所排気装置はフード形式、制御風速、ダクト圧力損失、排気・除じん、点検頻度をセットで確認する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question18/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-19","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":19,"question":"局所排気装置に関する次のイ～ホの記述について、誤っているものの組合せは（１）～（５）のうちどれか。\nイ　制御風速とは、有害物により汚染された空気を有害物の発生点におい\nて捕捉するために必要な最小風速をいう。\nロ　ダクトは、曲がり部分をできるだけ少なくするよう配管し、主ダクト\nと枝ダクトの合流角度は45°を超えないようにする。\nハ　排風量一定の条件では、ダクトの断面積を小さくすると、圧力損失は\n大きくなる。\nニ　スロット型フードは、作業面を除き、周りが囲われているもので、囲\nい式フードに分類される。\nホ　囲い式フードのうちのドラフトチェンバー型、カバー型及び建築ブー\nス型では、カバー型が最も排気効果が高い。","options":["イ ロ","イ ニ","ロ ハ","ハ ホ","ニ ホ"],"correctIndex":1,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"作業環境測定・換気","point":"作業環境測定では、単位作業場所、A測定・B測定、第一・第二評価値、管理濃度、管理区分を一連の流れで理解する。局所排気装置はフード形式、制御風速、ダクト圧力損失、排気・除じん、点検頻度をセットで確認する。","conclusion":"正答は（2）です。誤りはイ・ニ。制御風速はフードの形式ごとに定められた位置での最小風速で、単に発生点の風速ではない。スロット型フードは外付け式の一形態である。","choicesExplain":"【記述ごとの判定】\nイ　誤り：制御風速はフード型式ごとに規定位置で測る最小風速で、発生点そのものの風速とは限らない。\n　原文：制御風速とは、有害物により汚染された空気を有害物の発生点におい て捕捉するために必要な最小風速をいう。\nロ　正しい：記述どおり。\n　原文：ダクトは、曲がり部分をできるだけ少なくするよう配管し、主ダクト と枝ダクトの合流角度は45°を超えないようにする。\nニ　誤り：スロット型は外付け式フードの一形態である。\n　原文：スロット型フードは、作業面を除き、周りが囲われているもので、囲 い式フードに分類される。\nハ　正しい：記述どおり。\n　原文：排風量一定の条件では、ダクトの断面積を小さくすると、圧力損失は 大きくなる。\nホ　正しい：記述どおり。\n　原文：囲い式フードのうちのドラフトチェンバー型、カバー型及び建築ブー ス型では、カバー型が最も排気効果が高い。\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ニ：正答。求められた記述の集合と一致する。\n（3）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ハ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"0.4、0.5、1.0 m/sなどの数値はフード形式と一緒に覚える。測定頻度と自主検査頻度を取り違えない。","keywords":"正答（2）／誤りはイ・ニ。制御風速はフードの形式ごとに定められた位置での最小風速で、単に発生点の風速ではない。スロット型フードは外付け式の一形態である。\n数値チェック：１、５、45","related":"作業環境測定では、単位作業場所、A測定・B測定、第一・第二評価値、管理濃度、管理区分を一連の流れで理解する。局所排気装置はフード形式、制御風速、ダクト圧力損失、排気・除じん、点検頻度をセットで確認する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question19/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-20","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":20,"question":"事務室の採光、照明などに関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　照度は高いほど書類の文字はよく見えるが、明る過ぎると疲労度が増\nす。\nロ　全般照明の照度は、局部照明による照度の少なくとも約10分の１以上\nが望ましい。\nハ　室内の明るさにムラがないようにする。\nニ　前方から明かりをとるときは、まぶしさを防ぐため、光源と眼を結ぶ\n線と視線がなす角度は30°以下となるようにする。","options":["イ ロ ハ ニ","イ ロ ハ","イ ハ ニ","ロ ハ","ロ ニ"],"correctIndex":1,"category":"物理的因子","cluster":"人間工学・作業態様","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（2）です。適切なのはイ・ロ・ハ。照度は高すぎてもグレア・疲労を生じ、全般照明と局部照明の差を過大にしない。前方光源は視線との角度を小さくするのではなく、グレアを避ける配置とする。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：照度は高いほど書類の文字はよく見えるが、明る過ぎると疲労度が増 す。\nロ　正しい：記述どおり。\n　原文：全般照明の照度は、局部照明による照度の少なくとも約10分の１以上 が望ましい。\nハ　正しい：記述どおり。\n　原文：室内の明るさにムラがないようにする。\nニ　誤り：光源と視線の角度を30°以下にすると視野に入りやすく、グレア防止にならない。\n　原文：前方から明かりをとるときは、まぶしさを防ぐため、光源と眼を結ぶ 線と視線がなす角度は30°以下となるようにする。\n\n【組合せ肢の確認】\n（1）イ ロ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ロ ハ：正答。求められた記述の集合と一致する。\n（3）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（2）／適切なのはイ・ロ・ハ。照度は高すぎてもグレア・疲労を生じ、全般照明と局部照明の差を過大にしない。前方光源は視線との角度を小さくするのではなく、グレアを避ける配置とする。\n数値チェック：１、５、10分、30","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question20/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-21","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":21,"question":"化学物質等の有害性等に関する次の記述のうち、誤っているものはどれか。","options":["変異原性試験は発がん性のスクリーニングとして実施されているが、発がん性のあるものが変異原性を有するとは限らない。","特定標的臓器毒性（反復ばく露）とは、反復ばく露によって起こる特定臓器に対する特異的な致死性の毒性をいう。","神経毒性とは、神経機能を障害する性質をいい、神経毒性を持つ金属として、有機水銀などがある。","窒息性とは、窒素やヘリウムなどのガスが、酸素の供給を妨げることで窒息させる性質をいう。","感作性とは、皮膚や呼吸器にアレルギー反応を引き起こす性質をいう。"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（2）です。誤りは特定標的臓器毒性（反復ばく露）を「致死性」に限定する記述。反復ばく露による特定臓器への非致死性を含む有害影響を扱う。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　変異原性試験は発がん性のスクリーニングとして実施されているが、発がん性のあるものが変異原性を有するとは限らない。\n\n（2）誤り：反復ばく露による特定標的臓器毒性は非致死性の有害影響も含み、「致死性」に限定しない。\n　特定標的臓器毒性（反復ばく露）とは、反復ばく露によって起こる特定臓器に対する特異的な致死性の毒性をいう。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　神経毒性とは、神経機能を障害する性質をいい、神経毒性を持つ金属として、有機水銀などがある。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　窒息性とは、窒素やヘリウムなどのガスが、酸素の供給を妨げることで窒息させる性質をいう。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　感作性とは、皮膚や呼吸器にアレルギー反応を引き起こす性質をいう。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（2）／誤りは特定標的臓器毒性（反復ばく露）を「致死性」に限定する記述。反復ばく露による特定臓器への非致死性を含む有害影響を扱う。","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question21/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-22","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":22,"question":"安全データシート（SDS）に用いられる絵表示A～Cと、それらが表す危険有害性クラス・区分の組合せについて、正しいものはどれか。\nA：どくろ（急性毒性）\nB：感嘆符\nC：健康有害性（胸部に星形）","options":["急性毒性（区分1）／急性毒性（区分4）／呼吸器感作性（区分1）","急性毒性（区分1）／皮膚腐食性（区分1）／皮膚感作性（区分1）","発がん性（区分1）／呼吸器感作性（区分1）／生殖細胞変異原性（区分1）","発がん性（区分1）／発がん性（区分2）／誤えん有害性（区分1）","生殖毒性（区分1）／生殖毒性（区分2）／皮膚腐食性（区分1）"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（1）です。Aはどくろで急性毒性区分1、Bは感嘆符で急性毒性区分4、Cは健康有害性で呼吸器感作性区分1を表し得る。絵表示は一つの有害性だけに対応するものではない。","choicesExplain":"（1）正しい：A＝急性毒性区分1、B＝急性毒性区分4、C＝呼吸器感作性区分1の組合せが絵表示と整合する。\n　急性毒性（区分1）／急性毒性（区分4）／呼吸器感作性（区分1）\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　急性毒性（区分1）／皮膚腐食性（区分1）／皮膚感作性（区分1）\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　発がん性（区分1）／呼吸器感作性（区分1）／生殖細胞変異原性（区分1）\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　発がん性（区分1）／発がん性（区分2）／誤えん有害性（区分1）\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　生殖毒性（区分1）／生殖毒性（区分2）／皮膚腐食性（区分1）","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（1）／Aはどくろで急性毒性区分1、Bは感嘆符で急性毒性区分4、Cは健康有害性で呼吸器感作性区分1を表し得る。絵表示は一つの有害性だけに対応するものではない。\n数値チェック：1、4、2","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question22/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-23","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":23,"question":"高年齢労働者の感覚や反応に関する次の記述のうち、適切でないものはどれか。","options":["加齢による聴力低下では、高い周波数から聞こえにくくなる。","静止視力は、動体視力よりも加齢により著しく低下する。","加齢により、単純反応時間及び選択反応時間は、ともに長くなる。","加齢に伴う明暗順応の遅延は、明順応よりも暗順応の方が顕著である。","平衡機能は加齢により徐々に低下し、60歳代以降に大きく低下する。"],"correctIndex":1,"category":"人間工学・作業態様","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["人間工学・作業態様"],"explanation":{"title":"人間工学・作業態様","point":"人間工学・作業態様の対策は、設備改善、作業方法、作業時間・休止、教育、健康管理を組み合わせる。腰痛対策では不自然姿勢、重量物、反復、振動、温熱、心理社会的要因を総合的に評価する。","conclusion":"正答は（2）です。不適切なのは、静止視力の方が動体視力より著しく低下するとする記述。加齢では動体視力、暗順応、高音域聴力、平衡機能等の低下が目立つ。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　加齢による聴力低下では、高い周波数から聞こえにくくなる。\n\n（2）誤り：静止視力より動体視力の方が加齢影響を受けやすい。\n　静止視力は、動体視力よりも加齢により著しく低下する。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　加齢により、単純反応時間及び選択反応時間は、ともに長くなる。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　加齢に伴う明暗順応の遅延は、明順応よりも暗順応の方が顕著である。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　平衡機能は加齢により徐々に低下し、60歳代以降に大きく低下する。","trap":"正しい姿勢を固定するのではなく、姿勢変換・休止・補助具で負担を分散する。個人の体力だけに原因を求めない。","keywords":"正答（2）／不適切なのは、静止視力の方が動体視力より著しく低下するとする記述。加齢では動体視力、暗順応、高音域聴力、平衡機能等の低下が目立つ。\n数値チェック：60","related":"人間工学・作業態様の対策は、設備改善、作業方法、作業時間・休止、教育、健康管理を組み合わせる。腰痛対策では不自然姿勢、重量物、反復、振動、温熱、心理社会的要因を総合的に評価する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question23/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-24","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":24,"question":"厚生労働省の「職場における腰痛予防対策指針」に関する次の記述のうち、適切でないものはどれか","options":["長時間の車両運転作業では、一連続運転時間の長さを適切に管理することが重要となる。","介護作業では、不自然な姿勢を取らざるを得ない場合、壁に手をつく、床やベッドの上に膝を着く等により体を支える。","２人以上で重量物を取り扱う作業は、身長差の少ない者にて行う。","椅座位姿勢は、長い時間続けると背部筋の疲労によって後傾姿勢となることから、適宜、前傾姿勢をとるようにする。","立ち作業では、おおむね１時間につき１～２回程度の小休止・休息をとるようにする。"],"correctIndex":3,"category":"人間工学・作業態様","cluster":"人間工学・作業態様","examLawDate":"2023-04-01","tags":["人間工学・作業態様"],"explanation":{"title":"人間工学・作業態様","point":"人間工学・作業態様の対策は、設備改善、作業方法、作業時間・休止、教育、健康管理を組み合わせる。腰痛対策では不自然姿勢、重量物、反復、振動、温熱、心理社会的要因を総合的に評価する。","conclusion":"正答は（4）です。不適切なのは、椅座位で疲労したら前傾姿勢を取るよう勧める記述。腰椎の中間位を保ち、背もたれ・机椅子調整、姿勢変換、立位・休止で負担を分散する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　長時間の車両運転作業では、一連続運転時間の長さを適切に管理することが重要となる。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　介護作業では、不自然な姿勢を取らざるを得ない場合、壁に手をつく、床やベッドの上に膝を着く等により体を支える。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　２人以上で重量物を取り扱う作業は、身長差の少ない者にて行う。\n\n（4）誤り：前傾姿勢を意図的に取るのではなく、腰椎中間位、姿勢変換、休止で負担を減らす。\n　椅座位姿勢は、長い時間続けると背部筋の疲労によって後傾姿勢となることから、適宜、前傾姿勢をとるようにする。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　立ち作業では、おおむね１時間につき１～２回程度の小休止・休息をとるようにする。","trap":"正しい姿勢を固定するのではなく、姿勢変換・休止・補助具で負担を分散する。個人の体力だけに原因を求めない。","keywords":"正答（4）／不適切なのは、椅座位で疲労したら前傾姿勢を取るよう勧める記述。腰椎の中間位を保ち、背もたれ・机椅子調整、姿勢変換、立位・休止で負担を分散する。\n数値チェック：２人、１時間、１、２回","related":"人間工学・作業態様の対策は、設備改善、作業方法、作業時間・休止、教育、健康管理を組み合わせる。腰痛対策では不自然姿勢、重量物、反復、振動、温熱、心理社会的要因を総合的に評価する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question24/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-25","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":25,"question":"労働衛生保護具に関する次の記述のうち、誤っているものはどれか。","options":["直結式小型防毒マスクは、大気中で対象ガス又は蒸気の濃度が0.1％以下で使用する。","酸性ガス用防毒マスクの吸収缶の色は灰色で、シアン化水素用防毒マスクの吸収缶の色は青色である。","放射性物質がこぼれたとき等による汚染のおそれがある区域内の作業においてオイルミストが混在しない場合は、ろ過材の種類がＲＬ３の防じんマスクは使用できない。","取替え式防じんマスクの密着性を確認する方法には、陰圧法と陽圧法がある。","酸素濃度が18％未満の場所でも使用できる呼吸用保護具には、送気マスク、空気呼吸器、酸素呼吸器がある。"],"correctIndex":2,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","conclusion":"正答は（3）です。誤りは、オイルミストがない区域でRL3ろ過材を使用できないとする記述。RL3は高性能ろ過材であり、条件に応じて使用できる。酸欠場所では防毒・防じんマスクではなく給気式を用いる。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　直結式小型防毒マスクは、大気中で対象ガス又は蒸気の濃度が0.1％以下で使用する。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　酸性ガス用防毒マスクの吸収缶の色は灰色で、シアン化水素用防毒マスクの吸収缶の色は青色である。\n\n（3）誤り：RL3は条件に応じて使用でき、オイルミストがないことを理由に使用不可とはならない。\n　放射性物質がこぼれたとき等による汚染のおそれがある区域内の作業においてオイルミストが混在しない場合は、ろ過材の種類がＲＬ３の防じんマスクは使用できない。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　取替え式防じんマスクの密着性を確認する方法には、陰圧法と陽圧法がある。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　酸素濃度が18％未満の場所でも使用できる呼吸用保護具には、送気マスク、空気呼吸器、酸素呼吸器がある。","trap":"保護具は作業環境管理ではなく作業管理。局所排気・湿潤化は作業環境管理、健診後の就業制限は健康管理である。","keywords":"正答（3）／誤りは、オイルミストがない区域でRL3ろ過材を使用できないとする記述。RL3は高性能ろ過材であり、条件に応じて使用できる。酸欠場所では防毒・防じんマスクではなく給気式を用いる。\n数値チェック：0.1％、３、18％","related":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question25/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-26","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":26,"question":"派遣労働者に対する安全衛生教育に関する次のイ～ホの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、ホにおいて、特別教育とは、危険又は有害な業務で、厚生労働省令で定めるものに労働者を就かせるときに行う当該業務に関する安全又は衛生のための特別の教育をいうものとする。\nイ　派遣先事業者は、派遣労働者を受け入れたときは、派遣元事業者によ\nる雇入れ時の安全衛生教育について、当該派遣労働者が従事する業務に関する安全又は衛生を確保するために必要な内容の教育が実施されているか等、その実施結果を派遣元事業者に書面等により確認する。\nロ　派遣元事業者は、派遣先事業者に対して派遣労働者の雇入れ時の安全\n衛生教育の実施を委託した場合は、その実施結果を書面等により確認する。\nハ　派遣元事業者は、派遣労働者の派遣先事業場を変更する等その作業内\n容を変更したときは、当該派遣労働者に対し、作業内容変更時の安全衛生教育を実施する。\nニ　派遣元事業者は、派遣先事業場において派遣労働者を異なる作業に転\n換したとき等派遣労働者の作業内容の変更を把握した場合には、派遣先事業者が行った作業内容変更時の安全衛生教育の実施結果を書面等により確認する。\nホ　派遣先事業者は、特別教育が必要な業務に派遣労働者を従事させると\nきは、当該派遣労働者が当該業務に関する特別教育を既に受けた者かどうか等を確認し、当該派遣労働者に対し、必要な特別教育を適切に行うとともに、その実施結果を派遣元事業者に書面等により報告する。","options":["イ ロ ハ ニ ホ","イ ロ ハ ニ","イ ロ ニ ホ","イ ハ ニ","ロ ハ ホ"],"correctIndex":0,"category":"健康管理・健康診断","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["健康管理・健康診断"],"explanation":{"title":"健康管理・健康診断","point":"健康診断は、対象者、実施時期、一次・二次項目、結果通知、医師意見、事後措置、記録保存、監督署報告を順に確認する。一般健診、特殊健診、じん肺健診、面接指導、ストレスチェックは別制度である。","conclusion":"正答は（1）です。イ～ホはいずれも適切。派遣元は雇入れ時教育、派遣先は作業内容変更時教育・特別教育を中心に責任を負い、双方が実施結果を文書等で確認・連絡する。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：派遣先事業者は、派遣労働者を受け入れたときは、派遣元事業者によ る雇入れ時の安全衛生教育について、当該派遣労働者が従事する業務に関する安全又は衛生を確保するために必要な内容の教育が実施されているか等、その実施結果を派遣元事業者に書面等により確認する。\nロ　正しい：記述どおり。\n　原文：派遣元事業者は、派遣先事業者に対して派遣労働者の雇入れ時の安全 衛生教育の実施を委託した場合は、その実施結果を書面等により確認する。\nハ　正しい：記述どおり。\n　原文：派遣元事業者は、派遣労働者の派遣先事業場を変更する等その作業内 容を変更したときは、当該派遣労働者に対し、作業内容変更時の安全衛生教育を実施する。\nニ　正しい：記述どおり。\n　原文：派遣元事業者は、派遣先事業場において派遣労働者を異なる作業に転 換したとき等派遣労働者の作業内容の変更を把握した場合には、派遣先事業者が行った作業内容変更時の安全衛生教育の実施結果を書面等により確認する。\nホ　正しい：記述どおり。\n　原文：派遣先事業者は、特別教育が必要な業務に派遣労働者を従事させると きは、当該派遣労働者が当該業務に関する特別教育を既に受けた者かどうか等を確認し、当該派遣労働者に対し、必要な特別教育を適切に行うとともに、その実施結果を派遣元事業者に書面等により報告する。\n\n【組合せ肢の確認】\n（1）イ ロ ハ ニ ホ：正答。求められた記述の集合と一致する。\n（2）イ ロ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ロ ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ ハ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"健診項目の省略は、本人同意ではなく法令上の基準と医師判断による。医師意見聴取と本人への結果通知は別手続である。","keywords":"正答（1）／イ～ホはいずれも適切。派遣元は雇入れ時教育、派遣先は作業内容変更時教育・特別教育を中心に責任を負い、双方が実施結果を文書等で確認・連絡する。\n数値チェック：１、５","related":"健康診断は、対象者、実施時期、一次・二次項目、結果通知、医師意見、事後措置、記録保存、監督署報告を順に確認する。一般健診、特殊健診、じん肺健診、面接指導、ストレスチェックは別制度である。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question26/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-27","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":27,"question":"1,200人を対象とした疾病スクリーニング検査で、精密検査により疾病あり50人（検査陽性45、陰性5）、疾病なし1,150人（検査陽性100、陰性1,050）であった。感度と特異度の組合せとして適切なものはどれか。","options":["31.0％／99.5％","31.0％／91.3％","90.0％／91.3％","90.0％／87.5％","99.5％／87.5％"],"correctIndex":2,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（3）です。感度は45／（45＋5）＝90.0％、特異度は1,050／（1,050＋100）＝91.3％。分母を「疾病あり」「疾病なし」に分けて計算する。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　31.0％／99.5％\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　31.0％／91.3％\n\n（3）正しい：感度90.0％、特異度91.3％。\n　90.0％／91.3％\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　90.0％／87.5％\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　99.5％／87.5％","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（3）／感度は45／（45＋5）＝90.0％、特異度は1,050／（1,050＋100）＝91.3％。分母を「疾病あり」「疾病なし」に分けて計算する。\n数値チェック：1、200人、50人、45、5、150人、100、050、31.0％、99.5％、91.3％、90.0％","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question27/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-28","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["労働災害防止は事業者の責務であり、この責務を全うするには、何よりも事業場トップが労働者の安全と健康の確保を自らの課題として認識し、率先してこれに取り組むことが必要である。","４Ｓ活動は、職場の「整理」、「整頓」、「清掃」、「清潔」を行う活動であり、そのうち「清掃」とは、通路、作業床から機械設備、治工具、作業用具に至るまで、汚れ、くず、ほこりのない状態にすることであるとともに、「整理」、「整頓」の仕上げの役目も持っている。","労働災害の直接原因は、労働者の不安全な行動という人的原因と、設備、原材料、環境等の不安全な状態という物的原因とに分けることができる。","国の労働災害防止計画は、産業災害や職業性疾病の急増を踏まえ、1958年（昭和33年）に第１次の計画が策定された。","第14次労働災害防止計画では、計画の重点事項の取組の成果として、労働者の協力の下、事業者において実施される事項をアウトカム指標として定め、また、事業者がアウトカム指標に定める事項を実施した結果として期待される事項をアウトプット指標として定めている。"],"correctIndex":4,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2023-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","conclusion":"正答は（5）です。不適切なのはアウトプット指標とアウトカム指標を逆にした記述。事業者の実施事項がアウトプット、その結果として期待される災害・健康指標がアウトカムである。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　労働災害防止は事業者の責務であり、この責務を全うするには、何よりも事業場トップが労働者の安全と健康の確保を自らの課題として認識し、率先してこれに取り組むことが必要である。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　４Ｓ活動は、職場の「整理」、「整頓」、「清掃」、「清潔」を行う活動であり、そのうち「清掃」とは、通路、作業床から機械設備、治工具、作業用具に至るまで、汚れ、くず、ほこりのない状態にすることであるとともに、「整理」、「整頓」の仕上げの役目も持っている。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　労働災害の直接原因は、労働者の不安全な行動という人的原因と、設備、原材料、環境等の不安全な状態という物的原因とに分けることができる。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　国の労働災害防止計画は、産業災害や職業性疾病の急増を踏まえ、1958年（昭和33年）に第１次の計画が策定された。\n\n（5）誤り：アウトプット＝実施事項、アウトカム＝実施の結果として期待される成果。記述は逆。\n　第14次労働災害防止計画では、計画の重点事項の取組の成果として、労働者の協力の下、事業者において実施される事項をアウトカム指標として定め、また、事業者がアウトカム指標に定める事項を実施した結果として期待される事項をアウトプット指標として定めている。","trap":"保護具は作業環境管理ではなく作業管理。局所排気・湿潤化は作業環境管理、健診後の就業制限は健康管理である。","keywords":"正答（5）／不適切なのはアウトプット指標とアウトカム指標を逆にした記述。事業者の実施事項がアウトプット、その結果として期待される災害・健康指標がアウトカムである。\n数値チェック：４、1958年、33年、１、14","related":"三管理は、作業環境管理＝有害因子の発生・拡散を場で抑える、作業管理＝作業方法・時間・保護具等で個人ばく露を抑える、健康管理＝健診・保健指導・就業措置で健康を守る、という働きかけの対象で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question28/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-29","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」の内容及びこれに基づく労働安全衛生マネジメントシステムの運用に関する次の記述のうち、適切でないものはどれか。","options":["事業者は、あらかじめ、労働災害発生の急迫した危険がある状態（緊急事態）が生ずる可能性を評価し、緊急事態が発生した場合に労働災害を防止するための措置として、被害を最小限に食い止め、かつ、拡大を防止するための措置等を定める。","指針の内容は、労働安全衛生法の規定に基づき機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものではない。","事業場外部の者によるシステム監査は、事業場内部の者によるシステム監査に比べて、事業場の規程や基準等と実態との乖離を具体的に見つけだすことができる。","事業者は、安全衛生計画を実施する手順や日常的な点検、改善を実施する手順については、いつ、誰が、何を、どのようにするか等について文書により定める。","法人が同一である複数の事業場を一の単位として労働安全衛生マネジメントシステムに従って行う措置を実施する場合、システム各級管理者には、当該単位においてその事業の実施を統括管理する者が含まれる。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。不適切なのは、外部監査の方が内部監査より現場の規程と実態の乖離を具体的に見つけやすいと一律に断定する記述。内部監査と外部評価は目的・強みが異なる。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、あらかじめ、労働災害発生の急迫した危険がある状態（緊急事態）が生ずる可能性を評価し、緊急事態が発生した場合に労働災害を防止するための措置として、被害を最小限に食い止め、かつ、拡大を防止するための措置等を定める。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　指針の内容は、労働安全衛生法の規定に基づき機械、設備、化学物質等による危険又は健康障害を防止するため事業者が講ずべき具体的な措置を定めるものではない。\n\n（3）誤り：外部監査と内部監査は強みが異なり、外部監査が常に現場の乖離を具体的に見つけやすいとは限らない。\n　事業場外部の者によるシステム監査は、事業場内部の者によるシステム監査に比べて、事業場の規程や基準等と実態との乖離を具体的に見つけだすことができる。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、安全衛生計画を実施する手順や日常的な点検、改善を実施する手順については、いつ、誰が、何を、どのようにするか等について文書により定める。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　法人が同一である複数の事業場を一の単位として労働安全衛生マネジメントシステムに従って行う措置を実施する場合、システム各級管理者には、当該単位においてその事業の実施を統括管理する者が含まれる。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／不適切なのは、外部監査の方が内部監査より現場の規程と実態の乖離を具体的に見つけやすいと一律に断定する記述。内部監査と外部評価は目的・強みが異なる。","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question29/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2023-30","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":30,"question":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次のイ～ホの記述について、誤っているものの組合せは（１）～","options":["イ・ロ","イ・ニ","ロ・ハ","ハ・ホ","ニ・ホ"],"correctIndex":1,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（2）です。誤りはイ・ニ。リスクはハザードそのものではなく、発生可能性と重篤度等を組み合わせた概念。管理濃度は作業環境管理の評価指標であり、個人ばく露限界と同一ではない。","choicesExplain":"【記述ごとの判定】\nイ　誤り：リスクはハザードそのものではなく、危害の発生可能性と重篤度を組み合わせた概念。\nロ　正しい：記述どおり。\nニ　誤り：管理濃度は作業環境測定の評価基準で、個人ばく露限界と同一ではない。\nハ　正しい：記述どおり。\nホ　正しい：記述どおり。\n\n【組合せ肢の確認】\n（1）イ・ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ・ニ：正答。求められた記述の集合と一致する。\n（3）ロ・ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ハ・ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ニ・ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（2）／誤りはイ・ニ。リスクはハザードそのものではなく、発生可能性と重篤度等を組み合わせた概念。管理濃度は作業環境管理の評価指標であり、個人ばく露限界と同一ではない。\n数値チェック：１","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"統計値は問題が指定する年の数値で判定する。指針・ガイドラインは試験当時の版を基準とし、その後の改訂内容は別に確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question30/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-01","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":1,"question":"常時使用する労働者が600人で、有害な業務として著しく寒冷な場所における業務のみに常時40人の労働者を従事させている製造業の事業場の安全衛生管理体制に関する次の文中のＡ～Ｄに入る数値又は語句の組合せとして、労働安全衛生法令上、正しいものは（１）～（５）のうちどれか。ただし、衛生管理者の選任の特例はないものとする。事業者は、衛生管理者をＡ人以上選任し、そのうち少なくとも１人をＢとしなければならない。衛生管理者は、少なくともＣ１回作業場等を巡視し、設備、作業方法又は衛生状態に有害のおそれのあるときは、直ちに、労働者の健康障害を防止するため必要な措置を講じなければならない。また、事業者は、衛生委員会又は安全衛生委員会（以下「委員会」という。）を毎月１回以上開催するようにしなければならず、委員会の開催の都度、委員会の意見及び当該意見を踏まえて講じた措置の内容等所定の事項を記録し、これをＤ年間保存しなければならない。ＡＢＣＤ","options":["２専任の衛生管理者毎月５","２衛生工学衛生管理者免許を有する者毎週３","３専任の衛生管理者毎週３","３衛生工学衛生管理者免許を有する者毎週２","３衛生工学衛生管理者免許を有する者毎月５"],"correctIndex":2,"category":"安全衛生管理・法令","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["安全衛生管理・法令"],"explanation":{"title":"安全衛生管理・法令","point":"安全衛生管理体制は、業種・常時使用労働者数・有害業務従事者数を順に確認し、総括安全衛生管理者、安全管理者、衛生管理者、産業医、各委員会の要件を個別に判定する。人数基準だけでなく、専任・専属、選任期限、巡視頻度、記録保存期間まで一組で覚える。","conclusion":"正答は（3）です。正しい組合せは、衛生管理者3人以上、そのうち少なくとも1人を専任、巡視は毎週1回、委員会記録は3年間保存。人数・有害業務人数・専任要件を順に判定する。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　２専任の衛生管理者毎月５\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　２衛生工学衛生管理者免許を有する者毎週３\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　３専任の衛生管理者毎週３\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　３衛生工学衛生管理者免許を有する者毎週２\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　３衛生工学衛生管理者免許を有する者毎月５","trap":"「選任する者」「指名する者」「意見を聴く者」を混同しない。義務は「しなければならない」、努力義務は「努めなければならない」で判定する。","keywords":"正答（3）／正しい組合せは、衛生管理者3人以上、そのうち少なくとも1人を専任、巡視は毎週1回、委員会記録は3年間保存。人数・有害業務人数・専任要件を順に判定する。\n数値チェック：600人、40人、１、５、１人、１回、２、３、3人、1人、1回、3年","related":"安全衛生管理体制は、業種・常時使用労働者数・有害業務従事者数を順に確認し、総括安全衛生管理者、安全管理者、衛生管理者、産業医、各委員会の要件を個別に判定する。人数基準だけでなく、専任・専属、選任期限、巡視頻度、記録保存期間まで一組で覚える。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question01/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-02","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":2,"question":"労働安全衛生法令に基づき定期自主検査を行わなければならない機械等とその実施頻度に関する下表のイ～ニの組合せについて、労働安全衛生法令上、正しいもののみを挙げたものは（１）～（５）のうちどれか。ただし、透過写真撮影用ガンマ線照射装置については、線源容器の遮蔽能力の異常の有無についての検査ではないものとする。また、有機溶剤中毒予防規則及び特定化学物質障害予防規則に基づく設備の特例や適用の除外はないものとする。","options":["イ ロ","イ ハ","ロ ハ","ロ ニ","ハ ニ　定期自主検査を行わなければならない 機械等実施頻度 イ　第二種有機溶剤等を用いて有機溶剤業務を 行う作業場所に設けた局所排気装置６か月以内ごとに１回 ロ　特定化学設備 １年以内ごとに１回 ハ　透過写真撮影用ガンマ線照射装置 １か月以内ごとに１回 ニ　シアン化ナトリウムを含有する排液の排液 処理装置１年以内ごとに１回"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。正しいのはハ・ニ。ガンマ線照射装置は1か月以内ごと、シアン化ナトリウム排液処理装置は1年以内ごとの自主検査。局所排気装置と特定化学設備の周期を混同しない。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　イ ロ\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　イ ハ\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ロ ハ\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ロ ニ\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　ハ ニ　定期自主検査を行わなければならない 機械等実施頻度 イ　第二種有機溶剤等を用いて有機溶剤業務を 行う作業場所に設けた局所排気装置６か月以内ごとに１回 ロ　特定化学設備 １年以内ごとに１回 ハ　透過写真撮影用ガンマ線照射装置 １か月以内ごとに１回 ニ　シアン化ナトリウムを含有する排液の排液 処理装置１年以内ごとに１回","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／正しいのはハ・ニ。ガンマ線照射装置は1か月以内ごと、シアン化ナトリウム排液処理装置は1年以内ごとの自主検査。局所排気装置と特定化学設備の周期を混同しない。\n数値チェック：１、５、６、１回、１年、1、1年","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question02/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-03","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":3,"question":"危険物及び有害物に関する規制に関する次の記述のうち、労働安全衛生法令上、正しいものはどれか。","options":["ベンゼンを含有するゴムのりで、その含有するベンゼンの容量が当該ゴムのりの溶剤（希釈剤を含む。）の５パーセントを超えるものを製造しようとする者は、あらかじめ、厚生労働大臣の許可を受けなければならない。","ベリリウムの化合物を製造しようとする者は、あらかじめ、当該化合物を製造する場所を管轄する都道府県労働局長の許可を受けなければならない。","新規化学物質を試験研究のために製造しようとする者は、一つの事業場における１年間の製造量が100キログラムを超えるときは、あらかじめ、当該新規化学物質の有害性の調査（当該新規化学物質が労働者の健康に与える影響についての調査をいう。）を行い、厚生労働大臣に届け出なければならない。","名称等を表示すべき有害物を容器（一般消費者の生活の用に供するためのものを除く。）に入れ、かつ、包装して、譲渡し、又は提供する者は、その容器に名称等を表示しなければならない。","名称等を表示すべき有害物を二つ以上含有する混合物を容器（一般消費者の生活の用に供するためのものを除く。）に入れ、又は包装して、譲渡し、又は提供する者は、その容器又は包装に当該有害物の成分及び含有量を表示しなければならない。"],"correctIndex":3,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（4）です。正しいのは容器に入れ、かつ包装して譲渡・提供する場合の容器表示。製造許可・新規化学物質届出・ラベル記載事項の主体と提出先を区別する。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ベンゼンを含有するゴムのりで、その含有するベンゼンの容量が当該ゴムのりの溶剤（希釈剤を含む。）の５パーセントを超えるものを製造しようとする者は、あらかじめ、厚生労働大臣の許可を受けなければならない。\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ベリリウムの化合物を製造しようとする者は、あらかじめ、当該化合物を製造する場所を管轄する都道府県労働局長の許可を受けなければならない。\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　新規化学物質を試験研究のために製造しようとする者は、一つの事業場における１年間の製造量が100キログラムを超えるときは、あらかじめ、当該新規化学物質の有害性の調査（当該新規化学物質が労働者の健康に与える影響についての調査をいう。）を行い、厚生労働大臣に届け出なければならない。\n\n（4）正しい：名称等表示対象物を容器に入れ、かつ包装して譲渡・提供する場合、容器への表示が必要。\n　名称等を表示すべき有害物を容器（一般消費者の生活の用に供するためのものを除く。）に入れ、かつ、包装して、譲渡し、又は提供する者は、その容器に名称等を表示しなければならない。\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　名称等を表示すべき有害物を二つ以上含有する混合物を容器（一般消費者の生活の用に供するためのものを除く。）に入れ、又は包装して、譲渡し、又は提供する者は、その容器又は包装に当該有害物の成分及び含有量を表示しなければならない。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（4）／正しいのは容器に入れ、かつ包装して譲渡・提供する場合の容器表示。製造許可・新規化学物質届出・ラベル記載事項の主体と提出先を区別する。\n数値チェック：５、１年、100","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question03/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-04","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":4,"question":"安全衛生教育に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。ただし、特別教育とは、危険又は有害な業務で、厚生労働省令で定めるものに労働者を就かせるときに行う当該業務に関する安全又は衛生のための特別の教育をいうものとする。","options":["事業者が労働者を雇い入れ、又は労働者の作業内容を変更したときに行う教育の事項には、事故時等における応急措置及び退避に関することが含まれる。","職長教育には、作業方法の決定及び労働者の配置に関すること、労働者に対する指導又は監督の方法に関することのほか、労働災害を防止するため必要な事項として、労働災害防止についての関心の保持及び労働者の創意工夫を引き出す方法が含まれる。","高圧室内作業に係る業務は特別教育の対象であるが、再圧室を操作する業務は特別教育の対象ではない。","強烈な騒音を発する作業に係る業務や重量物を取り扱う作業に係る業務は、特別教育の対象ではない。","事業者は、事業場における安全衛生の水準の向上を図るため、危険又は有害な業務に現に就いている者に対し、その業務に関する安全又は衛生のための教育を行うように努めなければならない。"],"correctIndex":2,"category":"物理的因子","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（3）です。誤りは、再圧室を操作する業務は特別教育の対象ではないとする記述。高気圧作業関係では高圧室内作業と再圧室操作の双方について教育・資格要件を確認する。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者が労働者を雇い入れ、又は労働者の作業内容を変更したときに行う教育の事項には、事故時等における応急措置及び退避に関することが含まれる。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　職長教育には、作業方法の決定及び労働者の配置に関すること、労働者に対する指導又は監督の方法に関することのほか、労働災害を防止するため必要な事項として、労働災害防止についての関心の保持及び労働者の創意工夫を引き出す方法が含まれる。\n\n（3）誤り：再圧室操作業務も特別教育の対象であり、「対象ではない」が誤り。\n　高圧室内作業に係る業務は特別教育の対象であるが、再圧室を操作する業務は特別教育の対象ではない。\n\n（4）正しい：記述どおり。設問の基準・定義に合致する。\n　強烈な騒音を発する作業に係る業務や重量物を取り扱う作業に係る業務は、特別教育の対象ではない。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、事業場における安全衛生の水準の向上を図るため、危険又は有害な業務に現に就いている者に対し、その業務に関する安全又は衛生のための教育を行うように努めなければならない。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（3）／誤りは、再圧室を操作する業務は特別教育の対象ではないとする記述。高気圧作業関係では高圧室内作業と再圧室操作の双方について教育・資格要件を確認する。","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question04/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-05","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":5,"question":"労働安全衛生法令に基づき作業環境測定を行わなければならない作業場及び測定事項、実施頻度又は測定時期並びに測定を実施すべき者に関する下表のイ～ホの組合せについて、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、ロ及びハについては、化学物質管理の水準が一定以上の事業場における関係規定の適用除外はないものとする。","options":["イ ロ ニ","イ ハ","イ ホ","ロ ハ ニ","ロ ホ　作業場及び測定事項 実施頻度又は測定時期測定を実施すべき者 イ　放射線業務を行う作業場のう ち管理区域に該当する部分における外部放射線による線量当量率又は線量当量１か月以内ごとに１回作業環境測定士 ロ　常時特定粉じん作業が行われ る屋内作業場における空気中の粉じんの濃度６か月以内ごとに１回作業環境測定士 ハ　鉛ライニングの業務を行う屋 内作業場における空気中の鉛の濃度６か月以内ごとに１回作業環境測定士 ニ　酸素欠乏危険場所において作 業を行う場合の当該作業場における空気中の酸素の濃度その日の作業を開始する前酸素欠乏危険作業特別教育を受講した者 ホ　中央管理方式の空気調和設備 を設けている建築物の室で、事務所の用に供されるものにおける一酸化炭素及び二酸化炭素の含有率２か月以内ごとに１回測定実施者の要件に関する規定なし"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。正しいのはロ・ホ。特定粉じん作業場の粉じん濃度は6か月以内ごとに作業環境測定士が測定し、中央管理方式空調のCO・CO2は2か月以内ごとで測定者資格の限定がない。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　イ ロ ニ\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　イ ハ\n\n（3）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　イ ホ\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　ロ ハ ニ\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　ロ ホ　作業場及び測定事項 実施頻度又は測定時期測定を実施すべき者 イ　放射線業務を行う作業場のう ち管理区域に該当する部分における外部放射線による線量当量率又は線量当量１か月以内ごとに１回作業環境測定士 ロ　常時特定粉じん作業が行われ る屋内作業場における空気中の粉じんの濃度６か月以内ごとに１回作業環境測定士 ハ　鉛ライニングの業務を行う屋 内作業場における空気中の鉛の濃度６か月以内ごとに１回作業環境測定士 ニ　酸素欠乏危険場所において作 業を行う場合の当該作業場における空気中の酸素の濃度その日の作業を開始する前酸素欠乏危険作業特別教育を受講した者 ホ　中央管理方式の空気調和設備 を設けている建築物の室で、事務所の用に供されるものにおける一酸化炭素及び二酸化炭素の含有率２か月以内ごとに１回測定実施者の要件に関する規定なし","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／正しいのはロ・ホ。特定粉じん作業場の粉じん濃度は6か月以内ごとに作業環境測定士が測定し、中央管理方式空調のCO・CO2は2か月以内ごとで測定者資格の限定がない。\n数値チェック：１、５、１回、６、２、6、2","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question05/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2023-06","subject":"労働衛生関係法令","year":2023,"yearLabel":"令和5年度","round":51,"number":6,"question":"労働安全衛生法令に基づく健康診断のうち、医師による健康診断に関する次の記述について、労働安全衛生法令上、誤っているものはどれか。","options":["事業者は、健康診断の結果（当該健康診断の項目に異常の所見があると診断された労働者に係るものに限る。）に基づき、当該労働者の健康を保持するために必要な措置について、医師の意見を聴かなければならない。","事業者は、健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は労働時間等設定改善委員会への報告その他の適切な措置を講じなければならない。","事業者は、法令に基づき選任した産業医に、健康診断の実施及びその結果に基づく労働者の健康を保持するための措置に関することについて、事業者又は総括安全衛生管理者に対して意見を述べる権限を与えなければならない。","事業者は、常時使用する労働者に対して１年以内ごとに１回、定期に行う健康診断について、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、既往歴及び業務歴の調査並びに身長、体重、腹囲、視力及び聴力の検査を省略することができる。","事業者は、重量物の取扱い等重激な業務に常時従事する労働者に対して、当該業務への配置替えの際及び６か月以内ごとに１回、定期に、健康診断を行わなければならない。"],"correctIndex":3,"category":"統計・疫学","cluster":"健康診断・健康管理","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","conclusion":"正答は（4）です。誤りは、既往歴・業務歴等まで医師判断で省略できるとする記述。省略可能項目は限定され、本人同意で自由に省略できない。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、健康診断の結果（当該健康診断の項目に異常の所見があると診断された労働者に係るものに限る。）に基づき、当該労働者の健康を保持するために必要な措置について、医師の意見を聴かなければならない。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は労働時間等設定改善委員会への報告その他の適切な措置を講じなければならない。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、法令に基づき選任した産業医に、健康診断の実施及びその結果に基づく労働者の健康を保持するための措置に関することについて、事業者又は総括安全衛生管理者に対して意見を述べる権限を与えなければならない。\n\n（4）誤り：既往歴・業務歴は省略対象ではなく、身長等の省略も限定要件による。\n　事業者は、常時使用する労働者に対して１年以内ごとに１回、定期に行う健康診断について、厚生労働大臣が定める基準に基づき、医師が必要でないと認めるときは、既往歴及び業務歴の調査並びに身長、体重、腹囲、視力及び聴力の検査を省略することができる。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　事業者は、重量物の取扱い等重激な業務に常時従事する労働者に対して、当該業務への配置替えの際及び６か月以内ごとに１回、定期に、健康診断を行わなければならない。","trap":"割合だけを暗記せず、対象集団と分母を確認する。感度と陽性的中率、特異度と陰性的中率を入れ替えない。","keywords":"正答（4）／誤りは、既往歴・業務歴等まで医師判断で省略できるとする記述。省略可能項目は限定され、本人同意で自由に省略できない。\n数値チェック：１年、１回、６","related":"統計問題では、調査名、対象年、分母、件数の定義を最初に固定する。疫学指標は、感度＝真陽性／疾病あり、特異度＝真陰性／疾病なし、有病率＝患者数／対象人口、罹患率＝新規発症数／リスク人口・人時間で区別する。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2023/low-question06/","sourceType":"公表過去問＋濃厚解説データ","currentBa
