<script>
const DATA={"questions":[{"id":"general-2025-01","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":1,"question":"労働衛生管理に関する次のイ～ニの措置について、作業管理に該当するもの のみを全て挙げたものは（１）～（５）のうちどれか。 イ 強烈な騒音を発する作業場所であることを標識によって明示する。 ロ じん肺管理区分が管理２となった労働者を粉じん作業以外の作業に配置 転換する。 ハ 塗装作業に使用する塗料を有害性の低いものに変更する。 ニ 介護・看護作業において、福祉用具を導入して省力化を行う。","options":["イ ロ ハ","イ ハ","イ ニ","ロ ハ ニ","ロ ニ"],"tags":["作業環境測定","粉じん・石綿・じん肺","騒音・振動","人間工学・腰痛","労働衛生管理総論"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"労働衛生管理総論","cluster":"管理・マネジメント","explanation":{"answer":"（3）","point":"対策が「作業場・発生源」「作業方法・ばく露」「労働者の健康」のどこに働きかけるかを分類する問題である。同じ腰痛・騒音対策でも、設備改善なら作業環境管理、作業手順や標識なら作業管理、健診や配置転換なら健康管理となる。","conclusion":"作業管理に該当するのはイ（標識による明示）とニ（福祉用具による作業方法の省力化）であり、正答は（3）。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nイ：騒音作業場所を標識で明示：標識により労働者の立入り、滞在、保護具使用等の行動を管理するため作業管理に分類する。騒音源を低騒音化する措置とは異なる。\n（2）\n誤り\nロ：じん肺管理2の者を粉じん作業外へ配置転換：健康状態・じん肺管理区分に基づく就業措置であり健康管理。正しくは「健康管理に該当する」。\n（3）\n誤り\nハ：塗料を低有害性品へ変更：有害物の代替は発生源対策で、作業環境管理の最優先措置。正しくは「作業環境管理に該当する」。\n（4）\n正しい\nニ：介護・看護作業に福祉用具を導入：抱上げ等の作業方法を変え、身体負担・ばく露を低減する作業管理。設備導入を伴っても、中心目的が作業方法・負担の改善なら作業管理と判断する。\n（5）\n誤り\n組合せ肢：作業管理のみはイ・ニであるため（1）（2）（4）（5）は不適切。","evidence":"[R02] 厚生労働省「労働衛生の3管理」関連資料／[R21] 厚生労働省「職場における腰痛予防対策指針及び解説」","related":"三管理は相互に重なるが、試験では「対策が直接変える対象」で分類する。代替・密閉・局排は環境、作業時間・手順・保護具・省力化は作業、健診・保健指導・適正配置は健康で押さえる。","trap":"「器具を導入した＝設備＝作業環境管理」と短絡しない。福祉用具は介護者の動作・負担を変えるため、ここでは作業管理。","keywords":"代替＝作業環境管理／作業方法・標識・保護具＝作業管理／健診・配置転換＝健康管理","current":"【試験当時】三管理の基本分類は現行と同じ。【現在】化学物質の自律的管理でも、代替→工学的対策→管理的対策→保護具という優先順位が強調される。","title":"労働衛生管理の三管理","refs":[{"code":"R02","label":"厚生労働省「労働衛生の3管理」関連資料","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121.html"},{"code":"R21","label":"厚生労働省「職場における腰痛予防対策指針及び解説」","url":"https://www.mhlw.go.jp/content/11303000/001376468.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question01/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-02","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":2,"question":"受動喫煙及びその防止対策に関する次の記述のうち、誤っているものはどれ か。","options":["たばこの煙には、喫煙者が吸う「主流煙」のほかに、喫煙者が一旦吸い込 んだ煙を吐き出す「呼出煙」、たばこの点火部から立ち上る「副流煙」があ る。","副流煙や呼出煙がじゅうたんや壁紙に付着して、その後、揮発・浮遊した 有害物質を吸い込むことを「二次喫煙」という。","たばこ１本から発生する発がん物質の量は、主流煙よりも副流煙の方が多 い。","受動喫煙と虚血性心疾患には、因果関係を推定する十分な科学的証拠があ る。","厚生労働省の「職場における受動喫煙防止のためのガイドライン」によれ ば、一般の事務所や工場では、原則として屋内禁煙とする。"],"tags":["化学物質管理","健康診断・健康管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":1,"category":"受動喫煙","cluster":"健康管理","explanation":{"answer":"（2）","point":"主流煙・副流煙・呼出煙の定義、受動喫煙の健康影響、残留物による「三次喫煙」を区別する。用語の番号が最大のひっかけである。","conclusion":"壁紙等に付着した成分が再放散して曝露する現象は一般に「三次喫煙（third-hand smoke）」であり、「二次喫煙」とする（2）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n主流煙・呼出煙・副流煙の区分：主流煙は喫煙者が吸い込む煙、呼出煙は吐き出す煙、副流煙は点火部から立ち上る煙。受動喫煙は主に副流煙と呼出煙の混合への曝露。\n（2）\n誤り\n付着後に再揮発・再浮遊した物質を二次喫煙とする：これは三次喫煙。正しくは「三次喫煙という」。二次喫煙は他人のたばこ煙をその場で吸入する受動喫煙を指す。\n（3）\n正しい\n1本当たりの発がん物質量は副流煙が多い：副流煙は低温・不完全燃焼で生じ、物質によって主流煙より高濃度となる。比較は喫煙者の実吸入量ではなく、発生煙中・1本当たりの量である点に注意。\n（4）\n正しい\n受動喫煙と虚血性心疾患の因果関係：国のたばこ白書等で、受動喫煙と虚血性心疾患・脳卒中等には因果関係を推定する十分な証拠があると評価される。\n（5）\n正しい\n一般の事務所・工場は原則屋内禁煙：職場ガイドラインは望まない受動喫煙を防ぐため、事業場の実情に応じつつ原則屋内禁煙を基本とする。","evidence":"[R03] 厚生労働省「職場における受動喫煙防止のためのガイドライン」","related":"受動喫煙対策は、健康増進法上の施設類型に応じた規制と、安衛法上の事業者の努力義務・職場ガイドラインを重ねて理解する。空間分煙より屋内禁煙が優先される。","trap":"「second-hand＝二次」「third-hand＝三次」を逆にしない。副流煙が多いという記述は、喫煙者の総吸入量と混同しやすい。","keywords":"副流煙／呼出煙／受動喫煙＝二次喫煙／残留・再放散＝三次喫煙／原則屋内禁煙","current":"【試験当時・現在】基本的な考え方は同じ。加熱式たばこも職場の受動喫煙対策の対象として扱う。","title":"受動喫煙と三次喫煙","refs":[{"code":"R03","label":"厚生労働省「職場における受動喫煙防止のためのガイドライン」","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000189195.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question02/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-03","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":3,"question":"厚生労働省の労働衛生統計等に関する次のイ～ニの記述について、正しいも ののみを全て挙げたものは（１）～（５）のうちどれか。 イ 「定期健康診断結果調」によると、令和５年は、いずれかの健康診断項 目に所見のあった者の人数の割合（有所見率）は約60％で、健康診断項目 別では血糖検査の有所見率が最も高く約30％であった。 ロ 「業務上疾病調」によると、令和５年は、新型コロナウイルス感染症の 罹患によるものを除き、業務上疾病総数は約１万人であり、そのうち負傷 に起因する疾病が最も多く約7,500人、次いで多いものが物理的因子による 疾病で約1,400人であった。 ハ 「じん肺健康管理実施結果調」によると、令和５年は、じん肺健康診断 受診労働者数約30万人のうち、有所見者数は約9,000人で、そのうち管理１ であった者が管理２以上になった新規有所見者数は約1,000人であった。 ニ 「令和５年労働安全衛生調査（実態調査）」によると、調査対象事業場の うち事業場規模50人以上の事業場において、労働安全衛生法に基づくスト レスチェックを実施した事業場の割合は約80％であり、そのうち、ストレ スチェック結果の集団ごとの分析を実施した事業場の割合は約80％であっ た。","options":["イ ロ ハ","イ ハ","イ ニ","ロ ハ ニ","ロ ニ"],"tags":["粉じん・石綿・じん肺","健康診断・健康管理","疫学・統計","労働衛生管理総論"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"労働衛生統計","cluster":"疫学・統計","explanation":{"answer":"（5）","point":"複数の統計を、調査名・母集団・年度・分母とともに照合する問題である。「約」という表現でも、順位や桁が違えば誤りになる。","conclusion":"ロとニが正しく、正答は（5）。イは項目別1位が血糖ではなく血中脂質、ハはじん肺有所見者数が約2.7万人であり約9千人ではない。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nイ：有所見率約60％、血糖が最多で約30％：令和5年の総有所見率は58.9％で「約60％」はよいが、項目別最多は血中脂質31.2％。血糖は13.1％。正しくは「血中脂質検査が最も高く約31％」。\n（2）\n正しい\nロ：コロナ除外の業務上疾病約1万人、負傷起因約7,500人、物理因子約1,400人：令和5年業務上疾病調の概数と整合する。物理的因子には熱中症等が含まれ、コロナを含めるかで総数が大きく変わる。\n（3）\n誤り\nハ：受診約30万人、有所見約9,000人、新規約1,000人：受診302,070人、新規有所見916人は概ね合うが、有所見者は27,164人。正しくは「有所見者約2.7万人、新規有所見約900人」。\n（4）\n正しい\nニ：50人以上でストレスチェック約80％、そのうち集団分析約80％：全50人以上事業所を分母にした実施割合は約81.8％、実施事業所中の集団分析は78.9％で、いずれも約80％。\n（5）\n誤り\n組合せ肢：正しいのはロ・ニのみであるため（5）。","evidence":"[R04] 厚生労働省「令和5年業務上疾病発生状況（業種別・疾病別）」／[R05] 厚生労働省「令和5年 労働安全衛生調査（実態調査）の概況」／[R31] 厚生労働省「令和6年 定期健康診断実施結果（全国値掲載資料）」","related":"統計肢は、①年、②調査名、③対象事業場規模、④分母、⑤除外条件、⑥件数か率かを欄外にメモして照合する。令和5年定期健診は「58.9、31.2、13.1」をセットで覚える。","trap":"総有所見率が約60％という前半だけでイを正しいと判断しない。じん肺の「健康診断受診者」「有所見者」「新規有所見者」は桁が異なる。","keywords":"令和5年：総有所見58.9％／血中脂質31.2％／血糖13.1％／じん肺受診302,070・有所見27,164・新規916","current":"【試験当時】令和5年値を用いる。【現在】令和6年定期健診の全国総有所見率は59.4％、血中脂質31.2％。過去問の正答は令和5年値で判定する。","title":"令和5年の労働衛生統計","refs":[{"code":"R04","label":"厚生労働省「令和5年業務上疾病発生状況（業種別・疾病別）」","url":"https://www.mhlw.go.jp/content/11300000/001292235.pdf"},{"code":"R05","label":"厚生労働省「令和5年 労働安全衛生調査（実態調査）の概況」","url":"https://www.mhlw.go.jp/toukei/list/dl/r05-46-50_gaikyo.pdf"},{"code":"R31","label":"厚生労働省「令和6年 定期健康診断実施結果（全国値掲載資料）」","url":"https://jsite.mhlw.go.jp/gunma-roudoukyoku/content/contents/002293626.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question03/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-04","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":4,"question":"有害物質の性状、空気中での状態などに関する次の記述のうち、誤っている ものはどれか。","options":["固体に研磨、切削、粉砕等の機械的な作用を加えて発生した固体微粒子が 空気中に浮遊しているものを粉じんという。","金属の蒸気が空気中で凝固や化学変化を起こし、固体の微粒子となって空 気中に浮遊しているものをヒュームという。","常温、常圧で気体の状態であるものをガスという。","液体の微細な粒子が空気中に浮遊しているものをミストという。","常温、常圧で液体又は固体の物質が蒸気圧に応じて揮発又は昇華して気体 になっているものをエアロゾルという。"],"tags":["粉じん・石綿・じん肺","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"化学物質・有害因子","cluster":"化学物質","explanation":{"answer":"（5）","point":"粉じん、ヒューム、ミスト、ガス、蒸気、エアロゾルを、生成過程と相の組合せで区別する。","conclusion":"液体・固体が蒸気圧に応じて気体になったものは「蒸気」であり、エアロゾルではないため（5）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n粉じん：固体を研磨・切削・粉砕等した固体微粒子が空気中に分散したもの。生成過程が機械的。\n（2）\n正しい\nヒューム：金属等が一度蒸気となり、凝縮・酸化等で極微細固体粒子となったもの。溶接ヒュームが典型。\n（3）\n正しい\nガス：常温常圧で気体の物質。酸素、窒素、一酸化炭素、硫化水素等。\n（4）\n正しい\nミスト：液体微粒子が空気中に浮遊したもの。噴霧、凝縮、泡の破裂等で生じる。\n（5）\n誤り\nエアロゾル：蒸発・昇華で気体になったものは蒸気。エアロゾルは気体中に固体又は液体粒子が分散した系の総称。正しくは「蒸気という」。","evidence":"[R17] 職場のあんぜんサイト「GHS対応モデルSDS情報」","related":"「物質の通常状態」と「空気中での形」を分ける。蒸気は分子状の気体、ミスト・粉じん・ヒュームは粒子状。エアロゾルは粒子分散系の上位概念である。","trap":"「昇華した固体だから粒子」と考えない。昇華直後の分子状気体は蒸気であり、凝縮して粒子化すればヒューム等になる。","keywords":"機械的固体粒子＝粉じん／凝縮固体粒子＝ヒューム／液滴＝ミスト／分子状＝ガス・蒸気","current":"【試験当時・現在】定義に実質的変更なし。","title":"有害物質の空気中での状態","refs":[{"code":"R17","label":"職場のあんぜんサイト「GHS対応モデルSDS情報」","url":"https://anzeninfo.mhlw.go.jp/anzen_pg/GHS_MSD_FND.aspx"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question04/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-05","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":5,"question":"石綿に関する次の記述のうち、誤っているものはどれか。","options":["石綿が肺組織や胸膜などに長く滞留することが原因となって、肺がんや中 皮腫が発生すると考えられている。","石綿のばく露作業者が喫煙している場合、肺がんの罹患リスクが増大する。 り","石綿ばく露によって生じる肺がんは、通常の肺がんと比較して、発生部位、 病理組織型が大きく異なる。","中皮腫の罹患リスクは石綿の種類によって異なり、クロシドライトは他の 石綿に比べてリスクが高い。","石綿関連疾患の中で、中皮腫は潜伏期間が長く、他の石綿関連疾患に比べ て、より少ないばく露量でも罹患する。"],"tags":["粉じん・石綿・じん肺"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"石綿・じん肺","cluster":"粉じん・石綿","explanation":{"answer":"（3）","point":"石綿肺、肺がん、中皮腫、びまん性胸膜肥厚等の特徴と、喫煙との相互作用、石綿種によるリスク差を問う。","conclusion":"石綿による肺がんは臨床・病理学的に一般の肺がんと大きく異ならないため（3）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n長期滞留と発がん：生体内に残留しやすい繊維が慢性炎症、酸化ストレス等を介して肺がん・中皮腫に関与する。\n（2）\n正しい\n喫煙との相互作用：石綿ばく露と喫煙は肺がんリスクを大きく高める。中皮腫について喫煙は主要なリスク増強因子ではない。\n（3）\n誤り\n発生部位・病理組織型が大きく異なる：石綿関連肺がんに特異的な部位・組織型はなく、通常の肺がんとの鑑別はばく露歴等で行う。正しくは「大きな差はない」。\n（4）\n正しい\nクロシドライトのリスク：角閃石系のクロシドライトは、クリソタイル等より中皮腫リスクが高いとされる。\n（5）\n正しい\n中皮腫の長い潜伏期間と低ばく露でも発症：潜伏期間は数十年に及ぶことが多く、肺線維症を生じるほどの高濃度ばく露がなくても発症し得る。","evidence":"[R06] 環境省「石綿と健康被害」・厚生労働省石綿関連資料","related":"肺がんの業務起因性は、石綿肺所見、胸膜プラーク、石綿小体・繊維数、ばく露作業歴等を総合評価する。中皮腫は胸膜が最多だが腹膜等にも生じる。","trap":"肺がんと中皮腫を混同しない。喫煙は肺がんを増強するが、中皮腫の主要因ではない。","keywords":"潜伏数十年／肺がんは非特異的／クロシドライト高リスク／喫煙×石綿＝肺がんリスク増大","current":"【試験当時・現在】疾患概念は同じ。石綿事前調査結果報告・有資格者調査等の制度は近年強化されているが、本問の医学的正誤には影響しない。","title":"石綿関連疾患","refs":[{"code":"R06","label":"環境省「石綿と健康被害」・厚生労働省石綿関連資料","url":"https://www.env.go.jp/air/asbestos/"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question05/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-06","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":6,"question":"じん肺に関する次の記述のうち、適切でないものはどれか。","options":["鉱物、金属、研磨材、炭素原料等の粉じんの吸入により生じる。","肺内では線維増殖性変化が生じる。","初期にはチアノーゼなどの低酸素血症による症状が生じる。","合併症として、肺結核、原発性肺がん、続発性気胸が生じることがある。","じん肺の病変は不可逆性である。"],"tags":["粉じん・石綿・じん肺"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"石綿・じん肺","cluster":"粉じん・石綿","explanation":{"answer":"（3）","point":"粉じん吸入による肺線維化の進行、初期症状、不可逆性、法定合併症を整理する。","conclusion":"じん肺は初期には無症状であることが多く、チアノーゼは進行した低酸素血症でみられるため（3）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n原因粉じん：鉱物、金属、研磨材、炭素原料等の粉じんの長期吸入で生じる。\n（2）\n正しい\n肺内の線維増殖性変化：粉じんに対する炎症・線維化が基本病態。胸部画像所見と肺機能障害で評価する。\n（3）\n誤り\n初期からチアノーゼ：初期は自覚症状に乏しい。咳、痰、息切れ、低酸素血症・チアノーゼは進行例で目立つ。正しくは「初期は無症状のことが多い」。\n（4）\n正しい\n合併症：法定合併症には肺結核、結核性胸膜炎、続発性気管支炎、続発性気管支拡張症、続発性気胸、原発性肺がんがある。\n（5）\n正しい\n不可逆性：成立した線維化は基本的に不可逆で、粉じん作業離脱後も進行することがある。","evidence":"[R07] 厚生労働省「じん肺診査ハンドブック」等","related":"「じん肺管理区分」は管理1～4。管理1はじん肺所見なし、管理2・3は所見あり、管理4は療養を要する。健康管理と粉じんばく露防止を並行する。","trap":"「重篤な病気だから初期から症状が強い」という直感が誤り。画像所見が先行し、症状は遅れて現れることがある。","keywords":"初期無症状／線維化は不可逆／法定6合併症／管理4＝療養","current":"【試験当時・現在】医学的内容は同じ。令和7年1月からじん肺健康管理実施状況報告等は原則電子申請となった。","title":"じん肺の病態と合併症","refs":[{"code":"R07","label":"厚生労働省「じん肺診査ハンドブック」等","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000152476.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question06/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-07","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":7,"question":"電離放射線に関する次の記述のうち、誤っているものはどれか。","options":["ベータ線は電子からなる粒子線で、１価のマイナスの電荷を持っている。","放射線防護のための線量として、吸収線量に放射線加重（荷重）係数で重 み付けした等価線量を用いる。","電離放射線が物質を透過する際に、原子又は分子から電子を放出させるこ とを電離作用という。","電磁波であるエックス線は、粒子線である中性子線より物質を透過する力 が強い。","エックス線とガンマ線の違いは波長によるものではない。"],"tags":["放射線・有害光線"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"物理因子","cluster":"物理因子","explanation":{"answer":"（4）","point":"粒子線・電磁波、電離作用、吸収線量・等価線量、X線とγ線の区別を問う。透過力はエネルギーと物質に依存し、単純な固定順位ではない。","conclusion":"中性子線は電荷を持たず高い透過性を示し得るため、「X線の方が中性子線より透過力が強い」と一律にいう（4）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nβ線：通常のβ−線は高速電子で、電荷は−1。β＋線は陽電子だが、本問は一般的なβ線の説明。\n（2）\n正しい\n等価線量：組織・臓器の吸収線量に放射線加重係数を乗じ、放射線の種類による生物影響差を反映する。単位はSv。\n（3）\n正しい\n電離作用：放射線が原子・分子から電子をはじき出しイオンを作る作用。\n（4）\n誤り\nX線は中性子線より透過力が強い：透過力はエネルギーや遮蔽材に依存し、中性子線は一般に高い透過性を持つ。正しくは「一律にはいえず、中性子線は高い透過力を示す」。\n（5）\n正しい\nX線とγ線：ともに電磁波で、区別は主に発生起源。X線は原子核外電子過程、γ線は原子核遷移等に由来し、波長域は重なり得る。","evidence":"[R08] 環境省「放射線による健康影響等に関する統一的な基礎資料」","related":"吸収線量Gy＝単位質量当たり吸収エネルギー。等価線量Sv＝吸収線量×放射線加重係数。実効線量Sv＝等価線量×組織加重係数を全組織で合計。","trap":"「X線・γ線＝強い、粒子線＝弱い」という暗記は危険。α線は外部透過性が低いが内部被ばく影響が大きく、中性子線は遮蔽が難しい。","keywords":"Gy＝吸収線量／Sv＝等価・実効線量／X線とγ線は起源で区別／β−＝電子","current":"【試験当時・現在】基本概念は同じ。眼の水晶体の等価線量限度は2021年4月から5年平均20 mSv/年かつ単年50 mSv（経過措置あり）で、今後も頻出。","title":"電離放射線の種類と線量","refs":[{"code":"R08","label":"環境省「放射線による健康影響等に関する統一的な基礎資料」","url":"https://www.env.go.jp/chemi/rhm/basic_data.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question07/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-08","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":8,"question":"潜水による健康障害に関する次の記述のうち、適切でないものはどれか。","options":["環境圧の変化に伴い、体内の閉鎖空間で体積の変化が生じ気圧外傷を起こ す。","寝不足、疲労、脱水及び肥満は、減圧症の発症リスクを高める要因となる。","減圧すると組織内に取り込まれた二酸化炭素が過飽和状態となり、気泡が 組織や血管内に形成され減圧症が生じる。","減圧時に肺が過膨脹となってガスが動脈系に入ると、末梢の組織で気泡に ちょう しょう よる動脈ガス塞栓症が生じる。","水温が低い環境で運動の負荷が大きいと、肺水腫が生じる可能性が高い。"],"tags":["高気圧・酸欠","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"高気圧・潜水","cluster":"物理因子","explanation":{"answer":"（3）","point":"ボイルの法則による気圧外傷、溶解ガスによる減圧症、肺過膨張による動脈ガス塞栓症、浸漬性肺水腫を区別する。","conclusion":"減圧症で過飽和となり気泡を形成する主なガスは窒素等の不活性ガスであり、二酸化炭素ではないため（3）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n気圧外傷：圧変化により中耳、副鼻腔、肺等の閉鎖・半閉鎖空間の気体体積が変化し損傷する。\n（2）\n正しい\n発症リスク：疲労、脱水、肥満、寝不足、寒冷、激しい運動等は減圧症リスクを高め得る。\n（3）\n誤り\n二酸化炭素の過飽和：主因は高圧下で組織に溶け込んだ窒素等。減圧が速いと気泡化する。正しくは「窒素等の不活性ガス」。\n（4）\n正しい\n動脈ガス塞栓症：息を止めたまま浮上する等で肺胞ガスが膨張し肺損傷を起こし、ガスが動脈系へ入り脳等を塞栓する。\n（5）\n正しい\n浸漬性肺水腫：寒冷水、運動負荷、血液の胸腔内移動等で発症しやすく、呼吸困難・咳・血性泡沫痰等を呈する。","evidence":"[R09] 厚生労働省「潜水業務における現場でできる応急対応に関する研究」／[R34] 厚生労働省「高気圧作業安全衛生規則に基づく再圧室等Q&A」","related":"減圧症と動脈ガス塞栓症を合わせて減圧障害と呼ぶことがある。初期対応は酸素投与、安静、早期の専門医療・再圧治療につなぐ。","trap":"「減圧＝気体が出る」まで正しくても、気体の種類をCO2に置き換えたひっかけ。","keywords":"窒素過飽和＝減圧症／肺過膨張＝動脈ガス塞栓／圧平衡不全＝気圧外傷","current":"【試験当時・現在】基本概念は同じ。高気圧作業安全衛生規則に基づく減圧管理と特別教育を併せて確認する。","title":"潜水による減圧障害","refs":[{"code":"R09","label":"厚生労働省「潜水業務における現場でできる応急対応に関する研究」","url":"https://www.mhlw.go.jp/content/001104996.pdf"},{"code":"R34","label":"厚生労働省「高気圧作業安全衛生規則に基づく再圧室等Q&A」","url":"https://www.mhlw.go.jp/file/06-Seisakujouhou-11200000-Roudoukijunkyoku/0000201216.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question08/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-09","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":9,"question":"酸素欠乏症及び硫化水素中毒とその予防に関する次の記述のうち、適切でな いものはどれか。","options":["空気中の酸素濃度が約16％を下回ると脈拍数や呼吸数の増加が現れる。","酸素濃度が６％未満の空気を１回でも吸入すると、意識喪失のリスクがあ る。","酸素欠乏症の症状は、重度の筋作業中や疲労しているときに重症化する。","硫化水素は無色で腐卵臭があり、水には溶けにくい。","硫化水素濃度20～30ppmで嗅覚疲労、100～300ppmで嗅覚神経麻痺が起こる。 ひ"],"tags":["高気圧・酸欠","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"酸素欠乏・硫化水素","cluster":"物理因子","explanation":{"answer":"（4）","point":"酸素濃度低下による症状の進行と、硫化水素の物性・嗅覚麻痺を問う。臭いの有無を安全判断に用いてはいけない。","conclusion":"硫化水素は水に溶けるため、「水に溶けにくい」とする（4）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n酸素約16％未満：呼吸・脈拍増加、集中力低下等が現れ得る。法令上の酸素欠乏は18％未満で、症状発現値と定義値は別。\n（2）\n正しい\n6％未満：1回の吸入でも急速な意識喪失、けいれん、呼吸停止に至り得る極めて危険な濃度。\n（3）\n正しい\n筋作業・疲労で重症化：酸素需要が増大し、同じ環境濃度でも組織低酸素が進みやすい。\n（4）\n誤り\n硫化水素は水に溶けにくい：無色・腐卵臭は正しいが、水に溶ける。正しくは「水に溶ける（比較的溶解性がある）」。\n（5）\n正しい\n嗅覚疲労・嗅覚麻痺：低～中濃度で臭いを感じても、濃度上昇や時間経過で嗅覚が麻痺し、臭わなくなる。臭気による退避判断は不可。","evidence":"[R10] 職場のあんぜんサイト「硫化水素 SDS」","related":"救助者の二次災害が多い。換気・濃度測定・送気マスク等を確保せず進入しない。酸素欠乏危険作業では作業主任者、測定、換気、特別教育等が必要。","trap":"法令の定義「18％未満」と、症状が目立つ「16％付近」を混同しない。硫化水素は高濃度ほど臭いが強いとは限らない。","keywords":"酸欠定義＜18％／16％で呼吸・脈拍増／6％未満は即時危険／H2Sは嗅覚麻痺","current":"【試験当時・現在】基本は同じ。酸欠・硫化水素区域への無防備な救助進入をしないことが最重要。","title":"酸素欠乏症と硫化水素中毒","refs":[{"code":"R10","label":"職場のあんぜんサイト「硫化水素 SDS」","url":"https://anzeninfo.mhlw.go.jp/anzen/gmsds/7783-06-4.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question09/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-10","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":10,"question":"騒音性難聴に関する次の記述のうち、適切でないものはどれか。","options":["著しい騒音にばく露される業務に長期間引き続き従事した際に発生する。","鼓膜や中耳に著変がない。","騒音作業を離れるとほとんど増悪しない。","初期の段階では、オージオグラムがc5dipの型を示す。","オージオグラムでは、骨導値より気導値に顕著な低下が見られる。"],"tags":["騒音・振動"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"騒音","cluster":"物理因子","explanation":{"answer":"（5）","point":"騒音性難聴の感音性難聴としての特徴、C5 dip、離職後の経過、気導・骨導の関係を確認する。","conclusion":"感音性難聴では気導と骨導がともに低下し、著明な気骨導差は生じないため（5）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n長期騒音ばく露：著しい騒音への長期反復ばく露で徐々に進行する。爆発音等の急性音響外傷とは区別。\n（2）\n正しい\n鼓膜・中耳に著変なし：障害部位は主に蝸牛有毛細胞で、伝音系は保たれる。\n（3）\n正しい\n騒音離脱後は通常ほぼ増悪しない：加齢性難聴等は進むが、騒音による上乗せ進行はばく露停止で原則止まる。\n（4）\n正しい\nC5 dip：初期に4,000 Hz付近の聴力低下が目立ち、オージオグラムでノッチを示す。\n（5）\n誤り\n気導のみ顕著に低下：気導と骨導が同程度に低下する感音性難聴。正しくは「気導値と骨導値がともに低下し、著明な気骨導差はない」。","evidence":"[R11] 厚生労働省「騒音障害防止のためのガイドライン」関連資料","related":"伝音性難聴は気導が骨導より悪く気骨導差がある。感音性難聴は両者が低下。混合性は両方の要素を持つ。","trap":"「耳の病気＝鼓膜」「騒音＝気導検査だけ低下」という誤解を狙う。","keywords":"C5 dip＝4 kHz／感音性／気骨導差なし／不可逆・予防重視","current":"【試験当時】令和5年改訂騒音障害防止ガイドラインを踏まえる。【現在】同ガイドラインが現行で、個人ばく露測定・聴覚保護具の選定等が重視される。","title":"騒音性難聴","refs":[{"code":"R11","label":"厚生労働省「騒音障害防止のためのガイドライン」関連資料","url":"https://www.mhlw.go.jp/stf/newpage_32483.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question10/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-11","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":11,"question":"熱中症に関する次のイ～ニの記述について、適切なもののみを全て挙げたも のは（１）～（５）のうちどれか。 イ 熱中症の重症度分類において、Ⅳ度のみ症状に意識障害や中枢神経症状 が含まれる。 ロ 職場における熱中症による休業４日以上の死傷者数は、令和元年から令 和５年の５年間において、500人を下回った年はない。 ハ 代謝率レベルの高い作業を行うときのＷＢＧＴ基準値は、代謝率レベルの 低い作業より高くなる。 ニ 作業中の衣類は、暑熱環境において健康影響を受けるかどうかの要因に 含まれ、衣類の組合せに応じた着衣補正値をＷＢＧＴ値に加算する。","options":["イ ロ ハ","イ ハ","イ ニ","ロ ハ ニ","ロ ニ"],"tags":["暑熱・熱中症"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"暑熱・熱中症","cluster":"物理因子","explanation":{"answer":"（5）","point":"重症度分類、発生統計、代謝率別WBGT基準値、着衣補正を組み合わせた問題。基準値の方向を理解する。","conclusion":"ロとニが適切で、正答は（5）。イは中枢神経症状がIII度にも含まれ、ハは高代謝作業ほど基準値が低くなる。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nイ：意識障害・中枢神経症状はIV度のみ：新しい分類でもIII度に中枢神経症状等が含まれる。正しくは「III度及びIV度でみられ得る」。\n（2）\n正しい\nロ：令和元～5年の死傷者はいずれも500人以上：休業4日以上の職場熱中症は各年500人を下回っていない。年ごとの速報・確定値を区別する。\n（3）\n誤り\nハ：高代謝作業ほどWBGT基準値が高い：体内産熱が増えるため許容できる環境熱は小さくなり、基準値は低くなる。正しくは「高代謝ほど低い」。\n（4）\n正しい\nニ：着衣補正値を加算：通気性の悪い衣類等では実質的熱負荷が増えるため、測定WBGTに着衣補正値を加えて基準値と比較する。\n（5）\n誤り\n組合せ肢：適切なのはロ・ニのみ。","evidence":"[R12] 厚生労働省「職場における熱中症予防基本対策要綱」・令和7年改正","related":"WBGTは自然湿球温度・黒球温度・乾球温度から算出し、気温だけでは評価できない。屋内等：0.7NWB＋0.3GT、屋外日射下：0.7NWB＋0.2GT＋0.1DB。","trap":"代謝率が高いほど「耐えられる基準値も高い」と逆転して覚えない。補正値は衣類によりWBGTへ「加算」する。","keywords":"高代謝→基準値低下／着衣補正は加算／WBGT≠気温／III・IV度に中枢神経症状","current":"【試験当時】法令基準日は2025年4月1日で、安衛則612条の2はまだ施行前。【2026-09-25現在】2025年6月1日から、一定の暑熱作業で報告体制の整備・周知、重篤化防止手順の作成・周知が義務化。問11の正答番号自体は変わらない。","title":"熱中症とWBGT","refs":[{"code":"R12","label":"厚生労働省「職場における熱中症予防基本対策要綱」・令和7年改正","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000116133.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question11/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["heat2025"],"detailLevel":"濃厚"},{"id":"general-2025-12","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":12,"question":"厚生労働省の「情報機器作業における労働衛生管理のためのガイドライン」 に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは （１）～（５）のうちどれか。 イ 本ガイドラインの対象となる情報機器には、スマートフォンは含まれな い。 ロ 一般に、直接照明は間接照明よりもグレア防止に効果的である。 ハ ディスプレイ画面の明るさと周辺の明るさとの差は、なるべく小さくす る。 ニ 一連続作業時間は１時間以内とし、一連続作業時間内において１～２回 程度の小休止を設ける。","options":["イ ロ ハ","イ ロ","ロ ハ ニ","ハ ニ","ニ"],"tags":["人間工学・腰痛","労働衛生管理総論"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"人間工学・情報機器","cluster":"人間工学","explanation":{"answer":"（4）","point":"対象機器、グレア、明るさ、連続作業時間・小休止を問う。旧VDT指針の知識を現行ガイドラインに更新する。","conclusion":"ハとニが適切で、正答は（4）。スマートフォンも対象となり得て、グレア防止には一般に間接照明が有利。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nイ：スマートフォンは含まれない：情報機器にはデスクトップ、ノート、タブレット、スマートフォン等が含まれる。正しくは「含まれる」。\n（2）\n誤り\nロ：直接照明の方がグレア防止に有効：一般に間接照明は光源が視野に入りにくく、反射グレアを抑えやすい。正しくは「間接照明が有効」。\n（3）\n正しい\nハ：画面と周辺の明るさ差を小さく：過大な輝度差は眼の調節負担を増す。窓映り込み、照明反射も調整する。\n（4）\n正しい\nニ：一連続作業1時間以内・1～2回の小休止：連続作業間には10～15分の作業休止時間を設け、一連続時間内に小休止を入れる。\n（5）\n誤り\n組合せ肢：適切なのはハ・ニ。","evidence":"[R13] 厚生労働省「情報機器作業における労働衛生管理のためのガイドライン」","related":"一律に全作業者へ同じ管理をするのではなく、作業区分、作業時間、裁量性、姿勢、ディスプレイ特性等に応じて対策する。","trap":"「スマホは私用機器」という先入観を捨てる。1時間ごとの10～15分は休憩時間とは限らず、別作業への切替えも含む。","keywords":"スマホも対象／輝度差小さく／一連続≤1時間／作業休止10～15分／小休止1～2回","current":"【試験当時・現在】2019年ガイドラインが基本。テレワークでも同じ人間工学的原則を適用する。","title":"情報機器作業ガイドライン","refs":[{"code":"R13","label":"厚生労働省「情報機器作業における労働衛生管理のためのガイドライン」","url":"https://www.mhlw.go.jp/content/000539604.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question12/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-13","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":13,"question":"厚生労働省の「健康診断結果に基づき事業者が講ずべき措置に関する指針」 における派遣労働者に対する健康診断に係る留意事項に関する次の記述のうち、 適切なものはどれか。","options":["派遣元事業者からの依頼により派遣先事業者が派遣労働者に対して一般健 康診断を実施した場合には、派遣先事業者は当該一般健康診断の結果を把握 する。","派遣元事業者は、派遣労働者の一般健康診断の結果について適切に医師か ら意見を聴くことができるよう、派遣先事業者に対し、当該派遣労働者の同 意を得た上で、勤務の状況又は職場環境に関する情報を提供するように依頼 する。","派遣元事業者から派遣先事業者に対して、一般健康診断の結果に基づく派 遣労働者の就業上の措置の実施について協力するよう要請があった場合は、 派遣先事業者は当該派遣労働者の変更を求めることができる。","派遣先事業場で派遣労働者の特殊健康診断が行われたときは、派遣先事業 者は、派遣元事業者の依頼があった場合に限り、特殊健康診断の結果の記録 の写しを送付する必要がある。","派遣先事業者は、派遣労働者の一般健康診断に関する健康情報について、 就業区分の決定に必要な場合に限り、当該労働者の同意を得ずに派遣元事業 者から提供を受けることができる。"],"tags":["健康診断・健康管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":1,"category":"健康診断・健康管理","cluster":"健康管理","explanation":{"answer":"（2）","point":"一般健康診断は派遣元、特殊健康診断は派遣先という責任分担と、健康情報の取扱い・情報連携を問う。","conclusion":"派遣元が医師意見聴取を適切に行うため、本人同意を得て派遣先へ勤務状況・職場環境情報の提供を依頼する（2）が適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\n（1）派遣先が一般健診結果を把握する：一般健診の実施・事後措置は原則派遣元。派遣先が実施を受託しても、必要以上に健康情報を保持しない。正しくは「結果は派遣元が把握・管理する」。\n（2）\n正しい\n（2）本人同意を得て勤務状況等の提供を依頼：医師が就業上の意見を述べるには、実際の作業・職場環境情報が必要。個人情報保護にも配慮する。\n（3）\n誤り\n（3）派遣先は当該派遣労働者の変更を求められる：まず派遣元・派遣先が協力して就業場所・作業内容等の措置を実施する。安易な交代要求を正当化する規定ではない。\n（4）\n誤り\n（4）特殊健診記録写しは依頼時のみ送付：派遣先で特殊健診を実施した場合、派遣元へ結果記録の写しを送付する必要がある。依頼の有無を条件としない。\n（5）\n誤り\n（5）同意なしで一般健診情報を受領できる：必要性・目的を限定し、原則として本人同意等の適法な取扱いが必要。正しくは「同意を得て必要範囲で提供」。","evidence":"[R14] 厚生労働省「健康診断結果に基づき事業者が講ずべき措置に関する指針」","related":"派遣先は作業環境・作業条件を支配するため、特殊健診や就業措置の実行に重要な役割を持つ。責任分担を理由に連携を断たない。","trap":"「実際に働く場所＝派遣先がすべての健診担当」ではない。一般と特殊を分ける。","keywords":"一般健診＝派遣元／特殊健診＝派遣先／就業措置は連携／健康情報は必要最小限","current":"【試験当時・現在】基本的な責任分担は同じ。個人情報保護・健康情報取扱規程の整備が引き続き重要。","title":"派遣労働者の健康診断","refs":[{"code":"R14","label":"厚生労働省「健康診断結果に基づき事業者が講ずべき措置に関する指針」","url":"https://www.mhlw.go.jp/content/000616422.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question13/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-14","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":14,"question":"厚生労働省の「過重労働による健康障害を防止するため事業者が講ずべき措 置」に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは （１）～（５）のうちどれか。 イ 時間外・休日労働時間が１か月当たり45時間を超える労働者で、健康へ の配慮が必要と認めた者については、面接指導等の措置を講ずることが望 ましい。 ロ 面接指導等により労働者のメンタルヘルス不調が把握された場合は、面 接指導を行った医師、産業医等の助言を得ながら必要に応じ精神科医等と 連携を図りつつ対応する。 ハ 常時50人未満の労働者を使用する事業場における面接指導等については、 近隣に専門的知識を有する医師がいない等の理由により、事業者が自ら医 師を選任し、面接指導を実施することが困難な場合には、地域産業保健セ ンターの活用を図る。 ニ 過重労働による業務上の疾病を発生させたときは、労働時間の管理状況、 労働時間及び勤務の不規則性、健康診断及び面接指導の結果等について、 多角的に原因の究明を行う。","options":["イ ロ ハ ニ","イ ロ ハ","イ ロ ニ","イ ハ ニ","ロ ハ ニ"],"tags":["健康診断・健康管理","安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":0,"category":"過重労働・健康管理","cluster":"健康管理","explanation":{"answer":"（1）","point":"長時間労働者への面接指導、メンタル不調への連携、小規模事業場支援、発生後の原因究明を問う。","conclusion":"イ～ニはいずれも適切で、正答は（1）。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nイ：月45時間超で健康配慮が必要な者への面接指導等：法定の申出要件に達しない場合でも、45時間超で健康への配慮が必要な者には自主的な面接指導等が望ましい。\n（2）\n正しい\nロ：メンタル不調時の専門連携：面接医・産業医等の助言を得て、必要に応じ精神科医・心療内科医等と連携する。\n（3）\n正しい\nハ：50人未満で地域産業保健センター活用：産業医選任義務のない小規模事業場でも、地域窓口の長時間労働者面接指導等を活用できる。\n（4）\n正しい\nニ：業務上疾病発生時の多角的原因究明：単なる個人要因に帰さず、労働時間、勤務不規則性、健診・面接指導、組織体制等を検証し再発防止につなげる。\n（5）\n正しい\n組合せ：4記述すべて適切。","evidence":"[R15] 厚生労働省「過重労働による健康障害防止のための総合対策」","related":"面接指導後は医師意見を聴き、就業場所変更、作業転換、労働時間短縮、深夜業回数減少等の措置を検討する。記録保存も必要。","trap":"「45時間は法定面接指導の一律義務ライン」と誤認しない。法定要件と、指針上の望ましい措置を区別する。","keywords":"45時間超＝配慮対象／80時間超等＝法定面接指導要件を確認／地域産保センター","current":"【試験当時・現在】基本枠組みは同じ。医師の働き方改革等、職種別制度と一般労働者の面接指導要件を混同しない。","title":"過重労働による健康障害防止","refs":[{"code":"R15","label":"厚生労働省「過重労働による健康障害防止のための総合対策」","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000046653.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question14/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-15","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":15,"question":"厚生労働省の「労働者の心の健康の保持増進のための指針」に関する次のイ ～ホの記述について、適切なものの数は（１）～（５）のうちどれか。 イ 心の健康づくり計画の策定、その実施体制の整備等の具体的な実施方策 や個人情報の保護に関する規程等の策定等に当たっては、衛生委員会等に おいて十分調査審議を行うことが必要である。 ロ 事業者は、業務を一時的なプロジェクト体制で実施する等、通常のライ ンによるケアが困難な業務形態にある場合には、実務において指揮命令系 統の上位にいる者等によりケアが行われる体制を整えるなど、ラインによ るケアと同等のケアが確実に実施されるようにする。 ハ 衛生管理者等は、心の健康づくり計画に基づき、産業医等の助言、指導 等を踏まえて、具体的な教育研修の企画及び実施、職場環境等の評価と改 善、心の健康に関する相談ができる雰囲気や体制づくりを行う。 ニ 事業者は、管理監督者による日常の職場管理や労働者からの意見聴取の 結果を通じ、また、ストレスチェック結果の集団ごとの分析の結果や面接 指導の結果等を活用して、職場環境等の具体的問題点を把握する。 ホ 事業者は、衛生委員会等において調査審議し、産業医等の助言を受けな がら職場復帰支援プログラムを策定し、休業の開始から通常業務への復帰 に至るまでの一連の標準的な流れを明らかにするとともに、それに対応す る職場復帰支援の手順、内容及び関係者の役割等について定める。","options":["一つ","二つ","三つ","四つ","五つ"],"tags":["健康診断・健康管理","安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"メンタルヘルス","cluster":"健康管理","explanation":{"answer":"（5）","point":"心の健康づくり計画、4つのケア、衛生管理者等の役割、職場環境改善、職場復帰支援を総合的に問う。","conclusion":"イ～ホの5記述すべて適切で、正答は（5）。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nイ：衛生委員会等での調査審議：計画、体制、個人情報保護規程等は労使で十分調査審議する。\n（2）\n正しい\nロ：通常ラインが難しい業務形態への代替体制：プロジェクト型等でも、実質的な指揮命令者による同等のラインケアを確保する。\n（3）\n正しい\nハ：衛生管理者等の実務：教育研修、職場環境評価・改善、相談しやすい体制づくりを産業医等の助言の下で進める。\n（4）\n正しい\nニ：多様な情報で職場問題を把握：日常管理、労働者意見、集団分析、面接指導等を活用する。ただし個人特定・不利益取扱いを避ける。\n（5）\n正しい\nホ：職場復帰支援プログラム：休業開始から通常業務復帰までの標準的流れ、手順、役割をあらかじめ定める。","evidence":"[R16] 厚生労働省「労働者の心の健康の保持増進のための指針」","related":"4つのケアはセルフケア、ラインによるケア、事業場内産業保健スタッフ等によるケア、事業場外資源によるケア。相互に連携させる。","trap":"「衛生管理者が診断・治療を行う」とはしていない。企画・調整・環境改善と医療行為の境界を守る。","keywords":"4つのケア／心の健康づくり計画／集団分析／職場復帰支援プログラム／個人情報保護","current":"【試験当時・現在】基本構造は同じ。ストレスチェックの小規模事業場への義務拡大に向けた法改正動向は今後の試験で要確認。","title":"心の健康保持増進指針","refs":[{"code":"R16","label":"厚生労働省「労働者の心の健康の保持増進のための指針」","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000055195.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question15/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["stress2028"],"detailLevel":"濃厚"},{"id":"general-2025-16","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":16,"question":"物理的因子と、それにより障害を受ける部位との次の組合せのうち、適切で ないものはどれか。 物理的因子 障害を受ける部位","options":["騒音・・・・・・・・・・・・・耳小骨","振動・・・・・・・・・・・・・末梢神経 しょう","高気圧・・・・・・・・・・・・肺","レーザー光線・・・・・・・・・角膜","赤外線・・・・・・・・・・・・水晶体"],"tags":["騒音・振動","放射線・有害光線","高気圧・酸欠"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":0,"category":"物理因子","cluster":"物理因子","explanation":{"answer":"（1）","point":"物理因子の代表的標的臓器を対応させる。レーザーは波長により角膜・水晶体・網膜など標的が変わる点に注意。","conclusion":"騒音で主に障害されるのは内耳の蝸牛有毛細胞で、耳小骨ではないため（1）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\n騒音―耳小骨：騒音性難聴は主に内耳障害。正しくは「騒音―蝸牛（有毛細胞）」。耳小骨障害は伝音性難聴の原因。\n（2）\n正しい\n振動―末梢神経：手腕振動では末梢循環障害、末梢神経障害、筋骨格系障害を生じる。\n（3）\n正しい\n高気圧―肺：減圧時の肺過膨張、圧外傷、動脈ガス塞栓等に関係する。\n（4）\n正しい\nレーザー―角膜：紫外～遠赤外レーザーは角膜等に吸収されやすい。可視・近赤外は網膜障害が重要だが、組合せ自体は成立する。\n（5）\n正しい\n赤外線―水晶体：長期高強度ばく露で熱性白内障（いわゆるガラス工白内障）を生じ得る。","evidence":"[R08] 環境省「放射線による健康影響等に関する統一的な基礎資料」／[R11] 厚生労働省「騒音障害防止のためのガイドライン」関連資料","related":"紫外線は角結膜炎・皮膚障害、赤外線は熱作用・白内障、レーザーは波長依存、電離放射線は造血器・水晶体・生殖腺等が重要。","trap":"レーザーの標的を「網膜だけ」と固定しない。波長で透過・吸収部位が変わる。","keywords":"騒音＝内耳／振動＝末梢循環・神経／赤外線＝白内障／レーザー＝波長依存","current":"【試験当時・現在】基本医学は同じ。","title":"物理的因子と障害部位","refs":[{"code":"R08","label":"環境省「放射線による健康影響等に関する統一的な基礎資料」","url":"https://www.env.go.jp/chemi/rhm/basic_data.html"},{"code":"R11","label":"厚生労働省「騒音障害防止のためのガイドライン」関連資料","url":"https://www.mhlw.go.jp/stf/newpage_32483.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question16/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-17","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":17,"question":"化学物質による健康障害に関する次の記述のうち、誤っているものはどれか。","options":["フッ化水素の水溶液であるフッ酸は、金属の洗浄、半導体のエッチング等 に用いられ、ミストの吸入により眼、鼻、気道に粘膜刺激症状を生じ、肺炎、 肺気腫を生じることもある。","2,3,7,8-四塩化ジベンゾ-パラ-ジオキシン（TCDD）は、廃棄物の焼却の 際に副産物として発生し、ダイオキシン類の中でも最も毒性が強く、人に対 する発がん性が認められている。","ホルムアルデヒドは、接着剤や塗料の原料として用いられ、いわゆる「シ ックハウス症候群」の原因物質の一つで、粘膜刺激作用のほか、咳、上気道 せき 炎、流涙、接触皮膚炎などを生じる。","ナフタレンは、合成樹脂の原料や防虫剤、有機顔料などの用途に使用され、 人に対する発がん性が疑われている。","塩化ビニルは、合成樹脂の原料として用いられ、高濃度の急性ばく露では レイノー症状、指の骨の溶解（指端骨溶解）、肝血管肉腫などが見られる。"],"tags":["化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"化学物質・健康影響","cluster":"化学物質","explanation":{"answer":"（5）","point":"物質の用途、急性影響、慢性影響、発がん性を対応させる。発症時間軸の入替えがひっかけ。","conclusion":"塩化ビニルによるレイノー症状、指端骨溶解、肝血管肉腫は主に慢性職業ばく露の影響であり、高濃度急性ばく露とする（5）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nフッ酸：強い腐食性があり、ミスト吸入で眼・気道刺激、重症では肺障害。皮膚曝露では深部組織障害、低Ca血症・不整脈にも注意。\n（2）\n正しい\nTCDD：焼却等で副生成し得るダイオキシン類。最も毒性が強い同族体の一つで、IARCはヒト発がん性ありと評価。\n（3）\n正しい\nホルムアルデヒド：粘膜刺激、咳、流涙、接触皮膚炎等を生じ、室内空気汚染物質でもある。発がん性・感作性も重要。\n（4）\n正しい\nナフタレン：防虫剤、樹脂・顔料原料等。溶血性貧血、眼障害等があり、発がん性が疑われる区分。\n（5）\n誤り\n塩化ビニルの慢性影響を急性とする：急性高濃度では中枢神経抑制等。レイノー様症状、指端骨溶解、肝血管肉腫は長期ばく露。正しくは「慢性ばく露でみられる」。","evidence":"[R17] 職場のあんぜんサイト「GHS対応モデルSDS情報」","related":"化学物質は「用途―侵入経路―標的臓器―急性/慢性―発がん性」を一行で結ぶ。フッ酸は小面積でも全身毒性を起こし得る。","trap":"列挙された疾患名が正しくても、「高濃度急性」という時間軸が誤り。修飾語まで読む。","keywords":"塩化ビニル：慢性→指端骨溶解・肝血管肉腫／フッ酸：腐食＋低Ca／TCDD：強毒性","current":"【試験当時・現在】GHS分類や濃度基準値の対象追加は更新される。各物質の最新SDSで確認する。","title":"代表的化学物質の健康影響","refs":[{"code":"R17","label":"職場のあんぜんサイト「GHS対応モデルSDS情報」","url":"https://anzeninfo.mhlw.go.jp/anzen_pg/GHS_MSD_FND.aspx"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question17/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-18","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":18,"question":"検知管に関する次の記述のうち、誤っているものはどれか。","options":["共存ガスによる妨害は、その種類、濃度により一様ではなく、測定値にプ ラス又はマイナスの影響を及ぼす場合がある。","検知管の測定値は温度によって影響を受けるので、変色層の長さから濃度 を読み取った後、温度補正を行う。","検知管の変色層が斜めに現れたときは、変色した部分の最先端を変色層の 長さとし、濃度を決定する。","作業環境測定のＢ測定において３本の検知管を用いて測定を行うとき、３ 本目の検知管の測定中に最初の測定の開始から10分を経過した場合でも、三 つの測定値の算術平均値をＢ測定値とする。","有機溶剤混合物について、２年以上の期間、作業環境測定結果の評価で第 一管理区分が継続した単位作業場所については、所轄労働基準監督署長の許 可を受けた上で、定められた方法により当該有機溶剤の濃度の測定に検知管 を用いることができる。"],"tags":["作業環境測定","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"作業環境測定","cluster":"測定・換気","explanation":{"answer":"（3）","point":"検知管の妨害、温度補正、斜め変色の読み方、B測定、有機溶剤測定への例外使用を問う。","conclusion":"変色層が斜めの場合は最先端ではなく、一般に斜め部分の中間を読むため（3）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n共存ガスの妨害：反応促進で高値、反応抑制・競合で低値など、物質・濃度で方向が異なる。取扱説明書を確認する。\n（2）\n正しい\n温度補正：検知反応・気体体積等は温度の影響を受ける。読取り後、管ごとの補正式・表に従う。\n（3）\n誤り\n斜め変色の最先端を読む：斜めの両端の中間値を読むのが原則。正しくは「最長部と最短部の中間を変色層長とする」。\n（4）\n正しい\n複数管によるB測定値の算術平均：同一B測定として連続して複数本で測る方法では、所定の取扱いにより算術平均を用いる。測定開始から10分を超えたことだけで直ちに無効とはしない。\n（5）\n正しい\n2年以上第一管理区分継続＋署長許可：一定条件を満たす有機溶剤混合物の単位作業場所では、許可を受け所定の検知管法を用い得る。","evidence":"[R18] 厚生労働省「検知管を用いた化学物質のリスクアセスメントガイドブック」／[R19] e-Gov／厚生労働省「作業環境評価基準」","related":"検知管は簡便だが、選択性、定量範囲、温湿度、採気量、吸引時間、共存物質に制約がある。リスクアセスメントのスクリーニングと法定測定を区別する。","trap":"「濃い方を安全側として読む」と最先端を選ばない。メーカー指示の中間読取りが原則。","keywords":"斜め変色＝中間／温度補正／共存ガス±妨害／法定測定使用には条件","current":"【試験当時・現在】基本的取扱いは同じ。直接読取り式機器等を使う場合も、測定目的に適した精度・選択性の確認が必要。","title":"検知管の読取りと作業環境測定","refs":[{"code":"R18","label":"厚生労働省「検知管を用いた化学物質のリスクアセスメントガイドブック」","url":"https://anzeninfo.mhlw.go.jp/user/anzen/kag/pdf/kenchi-guidebook.pdf"},{"code":"R19","label":"e-Gov／厚生労働省「作業環境評価基準」","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74096000&dataType=0&pageNo=1"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question18/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["measure2026"],"detailLevel":"濃厚"},{"id":"general-2025-19","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":19,"question":"作業環境測定に関する次の記述のうち、適切でないものはどれか。","options":["Ｂ測定を行う場合には、最大濃度となると予測された点で測定を複数回行 い、得られた測定値の平均値をＢ測定値とする。","測定値が管理濃度の10分の１に満たない測定点がある場合には、管理濃度 の10分の１を当該測定点における測定値とみなして幾何平均値と幾何標準偏 差を計算する。","測定値が定量下限の値に満たない測定点がある場合には、当該定量下限の 値を当該測定点における測定値とみなして、管理区分の決定に用いる。","１日のみＡ測定を行った場合に、その結果から当該単位作業場所の評価を 行う際は、評価に用いる幾何平均値としては、測定日の幾何平均値をそのま ま使用する。","１日のみＡ測定を行った場合に、その結果から当該単位作業場所の評価を 行う際は、日間変動に相当する値を考慮して評価値を求める。"],"tags":["作業環境測定"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":0,"category":"作業環境測定","cluster":"測定・換気","explanation":{"answer":"（1）","point":"A測定の統計的評価、B測定の代表値、定量下限未満・管理濃度1/10未満の扱い、1日測定時の日間変動を問う。","conclusion":"複数地点でB測定を行った場合は平均ではなく最大値を用いるため（1）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nB測定の複数値を平均：B測定は高濃度となる場所・時間を評価するため、複数点なら最大値。正しくは「得られた測定値の最大値をB測定値とする」。\n（2）\n正しい\n管理濃度1/10未満の値：統計計算上、管理濃度の1/10をみなし値として用いる取扱いがある。極端な小値による幾何統計の不安定化を避ける。\n（3）\n正しい\n定量下限未満：定量下限値をみなし値として管理区分決定に用いる。定量下限自体が十分低い測定法を選ぶ。\n（4）\n正しい\n1日A測定の幾何平均：測定日の幾何平均Mを用いる。\n（5）\n正しい\n日間変動相当値の考慮：1日測定でも評価値算出では日間変動を表す0.084を加味する。","evidence":"[R19] e-Gov／厚生労働省「作業環境評価基準」","related":"1日測定の第一評価値の代表式：log EA1＝log M＋1.645√{(log σ)²＋0.084}。第二評価値は平均的状態、第一評価値は高濃度側を評価する。","trap":"B測定は「代表的平均」ではなく、発散源近傍の最悪条件を捉える測定。したがって最大値を使う。","keywords":"B測定＝最大／A測定＝幾何統計／1日測定も0.084／定量下限未満＝定量下限値","current":"【試験当時・現在】個人サンプリング法による作業環境測定が導入されているが、A・B測定の基本評価原理は現行。","title":"作業環境測定の評価","refs":[{"code":"R19","label":"e-Gov／厚生労働省「作業環境評価基準」","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74096000&dataType=0&pageNo=1"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question19/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["measure2026"],"detailLevel":"濃厚"},{"id":"general-2025-20","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":20,"question":"局所排気装置等に関する次の記述のうち、適切でないものはどれか。","options":["囲い式フードとは、発散源を囲うことにより有害物質がフード外へ流出す ることを防ぐように設けられたフードのことで、グローブボックス型やドラ フトチェンバ型などがある。","レシーバ式フードとは、発散源から一定方向の気流があって、有害物質が その気流に乗って飛散するときに気流の方向に沿って粉じん、ガス、蒸気等 を捕集するように設けたフードのことをいう。","外付け式フードで制御風速を保ちながら排風量を少なくするには、フード の開口部の周囲にフランジを付ける方法がある。","外付け式フードの制御風速は、フードの開口面から捕捉点までの距離が長 いと大きな値が必要である。","密閉式プッシュプル型換気装置は、天井、壁及び床で囲まれているブース を有するものをいい、空気の供給口と吸引口以外は全て密閉されている。"],"tags":["換気・局所排気","粉じん・石綿・じん肺","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"換気・局所排気","cluster":"測定・換気","explanation":{"answer":"（4）","point":"囲い式、外付け式、レシーバ式、プッシュプル型の構造と、制御風速・排風量の違いを問う。","conclusion":"外付け式フードで距離が長いと必要なのは主に排風量の増加であり、法定の「制御風速値」そのものが距離で大きくなるわけではないため（4）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n囲い式フード：発散源を囲って漏出を防ぐ。グローブボックス、ドラフトチャンバー等。一般に捕集効率が高い。\n（2）\n正しい\nレシーバ式フード：熱上昇流、回転流等の既存気流に乗る有害物を、流れの方向に設置して受ける。\n（3）\n正しい\nフランジ：開口周囲からの不要な背面吸込みを抑え、同じ捕捉性能をより少ない排風量で得やすい。\n（4）\n誤り\n距離が長いと制御風速値が大きくなる：制御風速は型式等に応じた基準値。距離増加で捕捉点にその速度を作るため必要排風量が急増する。正しくは「必要排風量が大きくなる」。\n（5）\n正しい\n密閉式プッシュプル：ブースを有し、給気口・吸引口以外を密閉して一様流で汚染物を押し・引きする。","evidence":"[R20] 厚生労働省「換気（局所排気装置）」","related":"対策優先順位は、可能なら密閉・囲い式→外付け式。外付け式では発散源を開口面に近づけ、作業者を発散源とフードの間に入れない。","trap":"「制御風速」と「必要排風量」を混同させる典型問題。距離の影響は流量・捕捉性能に現れる。","keywords":"囲い式が高効率／外付け式は距離を短く／フランジで流量削減／制御風速≠排風量","current":"【試験当時・現在】基本原理と法定性能要件は同じ。濃度基準値対応でも局排の有効性確認が重要。","title":"局所排気装置のフード","refs":[{"code":"R20","label":"厚生労働省「換気（局所排気装置）」","url":"https://anzeninfo.mhlw.go.jp/user/anzen/kag/pdf/taisaku/common_Ventilating.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question20/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-21","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":21,"question":"次のイ～ニの作業姿勢において、腰部の椎間板内圧が大きい順に並べたもの は（１）～（５）のうちどれか。 イ 背もたれを使用せず、座位にて背筋を伸ばした姿勢 せすじ ロ 立位にて膝を伸ばし、背を丸めて上半身を前方に傾けた姿勢 ハ 20kgの荷物を持ち、立位にて膝を伸ばし、背を丸めて上半身を 前方に傾けた姿勢 ニ 20kgの荷物を持ち、立位にて膝を曲げ、背筋を伸ばした姿勢","options":["ハ ロ ニ イ","ハ ニ イ ロ","ハ ニ ロ イ","ニ ハ イ ロ","ニ ハ ロ イ"],"tags":["人間工学・腰痛"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"人間工学・腰痛","cluster":"人間工学","explanation":{"answer":"（3）","point":"荷重、前屈モーメント、膝・背部姿勢、座位による腰部負担の相対順位を問う。","conclusion":"大きい順はハ（20kg・膝伸展・前屈）＞ニ（20kg・膝屈曲・背筋伸展）＞ロ（無荷重・前屈）＞イ（背もたれなし直立座位）で、正答は（3）。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nハが最大：荷物の重さに加え、荷物・上体の重心が腰椎から離れ、腰背筋の大きな力が必要。膝を伸ばした前屈は最も不利。\n（2）\n正しい\nニが次位：20kg荷重はあるが、膝を曲げ背を伸ばすことで荷物を体に近づけ、脚の力を使い、腰部モーメントを低減する。\n（3）\n正しい\nロがニより小さい：前屈は椎間板内圧を高めるが、20kg外部荷重がないためニより小さい。\n（4）\n正しい\nイが最小：背もたれなし座位は立位より負担が大きいことがあるが、本設問4姿勢では外部荷重・大きな前屈がないため最小。\n（5）\n正しい\n組合せ：ハ＞ニ＞ロ＞イ。","evidence":"[R21] 厚生労働省「職場における腰痛予防対策指針及び解説」","related":"腰部モーメントは「重さ×腰からの水平距離」で増える。膝を曲げる、背を伸ばす、荷物を身体へ近づける、ひねらない、補助具を使う。","trap":"「正しい持上げ姿勢なら荷物なし前屈より負担が小さい」とは限らない。20kgの外部荷重は大きい。","keywords":"重さ×距離＝腰部モーメント／荷物を近く／膝を曲げる／前屈・ひねり回避","current":"【試験当時】令和7年に腰痛予防対策指針及び解説が改訂・再整理された。【現在】改訂版でも、膝を曲げ、脚力を用い、荷物を身体に近づける原則は同じ。","title":"腰部椎間板内圧と姿勢","refs":[{"code":"R21","label":"厚生労働省「職場における腰痛予防対策指針及び解説」","url":"https://www.mhlw.go.jp/content/11303000/001376468.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question21/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-22","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":22,"question":"厚生労働省の「化学物質による健康障害防止のための濃度の基準の適用等に 関する技術上の指針」に関する次の記述のうち、誤っているものはどれか。","options":["濃度基準値が設定されている物質について、リスクの見積りの過程におい て、労働者がばく露される程度が濃度基準値を超えるおそれがある屋内作業 を把握した場合、確認測定を実施する。","確認測定では、労働者の呼吸域における物質の濃度を測定する。","確認測定は、労働者のばく露が最も高いと想定される均等ばく露作業にお ける、最も高いばく露を受ける労働者を選定して行う。","「労働者の呼吸域」とは、労働者が使用する呼吸用保護具の外側であって、 両耳を結んだ直線の中央を中心とした、半径１ｍの、顔の前方に広がった半 球の内側をいう。","この指針の対象となる物質であっても、人に対する発がん性が明確な物質 の場合は、「八時間濃度基準値」及び「短時間濃度基準値」のいずれも設定 されていない。"],"tags":["保護具","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"化学物質・自律的管理","cluster":"化学物質","explanation":{"answer":"（4）","point":"自律的化学物質管理における濃度基準値、確認測定、均等ばく露作業、呼吸域、発がん性物質の扱いを問う。","conclusion":"呼吸域の半径は1mではなく30cmであるため（4）が誤り。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n超えるおそれがある屋内作業で確認測定：リスク見積りで濃度基準値超過のおそれを把握した場合、労働者ばく露を確認するため測定する。\n（2）\n正しい\n呼吸域濃度を測定：労働者が実際に吸入する空気を評価するため、個人サンプラー等を呼吸域に装着する。\n（3）\n正しい\n最も高いばく露を受ける者を選定：均等ばく露作業ごとに、最悪条件を代表する労働者・作業を選ぶ。\n（4）\n誤り\n呼吸域の半径1m：両耳を結ぶ直線の中央を中心に、顔前方へ広がる半径30cmの半球内（保護具外側）。正しくは「半径30cm」。\n（5）\n正しい\nヒト発がん性が明確な物質に基準値なし：安全な閾値設定が困難な確率的影響として、8時間・短時間濃度基準値を設定せず、ばく露最小化を求める物質がある。","evidence":"[R22] 厚生労働省「濃度基準値と技術上の指針」／[R35] 厚生労働省「化学物質による健康障害防止のための濃度の基準の適用等に関する技術上の指針」（令和6年改正）","related":"八時間濃度基準値は長期影響、短時間濃度基準値は15分程度のピーク影響を念頭に置く。呼吸用保護具を使用する場合、外側濃度÷指定防護係数で内側濃度を推定できる。","trap":"「呼吸域」を作業者周辺の広い1m圏と誤認しない。30cmは頻出数値。","keywords":"呼吸域＝半径30cm前方半球／最悪ばく露者／8h・短時間／明確な発がん性＝最小限度","current":"【試験当時】令和6年改正指針を反映。【現在】令和7年10月適用の追加物質等があるため、濃度基準値一覧は最新版を確認する。","title":"濃度基準値と確認測定","refs":[{"code":"R22","label":"厚生労働省「濃度基準値と技術上の指針」","url":"https://www.mhlw.go.jp/stf/newpage_32871.html"},{"code":"R35","label":"厚生労働省「化学物質による健康障害防止のための濃度の基準の適用等に関する技術上の指針」（令和6年改正）","url":"https://www.mhlw.go.jp/content/11300000/001252603.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question22/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["chem2026","measure2026"],"detailLevel":"濃厚"},{"id":"general-2025-23","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":23,"question":"次のイ～ホの製品等について、当該製品等に労働安全衛生法令に基づく通知 対象物が裾切値以上の含有量で含まれているとき、当該製品等を提供する者が その提供の相手側に安全データシート（SDS）を交付する対象となるもののみ を全て挙げたものは（１）～（５）のうちどれか。 イ 原材料としての適否を判断するために提供する少量の試供品 ロ 飲食店向けに販売される酒類 ハ ホームセンターで販売される業務用の洗剤 ニ 業務用の印刷に用いるトナーカートリッジ ホ 乾電池を内蔵した電子機器","options":["イ ロ ハ","イ ロ ホ","イ ハ ニ","ロ ニ ホ","ハ ニ ホ"],"tags":["化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"化学物質・SDS","cluster":"化学物質","explanation":{"answer":"（3）","point":"通知対象物を裾切値以上含む製品でも、一般消費者向け、食品・酒類、密封された成形品等の除外を判断する。用途・提供相手が重要。","conclusion":"SDS交付対象はイ（原材料評価用試供品）、ハ（業務用洗剤）、ニ（業務用トナーカートリッジ）で、正答は（3）。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nイ：少量試供品：量が少なくても、事業者が原材料適否を判断し業務で取り扱うため対象。少量だけで免除されない。\n（2）\n誤り\nロ：飲食店向け酒類：食品として提供される酒類は対象外の扱い。正しくは「SDS交付対象外」。工業用エタノール等は別。\n（3）\n正しい\nハ：ホームセンターの業務用洗剤：一般消費者向けでなく、業務用途を明示して販売されるものは対象となり得る。販売場所だけで判断しない。\n（4）\n正しい\nニ：業務用トナーカートリッジ：使用中に内容物が放出されるため、密封成形品の除外に当たらず、対象物を含めばSDS交付対象。\n（5）\n誤り\nホ：乾電池内蔵電子機器：通常使用で対象化学物質が放出されない成形品・密封製品として対象外。正しくは「通常は対象外」。","evidence":"[R23] 厚生労働省「化学物質対策に関するQ&A（ラベル・SDS関係）」","related":"除外判断では、①労働者が通常の取扱いで対象物にばく露し得るか、②一般消費者生活用品か、③固体成形品か、④用途が業務用かを確認する。","trap":"「ホームセンター＝一般消費者向け」とは限らない。「カートリッジ＝密封」とも限らず、使用時放出を考える。","keywords":"少量でも対象／業務用洗剤・トナー対象／食品酒類・通常放出しない成形品は除外","current":"【試験当時・現在】通知対象物は段階的に拡大中。対象物質・裾切値は最新版リストで確認する。","title":"SDS交付の対象製品","refs":[{"code":"R23","label":"厚生労働省「化学物質対策に関するQ&A（ラベル・SDS関係）」","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question23/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["chem2026"],"detailLevel":"濃厚"},{"id":"general-2025-24","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":24,"question":"次のイ～ニの腰痛について、「災害性の原因による腰痛」に該当するものの みを全て挙げたものは（１）～（５）のうちどれか。 イ 介護業務中に廊下でつまずいて転倒して生じた腰痛 ロ 荷役作業において中腰姿勢で重量物を繰り返し取り扱うことで生じた腰 痛 ハ 配送作業において重量物を持ち上げた時に生じた腰痛 ニ 車両運転において全身振動を継続的に受けて生じた腰痛","options":["イ ロ ハ","イ ハ","ロ ハ","ロ ニ","ハ"],"tags":["騒音・振動","人間工学・腰痛"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":1,"category":"人間工学・腰痛","cluster":"人間工学","explanation":{"answer":"（2）","point":"突発的な出来事・急激な力の作用が明確な災害性腰痛と、反復負荷・長期振動等で徐々に発症する非災害性腰痛を区別する。","conclusion":"災害性に該当するのはイ（転倒）とハ（重量物持上げ時の急性発症）で、正答は（2）。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nイ：つまずき転倒：明確な災害・外力があり、発症時点が特定できる。\n（2）\n誤り\nロ：中腰で重量物を反復：反復・蓄積負荷による非災害性腰痛。正しくは「非災害性の原因による腰痛」。\n（3）\n正しい\nハ：重量物持上げ時に発症：持上げ動作という突発的出来事と急激な腰部負荷が特定できる。\n（4）\n誤り\nニ：全身振動の継続：長期反復ばく露による環境要因で、通常は非災害性。正しくは「非災害性」。\n（5）\n誤り\n組合せ肢：災害性はイ・ハのみ。","evidence":"[R24] 厚生労働省「腰痛の業務上外の認定基準」関連資料／[R21] 厚生労働省「職場における腰痛予防対策指針及び解説」","related":"業務上認定では、出来事の通常動作からの逸脱、腰部に作用した力、発症時間、医学的整合性、既往症等を総合する。名称だけで自動認定されるわけではない。","trap":"「重量物を扱う＝すべて災害性」ではない。反復作業か、特定時点の急激な負荷かを見る。","keywords":"転倒・急な持上げ＝災害性／反復中腰・長期振動＝非災害性","current":"【試験当時・現在】区分の基本は同じ。予防では災害性・非災害性を問わず、重量軽減、補助具、姿勢、休止、振動低減を行う。","title":"災害性腰痛と非災害性腰痛","refs":[{"code":"R21","label":"厚生労働省「職場における腰痛予防対策指針及び解説」","url":"https://www.mhlw.go.jp/content/11303000/001376468.pdf"},{"code":"R24","label":"厚生労働省「腰痛の業務上外の認定基準」関連資料","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000111055.html"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question24/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-25","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":25,"question":"呼吸用保護具の選択に関する次の記述のうち、適切でないものはどれか。","options":["濃度基準値が設定された化学物質に係る呼吸用保護具の要求防護係数は、 当該化学物質の濃度の測定結果から得られた最大値を、当該化学物質の濃度 基準値の値で除した数値である。","指定防護係数とは、訓練された着用者が、正常に機能する呼吸用保護具を 正しく着用した場合に、少なくとも得られるであろうと期待される防護係数 のことである。","指定防護係数は、呼吸用保護具の種類に応じて日本産業規格において定め られている。","指定防護係数が高いほど、呼吸用保護具内への有害物質の漏れ込みが少な いことを示している。","防毒マスクの指定防護係数の値は、面体の形状が同じであっても吸収缶の 種類によって異なる。"],"tags":["保護具","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"保護具","cluster":"化学物質","explanation":{"answer":"（5）","point":"要求防護係数、指定防護係数、面体・保護具種類、吸収缶の役割を区別する。","conclusion":"同じ面体形状・保護具形式なら、吸収缶のガス種が違っても指定防護係数は変わらないため（5）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\n要求防護係数：原則として最大ばく露濃度÷濃度基準値。これ以上の指定防護係数を持つ保護具を選ぶ。\n（2）\n正しい\n指定防護係数の定義：訓練された着用者が正常な保護具を正しく着用した場合に少なくとも期待される防護性能。\n（3）\n正しい\nJISで種類別に設定：面体形状、陰圧・陽圧、電動ファン、給気式等で異なる。\n（4）\n正しい\n高いほど漏れ込みが少ない：外側濃度／内側濃度の比なので、大きいほど保護性能が高い。\n（5）\n誤り\n吸収缶種類で指定防護係数が変わる：吸収缶は対象ガス・破過時間を決めるが、指定防護係数は主に保護具形式・面体で決まる。正しくは「同じ形式・面体なら原則同じ」。","evidence":"[R25] 厚生労働省「防じんマスク、防毒マスク等の選択、使用等について」／[R22] 厚生労働省「濃度基準値と技術上の指針」","related":"選択後もフィットテスト、シールチェック、ひげ・眼鏡との干渉、吸収缶の適合ガス・破過、酸欠環境での使用禁止を確認する。","trap":"「除毒能力」と「防護係数」を混同しない。吸収缶の種類は対応ガスを決めるが、面体漏れを示す指定防護係数とは別。","keywords":"要求PF＝最大濃度/基準値／指定PF≥要求PF／吸収缶＝ガス種・破過／酸欠にろ過式不可","current":"【試験当時】濃度基準値制度に対応した令和5年通達を反映。【現在】フィットテスト義務対象・頻度と、記録管理を最新規則で確認する。","title":"呼吸用保護具の防護係数","refs":[{"code":"R22","label":"厚生労働省「濃度基準値と技術上の指針」","url":"https://www.mhlw.go.jp/stf/newpage_32871.html"},{"code":"R25","label":"厚生労働省「防じんマスク、防毒マスク等の選択、使用等について」","url":"https://www.mhlw.go.jp/content/11300000/001100842.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question25/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["chem2026"],"detailLevel":"濃厚"},{"id":"general-2025-26","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":26,"question":"危険又は有害な業務で、労働者を就かせるときに当該業務に関する安全又は 衛生のための特別の教育（以下「特別教育」という。）を行わなければならな い業務と、当該特別教育において教育を行う科目に含まれる範囲に関する次の イ～ニの組合せについて、適切なもののみを全て挙げたものは（１）～（５） のうちどれか。 特別教育を行わなければならない 当該特別教育において教育を 危険又は有害な業務 行う科目に含まれる範囲 イ ガンマ線照射装置を用いて行う・・・・放射性物質によって汚染された 透過写真の撮影の業務 設備の汚染の除去の方法 ロ 再圧室を操作する業務・・・・・・・・人工蘇生法 そ ハ 廃棄物の焼却施設に設置された・・・・洗身及び身体等の清潔の保持の 廃棄物焼却炉、集じん機等の 方法 設備の保守点検の業務 ニ チェーンソーを用いて行う立木・・・・振動障害の予防措置 の伐木、かかり木の処理又は 造材の業務","options":["イ ロ ハ ニ","イ ロ ハ","イ ロ ニ","イ ハ ニ","ロ ハ ニ"],"tags":["騒音・振動","放射線・有害光線","高気圧・酸欠","安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":4,"category":"安全衛生教育","cluster":"管理・マネジメント","explanation":{"answer":"（5）","point":"特別教育が必要な業務と、告示で定める教育科目・範囲の対応を問う。業務名が似る放射線教育を区別する。","conclusion":"ロ・ハ・ニが適切で、正答は（5）。ガンマ線透過写真撮影の教育に、汚染設備の除染方法は含まれない。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nイ：ガンマ線透過写真撮影―汚染設備の除去：密封線源を用いる透過写真撮影の教育は装置、放射線防護、関係法令等が中心。汚染除去は非密封線源等の別の教育内容。正しくは「含まれない」。\n（2）\n正しい\nロ：再圧室操作―人工蘇生法：再圧室の構造・操作、救急処置、人工呼吸・人工蘇生法等が含まれる。\n（3）\n正しい\nハ：廃棄物焼却設備保守―洗身・清潔保持：ダイオキシン類等のばく露防止のため、保護具、汚染防止、洗身・清潔保持を教育する。\n（4）\n正しい\nニ：チェーンソー伐木等―振動障害予防：安全な伐木技術に加え、チェーンソー振動障害の予防措置が含まれる。\n（5）\n誤り\n組合せ肢：適切なのはロ・ハ・ニ。","evidence":"[R26] 厚生労働省「安全衛生特別教育規程」／[R34] 厚生労働省「高気圧作業安全衛生規則に基づく再圧室等Q&A」","related":"特別教育は法59条3項、対象業務は安衛則36条等、具体的科目・時間は安全衛生特別教育規程等で定める。技能講習・免許との違いも整理する。","trap":"放射線という共通語だけで教育科目を流用しない。密封線源と汚染を生じ得る非密封線源ではリスクが異なる。","keywords":"特別教育＝法59条3項／対象＝安衛則36条／科目・時間＝告示／再圧室＝蘇生法","current":"【試験当時・現在】規程は改正が多い。電気自動車整備等を含め、対象業務・科目は最新版を確認する。","title":"危険有害業務の特別教育","refs":[{"code":"R26","label":"厚生労働省「安全衛生特別教育規程」","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74085000&dataType=0&pageNo=1"},{"code":"R34","label":"厚生労働省「高気圧作業安全衛生規則に基づく再圧室等Q&A」","url":"https://www.mhlw.go.jp/file/06-Seisakujouhou-11200000-Roudoukijunkyoku/0000201216.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question26/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-27","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":27,"question":"労働災害の調査及び原因の分析に関する次のイ～ニの記述について、正しい もののみを全て挙げたものは（１）～（５）のうちどれか。 イ ある原因と疾病との関係の仮説に基づいて、疾病のある群とない群に分 け、各々の群で原因と考えられる事象の相違があるかどうかを調べる調査 方法は、コホート研究といわれる。 ロ 前向き調査は、後ろ向き調査に比べ、結果が出るまでの観察期間が長期 にわたり、費用や労力が大きい。 ハ 前向き調査の結果、算出される相対危険度（リスク比）は、ばく露群の 罹患率(Ie)と非ばく露群の罹患率(Iu)との比Ie/Iu を示し、この値が大きい り ほど因果関係が存在する可能性が高い。 ニ 横断研究では、ばく露と疾病との因果関係は証明できない。","options":["イ ロ","イ ニ","イ ロ ハ","ロ ハ ニ","ハ ニ"],"tags":["疫学・統計"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"疫学・統計","cluster":"疫学・統計","explanation":{"answer":"（4）","point":"症例対照研究、コホート研究、横断研究、前向き・後ろ向き、相対危険を区別する。","conclusion":"ロ・ハ・ニが正しく、正答は（4）。疾病の有無で群を作り過去のばく露を比べるイは症例対照研究。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nイ：疾病あり/なしで原因事象を比較＝コホート：これは症例対照研究。正しくは「症例対照研究といわれる」。コホートはばく露あり/なしから疾病発生を追う。\n（2）\n正しい\nロ：前向きは長期・高コスト：発症を待つため観察期間・費用が大きいが、時間的順序と罹患率を評価しやすい。\n（3）\n正しい\nハ：RR＝Ie/Iu：ばく露群罹患率を非ばく露群罹患率で除す。RR>1は正の関連。ただし大きいだけで交絡・偏りを除外できず、因果関係の証明にはならない。\n（4）\n正しい\nニ：横断研究は因果関係を証明できない：ばく露と疾病を同時点で測るため、どちらが先か不明になりやすい。\n（5）\n誤り\n組合せ肢：正しいのはロ・ハ・ニ。","evidence":"[R27] 国立保健医療科学院「疫学研究デザイン」関連教材","related":"症例対照研究では通常オッズ比、コホート研究では罹患率・相対危険・寄与危険を算出できる。横断研究は有病率の把握に適する。","trap":"「原因の仮説を調べる＝コホート」とせず、群分けの起点を見る。RRが大きい＝因果確定でもない。","keywords":"疾病から過去へ＝症例対照／ばく露から未来へ＝コホート／RR＝Ie/Iu／横断＝時間順序不明","current":"【試験当時・現在】疫学原理は同じ。因果推論では関連の強さだけでなく、一貫性、時間性、用量反応、交絡等を検討する。","title":"疫学研究デザインと相対危険","refs":[{"code":"R27","label":"国立保健医療科学院「疫学研究デザイン」関連教材","url":"https://www.niph.go.jp/"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question27/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-28","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["ツールボックスミーティングは、作業開始前や作業の切替え時に、監督者 を中心に、短時間でその日の作業の範囲、段取り、分担、安全衛生のポイン ト等を現場で話し合うものである。","ＫＹ活動は、現場でその日の作業を開始する前に、作業の状況を描いたイ ラストシート等を用いて、危険要因やそれに対する対策を話し合って決め、 その対策を一人ひとりが実践するものである。","効果の上がる安全管理を行うには、事業場トップから各級の管理者、監督 者に至るまで、それぞれの役割、責任、権限を明らかにして安全管理のため の活動に取り組むことが必要である。","４Ｓのうちの整理とは、必要なときに必要な物をすぐ取り出せるように、 わかりやすく安全な状態で配置、収納することをいう。","安全管理体制は、業種、規模等に応じて、法令で義務付けられている事項 を満たした上で、その事業場の実態に即した安全活動を実施することができ る体制にすることが必要である。"],"tags":["安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"安全衛生管理","cluster":"管理・マネジメント","explanation":{"answer":"（4）","point":"現場安全活動の目的と4Sの定義を問う。整理と整頓の入替えが典型的な誤答。","conclusion":"必要な物を取り出しやすく配置・収納するのは「整頓」であり、「整理」とする（4）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nTBM：作業開始前・切替時に、監督者中心で段取り、分担、危険、安全衛生ポイントを短時間確認する。\n（2）\n正しい\nKY活動：作業場面から危険要因を抽出し、対策と行動目標を決め、全員で実践する。\n（3）\n正しい\n役割・責任・権限の明確化：トップから管理監督者まで責任体系を明確にし、組織的に安全管理する。\n（4）\n誤り\n整理の定義：記述は整頓。整理＝必要・不要を分け、不要物を処分。正しくは「4Sのうちの整頓とは…」。\n（5）\n正しい\n法令＋事業場実態に即した体制：最低限の法定体制を満たし、リスク・業種・規模に応じた自主活動を組み込む。","evidence":"[R28] 厚生労働省「未熟練労働者の安全衛生教育マニュアル」","related":"4S＝整理、整頓、清掃、清潔。5Sでは「しつけ」を加える。TBMは会議、KYは危険感受性を高める活動で、併用される。","trap":"整理と整頓の逆転は頻出。語感ではなく定義文で覚える。","keywords":"整理＝捨てる／整頓＝定位置・即時取出し／清掃＝掃除点検／清潔＝良好状態維持","current":"【試験当時・現在】基本的活動は同じ。形式化を避け、当日の変化・非定常作業を具体的に扱う。","title":"TBM・KY活動・4S","refs":[{"code":"R28","label":"厚生労働省「未熟練労働者の安全衛生教育マニュアル」","url":"https://www.mhlw.go.jp/content/000611912.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question28/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-29","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」に基づく 労働安全衛生マネジメントシステムの運用に関する次のイ～ニの記述について、 適切でないものの組合せは（１）～（５）のうちどれか。 イ 労働安全衛生マネジメントシステムに従って行う措置は、建設業の場合 には、建設現場を一の単位として実施することが基本である。 ロ 計画―実施―評価－改善というサイクルを回すために、日常的な点検・ 改善、システム監査及び事業者による労働安全衛生マネジメントシステム の全般的な見直しという三つの評価・改善を行う。 ハ 安全衛生目標は、事業場として一定期間に達成すべき到達点を明らかに するものであるが、併せて、これを基にして部署ごとの目標も設定する。 ニ 労働災害や事故が発生した場合に、その原因の調査及び問題点の把握を 行う際には、背景要因ではなく、直接の原因の解明を行うことが重要であ る。","options":["イ ロ","イ ハ","イ ニ","ロ ハ","ロ ニ"],"tags":["安全衛生管理・教育"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":2,"category":"OSHMS","cluster":"管理・マネジメント","explanation":{"answer":"（3）","point":"適用単位、PDCA、目標設定、災害原因分析の考え方を問う。","conclusion":"不適切なのはイとニの組合せで、正答は（3）。建設業は現場単独ではなく請負契約を締結した事業場と関係現場を併せた単位、原因分析は直接原因だけでなく背景要因まで行う。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n誤り\nイ：建設現場を一の単位：指針は、建設業では請負契約を締結した事業場と、その契約に係る仕事を行う事業場を併せて一単位とするのが基本。正しくは「店社と関係現場を併せる」。\n（2）\n正しい\nロ：三つの評価・改善：日常的点検・改善、システム監査、事業者による全般的見直しを組み合わせ、PDCAを回す。\n（3）\n正しい\nハ：事業場目標と部署目標：上位目標を具体化し、部門ごとの責任・指標へ展開する。\n（4）\n誤り\nニ：背景要因でなく直接原因を重視：再発防止には管理・組織・設計等の背景要因を含む根本原因分析が必要。正しくは「直接原因と背景要因を解明する」。\n（5）\n誤り\n組合せ肢：不適切はイ・ニ。","evidence":"[R29] 厚生労働省「労働安全衛生マネジメントシステムに関する指針」／[R32] 厚生労働省「令和元年改正 OSHMS指針全文」","related":"OSHMSは法令順守を土台に、方針、リスクアセスメント、目標、計画、実施、点検、監査、見直しを体系化する。認証取得そのものが目的ではない。","trap":"「現場主義＝現場だけで完結」「事故の直接原因を取れば十分」という短絡を避ける。","keywords":"PDCA／事業場単位／建設＝店社＋現場／直接原因＋背景要因／継続的改善","current":"【試験当時・現在】令和元年7月改正指針が現行。ISO 45001/JIS Q 45001との整合を意識する。","title":"労働安全衛生マネジメントシステム（OSHMS）","refs":[{"code":"R29","label":"厚生労働省「労働安全衛生マネジメントシステムに関する指針」","url":"https://www.mhlw.go.jp/stf/newpage_05821.html"},{"code":"R32","label":"厚生労働省「令和元年改正 OSHMS指針全文」","url":"https://www.mhlw.go.jp/content/11300000/6.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question29/","sourceType":"原問題（提供PDF）","currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2025-30","subject":"労働衛生一般","year":2025,"yearLabel":"令和7年度","round":53,"number":30,"question":"化学物質のリスクアセスメントにおけるリスクの見積りの方法に関する次の 記述のうち、適切でないものはどれか。","options":["マトリクス法は、危険又は健康障害の発生可能性とその重篤度をそれぞれ 縦軸と横軸とした表に、あらかじめ発生可能性と重篤度に応じたリスクを割 り付けておき、発生可能性に該当する行を選び、次に見積り対象となる危険 又は健康障害の重篤度に該当する列を選ぶことにより、リスクを見積もる方 法である。","数値化法は、危険又は健康障害の発生可能性とその重篤度を一定の尺度に よりそれぞれ数値化し、それらを数値演算（足し算、掛け算等）してリスク を見積もる方法である。","枝分かれ図を用いた方法は、危険又は健康障害の発生可能性とその重篤度 について、危険性への遭遇の頻度、回避可能性等をステップごとに分岐して いくことにより、リスクを見積もる方法である。","コントロール・バンディングは、化学物質を取り扱う作業ごとに「化学物 質の有害性」、「揮発性・飛散性」及び「ばく露量」の三つの要素の情報か ら、リスクの程度を３段階にランク分けしてリスクを見積もる方法である。","管理濃度が定められている物質についての気中濃度等の測定による方法は、 作業環境測定により測定した当該物質の第一評価値を当該物質の管理濃度と 比較する方法である。"],"tags":["作業環境測定","化学物質管理"],"examLawDate":"2025-04-01","sourcePageStart":1,"correctIndex":3,"category":"リスクアセスメント","cluster":"化学物質","explanation":{"answer":"（4）","point":"定性的・半定量的・実測ベースの見積り方法を区別し、コントロールバンディングの入力要素と段階数を確認する。","conclusion":"コントロールバンディングは有害性、物理的形態（揮発性・飛散性）、取扱量から通常4段階の管理区分を示すため、「ばく露量」「3段階」とする（4）が不適切。","choicesExplain":"肢\n判定\n理由・正しい文章\n（1）\n正しい\nマトリクス法：発生可能性×重篤度の表でリスク区分を決める。尺度定義を事前に明確化する。\n（2）\n正しい\n数値化法：可能性・重篤度等を点数化し加算・乗算する。数値は絶対的確率ではなく優先順位付けの道具。\n（3）\n正しい\n枝分かれ図：遭遇頻度、回避可能性、重篤度等を段階的に選択しリスク区分へ到達する。\n（4）\n誤り\nコントロールバンディング：入力は有害性、取扱量、揮発性/飛散性で、管理手法を4段階に区分する。正しくは「取扱量」「4段階」。\n（5）\n正しい\n気中濃度測定による方法：管理濃度設定物質では、作業環境測定の第一評価値等を管理濃度と比較し管理区分を決める。個人ばく露評価とは目的・指標が異なる。","evidence":"[R30] 厚生労働省「化学物質等のリスクアセスメント」・コントロールバンディング／[R33] 厚生労働省「コントロールバンディングの流れ」／[R19] e-Gov／厚生労働省「作業環境評価基準」","related":"有害性（ハザード）と、ばく露を含むリスクを区別する。簡易法で高リスクなら、より詳細な測定・モデル・専門家判断へ段階的に進む。","trap":"「ばく露量」という完成した情報を入力するのではなく、取扱量と物理的形態からばく露ポテンシャルを推定する。3段階ではなく4段階。","keywords":"マトリクス／数値化／枝分かれ／CB＝有害性＋取扱量＋揮発・飛散、4段階","current":"【試験当時・現在】CREATE-SIMPLE等のより精緻な支援ツールが更新されている。ツール結果を盲信せず、作業実態と不確実性を確認する。\n\n4．横断比較表\n4-1．労働衛生の三管理\n管理\n直接の対象\n代表例\n作業環境管理\n発生源・作業場\n代替、密閉、局所排気、全体換気、作業環境測定\n作業管理\n作業方法・時間・ばく露\n手順、作業時間、立入制限、保護具、省力化、適正姿勢\n健康管理\n労働者の健康\n健診、医師意見、保健指導、就業措置、適正配置\n4-2．濃度・基準値\n用語\n性格\n主な用途・注意\n管理濃度\n作業環境管理の行政的指標\nA/B測定から管理区分を決定。個人の許容ばく露値そのものではない。\n濃度基準値\n安衛則に基づく個人ばく露の基準\n8時間値・短時間値。呼吸域測定等でばく露を評価。\n許容濃度\n日本産業衛生学会の勧告値\n法的な安全・危険の境界ではない。感受性差等を残す。\n生物学的許容値\n尿・血液等の生体指標\n吸入以外の経路も反映し得る。採取時期が重要。\n最大許容濃度\nいかなる時点でも超えないことを意図\n刺激性・急性影響等のピークを重視。\n4-3．測定・モニタリング\n方法\n何を測るか\n目的\n作業環境測定\n単位作業場所の場の濃度\n作業場の状態を評価し管理区分を決定。\n個人サンプリング法による作業環境測定\n作業者に装着した試料採取器\n法定作業環境測定の一方式。単位作業場所を評価。\n個人ばく露測定・確認測定\n呼吸域の個人濃度\n濃度基準値との比較、最悪ばく露者の評価。\n生物学的モニタリング\n血・尿・呼気等の物質・代謝物\n吸収量・内部ばく露を評価。\n健康診断\n健康影響・早期変化\n疾病・所見の早期発見と事後措置。\n4-4．疫学指標\n指標\n式・定義\n読み方\n罹患率\n一定期間の新規発症数／リスク人口・人時間\n新たに発症する速さ・危険。\n有病率\nある時点・期間の患者数／対象人口\n既に病気を持つ割合。罹患率と期間の影響を受ける。\n相対危険 RR\nIe／Iu\nばく露群のリスクが非ばく露群の何倍か。\nオッズ比 OR\n症例のばく露オッズ／対照のばく露オッズ\n症例対照研究の代表指標。稀な疾病ではRRに近似。\n感度\n真陽性／疾病あり\n疾病者を陽性にできる割合。\n特異度\n真陰性／疾病なし\n非疾病者を陰性にできる割合。\n陽性的中率\n真陽性／検査陽性\n有病率の影響を強く受ける。\n\n5．直前確認：数値・公式一覧\n5-1．数値・式\n論点\n覚える内容\n酸素欠乏\n法令上は酸素濃度18％未満。約16％で呼吸・脈拍増、6％未満は急速な意識喪失リスク。\n情報機器作業\n一連続作業1時間以内、作業休止10～15分、一連続内に1～2回の小休止。\n呼吸域\n両耳を結ぶ線の中央を中心とする顔前方の半径30 cm半球。\n騒音性難聴\n初期は4,000 Hz付近のC5 dip。感音性で著明な気骨導差なし。\n要求防護係数\n要求PF＝最大測定濃度／濃度基準値。指定PFが要求PF以上の保護具を選ぶ。\n相対危険\nRR＝Ie／Iu。Ie：ばく露群罹患率、Iu：非ばく露群罹患率。\nA測定1日評価\nlog EA1＝log M＋1.645√{(log σ)²＋0.084}。0.084は日間変動相当。\nWBGT（屋内・日射なし）\nWBGT＝0.7×自然湿球温度＋0.3×黒球温度。\nWBGT（屋外・日射あり）\nWBGT＝0.7×自然湿球温度＋0.2×黒球温度＋0.1×乾球温度。\n令和5年健診\n総有所見58.9％、血中脂質31.2％、血糖13.1％。\n令和5年じん肺\n健診受診302,070人、有所見27,164人、新規有所見916人。\nコントロールバンディング\n有害性＋取扱量＋揮発性/飛散性 → 4段階の管理手法。\n6．令和7年度の出題傾向\n化学物質の自律的管理が明確に反映され、問22の濃度基準値・確認測定、問23のSDS、問25の要求防護係数、問30のリスク見積りが連続して出題された。単なる物質暗記だけでなく、リスクアセスメントから測定、工学的対策、保護具選択までの一連の流れを理解する必要がある。\n従来型の基礎問題も厚く、粉じん・石綿・じん肺、騒音、酸欠、放射線、潜水、局所排気、検知管など、標準的な労働衛生工学・職業病の知識が広く問われた。\n健康管理分野では、派遣労働者、過重労働、メンタルヘルス、情報機器作業、熱中症など、指針の文言を正確に読ませる問題が多い。特に「義務」「望ましい」「原則」「同意を得た上で」の修飾語が正誤を分ける。\n計算そのものを要求する問題は少なかったが、作業環境評価式、要求防護係数、相対危険、WBGT等の式の意味を理解していないと選択肢の方向性を判断できない構成である。\n7．この年度で特に間違えやすい10項目\n1. 福祉用具導入は本問では作業管理。設備という語だけで作業環境管理にしない。\n2. 付着残留物の再放散は三次喫煙。受動喫煙（二次喫煙）と区別。\n3. 令和5年定健の項目別1位は血中脂質31.2％で、血糖ではない。\n4. 蒸気は分子状気体、エアロゾルは粒子分散系。\n5. 騒音性難聴は感音性で、気導だけが低下するのではない。\n6. 高代謝作業ほどWBGT基準値は低くなる。\n7. B測定を複数点で行った場合は平均でなく最大値。\n8. 外付け式フードで距離増加に伴い増やすのは主に排風量。制御風速値と混同しない。\n9. 呼吸域は半径1mでなく30cm。\n10. コントロールバンディングは取扱量を用い、管理手法は4段階。\n8．今後の学習方法と優先順位\n8-1．推奨学習サイクル\n段階\n具体的方法\n第1段階：分類の骨格\n三管理、リスク低減の優先順位、作業環境測定と個人ばく露測定、管理濃度と濃度基準値を比較表で説明できるようにする。\n第2段階：有害因子の対応表\n物質・因子ごとに「発生源／状態／侵入経路／標的臓器／急性・慢性／測定／対策」を一行でまとめる。\n第3段階：測定・工学\nA・B測定、評価値、検知管、局排フード、制御風速・排風量を図で反復する。\n第4段階：指針の数値\n情報機器1時間、呼吸域30cm、酸欠18％、C5 dip 4kHz、WBGT補正等をカード化する。\n第5段階：統計と疫学\n出題年ごとに統計表を保存し、分母と除外条件を付記。研究デザインは群分けの起点を図示する。\n第6段階：最新改正\n熱中症義務化、濃度基準値追加、SDS対象拡大、フィットテスト等を年度別に差分更新する。\nおすすめの復習方法：初回は正答を隠して解く → 誤答肢の「修正文」だけ音読 → 1週間後に暗記キーワードから説明を再現 → 月1回、最新改正欄だけ更新する。\n\n9．参考文献・根拠資料\n最終確認日：2026年6月22日。URLは改訂・移転される場合があるため、文書名でも検索すること。\n[R01] 第53回労働衛生コンサルタント試験（労働衛生一般） https://www.exam.or.jp/exmn/H_kakomon.htm\n[R02] 厚生労働省「労働衛生の3管理」関連資料 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121.html\n[R03] 厚生労働省「職場における受動喫煙防止のためのガイドライン」 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000189195.html\n[R04] 厚生労働省「令和5年業務上疾病発生状況（業種別・疾病別）」 https://www.mhlw.go.jp/content/11300000/001292235.pdf\n[R05] 厚生労働省「令和5年 労働安全衛生調査（実態調査）の概況」 https://www.mhlw.go.jp/toukei/list/dl/r05-46-50_gaikyo.pdf\n[R06] 環境省「石綿と健康被害」・厚生労働省石綿関連資料 https://www.env.go.jp/air/asbestos/\n[R07] 厚生労働省「じん肺診査ハンドブック」等 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000152476.html\n[R08] 環境省「放射線による健康影響等に関する統一的な基礎資料」 https://www.env.go.jp/chemi/rhm/basic_data.html\n[R09] 厚生労働省「潜水業務における現場でできる応急対応に関する研究」 https://www.mhlw.go.jp/content/001104996.pdf\n[R10] 職場のあんぜんサイト「硫化水素 SDS」 https://anzeninfo.mhlw.go.jp/anzen/gmsds/7783-06-4.html\n[R11] 厚生労働省「騒音障害防止のためのガイドライン」関連資料 https://www.mhlw.go.jp/stf/newpage_32483.html\n[R12] 厚生労働省「職場における熱中症予防基本対策要綱」・令和7年改正 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000116133.html\n[R13] 厚生労働省「情報機器作業における労働衛生管理のためのガイドライン」 https://www.mhlw.go.jp/content/000539604.pdf\n[R14] 厚生労働省「健康診断結果に基づき事業者が講ずべき措置に関する指針」 https://www.mhlw.go.jp/content/000616422.pdf\n[R15] 厚生労働省「過重労働による健康障害防止のための総合対策」 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000046653.html\n[R16] 厚生労働省「労働者の心の健康の保持増進のための指針」 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000055195.html\n[R17] 職場のあんぜんサイト「GHS対応モデルSDS情報」 https://anzeninfo.mhlw.go.jp/anzen_pg/GHS_MSD_FND.aspx\n[R18] 厚生労働省「検知管を用いた化学物質のリスクアセスメントガイドブック」 https://anzeninfo.mhlw.go.jp/user/anzen/kag/pdf/kenchi-guidebook.pdf\n[R19] e-Gov／厚生労働省「作業環境評価基準」 https://www.mhlw.go.jp/web/t_doc?dataId=74096000&dataType=0&pageNo=1\n[R20] 厚生労働省「換気（局所排気装置）」 https://anzeninfo.mhlw.go.jp/user/anzen/kag/pdf/taisaku/common_Ventilating.pdf\n[R21] 厚生労働省「職場における腰痛予防対策指針及び解説」 https://www.mhlw.go.jp/content/11303000/001376468.pdf\n[R22] 厚生労働省「濃度基準値と技術上の指針」 https://www.mhlw.go.jp/stf/newpage_32871.html\n[R23] 厚生労働省「化学物質対策に関するQ&A（ラベル・SDS関係）」 https://www.mhlw.go.jp/stf/newpage_11237.html\n[R24] 厚生労働省「腰痛の業務上外の認定基準」関連資料 https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000111055.html\n[R25] 厚生労働省「防じんマスク、防毒マスク等の選択、使用等について」 https://www.mhlw.go.jp/content/11300000/001100842.pdf\n[R26] 厚生労働省「安全衛生特別教育規程」 https://www.mhlw.go.jp/web/t_doc?dataId=74085000&dataType=0&pageNo=1\n[R27] 国立保健医療科学院「疫学研究デザイン」関連教材 https://www.niph.go.jp/\n[R28] 厚生労働省「未熟練労働者の安全衛生教育マニュアル」 https://www.mhlw.go.jp/content/000611912.pdf\n[R29] 厚生労働省「労働安全衛生マネジメントシステムに関する指針」 https://www.mhlw.go.jp/stf/newpage_05821.html\n[R30] 厚生労働省「化学物質等のリスクアセスメント」・コントロールバンディング https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000094015.html\n[R31] 厚生労働省「令和6年 定期健康診断実施結果（全国値掲載資料）」 https://jsite.mhlw.go.jp/gunma-roudoukyoku/content/contents/002293626.pdf\n[R32] 厚生労働省「令和元年改正 OSHMS指針全文」 https://www.mhlw.go.jp/content/11300000/6.pdf\n[R33] 厚生労働省「コントロールバンディングの流れ」 https://www.mhlw.go.jp/content/11303000/001509810.pdf\n[R34] 厚生労働省「高気圧作業安全衛生規則に基づく再圧室等Q&A」 https://www.mhlw.go.jp/file/06-Seisakujouhou-11200000-Roudoukijunkyoku/0000201216.pdf\n[R35] 厚生労働省「化学物質による健康障害防止のための濃度の基準の適用等に関する技術上の指針」（令和6年改正） https://www.mhlw.go.jp/content/11300000/001252603.pdf\n対象問題冊子：ユーザー提供「令和7年(4).pdf」（表紙に「第53回 労働衛生コンサルタント試験（労働衛生一般）」と明記）。\n労働衛生コンサルタント試験\n令和7年度（第53回）","title":"化学物質リスクの見積り手法","refs":[{"code":"R19","label":"e-Gov／厚生労働省「作業環境評価基準」","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74096000&dataType=0&pageNo=1"},{"code":"R30","label":"厚生労働省「化学物質等のリスクアセスメント」・コントロールバンディング","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000094015.html"},{"code":"R33","label":"厚生労働省「コントロールバンディングの流れ」","url":"https://www.mhlw.go.jp/content/11303000/001509810.pdf"}]},"oshUrl":"https://osh-management.com/consultant/health/2025/gen-question30/","sourceType":"原問題（提供PDF）","currentBadge":"関連改正あり","currentUpdates":["chem2026"],"detailLevel":"濃厚"},{"prompt":"常時使用する労働者2,000人の事業場で、硝酸取扱業務に常時20人を従事させている（他の有害業務なし、試験研究ではない、衛生管理者の特例なし）。次のイ～ホのうち、法令上正しいものの組合せはどれか。\nイ 産業医を2人以上選任\nロ 専属産業医を選任\nハ 衛生管理者を5人以上選任\nニ 衛生管理者のうち1人を衛生工学衛生管理者免許者から選任\nホ 特定化学物質作業主任者を選任","options":["イ・ハ","イ・ハ・ニ","ロ・ニ・ホ","ロ・ホ","ニ・ホ"],"category":"安全衛生管理体制","cluster":"管理・マネジメント","id":"law-2025-01","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":1,"correctIndex":3,"explanation":{"answer":"正答：（4）ロ・ホ","point":"常時使用労働者数による産業医・衛生管理者の人数要件と、有害業務の種類・従事者数による専属要件、衛生工学衛生管理者要件、作業主任者要件を重ねて判定する問題である。人数の境界「2,000人」と、有害業務20人という条件を別々に処理するのがコツとなる。","reason":"2,000人の事業場では産業医は1人で足りるが、常時1,000人以上を使用するため専属産業医が必要である。衛生管理者は常時1,001～2,000人では4人以上であり、5人以上ではない。硝酸取扱業務の常時従事者は20人なので「500人超かつ有害業務30人以上」による衛生工学衛生管理者の要件を満たさない。一方、硝酸は特定化学物質として、試験研究以外の取扱作業では特定化学物質作業主任者の選任対象となる。","choicesExplain":"イ 誤り 「2人以上の産業医」\n産業医が2人以上必要となるのは常時3,000人を超える労働者を使用する事業場である。2,000人は1人でよい。 〔根拠：安衛令第5条、安衛則第13条〕\nロ 正しい 「専属の産業医」\n常時1,000人以上を使用する事業場では、事業場に専属の産業医を選任する。2,000人なので該当する。 〔根拠：安衛則第13条第1項〕\nハ 誤り 「衛生管理者5人以上」\n常時1,001～2,000人の区分は4人以上。5人以上は常時2,001～3,000人の区分からである。「2,000人ちょうど」を次の区分に入れない。 〔根拠：安衛則第7条第1項第4号・別表〕\nニ 誤り 「衛生工学衛生管理者免許を受けた者を1人」\nこの上乗せ要件は、常時500人を超える労働者を使用し、かつ一定の有害業務に常時30人以上を従事させる場合等に問題となる。本問は有害業務20人なので該当しない。 〔根拠：安衛則第7条第1項第6号〕\nホ 正しい 「特定化学物質作業主任者」\n硝酸を取り扱う作業は、適用除外がなく試験研究でもないため、技能講習修了者から作業主任者を選任する。 〔根拠：安衛令第6条第18号、特化則第27条〕","basis":"労働安全衛生法第12条（衛生管理者）、第13条（産業医）、第14条（作業主任者）\n労働安全衛生法施行令第4条、第5条、第6条第18号、別表第3\n労働安全衛生規則第7条、第13条\n特定化学物質障害予防規則第27条","current":"【試験当時】令和7年4月1日現在の人数区分・専属要件による。【現在】本問の結論を変える改正はない。令和8年以降の個人事業者等への安全衛生対策拡張は、事業場の産業医・衛生管理者の人数判定を変更するものではない。","keywords":"✓ 2,000人＝産業医1人\n✓ 1,000人以上＝専属産業医\n✓ 1,001～2,000人＝衛生管理者4人\n✓ 有害業務30人以上が衛生工学要件の境界\n✓ 硝酸＝特化物・作業主任者","trap":"注意\n「2,000人」を「2,001人以上」の欄に入れる境界値ミスと、「事業場全体の人数」と「有害業務従事者数」を混ぜることが典型的なひっかけである。","title":"安全衛生管理体制（2,000人・硝酸取扱い）"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question01/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"労働安全衛生法施行令","url":"https://laws.e-gov.go.jp/law/347CO0000000318"},{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"},{"label":"特定化学物質障害予防規則","url":"https://laws.e-gov.go.jp/law/347M50002000039"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"A＝規格具備、B＝型式検定、C＝定期自主検査とする。次のイ～ホの制度対応のうち正しいもののみを挙げた組合せはどれか。\nイ 防じん機能を有する電動ファン付き呼吸用保護具＝A・B\nロ 再圧室＝A・C\nハ 透過写真撮影用ガンマ線照射装置＝A\nニ 排気量40 cm³以上のチェーンソー＝A・B\nホ 特定化学設備＝C","options":["イ・ロ・ホ","イ・ホ","ロ・ハ","ロ・ニ","ハ・ニ・ホ"],"category":"機械等の規制","cluster":"管理・マネジメント","id":"law-2025-02","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":2,"correctIndex":1,"explanation":{"answer":"正答：（2）イ・ホ","point":"機械等に対する三つの制度、A＝構造規格・安全装置の具備、B＝型式検定、C＝定期自主検査を区別する問題である。同じ機械が複数制度の対象になる場合もあるため、「名称から危険そう」と推測せず、政令の列挙で覚える。","reason":"防じん機能を有する電動ファン付き呼吸用保護具は、厚生労働大臣の定める規格を備え、かつ型式検定を受ける対象である。特定化学設備は定期自主検査の対象である。再圧室は本肢のA・Cの双方という組合せが誤り、ガンマ線照射装置はAのみとはいえず、40 cm³以上のチェーンソーは型式検定対象ではあるがAも対象とする組合せが誤りとなる。","choicesExplain":"イ 正しい 電動ファン付き呼吸用保護具＝A・B\n防じん機能を有する電動ファン付き呼吸用保護具は、譲渡等の制限に係る規格適合と型式検定の双方が必要である。 〔根拠：安衛法第42条・第44条の2、安衛令第13条・第14条の2〕\nロ 誤り 再圧室＝A・C\n再圧室について本肢のようにAと定期自主検査Cの双方を結び付けるのは誤り。再圧室は高圧則上の設置・維持・使用の規制と混同しない。 〔根拠：安衛法第42条・第45条、安衛令第13条・第15条、高圧則〕\nハ 誤り 透過写真撮影用ガンマ線照射装置＝A\nガンマ線照射装置の規制は、電離則上の装置・作業主任者・立入管理等であり、ここでいう安衛法第42条のAだけに該当するとの整理は誤りである。 〔根拠：電離放射線障害防止規則、安衛令第6条〕\nニ 誤り 40 cm³以上のチェーンソー＝A・B\nこのチェーンソーは型式検定Bの対象だが、Aとのセットではない。数値「40 cm³以上」は型式検定対象を識別する語である。 〔根拠：安衛法第44条の2、安衛令第14条の2〕\nホ 正しい 特定化学設備＝C\n特定化学設備は、1年以内ごとに1回の定期自主検査等が必要な機械等に該当する。 〔根拠：安衛法第45条、安衛令第15条、特化則第31条等〕","basis":"労働安全衛生法第42条、第44条の2、第45条\n労働安全衛生法施行令第13条、第14条の2、第15条\n機械等検定規則\n特定化学物質障害予防規則（特定化学設備の自主検査）","current":"【試験当時】令和7年4月1日の対象機械等による。【現在】対象制度の基本的な区分は同じ。令和7年改正法では機械等の災害防止制度の見直しが段階施行されるため、今後は登録機関・検査制度の改正条文も確認するが、本問の個別判定は変わらない。","keywords":"✓ A＝規格具備\n✓ B＝型式検定\n✓ C＝定期自主検査\n✓ PAPRはA＋B\n✓ チェーンソー40 cm³以上はB\n✓ 特定化学設備はC","trap":"注意\n「規格」「検定」「自主検査」は似て見えるが、目的も実施主体も異なる。型式検定は製品型式、定期自主検査は事業者が使用中の設備に行う点で切り分ける。","title":"機械等の規制（規格・型式検定・定期自主検査）"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question02/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"労働安全衛生法施行令","url":"https://laws.e-gov.go.jp/law/347CO0000000318"},{"label":"特定化学物質障害予防規則","url":"https://laws.e-gov.go.jp/law/347M50002000039"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"リスクアセスメント対象物の管理に関する次の記述のうち、誤っているものはどれか。","options":["RA対象物を製造・取り扱う事業場ごとに化学物質管理者を選任する。","RAの記録は次回RAまで保存し、次回が3年以内でも起算日から3年間保存する。","がん原性物質に係る健康障害防止措置の実施状況は、1年を超えない期間ごとに記録する。","濃度基準を超えてばく露したおそれがある場合の健康診断を実施し、その結果報告書を所轄労働基準監督署長へ提出する。","RA結果等は掲示・備付け、書面交付、電子的方法等で対象業務従事者に周知する。"],"category":"化学物質・自律的管理","cluster":"化学物質","id":"law-2025-03","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":3,"correctIndex":3,"explanation":{"answer":"正答：（4）","point":"化学物質の自律的管理に関する新しい規定を横断的に問う。化学物質管理者、リスクアセスメント記録、がん原性物質の記録、健康診断、労働者周知をそれぞれ別制度として整理する必要がある。","reason":"濃度基準を超えてばく露したおそれがある場合の健康診断自体は必要だが、その結果報告書を所轄労働基準監督署長へ提出する規定はない。事業者は健康診断個人票の作成・保存、医師等からの意見聴取、必要な事後措置、本人への通知等を行う。したがって、監督署長への結果報告まで義務とする（4）が誤りである。","choicesExplain":"（1） 正しい 事業場ごとの化学物質管理者\nRA対象物を製造又は取り扱う事業場ごとに化学物質管理者を選任し、管理に係る技術的事項を管理させる。 〔根拠：安衛則第12条の5〕\n（2） 正しい RA記録の保存\n記録は次回のRAまで保存し、3年以内に次回RAを行った場合でも、起算日から3年間は保存する。 〔根拠：安衛則第34条の2の8〕\n（3） 正しい がん原性物質に係る措置状況の定期記録\n健康障害防止措置の実施状況は1年を超えない期間ごとに記録し、通常は3年間保存する。著しい汚染事態の記録や作業記録等には別の長期保存規定があるため、記録の種類を混同しない。 〔根拠：安衛則第577条の2〕\n（4） 誤り ばく露のおそれ時健診と監督署報告\n健康診断は実施するが、結果報告書の提出義務は規定されていない。「健診義務」と「行政報告義務」を勝手にセットにしない。 〔根拠：安衛則第577条の2〕\n（5） 正しい RA結果等の労働者周知\n掲示・備付け、書面交付、電子的方法等により、対象業務従事者に所定事項を周知する。 〔根拠：安衛則第34条の2の8〕","basis":"労働安全衛生法第57条の3\n労働安全衛生規則第12条の5、第34条の2の7・第34条の2の8、第577条の2\n濃度基準値に関する告示・関係通達","current":"【試験当時】2025年4月1日までに段階的に拡大されたRA対象物を前提とする。【2026-09-25現在】2026年4月から対象物質は約2,900物質へ拡大済み。ただし、化学物質管理者・RA記録・周知・健康診断の制度構造と本問の正答番号は変わらない。","keywords":"✓ 事業場ごとに化学物質管理者\n✓ RA記録＝次回まで／最低3年\n✓ 1年を超えない期間ごと\n✓ 健診結果の監督署報告なし\n✓ 掲示・備付け等で周知","trap":"注意\n「特殊健診結果報告書」の印象から、すべての化学物質健診に監督署報告があると思わせるひっかけ。RA対象物健診は、実施・記録・意見聴取・事後措置と行政報告を分ける。","title":"リスクアセスメント対象物の管理"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question03/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"}],"currentBadge":"関連改正あり","currentUpdates":["chem2026"],"detailLevel":"濃厚"},{"prompt":"有機溶剤作業場が第三管理区分となった後の措置の流れとして正しいものはどれか。\nA＝定期測定・評価で第三管理区分\nB＝改善後の再測定・再評価\nC＝個人サンプリング測定等\nD＝直ちに必要な作業環境改善措置\nE＝外部の作業環境管理専門家の意見聴取\nF＝6か月以内ごとの継続測定","options":["A→E。改善困難ならC→F、改善可能ならD→B→C","A→E。改善困難ならC→F、改善可能ならD→C","A→D→B。なお第三ならE。改善可能ならD→Bを再実施し、改善困難又は再改善後も第三ならC→F","A→D→B。なお第三ならE。改善可能ならD→B→F","A→D→B。なお第三ならE。改善可能ならD→C→F"],"category":"第三管理区分・作業環境管理","cluster":"測定・換気","id":"law-2025-04","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":4,"correctIndex":2,"explanation":{"answer":"正答：（3）","point":"令和6年4月1日施行の第三管理区分対策強化を、措置の順序で問う問題である。「直ちに改善→再測定・再評価→専門家意見→改善可能性に応じた再改善→個人サンプリング等」の順序が核心となる。","reason":"正しい流れは、A（定期測定・評価で第三管理区分）→D（直ちに必要な改善措置）→B（再測定・再評価）→なお第三管理区分ならE（外部の作業環境管理専門家の意見聴取）。改善可能ならD→Bを再度行う。改善困難、又は再改善後も第三管理区分ならC（個人サンプリング測定等）を行い、第一・第二管理区分になるまでF（6か月以内ごとの測定）を継続する。この全過程を示す（3）が正しい。","choicesExplain":"（1） 誤り Aの直後にEへ進む\nまず事業者が直ちに必要な改善Dを行い、再測定・再評価Bをする。最初から専門家意見へ進む順序ではない。 〔根拠：有機則第28条の3・第28条の3の2〕\n（2） 誤り 改善可能後の再評価Bがない\n改善可能との意見を受けてDを行った後は、効果確認のBが必要である。 〔根拠：有機則第28条の3の2〕\n（3） 正しい 法定の全工程を示す\n初回改善と再評価、専門家意見、再改善と再評価、改善困難時等の個人サンプリング測定、継続測定をすべて正しい順序で示している。 〔根拠：有機則第28条の3・第28条の3の2〕\n（4） 誤り 改善可能ルート後の接続が不適切\n再改善後のBの結果が第三管理区分であることを受けてCへ進む必要があり、図の工程の表し方が法定順序を正確に示していない。 〔根拠：同上〕\n（5） 誤り 再改善後のBを欠く\n改善可能の場合にDだけでCへ進むのではなく、再測定・再評価Bを挟む。 〔根拠：同上〕","basis":"有機溶剤中毒予防規則第28条（測定）、第28条の2（評価）、第28条の3（第三管理区分の措置）、第28条の3の2\n第三管理区分に区分された場所に係る有機溶剤等の濃度の測定の方法等（令和4年厚生労働省告示第341号）\n基発1130第1号（令和4年11月30日）","current":"【試験当時】令和6年4月1日から施行された強化措置が適用済み。【現在】同じ。改善困難等の場合には、呼吸用保護具の選定、装着確認、保護具着用管理責任者の選任、第三管理区分措置状況届の提出も合わせて学ぶ。","keywords":"✓ 第三管理区分→直ちに改善\n✓ 改善後に再測定・再評価\n✓ なお第三→外部専門家\n✓ 改善困難等→個人サンプリング等\n✓ 6か月以内ごとに1回","trap":"注意\n「専門家にまず相談」が実務的に見えても、法令問題では工程順が決まっている。DとBをワンセットで覚える。","title":"第三管理区分となった有機溶剤作業場の措置"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question04/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"有機溶剤中毒予防規則","url":"https://laws.e-gov.go.jp/law/347M50002000036"}],"currentBadge":"関連改正あり","currentUpdates":["measure2026"],"detailLevel":"濃厚"},{"prompt":"面接指導・ストレスチェック等に関する次の記述のうち、正しいものはどれか。","options":["時間外・休日労働が月80時間超で疲労蓄積があり申出た労働者には、医師による健康診断を行う。","健診結果に基づく産業医の意見に健康情報が含まれる場合、事業者への提供には本人同意が必須である。","人事異動の権限を有する監督者でも医師等の資格があれば、その労働者のストレスチェック実施事務に従事できる。","ストレスチェック後の医師面接では、検査項目、勤務状況、心理的負担、その他の心身の状況を確認する。","常時50人以上の事業者は、各労働者のストレスチェック個人結果を所轄労働基準監督署長へ提出する。"],"category":"面接指導・ストレスチェック","cluster":"健康管理","id":"law-2025-05","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":5,"correctIndex":3,"explanation":{"answer":"正答：（4）","point":"長時間労働者への面接指導と、ストレスチェック、健診結果に基づく医師意見を区別する。特に「健康診断」と「面接指導」、「個人結果」と「実施状況報告」の語を厳密に読む。","reason":"ストレスチェック後の医師による面接指導では、検査項目に関する事項に加え、勤務状況、心理的負担の状況、その他の心身の状況を確認する。（4）は安衛則の確認事項を正確に示している。","choicesExplain":"（1） 誤り 80時間超・疲労・申出時に「健康診断」\n必要なのは医師による面接指導である。時間外・休日労働が月80時間超、疲労蓄積、本人申出が基本要件。 〔根拠：安衛法第66条の8、安衛則第52条の2・第52条の3〕\n（2） 誤り 産業医意見に個人情報があれば本人同意\n法に基づき事業者が医師等の意見を聴く制度であり、本人同意を要件としない。ただし、必要最小限の健康情報の取扱いと守秘・目的外利用防止は必要。 〔根拠：安衛法第66条の4・第66条の5〕\n（3） 誤り 異動権限を持つ監督者が実施者\n人事権を持つ監督的地位の者は、たとえ医師等の資格があっても、当該労働者のストレスチェック実施事務に従事できない。 〔根拠：安衛則第52条の10、関係指針〕\n（4） 正しい 面接指導の確認事項\n検査項目、勤務状況、心理的負担、その他心身の状況を確認する。 〔根拠：安衛則第52条の17〕\n（5） 誤り 労働者ごとの結果記録を監督署へ提出\n個人結果は実施者等が5年間保存し、事業者への提供には原則本人同意が必要。監督署へ提出するのは事業場単位の心理的な負担の程度を把握するための検査結果等報告書であり、個人結果ではない。 〔根拠：安衛則第52条の13・第52条の21〕","basis":"労働安全衛生法第66条の4、第66条の8、第66条の10\n労働安全衛生規則第52条の2・第52条の3、第52条の10、第52条の13、第52条の17、第52条の21\n心理的な負担の程度を把握するための検査及び面接指導の実施並びに面接指導結果に基づき事業者が講ずべき措置に関する指針","current":"【試験当時】ストレスチェック義務は常時50人以上の事業場、50人未満は努力義務。【2026-09-25現在】50人未満も義務化する改正は成立済みだが施行前で、施行日は2028年4月1日。現在の試験対策では「施行前」と「施行後」を分ける。","keywords":"✓ 月80時間超＋疲労＋申出\n✓ 健康診断ではなく面接指導\n✓ 人事権者は実施事務不可\n✓ 勤務・心理・心身を確認\n✓ 個人結果を監督署へ出さない\n✓ 記録5年","trap":"注意\n「医師が行うから健康診断」と決め付けること、個人結果と実施状況報告を混同すること、人事権者が職場事情を知るから適任と思わせること。","title":"健康保持増進・面接指導・ストレスチェック"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question05/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"}],"currentBadge":"関連改正あり","currentUpdates":["stress2028"],"detailLevel":"濃厚"},{"prompt":"次の業務のうち、作業従事者本人が都道府県労働局長の免許を受ける必要があるものはどれか。\nイ 高圧室内作業\nロ 工業用エックス線装置の使用\nハ アーク溶接\nニ 潜水器を用いる潜水業務（水深10 m未満）","options":["イ・ロ・ハ","イ・ロ","ロ・ニ","ハ・ニ","ニのみ"],"category":"就業制限・免許","cluster":"安全衛生教育","id":"law-2025-06","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":6,"correctIndex":4,"explanation":{"answer":"正答：（5）ニのみ","point":"安衛法第61条の就業制限は、免許・技能講習などの資格が必要な「業務そのもの」を列挙する。一方、作業主任者免許を持つ者を選任すれば足りる業務、特別教育で足りる業務を区別する。","reason":"潜水器を用い、送気又は給気を受けて水中で行う潜水業務は、水深10 m未満でも潜水士免許が必要である。その他は、作業主任者の選任又は特別教育の問題であり、作業従事者全員に都道府県労働局長免許を要求するものではない。","choicesExplain":"イ 誤り 高圧室内の作業従事者\n高圧室内作業主任者は免許者から選任するが、作業従事者全員が免許を受けなければならない就業制限業務ではない。必要な特別教育等と区別する。 〔根拠：安衛令第6条第1号、高圧則第10条等〕\nロ 誤り 工業用X線装置の使用\nエックス線作業主任者を免許者から選任する規制であり、装置使用者全員に免許を求めるものではない。 〔根拠：安衛令第6条第5号、電離則第46条〕\nハ 誤り アーク溶接\nアーク溶接機による金属溶接は特別教育の対象。都道府県労働局長免許による就業制限ではない。 〔根拠：安衛則第36条第3号〕\nニ 正しい 潜水業務（水深10 m未満を含む）\n潜水器を用いる潜水業務は潜水士免許が必要。水深の浅さによる免許除外はない。 〔根拠：安衛法第61条、安衛令第20条第9号、高圧則第52条以下〕","basis":"労働安全衛生法第61条\n労働安全衛生法施行令第20条第9号\n労働安全衛生規則第36条第3号\n高気圧作業安全衛生規則、電離放射線障害防止規則","current":"【試験当時・現在】本問の区分は同じ。令和7年改正法の段階施行で個人事業者等にも安全衛生教育や遵守義務が拡張されるが、潜水士免許を要する業務の判定は変わらない。","keywords":"✓ 潜水士免許＝水深にかかわらない\n✓ 作業主任者免許≠全員免許\n✓ アーク溶接＝特別教育\n✓ X線＝作業主任者","trap":"注意\n「免許を持つ人が必要」と「従事者本人が免許を持たなければ就けない」を混同させる問題。主語が作業主任者か作業者かを確認する。","title":"免許を要する就業制限業務"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question06/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"労働安全衛生法施行令","url":"https://laws.e-gov.go.jp/law/347CO0000000318"},{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"},{"label":"高気圧作業安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000040"},{"label":"電離放射線障害防止規則","url":"https://laws.e-gov.go.jp/law/347M50002000041"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"計画の届出・報告等に関するイ～ニのうち、誤っているもののみを挙げた組合せはどれか。\nイ 特定化学設備の排液処理設備の設置工事計画は14日前までに労基署長へ届け出る。\nロ 圧気工法で作業室圧力が100 kPa以上となる工事計画は30日前までに厚生労働大臣へ届け出る。\nハ 休業4日未満の労働災害は四半期ごとに、期間後2か月以内に報告する。\nニ 同一事業場で同種のがんが1年以内に2人以上発生し化学物質取扱いとの関連が疑われるときは、速やかに医師の意見を聴く。","options":["イ","イ・ロ・ハ","ロ・ハ","ロ・ハ・ニ","ハ・ニ"],"category":"届出・報告","cluster":"管理・マネジメント","id":"law-2025-07","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":7,"correctIndex":1,"explanation":{"answer":"正答：（2）イ・ロ・ハが誤り","point":"行政手続の提出期限・提出先・報告時期を問う。14日と30日、厚生労働大臣と所轄労働基準監督署長、翌月末と翌々月末を正確に区別する。","reason":"イは排液処理装置の設置計画届が原則工事開始30日前までであり14日前ではない。ロは100 kPa以上の圧気工法による仕事の計画を開始14日前までに所轄労働基準監督署長へ届けるため、30日前・厚生労働大臣が誤り。ハは休業4日未満の四半期報告は各期間の最後の月の翌月末までであり、翌々月末ではない。ニは正しい。","choicesExplain":"イ 誤り 特化則の排液処理装置＝14日前\n安衛法第88条第1項の機械等設置届の対象では、工事開始30日前までに所轄労基署長へ届け出る。 〔根拠：安衛法第88条第1項、安衛則第85条・第86条・別表第7〕\nロ 誤り 100 kPa以上の圧気工法＝30日前・厚労大臣\nこの仕事の計画届は開始14日前までに所轄労働基準監督署長へ提出する。「仕事の届」と「大規模建設工事の厚労大臣届」を混同しない。 〔根拠：安衛法第88条第4項、安衛則第90条〕\nハ 誤り 休業4日未満＝翌々月末\n四半期ごとに取りまとめ、最後の月の翌月末までに報告する。令和7年1月1日から原則電子申請。 〔根拠：安衛則第97条第2項〕\nニ 正しい 1年以内に2人以上の同種がん\n化学物質等を製造・取扱う事業場でこの事実を把握したとき、業務起因性について遅滞なく医師の意見を聴く。医師が業務起因を疑うときは所定の報告へつながる。 〔根拠：安衛則第97条の2〕","basis":"労働安全衛生法第88条\n労働安全衛生規則第85条、第86条・別表第7、第90条、第97条、第97条の2","current":"【試験当時】労働者死傷病報告は令和7年1月1日から原則電子申請化済み。【現在】期限・提出先は本問と同じ。電子申請義務を含めて覚える。","keywords":"✓ 機械等設置届＝30日前\n✓ 一定の仕事の計画＝14日前\n✓ 提出先＝所轄労基署長\n✓ 休業4日未満＝四半期・翌月末\n✓ 同種がん2人以上・1年以内・遅滞なく医師意見","trap":"注意\n「30日前」と「14日前」を設備届と仕事届で入れ替える、中央官庁へ出すように見せる、翌月末を翌々月末にずらす三重の数値・提出先ひっかけ。","title":"計画届・労働者死傷病報告・同種がん把握"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question07/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生法","url":"https://laws.e-gov.go.jp/law/347AC0000000057"},{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"労働安全衛生規則の衛生基準に関するイ～ホのうち、誤っているもののみを挙げた組合せはどれか。\nイ 飲用水は水質基準に適合し、十分な量を供給する。\nロ 著しく汚染するおそれのある作業では、労働者ごとに専用の衣服収納設備を必ず設ける。\nハ 衣服が著しく湿潤する作業では乾燥設備を設ける。\nニ 屋内の暑熱・寒冷・多湿作業場では常に18～28℃を保つ。\nホ 常時300食以上を供給する場合は管理栄養士を配置しなければならない。","options":["イ・ロ","イ・ハ","ロ・ニ","ロ・ハ","ロ・ニ・ホ"],"category":"一般衛生基準","cluster":"作業環境管理","id":"law-2025-08","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":8,"correctIndex":4,"explanation":{"answer":"正答：（5）ロ・ニ・ホが誤り","point":"工場等の一般的衛生基準について、設備義務、温湿度措置、給食の栄養士配置を問う。義務と努力義務、固定数値がある制度とない制度を区別する。","reason":"飲用水の供給と湿潤被服の乾燥設備は正しい。汚染業務では洗眼・洗身・うがい・更衣・洗濯等の必要な設備を設けるが、労働者ごとの被服保管設備までは規定していない。暑熱等の一般作業場に18～28℃を常時義務付ける規定はない。給食は1回100食以上又は1日250食以上で栄養士又は管理栄養士を置くよう努める規定で、1日300食・管理栄養士必置ではない。","choicesExplain":"イ 正しい 飲用水の水質・十分な供給\n飲用水は水質基準に適合するものを十分供給する。 〔根拠：安衛則第627条〕\nロ 誤り 労働者ごとの被服保管設備\n必要なのは業務に応じた洗眼、洗身、うがい、更衣、洗濯設備等。個人別収納まで条文は要求していない。 〔根拠：安衛則第625条〕\nハ 正しい 著しく湿潤する被服の乾燥設備\n被服が著しく湿潤する作業場では乾燥設備を設ける。 〔根拠：安衛則第626条〕\nニ 誤り 暑熱・寒冷・多湿作業場を常時18～28℃\n適切な温湿度調節措置は必要だが、一般作業場にこの固定範囲を常時維持する義務ではない。18～28℃は空調事務所の室温努力目標との混同。 〔根拠：安衛則第606条等、事務所則第5条〕\nホ 誤り 1日300食以上で管理栄養士必置\n基準は1回100食以上又は1日250食以上で、栄養士又は管理栄養士を置くよう努める。義務ではなく努力義務。 〔根拠：安衛則第632条〕","basis":"労働安全衛生規則第606条、第625条、第626条、第627条、第631条・第632条\n水質基準に関する省令","current":"【試験当時・現在】本問の条文構造は同じ。給食については健康増進法上の特定給食施設の基準もあるが、試験では安衛則第632条の「1回100食／1日250食」「栄養士又は管理栄養士」「努力義務」を答える。","keywords":"✓ 洗浄・更衣・洗濯設備\n✓ 乾燥設備は義務\n✓ 固定18～28℃ではない\n✓ 1回100食又は1日250食\n✓ 栄養士又は管理栄養士\n✓ 置くよう努める","trap":"注意\n別法令や事務所則の数値を持ち込み、「管理栄養士」「配置しなければならない」と義務を強める表現に注意。","title":"労働安全衛生規則の衛生基準"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question08/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"有機溶剤中毒予防規則に関するイ～ニのうち、正しいもののみを挙げた組合せはどれか。\nイ 通風不十分な屋内で第三種有機溶剤による払拭作業を行う場合も、所定の換気設備等が必要となる。\nロ 屋内で第二種有機溶剤を密閉式でない囲い式フードにより排気する場合、所定の制御風速を満たす必要がある。\nハ 地下室で第一種有機溶剤を外付け式フードで排気する場合は、必ず呼吸用保護具も併用する。\nニ 以前有機溶剤を入れていたタンク内部作業では、作業開始前にタンク容積以上の空気を送排気すれば足りる。","options":["イ・ロ","イ・ロ・ニ","イ・ハ・ニ","ロ・ハ","ハ・ニ"],"category":"有機溶剤","cluster":"化学物質","id":"law-2025-09","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":9,"correctIndex":0,"explanation":{"answer":"正答：（1）イ・ロ","point":"有機溶剤の種類、作業場所、換気設備、局所排気装置の性能、呼吸用保護具、タンク作業前措置を組み合わせる。設備を設ければ常に呼吸用保護具が必要、という単純な関係ではない。","reason":"通風不十分な屋内で第三種有機溶剤等を用いる払拭業務では、密閉・局排・プッシュプル・全体換気のいずれかが必要である。囲い式フードの制御風速0.4 m/sも正しい。一方、地下室で外付け式フードを設置しただけで一律に防毒マスクを併用する義務とはならない。タンクは容積の3倍以上の空気を送排気する等が必要で、同量以上では足りない。","choicesExplain":"イ 正しい 第三種・払拭・通風不十分\nこの条件では、発散源密閉、局所排気、プッシュプル型換気又は全体換気の設備措置が必要。 〔根拠：有機則第6条〕\nロ 正しい 囲い式フード0.4 m/s\n局所排気装置の性能として、囲い式フードは開口面の最小風速0.4 m/s。 〔根拠：有機則第16条〕\nハ 誤り 地下室＋外付け式フードなら必ず防毒マスク\n有効な局所排気装置を法定どおり設ける通常ケースについて、一律に呼吸用保護具を併用させる規定ではない。保護具義務は設備特例、臨時作業、タンク内等の所定の場合に判断する。 〔根拠：有機則第32条・第33条等〕\nニ 誤り タンク容積と同量以上の送排気\n作業開始前にタンク容積の3倍以上の空気を送気又は排気するか、水を満たして排出する。 〔根拠：有機則第26条第6号〕","basis":"有機溶剤中毒予防規則第5条・第6条、第16条、第26条、第32条・第33条","current":"【試験当時・現在】基本数値と措置は同じ。令和8年以降は個人事業者等への保護措置対象拡張があるため、請負人への配慮規定も併せて確認する。","keywords":"✓ 第三種＋払拭＋通風不十分\n✓ 囲い式0.4 m/s\n✓ 外付け側方・下方0.5 m/s、上方1.0 m/s\n✓ タンク容積の3倍以上","trap":"注意\n「地下室＝必ず防毒マスク」と短絡させる肢と、「同じ量」で十分そうに見せるタンク換気量の数値ひっかけ。","title":"有機溶剤中毒予防規則"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-q
