請け負わないで注文している者に限る。）は、当該通知対象物の危険性及び有害性、当該仕事の作業において注意すべき安全又は衛生に関する事項等所定の事項を記載した文書を作成し、これをその請負人に交付しなければならない。","options":["イ ロ ハ ニ","イ ロ","イ ハ ニ","ロ ニ","ハ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"SDS通知対象物","point":"SDSの通知は、相手方の承諾を要せず、ホームページのアドレスと閲覧を求める旨を伝える方法も用いられます。人体に及ぼす作用は5年以内ごとに最新知見を確認し、変更が必要なら確認後1年以内に更新します。設備内部に立ち入る改造・修理・清掃等を注文する元方は、危険有害性や注意事項を書面で請負人に交付します。有機溶剤含有量を一律10％幅で通知できるというロは誤りです。","conclusion":"正答（3）：イ・ハ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ ニ\n\n（2）— 非正答肢\n　イ ロ\n\n（3）◎ 公式公表正答\n　イ ハ ニ\n\n（4）— 非正答肢\n　ロ ニ\n\n（5）— 非正答肢\n　ハ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20240401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"厚生労働省：SDS","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question03/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question03/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-04","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":4,"question":"労働安全衛生法令に基づく健康診断のうち、労働者に対しその業務内容にかかわらず実施する健康診断（以下「一般健康診断」という。）に関する次の記述のうち、労働安全衛生法令上、正しいものはどれか。","options":["常時50人以上の労働者を使用する事業者は、一般健康診断を行わなければならないが、常時使用する労働者の数が50人未満の場合であっても、事業者は同様の健康診断を実施するよう努めなければならない。","一般健康診断は、所定の項目について実施しなければならないが、あらかじめ対象労働者の同意を得た場合には一部の項目を省略することができる。","事業者は、一般健康診断の結果、特に健康の保持に努める必要があると認められる労働者に対し、医師又は保健師による保健指導を行うよう努めなければならない。","事業者は、事業者の指定した医師が行う一般健康診断を受診していない労働者を業務に従事させる場合には、遅滞なく、所轄労働基準監督署長に届け出なければならない。","事業者は、一般健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は当該事業場の労働者の過半数で組織する労働組合への報告その他の適切な措置を講じなければならない。"],"correctIndex":2,"category":"健康管理・健康診断","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["健康管理・健康診断"],"explanation":{"title":"一般健康診断","point":"一般健康診断は事業場規模50人以上に限られず、常時使用する労働者に対して実施します。項目の省略は本人同意ではなく、法令上の要件と医師の判断によります。労働者が他の医師の健診結果を提出すれば事業者指定医の健診を受けないことができます。事業者は必要な労働者に医師・保健師による保健指導を行うよう努めます。就業上の措置等は衛生委員会等への報告を含みますが、労組への報告に置き換える規定ではありません。","conclusion":"正答（3）：特に健康保持に努める必要がある労働者への保健指導は努力義務。","choicesExplain":"（1）— 非正答肢\n　常時50人以上の労働者を使用する事業者は、一般健康診断を行わなければならないが、常時使用する労働者の数が50人未満の場合であっても、事業者は同様の健康診断を実施するよう努めなければならない。\n\n（2）— 非正答肢\n　一般健康診断は、所定の項目について実施しなければならないが、あらかじめ対象労働者の同意を得た場合には一部の項目を省略することができる。\n\n（3）◎ 公式公表正答\n　事業者は、一般健康診断の結果、特に健康の保持に努める必要があると認められる労働者に対し、医師又は保健師による保健指導を行うよう努めなければならない。\n\n（4）— 非正答肢\n　事業者は、事業者の指定した医師が行う一般健康診断を受診していない労働者を業務に従事させる場合には、遅滞なく、所轄労働基準監督署長に届け出なければならない。\n\n（5）— 非正答肢\n　事業者は、一般健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は当該事業場の労働者の過半数で組織する労働組合への報告その他の適切な措置を講じなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20240401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question04/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question04/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-05","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":5,"question":"労働安全衛生法令に基づき事業者が行わなければならない作業環境測定等に関する次のイ～ホの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　金属アーク溶接等作業を行う屋内作業場について、当該金属アーク溶\n接等作業に従事する労働者の身体に装着する試料採取機器等を用いて行う測定により、６か月以内ごとに１回、空気中の溶接ヒュームの濃度を測定しなければならない。\nロ　地下室の内部において、吹付けによる第三種有機溶剤等に係る有機溶\n剤業務に労働者を従事させるときは、当該作業場について、６か月以内ごとに１回、定期に、当該有機溶剤の濃度を測定しなければならない。\nハ　廃棄物の焼却施設に設置された廃棄物焼却炉、集じん機等の設備の保\n守点検等の業務を行う作業場について、６か月以内ごとに１回、定期に、当該作業場における空気中のダイオキシン類の濃度を測定しなければならない。\nニ　労働者を常時就業させる室で、事務所衛生基準規則の適用のあるもの\nの建築を行ったときは、当該室におけるホルムアルデヒドの量について、当該建築を完了し、当該室の使用を開始した日以後最初に到来する６月から９月までの期間に１回、測定しなければならない。\nホ　陶磁器、レンガ等を焼成する業務を行う屋内作業場について、１か月\n以内ごとに１回、定期に、当該屋内作業場における気温、湿度及び輻射熱を測定しなければならない。","options":["イ ロ ハ","イ ハ ニ","イ ニ ホ","ロ ホ","ハ ニ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"法定の作業環境測定等","point":"廃棄物焼却施設の設備保守点検等の作業場では、ダイオキシン類を6か月以内ごとに測定します。中央管理方式の事務室等を新築・改築等した場合のホルムアルデヒドは、使用開始後最初の6～9月に測定します。溶接ヒュームは作業方法を新たに採用・変更した場合等に個人ばく露測定を行うもので、6か月ごとの定期測定ではありません。第三種有機溶剤の当該作業は設問の定期測定対象ではなく、暑熱作業場の温湿度・輻射熱は1か月ではなく半月以内ごとです。","conclusion":"正答（5）：ハ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ハ ニ\n\n（3）— 非正答肢\n　イ ニ ホ\n\n（4）— 非正答肢\n　ロ ホ\n\n（5）◎ 公式公表正答\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20240401"},{"label":"事務所衛生基準規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000043?occasion_date=20240401"},{"label":"溶接ヒューム規制","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121_00001.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question05/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question05/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-06","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":6,"question":"労働安全衛生法令に基づく免許に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　事業者は、潜水作業者への送気の調節を行うためのバルブ又はコック\nを操作する業務については、潜水士免許を受けた者でなければ、就かせてはならない。\nロ　事業者は、医師、歯科医師及び労働衛生コンサルタントについては、\n第一種衛生管理者免許を受けていない者であっても、衛生管理者として選任することができる。\nハ　満20歳に満たない者は、エックス線作業主任者免許を受けることがで\nきない。\nニ　高圧室内作業主任者がその職務に従事するときは、高圧室内作業主任\n者免許証その他その資格を証する書面を携帯していなければならない。","options":["イ ハ ニ","イ ニ","ロ ハ","ロ ニ","ロ"],"correctIndex":4,"category":"物理的因子","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"免許・衛生管理者資格","point":"医師、歯科医師、労働衛生コンサルタントは、第一種衛生管理者免許を持たなくても衛生管理者として選任できる資格者です。潜水作業者への送気バルブ操作者に潜水士免許が必要という規定ではありません。エックス線作業主任者免許は「満20歳未満は取得不可」ではなく、免許交付年齢の条件を取り違えています。高圧室内作業主任者に資格書面の常時携帯義務はありません。","conclusion":"正答（5）：ロのみ。","choicesExplain":"（1）— 非正答肢\n　イ ハ ニ\n\n（2）— 非正答肢\n　イ ニ\n\n（3）— 非正答肢\n　ロ ハ\n\n（4）— 非正答肢\n　ロ ニ\n\n（5）◎ 公式公表正答\n　ロ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question06/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question06/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-07","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":7,"question":"次のイ～ニの機械等のうち、設置しようとするとき、労働安全衛生法令に基づき、その計画を所轄労働基準監督署長に届け出なければならないもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、所轄労働基準監督署長による計画の届出の免除認定を受けていないものとする。\nイ　石綿等の粉じんが発散する屋内作業場に設ける発散抑制の設備\nロ　事務所に設置される空気調和設備で中央管理方式のもの\nハ　ダイオキシン類を発生するおそれのある廃棄物の焼却施設に設置する\n廃棄物焼却炉\nニ　塩酸を含有する排液を中和方式により処理する排液処理装置","options":["イ ロ ハ ニ","イ ロ ハ","イ ロ ニ","イ ハ ニ","ロ ニ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"設備計画の届出","point":"石綿粉じん発散抑制設備、中央管理方式の空気調和設備、塩酸含有排液の中和処理装置は、設置等の計画届の対象です。ダイオキシン類を発生するおそれのある廃棄物焼却炉は、問題文の区分では同じ設備計画届の列挙対象に含まれません。届出対象は安衛則別表第7等で設備種類ごとに確認します。","conclusion":"正答（3）：イ・ロ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ ニ\n\n（2）— 非正答肢\n　イ ロ ハ\n\n（3）◎ 公式公表正答\n　イ ロ ニ\n\n（4）— 非正答肢\n　イ ハ ニ\n\n（5）— 非正答肢\n　ロ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20240401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question07/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question07/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-08","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":8,"question":"労働安全衛生規則の衛生基準に関する次のイ～ホの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　事業者は、強烈な騒音を発する場所において、業務の一部を請負人に\n請け負わせるときは、当該業務を行う労働者と請負人に使用させるために必要な数の耳栓その他の保護具を備えなければならない。\nロ　事業者は、高温による健康障害を防止するために必要な措置を講じて\n人命救助又は危害防止に関する作業をさせるときを除き、坑内における気温は28度以下としなければならない。\nハ　事業者は、有害な光線又は超音波にさらされる場所には、関係者以外\nの者が立ち入ることを禁止しなければならない。\nニ　事業者は、労働者を屋外で就業させる場合には、塩及び労働者の飲用\nに供する水その他の飲料を、十分供給するようにしなければならない。\nホ　同時に就業する労働者の数が常時10人以内である事業場においては、\n四方を壁等で囲まれた一個の便房により構成される独立個室型の便所を１か所設ければ、男性用、女性用に区別した便所を設ける必要はない。","options":["イ ロ ハ","イ ハ ニ","ロ ニ ホ","ロ ホ","ハ ホ"],"correctIndex":4,"category":"物理的因子","cluster":"騒音・振動","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"労働安全衛生規則の衛生基準","point":"有害光線・超音波にさらされる場所は関係者以外の立入禁止が必要です。同時就業者が常時10人以内の事業場では、条件を満たす独立個室型便所1か所により男女別便所の例外を適用できます。保護具を備える義務は自社労働者についての規定で、請負人分まで一律に含める記述は不適切です。坑内気温の上限を28℃とする規定ではなく、屋外就業の全てで塩・飲料を供給する義務があるわけでもありません。","conclusion":"正答（5）：ハ・ホ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ハ ニ\n\n（3）— 非正答肢\n　ロ ニ ホ\n\n（4）— 非正答肢\n　ロ ホ\n\n（5）◎ 公式公表正答\n　ハ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question08/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question08/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-09","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":9,"question":"有機溶剤中毒予防規則に関する次のイ～ニの記述について、労働安全衛生法令上、正しいものの組合せは（１）～（５）のうちどれか。ただし、有機溶剤中毒予防規則に定める適用の除外及び設備の特例はないものとする。\nイ　屋内作業場において第二種有機溶剤等に係る有機溶剤業務を行う作業\n場所に設置する上方吸引型の外付け式フードの局所排気装置は、0.5メートル／秒の制御風速を出し得る能力を有するものでなければならない。\nロ　事業者は、作業環境測定の評価の結果、第三管理区分に区分された場\n所については、直ちに、施設、作業方法等の点検を行い、その結果に基づき、作業環境を改善するため必要な措置を講じ、当該場所の管理区分が第一管理区分又は第二管理区分となるようにしなければならない。\nハ　事業者は、ずい道の内部において第三種有機溶剤等を用いて行う有機\n溶剤業務に常時従事する労働者に対し、６か月以内ごとに１回、定期に、所定の項目について医師による健康診断を行わなければならない。\nニ　事業者は、有機溶剤等を入れたことのあるタンクで有機溶剤の蒸気の\n発散するおそれがあるものの内部における業務に労働者を従事させるときは、当該業務に従事する労働者に、有機ガス用の防毒機能を有する電動ファン付き呼吸用保護具を使用させなければならない。","options":["イ ハ","イ ニ","ロ ハ","ロ ニ","ハ ニ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"有機溶剤中毒予防規則","point":"第三管理区分では、直ちに設備・作業方法等を点検し、必要な改善を行い第一又は第二管理区分を目指します。ずい道内部で第三種有機溶剤業務に常時従事する労働者は、6か月以内ごとの有機溶剤健康診断対象です。上方吸引型外付け式フードの制御風速は0.5 m/sではなく、発散方向に逆らうためより大きい値が必要です。タンク内部では防毒PAPRではなく、送気マスク等の給気式保護具を用いる場合があります。","conclusion":"正答（3）：ロ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ ハ\n\n（2）— 非正答肢\n　イ ニ\n\n（3）◎ 公式公表正答\n　ロ ハ\n\n（4）— 非正答肢\n　ロ ニ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20240401"},{"label":"第三管理区分後の措置","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc7171&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question09/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question09/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-10","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":10,"question":"鉛中毒予防のため事業者が講ずべき措置に関する次の記述のうち、労働安全衛生法令上、違反となるものはどれか。ただし、鉛業務は遠隔操作によって行う隔離室におけるものではなく、また、鉛中毒予防規則に定める適用の除外及び設備の特例はないものとする。","options":["鉛化合物を含有する釉薬を用いて行う施釉又は当該施釉を行った物の焼成の業務（臨時に行う業務を除く。）を行う屋内作業場について、１年以内ごとに１回、定期に、空気中における鉛の濃度を測定していない。","屋内作業場で自然換気が不十分な場所におけるはんだ付けの業務に労働者を従事させるとき、当該業務を行う作業場所に、全体換気装置を設けているが、局所排気装置又はプッシュプル型換気装置のいずれも設けていない。","鉛ライニングの業務に常時従事する労働者に対する医師による特別の項目についての健康診断（６か月以内ごとに１回、定期に行うものに限る。以下「健康診断」という。）について、前回の健康診断において血液中の鉛の量の検査及び尿中のデルタアミノレブリン酸の量の検査を受けた者については、医師が必要でないと認めるときは、当該検査を省略している。","鉛化合物を製造する工程において、鉛等の鋳造を行う鉛業務に労働者を従事させるとき、当該業務を行う屋内の作業場所に有効な局所排気装置を設け、これを稼働させているが、当該労働者に有効な呼吸用保護具を使用させていない。","電線又はケーブルを製造する工程における鉛の溶融の業務に労働者を従事させるとき、鉛の溶融を行う屋内の作業場所にプッシュプル型換気装置を設けているが、当該換気装置に、ろ過除じん方式の除じん装置又はこれと同等以上の性能を有する除じん装置を設けていない。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"鉛中毒予防規則","point":"鉛化合物製造工程で鉛等を鋳造する業務は、局所排気装置等の設備対策に加えて、有効な呼吸用保護具の使用が求められる作業です。設備を稼働させていることだけで保護具義務が消えるわけではないため（4）は違反です。他の選択肢は、測定対象作業の範囲、全体換気が認められる作業、医師判断による検査省略、除じん装置設置対象の違いを踏まえると違反とはなりません。","conclusion":"正答（4）：局排を設けても、当該鉛鋳造作業では呼吸用保護具を使用させる必要がある。","choicesExplain":"（1）— 非正答肢\n　鉛化合物を含有する釉薬を用いて行う施釉又は当該施釉を行った物の焼成の業務（臨時に行う業務を除く。）を行う屋内作業場について、１年以内ごとに１回、定期に、空気中における鉛の濃度を測定していない。\n\n（2）— 非正答肢\n　屋内作業場で自然換気が不十分な場所におけるはんだ付けの業務に労働者を従事させるとき、当該業務を行う作業場所に、全体換気装置を設けているが、局所排気装置又はプッシュプル型換気装置のいずれも設けていない。\n\n（3）— 非正答肢\n　鉛ライニングの業務に常時従事する労働者に対する医師による特別の項目についての健康診断（６か月以内ごとに１回、定期に行うものに限る。以下「健康診断」という。）について、前回の健康診断において血液中の鉛の量の検査及び尿中のデルタアミノレブリン酸の量の検査を受けた者については、医師が必要でないと認めるときは、当該検査を省略している。\n\n（4）◎ 公式公表正答\n　鉛化合物を製造する工程において、鉛等の鋳造を行う鉛業務に労働者を従事させるとき、当該業務を行う屋内の作業場所に有効な局所排気装置を設け、これを稼働させているが、当該労働者に有効な呼吸用保護具を使用させていない。\n\n（5）— 非正答肢\n　電線又はケーブルを製造する工程における鉛の溶融の業務に労働者を従事させるとき、鉛の溶融を行う屋内の作業場所にプッシュプル型換気装置を設けているが、当該換気装置に、ろ過除じん方式の除じん装置又はこれと同等以上の性能を有する除じん装置を設けていない。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"鉛中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000037?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question10/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question10/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-11","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":11,"question":"特定化学物質の製造、取扱い等に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。ただし、特定化学物質障害予防規則に定める適用の除外はないものとする。","options":["硫化水素のガスを含有する気体を排出する製造設備の排気筒には、吸収方式若しくは酸化・還元方式のいずれかの処理方式による排ガス処理装置又はこれらと同等以上の性能を有する排ガス処理装置を設けなければならない。","塩化ビニルを製造する特定化学設備又はその附属設備については、２年を超える期間使用しない場合を除き、２年以内ごとに１回、定期に、自主検査を行い、所定の事項を記録し、これを３年間保存しなければならない。","アルキル水銀化合物（アルキル基がメチル基又はエチル基であるものに限る。以下同じ。）を製造し、又は取り扱う屋内作業場については、６か月以内ごとに１回、定期に、アルキル水銀化合物の空気中における濃度を測定し、その都度所定の事項を記録し、これを３年間保存しなければならない。","ジクロロメタンを製造し、又は取り扱う作業場において常時作業に従事する労働者については、１か月を超えない期間ごとに、従事した作業の概要及び当該作業に従事した期間等の所定の事項を記録し、これを30年間保存するものとする。","エチレンオキシドを製造し、又は取り扱う業務に常時従事させたことのある労働者で、現に使用しているものに対し、６か月以内ごとに１回、定期に、医師による特別の項目についての健康診断を行わなければならない。"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"特定化学物質障害予防規則","point":"硫化水素排ガスの処理方式、塩化ビニル設備の2年以内ごとの自主検査、アルキル水銀作業場の6か月以内ごとの測定、ジクロロメタン作業記録の30年保存はいずれも規定に沿います。エチレンオキシドは特定化学物質として設備等の規制がありますが、特化則の特別項目健康診断を過去従事者に6か月ごとに行う対象としての記述は誤りです。","conclusion":"正答（5）：エチレンオキシドは、過去従事者への特化則健康診断を6か月ごとに行う物質ではない。","choicesExplain":"（1）— 非正答肢\n　硫化水素のガスを含有する気体を排出する製造設備の排気筒には、吸収方式若しくは酸化・還元方式のいずれかの処理方式による排ガス処理装置又はこれらと同等以上の性能を有する排ガス処理装置を設けなければならない。\n\n（2）— 非正答肢\n　塩化ビニルを製造する特定化学設備又はその附属設備については、２年を超える期間使用しない場合を除き、２年以内ごとに１回、定期に、自主検査を行い、所定の事項を記録し、これを３年間保存しなければならない。\n\n（3）— 非正答肢\n　アルキル水銀化合物（アルキル基がメチル基又はエチル基であるものに限る。以下同じ。）を製造し、又は取り扱う屋内作業場については、６か月以内ごとに１回、定期に、アルキル水銀化合物の空気中における濃度を測定し、その都度所定の事項を記録し、これを３年間保存しなければならない。\n\n（4）— 非正答肢\n　ジクロロメタンを製造し、又は取り扱う作業場において常時作業に従事する労働者については、１か月を超えない期間ごとに、従事した作業の概要及び当該作業に従事した期間等の所定の事項を記録し、これを30年間保存するものとする。\n\n（5）◎ 公式公表正答\n　エチレンオキシドを製造し、又は取り扱う業務に常時従事させたことのある労働者で、現に使用しているものに対し、６か月以内ごとに１回、定期に、医師による特別の項目についての健康診断を行わなければならない。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"特定化学物質障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000039?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question11/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question11/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-12","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":12,"question":"潜水作業において、潜水作業者が吸入する時点の気体の分圧の制限に関する次の文中のＡ～Ｄに入る数値の組合せとして、高気圧作業安全衛生規則上、正しいものは（１）～（５）のうちどれか。\n\n事業者は、潜水作業者が潜水作業に従事している間、潜水作業者が吸入する時点における次に掲げる気体の分圧が、気体の種類ごとに定められた範囲に収まるように、潜水作業者への送気、ボンベからの給気その他の必要な措置を講じなければならない。\n\n１　酸素：Ａ kPa以上、Ｂ kPa以下\n　　ただし、潜水作業者が溺水しないよう必要な措置を講じて浮上を行わせる場合は、Ａ kPa以上220 kPa以下とする。\n２　窒素：Ｃ kPa以下\n３　炭酸ガス：Ｄ kPa以下","options":["Ａ：12\nＢ：100\nＣ：600\nＤ：0.5","Ａ：12\nＢ：100\nＣ：600\nＤ：1.0","Ａ：18\nＢ：120\nＣ：600\nＤ：0.5","Ａ：18\nＢ：160\nＣ：400\nＤ：0.5","Ａ：18\nＢ：160\nＣ：400\nＤ：0.1"],"correctIndex":3,"category":"物理的因子","cluster":"酸欠・高気圧","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"潜水作業のガス分圧","point":"潜水作業者が吸入する時点のガス分圧は、酸素18 kPa以上160 kPa以下、窒素400 kPa以下、二酸化炭素0.5 kPa以下に管理します。溺水を防ぐため緊急に浮上させる場合は、酸素上限を220 kPaとする例外があります。分圧は混合ガス中の割合と絶対圧の積で、高圧になるほど同じ濃度でも分圧が上がります。","conclusion":"正答（4）：酸素18～160 kPa、窒素400 kPa以下、炭酸ガス0.5 kPa以下。","choicesExplain":"（1）— 非正答肢\n　Ａ：12\nＢ：100\nＣ：600\nＤ：0.5\n\n（2）— 非正答肢\n　Ａ：12\nＢ：100\nＣ：600\nＤ：1.0\n\n（3）— 非正答肢\n　Ａ：18\nＢ：120\nＣ：600\nＤ：0.5\n\n（4）◎ 公式公表正答\n　Ａ：18\nＢ：160\nＣ：400\nＤ：0.5\n\n（5）— 非正答肢\n　Ａ：18\nＢ：160\nＣ：400\nＤ：0.1","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"高気圧作業安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000040?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question12/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question12/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-13","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":13,"question":"電離放射線障害を防止するため事業者が講ずべき措置に関する次のイ～ニの記述について、電離放射線障害防止規則上、正しいものの組合せは（１）～（５）のうちどれか。\n\nイ　管理区域には、必要のある者以外の者を立ち入らせてはならない。\nロ　放射線業務従事者が眼の水晶体に受ける等価線量は、緊急作業における線量を含め、５年間につき100ミリシーベルト及び１年間につき50ミリシーベルトを超えないようにしなければならない。\nハ　管理区域に一時的に立ち入る労働者についても、管理区域内において受ける外部被ばくによる線量及び内部被ばくによる線量を測定しなければならない。\nニ　放射線業務従事者の実効線量及び人体の組織別の等価線量を、所定の期間ごとに算定し、これを見やすい場所に掲示する等の方法によって、管理区域に立ち入る者に周知させなければならない。","options":["イ　ロ","イ　ハ","ロ　ハ","ロ　ニ","ハ　ニ"],"correctIndex":1,"category":"物理的因子","cluster":"放射線","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"電離放射線障害防止規則","point":"管理区域には必要のある者以外を立ち入らせず、一時立入者を含め、管理区域内で受ける外部・内部被ばく線量を測定します。眼の水晶体の通常作業の限度は5年間100 mSvかつ1年間50 mSvですが、緊急作業の線量まで同じ枠に含める記述は誤りです。線量記録は各労働者に通知・保存するもので、管理区域立入者全員に掲示して個人線量を周知するものではありません。","conclusion":"正答（2）：イ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ　ロ\n\n（2）◎ 公式公表正答\n　イ　ハ\n\n（3）— 非正答肢\n　ロ　ハ\n\n（4）— 非正答肢\n　ロ　ニ\n\n（5）— 非正答肢\n　ハ　ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"電離放射線障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question13/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question13/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-14","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":14,"question":"酸素欠乏症等の防止に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　メタンを含有する地層に接する井戸の内部における作業、しょうゆを\n入れたことのある醸造槽の内部における作業は、どちらも第一種酸素欠乏危険作業に該当する。\nロ　第二種酸素欠乏危険作業については、その日の作業を開始する前等の\n所定の時期に、作業を行う場所の空気中の酸素及び硫化水素の濃度を、作業環境測定士に測定させなければならない。\nハ　酸素欠乏危険作業に労働者を従事させるときは、労働者を当該作業を\n行う場所に入場させ、及び退場させる時に、人員を点検しなければならない。\nニ　酸素欠乏危険作業に労働者を従事させる場合であって、爆発、酸化等\nの防止のため換気することができないときは、同時に就業する労働者の人数と同数以上の空気呼吸器、酸素呼吸器、送気マスク又は電動ファン付き呼吸用保護具を備え、労働者にこれを使用させなければならない。","options":["イ ロ ハ","イ ロ ニ","イ ハ","ロ ニ","ハ ニ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"酸素欠乏危険作業","point":"メタンを含む地層に接する井戸、しょうゆ等を入れた醸造槽の内部は第一種酸素欠乏危険作業です。入退場時の人員点検も必要です。濃度測定は作業環境測定士に限らず、酸素欠乏危険作業主任者等の所定の者に行わせます。換気できない酸欠場所では、空気呼吸器・酸素呼吸器・送気マスク等の給気式を使用し、外気をろ過するだけの電動ファン付き呼吸用保護具は使えません。","conclusion":"正答（3）：イ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ロ ニ\n\n（3）◎ 公式公表正答\n　イ ハ\n\n（4）— 非正答肢\n　ロ ニ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20240401"},{"label":"酸素欠乏症等防止対策","url":"https://www.mhlw.go.jp/new-info/kobetu/roudou/gyousei/anzen/dl/040325-3a.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question14/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question14/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-15","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":15,"question":"じん肺法令に関する次のイの記述及び粉じん障害防止規則に関する次のロの記述について、文中のＡ～Ｄに入る期間の組合せとして、労働安全衛生法令上、正しいものは（１）～（５）のうちどれか。\nイ　事業者は、次の各号に掲げる労働者で、離職の日まで引き続き厚生労\n働省令で定める期間を超えて使用していたものが、当該離職の際にじん肺健康診断を行うように求めたときは、当該労働者に対して、じん肺健康診断を行わなければならない。ただし、当該労働者が直前にじん肺健康診断を受けた日から当該離職の日までの期間が、次の各号に掲げる労働者ごとに、次の各号に掲げる期間に満たないときは、この限りでない。１常時粉じん作業に従事する労働者（次号に掲げる者を除く。）Ａ２常時粉じん作業に従事する労働者でじん肺管理区分が管理２又は管理３であるものＢ\nロ　作業環境測定を行うべき屋内作業場における空気中の粉じんの濃度の\n測定結果の評価がＣ以上行われ、その間、当該評価の結果、第一管理区分に区分されることが継続した単位作業場所については、当該単位作業場所に係る事業場の所在地を管轄する労働基準監督署長の許可を受けた場合には、当該粉じん濃度の測定は、別に厚生労働大臣の定めるところによることができる。この場合において、事業者は、厚生労働大臣の登録を受けた者により、Ｄ以内ごとに１回、定期に較正された測定機器を使用しなければならない。ＡＢＣＤ","options":["1年／3か月／3年／2年","1年／6か月／2年／1年","1年6か月／3か月／3年／1年","1年6か月／3か月／3年／2年","1年6か月／6か月／2年／1年"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"じん肺健診・粉じん測定の期間","point":"離職時じん肺健康診断の例外期間は、常時粉じん作業従事者が直前健診から1年6か月未満、管理2又は3の者が6か月未満です。粉じん濃度測定の特例許可は、2年以上にわたり第一管理区分が継続した単位作業場所が対象で、特例測定に用いる機器は登録者により1年以内ごとに較正されます。","conclusion":"正答（5）：A＝1年6か月、B＝6か月、C＝2年、D＝1年。","choicesExplain":"（1）— 非正答肢\n　1年／3か月／3年／2年\n\n（2）— 非正答肢\n　1年／6か月／2年／1年\n\n（3）— 非正答肢\n　1年6か月／3か月／3年／1年\n\n（4）— 非正答肢\n　1年6か月／3か月／3年／2年\n\n（5）◎ 公式公表正答\n　1年6か月／6か月／2年／1年","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"じん肺法（e-Gov）","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20240401"},{"label":"粉じん障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question15/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question15/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-01","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":1,"question":"事業場における労働衛生の三管理（作業環境管理、作業管理及び健康管理）について、その種類と取組内容に関する次のイ～ホの組合せについて、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\n\n【労働衛生管理の種類】｜【労働衛生に関する取組内容】\nイ　作業管理｜腰部に著しい負担のかかる作業に従事する労働者に対し、腰痛予防体操を実施する。\nロ　作業環境管理｜アーク溶接作業を行う労働者に防じんマスクなどの保護具を使用させることによって、有害物質に対するばく露量を低減する。\nハ　作業管理｜有機溶剤業務を行う作業場所に設置した局所排気装置のフード付近の気流の風速を測定する。\nニ　健康管理｜健康診断結果に基づく事後措置として就業制限を行う。\nホ　作業環境管理｜ずい道建設工事の掘削作業において、土石又は岩石を湿潤な状態に保つための設備を稼働する。","options":["イ ロ","イ ハ ニ","ロ ニ ホ","ハ ホ","ニ ホ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"管理・マネジメント","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"労働衛生の三管理","point":"健康診断結果に基づく就業制限は健康管理、粉じんを湿潤化して発散を抑える設備は作業環境管理です。腰痛予防体操は健康保持増進・健康管理に近く、保護具の使用は作業管理、局所排気装置の風速確認は設備の維持管理として作業環境管理に整理します。","conclusion":"正答（5）：ニ・ホ。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ハ ニ\n\n（3）— 非正答肢\n　ロ ニ ホ\n\n（4）— 非正答肢\n　ハ ホ\n\n（5）◎ 公式公表正答\n　ニ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov・令和5年4月1日）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20230401"},{"label":"粉じん障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question01/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question01/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-02","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":2,"question":"厚生労働省の労働衛生統計等に関する次のイ～ニの記述について、誤っているもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　厚生労働省が公表している「労働災害発生状況」によると、休業４日\n以上の死傷者数は、平成24年から令和３年までの10年間、年々減少傾向にあり、令和３年は約15万人である。\nロ　厚生労働省の「業務上疾病調」によると、令和３年の業務上疾病者数\nは、疾病別では、新型コロナウイルス感染症罹患によるものを除くと、災害性腰痛などの負傷に起因する疾病が最も多く、約6,700人となっている。\nハ　厚生労働省の「じん肺健康管理実施結果調」（随時申請によるものを\n除く。）によると、じん肺健康診断受診労働者数に対する有所見者数の割合は、平成14年以降の20年間減少傾向にあり、令和３年は約３％となっている。\nニ　厚生労働省の「労働安全衛生調査（実態調査）」によると、現在の仕\n事や職業生活に関することで、強いストレスとなっていると感じる事柄がある労働者の割合は、令和３年は約30％である。","options":["イ ロ","イ ハ ニ","イ ニ","ロ ハ","ロ ハ ニ"],"correctIndex":1,"category":"統計・疫学","cluster":"粉じん・石綿・じん肺","examLawDate":"2023-04-01","tags":["統計・疫学"],"explanation":{"title":"労働衛生統計","point":"令和3年の死傷者数は新型コロナの影響もあり、10年間一貫して減少したとはいえません。負傷に起因する疾病が最多で約6,700人は適切です。じん肺有所見率は約3％ですが、20年間単調に減少したという表現は不適切です。強いストレスがある労働者は約5割で、約30％ではありません。","conclusion":"正答（2）：イ・ハ・ニが誤り。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）◎ 公式公表正答\n　イ ハ ニ\n\n（3）— 非正答肢\n　イ ニ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ロ ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点 nagement 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question06/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2023/gen-question06/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2023-07","subject":"労働衛生一般","year":2023,"yearLabel":"令和5年度","round":51,"number":7,"question":"酸素欠乏症及び硫化水素による健康障害とそれらの予防に関する次の記述のうち、適切でないものはどれか。","options":["ドライアイスが昇華すると酸素欠乏症のリスクが生じる。","酸素欠乏空気には鋭敏な人が検知できる特有の臭いがある。","硫化水素用の防毒マスクは、酸素濃度18％以上のときに使用できる。","海水が滞留している暗渠では、酸素欠乏症及び硫化水素中毒のリスクがある。","硫化水素にばく露したときの眼の症状として、結膜炎や角膜損傷が知られている。"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2023-04-01","tags":["化学物質・毒性"],"explanation":{"title":"酸素欠乏症・硫化水素","point":"酸素欠乏は臭いや刺激で検知できないため、測定器による確認が必須です。ドライアイスは昇華して二酸化炭素を発生させ、酸素を置換します。硫化水素用防毒マスクは酸素濃度18％以上など使用条件を満たす場合に限り、高濃度・酸欠では給気式を使用します。","conclusion":"正答（2）：酸素欠乏空気に固有の臭いはない。","choicesExplain":"（1）— 非正答肢\n　ドライアイスが昇華すると酸素欠乏症のリスクが生じる。\n\n（2）◎ 公式公表正答\n　酸素欠乏空気には鋭敏な人が検知できる特有の臭いがある。\n\n（3）— 非正答肢\n　硫化水素用の防毒マスクは、酸素濃度18％以上のときに使用できる。\n\n（4）— 非正答肢\n　海水が滞留している暗渠では、酸素欠乏症及び硫化水素中毒のリスクがある。\n\n（5）— 非正答肢\n　硫化水素にばく露したときの眼の症状として、結膜炎や角膜損傷が知られている。","trap":"","keywords":"","related":"","current":"【出題当時】2023-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20230401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2023/gen-question07/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge
