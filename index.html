uestion09/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"有機溶剤中毒予防規則","url":"https://laws.e-gov.go.jp/law/347M50002000036"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"特定化学物質障害予防規則に関する次の記述のうち、法令違反となるものはどれか。","options":["所定条件を満たすとして、特別有機溶剤等業務の特殊健康診断を6か月以内ごとから1年以内ごとへ一律に緩和した。","一時的な管理第二類物質の粉じん作業で、十分な湿潤化により発散を防止して局排等を設けなかった。","シアン化ナトリウムを含む排液の処理に、物質特性に適した所定の処理方式を採用した。","特化物を扱う建屋の避難設備として、所定の直接階段と非常用の避難設備を設けた。","特化物の運搬容器に名称・人体への作用・貯蔵上の注意等、法令所定事項を表示した。"],"category":"特定化学物質","cluster":"化学物質","id":"law-2025-10","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":10,"correctIndex":0,"explanation":{"answer":"正答：（1）","point":"特殊健康診断の頻度緩和、臨時作業の設備特例、排液処理方式、避難設備、運搬表示を問う。一般の特化物と特別管理物質・特別有機溶剤を区別する。","reason":"令和5年4月1日から一定要件下で特殊健康診断を6か月ごとから1年ごとへ緩和できる制度があるが、特別管理物質等は対象外である。特別有機溶剤業務について要件を満たしたとして年1回にした（1）は違反となる。","choicesExplain":"（1） 違反 特別有機溶剤業務の健診を年1回\n頻度緩和は特別管理物質等を除く。特別有機溶剤は発がん性等を踏まえた特別管理物質として、原則6か月以内ごとに1回の健診を維持する。 〔根拠：特化則第38条の3・第39条〕\n（2） 適法 管理第二類物質の臨時作業・湿潤化\n臨時作業で湿潤化等の措置を講じる場合は、発散源密閉・局排等を設けないことが認められる特例がある。 〔根拠：特化則第5条〕\n（3） 適法 シアン化ナトリウム排液を活性汚泥方式\n法令が認める排液処理方式の一つであり、酸化・還元方式に限られない。 〔根拠：特化則第12条・別表〕\n（4） 適法 直通階段1つ＋避難用タラップ\n避難階以外の階から避難階へ通じる直通階段に加え、避難用タラップ等を設ける組合せは要件を満たす。 〔根拠：特化則第19条〕\n（5） 適法 運搬容器の表示\n容器には名称と取扱い上の注意事項を表示する。流出事故時の応急措置までを当該容器表示の必須事項とはしていない。SDS等の情報伝達義務とは別に考える。 〔根拠：特化則第25条〕","basis":"特定化学物質障害予防規則第5条、第12条、第19条、第25条、第38条の3、第39条\n労働安全衛生規則等の一部改正（令和5年4月1日施行：特殊健診頻度緩和）","current":"【試験当時・現在】特別管理物質等を頻度緩和対象から除く点は同じ。頻度緩和の3条件（健診3回、作業環境評価3回、作業内容変更なし）は、対象物質であることを確認してから適用する。","keywords":"✓ 特殊健診＝原則6か月以内ごと\n✓ 緩和は一部物質のみ\n✓ 特別管理物質は除外\n✓ 臨時作業＋湿潤化\n✓ 表示事項とSDS事項を分離","trap":"注意\n「3回連続で異常なし・第一管理区分」という緩和要件が全部書かれているため適法に見えるが、対象物質の除外条件が決め手。","title":"特定化学物質による健康障害防止措置"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question10/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"労働安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000032"},{"label":"特定化学物質障害予防規則","url":"https://laws.e-gov.go.jp/law/347M50002000039"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"高圧室内作業に関する作業計画に示す事項として、適切でないものはどれか。","options":["送気する気体の組成","加圧開始から減圧開始までの時間","作業時間中の時間加重平均圧力","加圧・減圧の速度","減圧停止時の圧力と停止時間"],"category":"高気圧作業","cluster":"物理因子","id":"law-2025-11","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":11,"correctIndex":2,"explanation":{"answer":"正答：（3）","point":"高圧室内業務の作業計画に列挙される事項をそのまま問う。平均値・時間加重平均値ではなく、最高圧力を定める点を覚える。","reason":"計画には、送気ガスの成分組成、加圧開始から減圧開始までの時間、高圧室内業務における最高の圧力、加圧・減圧速度、減圧停止圧力と停止時間を示す。圧力の時間加重平均値は法定項目ではない。","choicesExplain":"（1） 正しい 送気する気体の成分組成\n呼吸用ガス管理の基礎として計画に記載する。 〔根拠：高圧則第12条の2〕\n（2） 正しい 加圧開始から減圧開始までの時間\n高圧下にある時間として計画項目。 〔根拠：同上〕\n（3） 誤り 圧力の時間加重平均値\n必要なのは業務における最高の圧力であり、時間加重平均値ではない。 〔根拠：同上〕\n（4） 正しい 加圧・減圧速度\n急激な圧力変化を避けるための計画項目。 〔根拠：同上〕\n（5） 正しい 減圧停止圧力・停止時間\n減圧症防止の中心事項。 〔根拠：同上〕","basis":"高気圧作業安全衛生規則第12条の2\n高気圧作業安全衛生規則第8条第2項等に基づく厚生労働大臣告示","current":"【試験当時・現在】列挙項目は同じ。高気圧作業の減圧方法に関する将来改正の検討が続いているため、次年度以降は最新条文・告示を確認する。","keywords":"✓ 成分組成\n✓ 加圧開始～減圧開始\n✓ 最高の圧力\n✓ 加圧・減圧速度\n✓ 減圧停止圧力・時間","trap":"注意\n作業環境測定で用いる「時間加重平均」を、高圧作業計画へ紛れ込ませている。高圧則は「最高圧力」。","title":"高圧室内作業計画に示す事項"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question11/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"高気圧作業安全衛生規則","url":"https://laws.e-gov.go.jp/law/347M50002000040"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"酸素欠乏症等防止規則に関する次の記述のうち、誤っているものはどれか。","options":["酸素18％未満又は硫化水素10 ppm超の危険がある状態は酸素欠乏等として管理対象となる。","酸素欠乏等により墜落するおそれがあるときは、安全帯等・救命索等を使用させる。","不活性ガス等を送給する配管のバルブ等には、ガス名と開閉方向を表示する。","作業主任者は作業開始前、全員退場後の再開時、身体・換気装置等に異常があったとき等に酸素濃度等を測定する。","爆発・酸化等のため換気できず呼吸用保護具を使用する場合、その保護具は1か月以内ごとに1回点検すれば足りる。"],"category":"酸素欠乏","cluster":"物理因子","id":"law-2025-12","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":12,"correctIndex":4,"explanation":{"answer":"正答：（5）","point":"定義、墜落防止、不活性ガス配管表示、濃度測定の時機、空気呼吸器等の点検を問う。濃度の境界と、点検頻度が重要である。","reason":"換気できない場合に使用させる空気呼吸器等は、作業開始前に点検しなければならない。1か月以内ごとに1回の定期点検という規定ではないため（5）が誤りである。","choicesExplain":"（1） 正しい 酸素18%未満又は硫化水素10 ppm超\n酸素欠乏等の定義を正確に示す。 〔根拠：酸欠則第2条〕\n（2） 正しい 酸欠症等による転落のおそれ\n要求性能墜落制止用器具その他の命綱を使用させる。 〔根拠：酸欠則第6条〕\n（3） 正しい 不活性ガス配管の表示\n誤操作防止のため、気体名称と開閉方向を表示する。 〔根拠：酸欠則第5条〕\n（4） 正しい 第一種作業の酸素濃度測定時機\n当日作業開始前、全員退避後の再開前、身体・換気装置等に異常があったとき等に測定する。 〔根拠：酸欠則第3条・第11条〕\n（5） 誤り 空気呼吸器等を月1回点検\n保護具等は作業開始前に点検する。異常時は直ちに補修・取替え。 〔根拠：酸欠則第9条〕","basis":"酸素欠乏症等防止規則第2条、第3条、第5条、第6条、第9条、第11条","current":"【試験当時・現在】数値と点検時機は同じ。個人事業者等への保護措置拡張後も、作業場所の酸素・硫化水素測定と保護具点検は中核事項である。","keywords":"✓ 酸素18%未満\n✓ H2S 10 ppm超\n✓ 作業開始前に測定・点検\n✓ 退避後再開前\n✓ 名称＋開閉方向表示","trap":"注意\n設備の定期自主検査の感覚で「月1回」と選ばせるが、生命維持用保護具は作業開始前点検。","title":"酸素欠乏症等の防止"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question12/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"酸素欠乏症等防止規則","url":"https://laws.e-gov.go.jp/law/347M50002000042"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"事務所衛生基準規則に関するイ～ニのうち、正しいもののみを挙げた組合せはどれか。\nイ 直接外気に向かって開放可能な窓等の面積は原則床面積の1/20以上（十分な換気設備がある場合を除く）。\nロ 空調設備の供給空気中の浮遊粉じん量は1.5 mg/m³以下とする。\nハ 常時50人以上又は常時女性30人以上を使用する事業場では、横になれる休養設備を男女別に設ける。\nニ 空調設備の排水受けは使用開始時と6か月以内ごとに1回点検する。","options":["イ・ロ","イ・ハ","ロ・ニ","ロ・ハ","ハ・ニ"],"category":"事務所衛生基準","cluster":"作業環境管理","id":"law-2025-13","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":13,"correctIndex":1,"explanation":{"answer":"正答：（2）イ・ハ","point":"事務所則の自然換気開口部、空調時の浮遊粉じん、休養室、空調設備排水受けの点検を問う。数値の小数点と点検周期を狙った問題である。","reason":"自然換気可能部分は床面積の1/20以上、休養室・休養所は常時50人以上又は常時女性30人以上で男女別に設けるため、イ・ハが正しい。浮遊粉じんは1.5 mg/m³ではなく0.15 mg/m³。排水受けは6か月ごとではなく1か月以内ごとに点検する。","choicesExplain":"イ 正しい 開口部＝床面積の1/20以上\n十分な性能の換気設備がある場合を除き、直接外気へ開放できる部分を1/20以上とする。 〔根拠：事務所則第3条〕\nロ 誤り 浮遊粉じん1.5 mg/m³\n基準は0.15 mg/m³以下。小数点が1桁違う。 〔根拠：事務所則第5条〕\nハ 正しい 50人以上又は女性30人以上\n臥床できる休養室又は休養所を男女別に設ける。 〔根拠：事務所則第21条〕\nニ 誤り 排水受け6か月以内ごと\n使用開始時及び使用開始後1か月以内ごとに1回点検し、必要に応じ清掃する。 〔根拠：事務所則第9条の2第4号〕","basis":"事務所衛生基準規則第3条、第5条、第9条の2、第21条","current":"【試験当時・現在】本問の基準は同じ。空調事務所の室温は18～28℃に保つよう努める規定であり、問8の一般作業場の義務と横断比較する。","keywords":"✓ "label":"石綿障害予防規則","url":"https://laws.e-gov.go.jp/law/417M60000100021"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"prompt":"じん肺法・粉じん障害防止規則に関するA～Dの空欄の組合せとして正しいものはどれか。\nA＝合併症で休業した者が回復後に受ける随時健康診断の時期\nB＝現に常時粉じん作業に従事する者について都道府県労働局長が作業転換を勧め得る管理区分\nC＝その措置の法的性格\nD＝研削材による金属研磨作業で、プッシュプル型換気装置の排気口を屋外に設けなくてもよい除じん方式","options":["6か月／管理三イ／勧奨／電気集じん又はスクラバ","6か月／管理三ロ／勧奨／ろ過又は電気集じん","1年／管理三イ／勧奨／ろ過又は電気集じん","1年／管理三ロ／指示／ろ過又はスクラバ","2年／管理三ロ／指示／ろ過又はスクラバ"],"category":"じん肺・粉じん","cluster":"粉じん・石綿","id":"law-2025-15","subject":"労働衛生関係法令","year":2025,"yearLabel":"令和7年度","round":53,"number":15,"correctIndex":2,"explanation":{"answer":"正答：（3）A＝1年、B＝管理三イ、C＝勧奨、D＝ろ過除じん方式又は電気除じん方式","point":"じん肺健康診断の臨時実施事由、管理区分に応じた作業転換措置、粉じん局排等の排出口特例を問う。管理三イと三ロ、勧奨と指示の対応を正確に覚える。","reason":"合併症で1年を超えて休業した者が就業可能になった場合は遅滞なくじん肺健康診断を行う。管理三イで現に常時粉じん作業に従事する者について、都道府県労働局長は作業転換を勧奨できる。屋内の動力研磨箇所のプッシュプル型換気装置では、ろ過除じん方式又は電気除じん方式の除じん装置を付設した場合に排出口の屋外設置を要しない特例がある。","choicesExplain":"（1） 誤り A＝6か月、D＝電気又はスクラバ\nAは1年。Dはろ過又は電気であり、スクラバとの組合せではない。 〔根拠：じん肺法第8条、粉じん則第11条〕\n（2） 誤り A＝6か月、B＝管理三ロ\nAもBも誤り。勧奨は管理三イに対応する。 〔根拠：じん肺法第21条〕\n（3） 正しい 1年・管理三イ・勧奨・ろ過又は電気\n四つの語句が全て法令に一致する。 〔根拠：じん肺法第8条・第21条、粉じん則第11条〕\n（4） 誤り 管理三ロ・指示、Dにスクラバ\n管理三ロでは、事業者の作業転換努力義務に加え、局長が指示できる場合があるが、本問文の「管理区分が○である者に勧奨」とは管理三イ。Dも誤り。 〔根拠：じん肺法第21条〕\n（5） 誤り A＝2年、管理三ロ・指示\nAは1年。本問の文型は管理三イ・勧奨。 〔根拠：同上〕","basis":"じん肺法第8条、第21条\nじん肺法施行規則第26条\n粉じん障害防止規則第11条・別表第2","current":"【試験当時・現在】本問の数値・管理区分対応は同じ。管理三イ＝勧奨、管理三ロ＝事業者の転換努力＋一定の場合の局長指示、管理四又は合併症＝療養、という段階で整理する。","keywords":"✓ 合併症休業1年超\n✓ 管理三イ＝勧奨\n✓ 管理三ロ＝転換努力・指示\n✓ ろ過又は電気除じん\n✓ 排出口屋外の例外","trap":"注意\n三イ／三ロと勧奨／指示を交差させる組合せ問題。AとDが分かっても、B・Cの対応で落としやすい。\n\n4．数値・期限・頻度・保存期間の整理\n分野\n数値・期限\n内容（誰が・何を・いつ）\n安全衛生管理体制\n3,000人を超える\n産業医を2人以上選任。3,000人ちょうどは1人。\n安全衛生管理体制\n1,000人以上\n専属産業医が必要。\n衛生管理者\n1,001～2,000人\n4人以上。2,001～3,000人は5人以上。\n衛生工学衛生管理者\n500人超＋有害業務30人以上\n一定の有害業務の場合、衛生管理者のうち1人を衛生工学衛生管理者免許者から選任。\n化学物質RA記録\n次回RAまで／最低3年\n3年以内に次回RAをした場合も起算日から3年保存。\nがん原性物質の措置状況\n1年を超えない期間ごと／3年保存\n記録の種類により30年保存規定もあるので区別。\n第三管理区分\n6か月以内ごとに1回\n改善困難等の場合、第一・第二管理区分になるまで個人サン 度、じん肺健診。\n特別規則の固有数値：問9・問12・問13・問14。0.4 m/s、3倍、18%、10 ppm、0.15 mg/m³、1か月、20トン。\n6-2 特に間違えやすいポイント\n人数の境界：「2,000人」は1,001～2,000人の区分であり、2,001人以上ではない。\n事業場全体の労働者数と、有害業務に常時従事する労働者数を別々に数える。\n作業主任者免許者の選任と、作業者本人の就業制限免許を混同しない。\n規格具備、個別検定、型式検定、定期自主検査は対象機械等を別表で整理する。\n化学物質健診を行う義務があっても、必ず監督署へ結果報告するとは限らない。\n第三管理区分は「改善D→再測定B」を先に行い、その後に外部専門家Eへ進む。\n健康診断、医師面接指導、ストレスチェックは別制度。動詞を読む。\n設備届30日前と仕事届14日前、厚労大臣と労基署長をペアで暗記する。\n義務（～しなければならない）と努力義務（～努めなければならない）を語尾で判定する。\n同じ「換気装置」でも局所排気、プッシュプル、全体換気で自主検査義務が異なる。\n特殊健診頻度緩和は、条件だけでなく対象物質の除外（特別管理物質等）を先に確認する。\n小数点・単位を確認する：0.15 mg/m³、0.4 m/s、100 kPa、40 cm³。\n7．直前暗記項目と学習方法\n7-1 直前暗記カード\n管理体制\n1,000人以上＝専属産業医／3,000人超＝産業医2人以上／2,000人＝衛生管理者4人\n化学物質\n化学物質管理者＝事業場ごと／RA記録最低3年／健診結果の監督署報告なし\n第三管理区分\nA→D→B→E。改善困難又は再改善後も第三ならC→F\n面接指導\n月80時間超＋疲労＋申出。健康診断ではない\n行政手続\n設備30日前、仕事14日前、休業4日未満は翌月末\n有機溶剤\n囲い式0.4 m/s、タンク空気3倍以上\n酸欠\n18%未満、H2S 10 ppm超、保護具は作業開始前点検\n事務所\n1/20、0.15 mg/m³、50人又は女性30人、排水受け1か月\n石綿\n特別教育記録3年、船舶20トン以上、全体換気は年1回自主検査肢が誤り\nじん肺\n休業1年超、管理三イ＝勧奨、ろ過又は電気除じん\n7-2 学習上の優先順位\n第1優先：安衛法本体＋安衛令＋安衛則の骨格\n管理体制、資格・教育、健康診断、面接指導、計画届、報告を先に固める。表を自作し、主語・期限・提出先をセットで覚える。\n第2優先：化学物質の自律的管理\n令和5～8年の段階施行が続く。化学物質管理者、保護具着用管理責任者、濃度基準、RA対象物健診、がん原性記録、第三管理区分を一枚の流れ図にする。\n第3優先：各特別規則を同じ型で比較\n有機、特化、鉛、粉じん、石綿について、①対象、②設備、③測定、④作業主任者、⑤健診、⑥記録保存の6列で比較する。\n第4優先：数値は単独でなく対比暗記\n30日／14日、1月／6月、0.15／1.5、同量／3倍、管理三イ／三ロを対にして反復する。\n第5優先：改正情報の更新\n試験基準日が毎年4月1日なので、前年5月以降に公布された改正の施行日を確認する。厚労省の「改正法特設ページ」「化学物質規制」「石綿ポータル」を定期確認する。\n7-3 具体的な復習手順\n1周目：正答一覧を隠し、各肢を「正しい／誤り」だけ判定する。\n2周目：誤りの語句に下線を引き、正しい数値・主体・期限へ言い換える。\n3周目：根拠条文をe-Govで開き、条文の見出しと要件を30秒で説明する。\n4周目：本資料の数値表から、逆向き問題（例：1か月点検は何か）を作る。\n直前期：第三管理区分の流れ、管理体制人数表、行政手続期限表を毎日1回白紙再現する。\n\n8．参考法令・一次資料\n1. 第53回労働衛生コンサルタント試験「労働衛生関係法令」問題冊子（安全衛生技術試験協会）https://www.exam.or.jp/wp-content/uploads/2025/11/CS20251909.pdf\n2. 労働安全衛生法（e-Gov法令検索）https://laws.e-gov.go.jp/law/347AC0000000057\n3. 労働安全衛生法施行令（e-Gov法令検索）https://laws.e-gov.go.jp/law/347CO0000000318\n4. 労働安全衛生規則（令和7年4月1日現在・e-Gov法令検索）https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20250401\n5. 有機溶剤中毒予防規則https://laws.e-gov.go.jp/law/347M50002000036\n6. 特定化学物質障害予防規則https://laws.e-gov.go.jp/law/347M50002000039\n7. 高気圧作業安全衛生規則https://laws.e-gov.go.jp/law/347M50002000040\n8. 酸素欠乏症等防止規則https://laws.e-gov.go.jp/law/347M50002000042\n9. 事務所衛生基準規則https://laws.e-gov.go.jp/law/347M50002000043\n10. 石綿障害予防規則https://laws.e-gov.go.jp/law/417M60000100021\n11. じん肺法https://laws.e-gov.go.jp/law/335AC0000000030\n12. じん肺法施行規則https://laws.e-gov.go.jp/law/335M50002000006\n13. 粉じん障害防止規則https://laws.e-gov.go.jp/law/354M50002000018\n14. 化学物質による労働災害防止のための新たな規制（厚生労働省）https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000099121_00005.html\n15. 労働安全衛生法及び作業環境測定法の一部を改正する法律（令和7年法律第33号）特設ページhttps://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzen/an-eihou/index_00001.html\n16. ストレスチェック制度について（こころの耳・厚生労働省）https://kokoro.mhlw.go.jp/etc/kaiseianeihou/\n17. 改正高気圧作業安全衛生規則リーフレットhttps://www.mhlw.go.jp/file/06-Seisakujouhou-11300000-Roudoukijunkyokuanzeneiseibu/kaiseikouatusokuri-furetto.pdf\n18. 石綿総合情報ポータルサイトhttps://www.ishiwata.mhlw.go.jp/\n注意 法令は改正される。次年度の過去問演習では、問題冊子に明記された基準日へe-Govの「時点指定」を合わせて確認すること。\n― 令和7年度版 終 ―\n\n第IV部\n横断的な頻出事項・法令数値一覧\n1．令和7年度を横断する頻出テーマ\nテーマ\n学習の軸\n化学物質の自律的管理\nSDS・GHS、有害性特定、リスクアセスメント、代替・工学的対策、作業管理、保護具、健康診断を一連の流れとして理解する。\n健康診断制度の比較\n一般健診、特定業務従事者健診、特殊健診、RA対象物健診及び面接指導を、対象・目的・時期・項目・事後措置で比較する。\nばく露評価と呼吸用保護具\n作業環境測定と個人ばく露測定の違い、要求防護係数、指定防護係数、フィットテスト及び記録保存を結び付ける。\n作業態様・人間工学\n腰痛、介護・看護、情報機器作業、高年齢労働者、交替制勤務について、個人注意ではなく設備・作業方法・勤務制度を改善する。\n法令の主体・時点・数字\n誰が、誰に、何を、いつまでに、どこへ、何年間保存するかを一組で読む。義務と努力義務、試験時点と現在を分ける。\n有害因子の機序\n粉じん、ヒューム、放射線、高気圧、騒音、熱、化学物質について、発生機序・標的臓器・初期所見・予防策を対応させる。\n2．三管理とリスク低減措置の優先順位\n区分\n直接変える対象\n代表例\n試験での見分け方\n作業環境管理\n発生源・作業場の環境\n有害物の除去・代替、密閉、局所排気、全体換気\n発生量又は空気中濃度を下げる\n作業管理\n作業方法・ばく露時間・動作\n手順、立入制限、作業時間、福祉用具、保護具\n作業者の行動・ばく露の仕方を変える\n健康管理\n労働者の健康状態・適正配置\n健診、保健指導、面接指導、配置転換、就業制限\n健康状態を把握し、就業措置へつなぐ\nリスク低減は、除去・代替 → 工学的対策 → 管理的対策 → 個人用保護具の順に検討する。個人用保護具だけに依存しない。\n3．健康診断・面接指導の横断比較\n制度\n主な対象\n目的\n時期・頻度\n項目の特徴\n得点ポイント\n雇入時健診\n常時使用する労働者\n配置前の健康状態把握\n雇入れ時\n法定項目を原則実施\n規模・年齢制限なし。3か月以内の証明書で該当項目のみ省略可\n一般定期健診\n常時使用する労働者\n継続的健康管理\n1年以内ごと\n全身的・一般的項目\n結果を就業措置・保健指導へ\n特定業務従事者健診\n深夜業等の特定業務従事者\n負担の大きい業務の健康管理\n配置替え時＋6か月以内ごと\n一般健診型\n特殊健診とは目的・項目が別\n特殊健康診断\n有機・特化・鉛等の業務従事者\n有害因子特異的障害の早期発見\n各特別規則。原則6か月以内ごと等\n業務歴・症状・生物学的検査等\n対象物質、配置替え、離職時・配置転換後の扱いを確認\nRA対象物健診\nRA結果で必要な者等\nリスクに応じた健康障害防止\n必要時\n医師等が必要項目を選定\n一律健診ではない。第3項・第4項健診を区別\n長時間労働面接指導\n月80時間超＋疲労蓄積＋申出等\n過重労働による健康障害防止\n要件該当時\n勤務状況、疲労、心身状態\n健康診断ではない\nストレスチェック後面接\n高ストレス者等の申出\nメンタルヘルス不調の予防\n申出後遅滞なく\n心理的負担、勤務状況、心身状態\n個人結果と集団分析、情報保護を区別\n4．重要数値・期限・頻度・保存期間\n分野\n項目\n数値・要件\n注意\n腰痛・情報機器\n重量物\n男性：体重のおおむね40％以下／女性：男性が扱える重量の60％程度\n超過時は機械化を優先。やむを得ない場合は身長差の少ない2人以上で均等負担\n腰痛・情報機器\n照度・作業時間\n書類・キーボード面は300 lx以上／一連続作業1時間以内／休止10～15分\n一連続作業中に1～2回の小休止\n溶接ヒューム\nマンガン濃度基準値\n0.05 mg/m³\n単位を含めて記憶\n個人ばく露測定\n呼吸域\n両耳を結ぶ線の中央を中心とする顔前方の半径30 cmの半球\n採取口を呼吸域に装着\n呼吸用保護具\nフィットテスト\n1年以内ごとに1回／結果3年間保存\n面体を有するろ過式・送気式等の対象を確認\n一般・特殊健診\n頻度\n一般定期：1年以内ごと／特定業務・多くの特殊健診：6か月以内ごと\n頻度緩和の条件は各規則で確認\n長時間労働\n面接指導\n月80時間超＋疲労蓄積＋本人の申出\n研究開発・高度プロフェッショナル等は別要件あり\n酸素欠乏\n定義\n酸素18％未満／第2種は硫化水素10 ppm超も対象\n約16％で呼吸・脈拍増、6％未満は急速な意識喪失リスク\n管理体制\n産業医\n50人以上で選任／1,000人以上等で専属／3,000人超で2人以上\n3,000人ちょうどと「超」を区別\n管理体制\n衛生管理者\n1,001～2,000人：4人以上／2,001～3,000人：5人以上\n有害業務人数による衛生工学衛生管理者の要件も確認\n行政手続\n計画届\n機械等：工事開始30日前／一定の仕事：仕事開始14日前\n提出先と対象をセットで覚える\n労災報告\n休業日数\n4日以上：遅滞なく／4日未満：四半期ごとに翌月末\n休業日数で期限が変わる\n化学物質RA\n記録\n次回RAまで、かつ最低3年間\nがん原性物質等の長期保存記録と混同しない\n有機溶剤\n制御風速\n囲い式0.4 m/s／外付け側方・下方0.5 m/s／外付け上方1.0 m/s\nフード型式と方向を対応\n有機溶剤\nタンク作業前\n容積の3倍以上の空気を送排気する等\n作業前措置\n事務所衛生\n換気開口部\n床面積の1/20以上\n十分な換気設備がある場合を除く\n事務所衛生\n浮遊粉じん\n0.15 mg/m³以下\n1.5 mg/m³との10倍ミスに注意\n事務所衛生\n休養室\n常時50人以上又は常時女性30人以上\n男女別、臥床可能\n事務所衛生\n空調排水受け\n1か月以内ごとに1回点検\n使用開始時にも点検\n石綿\n記録・報告\n特別教育記録3年／船舶は総トン数20トン以上で所定の事前調査報告\n全体換気装置と局排等の自主検査を混同しない\n勤務間インターバル\n制度\n2019年4月から導入が努力義務\n一般労働者に全国一律の11時間義務があると断定しない\n5．代表的有害因子・疾病の対応\n因子\n機序・性状\n代表的健康影響\n管理の要点\n溶接ヒューム\n金属蒸気が凝固した微細な固体粒子\n肺がん、マンガン中毒等\n局排等、個人ばく露測定、適切な呼吸用保護具\n石綿\n生体内に長期滞留する繊維\n石綿肺、肺がん、中皮腫\n事前調査、隔離・集じん、特別教育、記録\n鉱物性粉じん\n肺内で線維増殖性変化\nじん肺、肺結核、肺がん、続発性気胸\n粉じん抑制、換気、呼吸用保護具、じん肺健診\n騒音\n内耳有毛細胞への慢性障害\n感音性難聴、初期C5 dip\n工学的対策、作業時間、耳栓等、聴力管理\n高気圧・潜水\n圧変化・不活性ガス気泡\n気圧外傷、減圧症、動脈ガス塞栓\n適切な加圧・減圧、体調管理\n酸素欠乏・硫化水素\n低酸素、細胞呼吸障害・粘膜刺激\n意識障害、呼吸停止、急性中毒\n測定、換気、監視人、空気呼吸器等\n熱\n体温調節破綻\n熱中症\nWBGT、順化、休憩、水分・塩分、緊急対応体制\n赤外線・レーザー・放射線\n波長・線種により吸収部位が異なる\n白内障、角膜・網膜障害、造血器等の障害\n遮へい、距離、時間、保護眼鏡、線量管理\n6．択一式の誤り肢を見抜くチェック順\n主体：事業者、医師、産業医、作業主任者、労働者、都道府県労働局長、労働基準監督署長のどれか。\n対象：全労働者か、常時使用する労働者か、常時従事者か、特定業務・特定物質の対象者か。\n時点：雇入れ時、配置替え時、作業開始前、定期、事故時、離職時等を入れ替えていないか。\n頻度・期限：1か月、3か月、6か月、1年、14日、30日等の数字が別制度と置換されていないか。\n法的強度：「しなければならない」「努めなければならない」「望ましい」がすり替えられていないか。\n測定・健診の目的：作業場の状態評価、個人ばく露評価、疾病の早期発見、就業適性評価を混同していないか。\n医学的時間軸：急性影響と慢性影響、初期所見と重症所見が逆になっていないか。\n7．健康管理の記述答案チェックリスト\n確認点\n答案上の扱い\n指定数・字数\n「四つ」「二つずつ」「150字程度」を守り、余分な項目で焦点をぼかさない。\n正式用語\n最初に法令・指針上の正式名称を書き、括弧で平易に説明する。\n構造\n原因・リスク → 措置 → 留意点・目的の順に書く。\n数値\n単位を付け、対象と条件を併記する。数字だけを書かない。\n義務の区別\n法定義務、努力義務、指針上の推奨を分ける。\n事後措置\n健診や測定は、就業上の措置、作業改善、保健指導へつなげて完結させる。\n時間配分\nまず指定個数を満たす骨格を書き、その後に理由・具体例を補う。\n8．直前確認用ミニリスト\n男性40％／女性は男性の60％、300 lx、1時間、10～15分\n溶接ヒューム：Mn、0.05 mg/m³、呼吸域30 cm、フィットテスト年1回・3年保存\n酸素18％未満、硫化水素10 ppm超\n産業医50人、専属1,000人、2人は3,000人超\n設備届30日前、仕事届14日前、休業4日未満は四半期翌月末\n事務所：1/20、0.15 mg/m³、50人又は女性30人、排水受け1か月\n有機溶剤：0.4／0.5／1.0 m/s、タンク容積3倍以上\n石綿：特別教育3年、船舶20トン以上\n健診は対象・目的・時","title":"じん肺法令・粉じん障害防止規則の穴埋め"},"oshUrl":"https://osh-management.com/consultant/health/2025/low-question15/","sourceType":"問題要旨（提供解説を基に学習用に再構成）","lawLinks":[{"label":"じん肺法","url":"https://laws.e-gov.go.jp/law/335AC0000000030"},{"label":"じん肺法施行規則","url":"https://laws.e-gov.go.jp/law/335M50002000006"},{"label":"粉じん障害防止規則","url":"https://laws.e-gov.go.jp/law/354M50002000018"}],"currentBadge":"正答変更なし","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-01","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":1,"question":"労働衛生管理に関する次のイ～リの措置について、該当する労働衛生の三管理（作業環境管理・作業管理・健康管理）の組合せのうち、適切なもののみを挙げたものは（１）～（５）のうちどれか。\nイ　有害業務に従事することが適当でないと医師が認めた者を配置転換する。\nロ　高温多湿作業に労働者を従事させる場合に暑熱順化期間を設ける。\nハ　騒音作業において、騒音発生源である機械に防振ゴムを取り付ける。\nニ　放射線業務において、管理区域を設定し、必要のある者以外の者を立入\n禁止とする。\nホ　情報機器作業において、間接照明等のグレア防止用照明器具を用いる。\nヘ　長時間労働者に対して、医師による面接指導を行う。\nト　疾病による休職者の職場復帰を支援する。\nチ　ずい道建設工事の掘削作業において、土石又は岩石を湿潤な状態に保つ\nための設備を設ける。\nリ　重量物取扱い作業において、人力で取り扱う重量物の重量や取扱い回数\nに制限を設ける。作業環境管理作業管理健康管理","options":["ハ ホ ト","チ ホ ロ","ニ リ ヘ","ハ イ ロ","チ リ"],"correctIndex":4,"category":"メンタルヘルス・過重労働","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"メンタルヘルス・過重労働","point":"対策が直接働きかける対象を、作業場・発生源（作業環境管理）、作業方法・ばく露の仕方（作業管理）、労働者の健康状態（健康管理）に分ける問題である。設備を使う対策でも、作業者の動作や時間を変えるものは作業管理となる。","conclusion":"チは湿潤化設備による粉じん発散抑制で作業環境管理、リは重量・回数の制限で作業管理、ヘは医師による面接指導で健康管理である。したがって（5）。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | ハは作業環境管理でよいが、ホも照明設備の改善で作業環境管理、トは健康管理である。 | 作業環境管理＝ハ・ホ・チ、作業管理＝ロ・ニ・リ、健康管理＝イ・ヘ・ト。\n（2） | 誤り | チは作業環境管理だが、ホは作業管理ではなく作業環境管理、ロは健康管理ではなく作業管理。 | チ／リ又はロ・ニ／イ・ヘ・トの組合せを選ぶ。\n（3） | 誤り | ニの立入禁止は労働者の行動・ばく露を制御する作業管理。リは作業管理、ヘは健康管理。 | 作業環境管理欄をチ又はハ・ホとする。\n（4） | 誤り | ハは作業環境管理だが、イは健康管理、ロは作業管理である。 | ハ／ロ・ニ・リ／イ・ヘ・ト。\n（5） | 正しい | チ＝作業環境管理、リ＝作業管理、ヘ＝健康管理の対応が全て適切。 | 記載どおり。","trap":"","keywords":"発生源・作業場＝環境／方法・時間・保護具＝作業／健診・面接・配置＝健康","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question01/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-02","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":2,"question":"厚生労働省の「職場における受動喫煙防止のためのガイドライン」に関する次のイ～ニの記述について、正しいものの組合せは（１）～（５）のうちどれか。\nイ　第一種施設とは、多数の者が利用する施設のうち、学校、病院、国や地\n方公共団体の行政機関の庁舎等をいい、「原則敷地内禁煙」とされている。\nロ　第二種施設には一般の事務所や工場が含まれ、「原則屋内禁煙」とされ\nているが、特定の時間を禁煙とする時間分煙は例外的に認められている。\nハ　たばこの煙の流出を防止するための技術的基準に適合した喫煙専用室に\nおいては、飲料の摂取は認められている。\nニ　喫煙専用室には、20歳未満の者を立ち入らせてはならず、たとえ清掃作\n業のためであっても認められない。","options":["イ ロ","イ ニ","ロ ハ","ロ ニ","ハ ニ"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"健康増進法上の第一種施設・第二種施設の規制、喫煙専用室の用途、20歳未満者の立入禁止を区別する。従来の「時間分煙」や曖昧な区域分煙は、改正法の原則屋内禁煙に代わる措置ではない。","conclusion":"イとニが正しい。第一種施設は原則敷地内禁煙、一般事務所・工場等の第二種施設は原則屋内禁煙であり、20歳未満者は清掃等の業務目的でも喫煙区域に立ち入れない。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | イは正しいが、ロは時間分煙を例外として認める点が誤り。 | 第二種施設は原則屋内禁煙。喫煙を認めるなら基準適合の喫煙専用室等を設ける。\n（2） | 正しい | イとニはいずれもガイドライン及び健康増進法の考え方に合致。 | 記載どおり。\n（3） | 誤り | ロは誤り。ハも喫煙専用室を飲食場所として扱う点が誤り。 | 喫煙専用室は専ら喫煙のための場所で、通常の飲食提供場所ではない。\n（4） | 誤り | ニは正しいが、ロが誤り。 | イとニを選ぶ。\n（5） | 誤り | ニは正しいが、ハが誤り。 | 喫煙と飲食を伴う営業を認める経過措置の喫煙可能室等と、喫煙専用室を区別する。","trap":"","keywords":"第一種＝原則敷地内禁煙／第二種＝原則屋内禁煙／20歳未満は喫煙区域立入禁止","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question02/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-03","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":3,"question":"厚生労働省の労働衛生統計等に関する次のイ～ニの記述について、正しいものの組合せは（１）～（５）のうちどれか。イ「精神障害の労災補償状況」によると、精神障害による労災補償支給決定件数は、平成30年度以降増加傾向にあり、令和４年度は約700件であった。ロ「脳・心臓疾患の労災補償状況」によると、脳・心臓疾患の労災補償支給決定件数は、平成30年度以降増加傾向にあり、令和４年度は約500件であった。ハ「令和４年労働安全衛生調査（実態調査）」によると、メンタルヘルス対策に取り組んでいる事業場の割合は、労働者数50人以上の事業場で約50％であった。ニ「第14次労働災害防止計画」の記述によると、特定化学物質障害予防規則等による個別規制の対象外となっている化学物質による労働災害が、化学物質による労働災害全体の約８割を占めている。","options":["イ ロ","イ ニ","ロ ハ","ロ ニ","ハ ニ"],"correctIndex":1,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"統計の対象年、年度、指標（請求件数か支給決定件数か）、事業所規模を正確に読む問題である。おおよその桁を覚えるだけでなく、精神障害と脳・心臓疾患の件数差を理解する。","conclusion":"イは710件で正しい。ニも、第14次労働災害防止計画が示す「個別規制対象外の化学物質による災害が約8割」という課題認識に合致する。したがって（2）。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | イは正しいが、ロは支給決定件数を約500件とする点と増加傾向の説明が誤り。 | 令和4年度の脳・心臓疾患の支給決定件数は194件。\n（2） | 正しい | イ＝710件、ニ＝約8割でいずれも正しい。 | 記載どおり。\n（3） | 誤り | ロ・ハが誤り。50人以上の事業所ではメンタルヘルス対策取組率は約9割。 | イとニの組合せとする。\n（4） | 誤り | ニは正しいがロが誤り。 | 脳・心臓疾患は194件。\n（5） | 誤り | ニは正しいがハが誤り。 | 50人以上では約50％ではなく高率である。","trap":"","keywords":"令和4年度：精神710件／脳・心臓194件／個別規制外化学物質災害約8割","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question03/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-04","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":4,"question":"有害物の性状、測定等に関する次のイ～ホの記述について、誤っているものの組合せは（１）～（５）のうちどれか。\nイ　環境空気中の有害物質の濃度の分布は、一般に、正規分布に従う。\nロ　1,4-ジオキサンは、脂溶性と水溶性の双方を有している。\nハ　アセトンは、トルエンより極性が大きい。\nニ　空気中の有機溶剤の体積分率0.5％は、5000ppmに相当する。\nホ　粉じんの相対沈降径は、光学的観察による粉じん粒径の測定により求め\nる。","options":["イ ハ","イ ホ","ロ ニ","ロ ハ","ニ ホ"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"空気中濃度の統計分布、溶剤の極性、ppm換算、粉じん粒径の定義を横断的に問う。濃度データは正規分布ではなく対数正規分布を示すことが多い。","conclusion":"誤りはイとホで、正答は（2）。環境濃度は一般に対数正規分布を示し、相対沈降径は沈降速度を基準とした空気動力学的な概念で、単なる光学顕微鏡の幾何学径ではない。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | イは誤りだがハは正しい。アセトンはカルボニル基を有し、トルエンより極性が大きい。 | イとホが誤り。\n（2） | 正しい | イは正規分布ではなく対数正規分布、ホは光学径ではなく沈降挙動に基づく。 | 記載どおり。\n（3） | 誤り | ロは1,4-ジオキサンが水と多くの有機溶媒に混和し得るため正しい。ニも0.5％＝0.005＝5000ppmで正しい。 | 誤りはイ・ホ。\n（4） | 誤り | ロ・ハはいずれも正しい。 | 誤りはイ・ホ。\n（5） | 誤り | ニは正しいがホは誤り。 | 0.5％×10,000＝5000ppm。","trap":"","keywords":"濃度分布＝対数正規／1％＝10,000ppm／0.5％＝5000ppm","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question04/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-05","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":5,"question":"石綿に関する次の記述のうち、誤っているものはどれか。","options":["クロシドライトは、これまでに使用されてきた石綿の９割以上を占める。","石綿繊維は極めて細いため、長さ数十μmの石綿繊維が肺内に検出されることも少なくない。","石綿関連疾患には、石綿肺、肺がん、中皮腫、良性石綿胸水が含まれる。","石綿ばく露によって生じる肺がんの発生部位、病理組織型は、通常の肺がんと差異はない。","胸膜プラークや、肺組織中の石綿小体は、過去の石綿ばく露の指標となる。"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"石綿の種類別使用量と発がん性、関連疾患、過去ばく露を示す医学的所見を問う。日本で最も多く使われたのはクリソタイル（白石綿）である。","conclusion":"クロシドライトが使用量の9割以上を占めたとする（1）が誤り。実際にはクリソタイルが大部分を占め、クロシドライトは中皮腫リスクが高い角閃石系石綿である。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | 国内外で使用量の大部分を占めたのはクリソタイル。クロシドライトではない。 | クリソタイルは、これまで使用された石綿の大部分を占める。\n（2） | 正しい | 石綿繊維は極めて細長く、数十μmの長さの繊維も肺内に残留し得る。 | 記載どおり。\n（3） | 正しい | 石綿肺、肺がん、中皮腫、良性石綿胸水はいずれも石綿関連疾患。 | 記載どおり。\n（4） | 正しい | 石綿関連肺がんは、発生部位・組織型だけで通常の肺がんと鑑別できない。 | 記載どおり。\n（5） | 正しい | 胸膜プラークや石綿小体は過去の石綿ばく露を示す所見。 | 記載どおり。","trap":"","keywords":"使用量最多＝クリソタイル／高い中皮腫リスク＝クロシドライト／ばく露指標＝胸膜プラーク・石綿小体","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question05/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-06","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":6,"question":"けい肺症に関する次の記述のうち、適切でないものはどれか。","options":["遊離結晶性シリカの吸入により生じる。","採石場労働者、石切り工、研磨作業員、ガラス職人に多い。","肺結核及び非結核性肺抗酸菌症を発症するリスクが高い。","急性けい肺症は、短期間（数か月～数年）の多量の原因物質ばく露により引き起こされる。","胸部エックス線写真で下肺野に線状影が多く見られる。"],"correctIndex":4,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"遊離結晶性シリカによるじん肺の職種、合併感染、急性型と慢性型、胸部画像の典型分布を問う。けい肺の典型は上肺野優位の小結節影である。","conclusion":"（5）の「下肺野に線状影が多い」が不適切。下肺野優位の不整形・線状影は石綿肺等でみられ、けい肺では上肺野優位の結節影、進行すると大陰影が典型である。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 原因は遊離結晶性シリカ（結晶質シリカ）の吸入。 | 記載どおり。\n（2） | 正しい | 採石、石材加工、研磨、鋳物、ガラス等は高リスク作業。 | 記載どおり。\n（3） | 正しい | けい肺では肺結核及び非結核性抗酸菌症のリスクが上昇。 | 記載どおり。\n（4） | 正しい | 急性けい肺は高濃度ばく露により数か月～数年で発症し得る。 | 記載どおり。\n（5） | 誤り | 典型は上肺野優位の小結節影。下肺野の線状影は典型でない。 | 胸部X線では上肺野優位に粒状・結節状影がみられる。","trap":"","keywords":"けい肺＝結晶性シリカ／上肺野結節影／結核・非結核性抗酸菌症","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question06/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-07","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":7,"question":"電離放射線の生体影響に関する次の記述のうち、誤っているものはどれか。","options":["細胞分裂が盛んな組織は、放射線感受性が高い。","しきい線量以下では、確定的影響は見られない。","眼の水晶体の混濁は、確定的影響かつ晩発影響である。","最も放射線感受性が高い細胞は、卵巣の濾胞上皮細胞である。","放射線誘発がんの代表的なものとして、白血病が挙げられる。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"放射線感受性、組織反応（確定的影響）、晩発影響、放射線誘発がんを整理する。ベルゴニエ・トリボンドーの法則では、未分化で分裂が盛んな細胞ほど感受性が高い。","conclusion":"（4）が誤り。最も高感受性の代表はリンパ球、造血幹細胞、精原細胞などで、卵巣の濾胞上皮細胞を「最も高い」とするのは適切でない。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 分裂頻度が高く、未分化な細胞は一般に放射線感受性が高い。 | 記載どおり。\n（2） | 正しい | 組織反応には一般にしきい線量があり、それ以下では臨床的影響がみられないと扱う。 | 記載どおり。\n（3） | 正しい | 水晶体混濁はしきい線量を持つ組織反応で、晩発して現れる。 | 記載どおり。\n（4） | 誤り | 最高感受性の代表はリンパ球・造血系・生殖細胞等。濾胞上皮細胞と限定できない。 | リンパ球や造血幹細胞等は放射線感受性が高い。\n（5） | 正しい | 白血病は代表的な放射線誘発がん。 | 記載どおり。","trap":"","keywords":"感受性：リンパ球・造血系・生殖細胞高い／水晶体＝組織反応・晩発","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question07/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-08","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":8,"question":"減圧症に関する次の記述のうち、適切でないものはどれか。","options":["窒素は、脂肪含量の高い組織に溶解しやすい。","減圧症は、圧力が急速に減少することにより、血液又は組織に溶解していたガスが気泡を形成することで生じる。","心臓内の右左短絡は、減圧症の危険因子である。","スクイーズと呼ばれる息切れ、胸痛などの呼吸器症状が生じる。","減圧性の骨壊死が生じる。"],"correctIndex":3,"category":"労働衛生管理総論","cluster":"酸欠・高気圧","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"高気圧下で溶解した不活性ガスの気泡化による減圧症と、圧力差によるスクイーズ（締め付け障害）を区別する。右左短絡は静脈側気泡が動脈側に移行する要因となる。","conclusion":"（4）が不適切。スクイーズは潜降時などに閉鎖腔内外の圧較差で起こる気圧外傷であり、息切れ・胸痛を主徴とする減圧症の呼吸器型（チョークス）とは異なる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 窒素は脂溶性で、脂肪組織に多く溶解・蓄積しやすい。 | 記載どおり。\n（2） | 正しい | 急速減圧により溶解ガスが過飽和となり気泡を形成する。 | 記載どおり。\n（3） | 正しい | 卵円孔開存等の右左短絡は動脈化気泡の危険因子。 | 記載どおり。\n（4） | 誤り | スクイーズは気圧外傷。呼吸困難・胸痛は重症減圧症のチョークス等でみられる。 | スクイーズは閉鎖腔の圧平衡不良による障害で、耳・副鼻腔等に起こる。\n（5） | 正しい | 慢性的又は反復する不適切な減圧で骨壊死を生じることがある。 | 記載どおり。","trap":"","keywords":"スクイーズ＝気圧外傷／チョークス＝呼吸器型減圧症／右左短絡＝危険因子","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question08/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-09","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":9,"question":"酸素欠乏症及び硫化水素中毒とその予防に関する次の記述のうち、適切でないものはどれか。","options":["酵母など発酵する物を入れてある醸造槽の内部での作業は、酸素欠乏症の危険がある。","空気中の酸素濃度が12～16％程度では、一般に、集中力の低下や、頭痛、吐き気などの症状がみられる。","硫化水素は無色で、その比重は空気より大であり、滞留性がある。","高濃度の硫化水素は、脳細胞内の呼吸酵素の働きを阻害し、意識消失を瞬時に引き起こす。","空気中の硫化水素濃度が１～５ppmで、嗅覚麻痺が生じる。"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"酸素濃度ごとの症状、酸欠危険場所、硫化水素の物性・毒性・嗅覚麻痺を問う。臭いの有無を安全確認に使ってはならない。","conclusion":"（5）が不適切。1～5ppmでは腐卵臭を感じる程度で、嗅覚麻痺はより高濃度・一定時間のばく露で生じる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 発酵により酸素消費・二酸化炭素発生が起こり、醸造槽内部は酸欠危険。 | 記載どおり。\n（2） | 正しい | 12～16％程度では脈拍・呼吸増加、集中力低下、頭痛、吐き気等が生じ得る。 | 記載どおり。\n（3） | 正しい | 硫化水素は無色で空気より重く、低所に滞留しやすい。 | 記載どおり。\n（4） | 正しい | 高濃度では細胞呼吸を阻害し、急速な意識消失・呼吸停止を来す。 | 記載どおり。\n（5） | 誤り | 1～5ppmは臭気を感じる濃度。嗅覚疲労・麻痺はより高濃度で起こる。 | 1～5ppmでは腐卵臭を感じ、100ppm前後以上では嗅覚が当てにならなくなる。","trap":"","keywords":"酸欠＝18％未満／硫化水素は空気より重い／臭いは安全指標にならない","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question09/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-10","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":10,"question":"振動障害の診断に用いられる検査項目として、適切でないものは次のうちどれか。","options":["握力（最大握力、瞬発握力）","手指の皮膚温","血圧","爪圧迫","24時間心電図"],"correctIndex":4,"category":"物理的因子","cluster":"騒音・振動","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"手腕振動障害の末梢循環、末梢神経、運動機能を評価する検査を選ぶ。レイノー現象だけでなく感覚障害・筋力低下を総合評価する。","conclusion":"24時間心電図は通常の振動障害診断項目ではないため（5）。握力、皮膚温、血圧、爪圧迫は関連評価に用いられる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 最大握力・維持握力等は運動機能評価。 | 記載どおり。\n（2） | 正しい | 手指皮膚温は末梢循環機能評価。冷却負荷と組み合わせることがある。 | 記載どおり。\n（3） | 正しい | 血圧は全身状態及び循環機能の把握に含まれる。 | 記載どおり。\n（4） | 正しい | 爪圧迫試験は毛細血管再充満等をみる末梢循環評価。 | 記載どおり。\n（5） | 誤り | 24時間心電図は不整脈等の評価であり、振動障害の基本検査ではない。 | 振動覚・痛覚、握力、皮膚温、爪圧迫等を用いる。","trap":"","keywords":"三本柱＝末梢循環・末梢神経・運動機能／皮膚温・爪圧迫・振動覚・握力","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question10/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-11","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":11,"question":"職場における熱中症予防に関する次の記述のうち、適切でないものはどれか。","options":["糖尿病で血糖値が高い場合は、発症のリスクが高い。","日射がある場合、ＷＢＧＴ値を求める計算において、気温（乾球温度）は算出に用いない。","暑熱順化は、暑熱順化していない状態から７日以上かけて熱へのばく露時間を次第に長くすることで行う。","身体作業強度（代謝率レベル）が高くなるほど、適用すべきＷＢＧＴ基準値は低くなる。","休憩中の体温が作業開始前の体温に戻らない場合は、熱へのばく露を止める。"],"correctIndex":1,"category":"物理的因子","cluster":"温熱・気象","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"基礎疾患、WBGTの算出式、暑熱順化、作業強度と基準値、休憩時の回復を問う。日射の有無で式が変わる点が計算問題の基本である。","conclusion":"日射がある場合のWBGTには乾球温度を0.1の重みで用いるため、（2）が不適切。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 糖尿病、高血糖、脱水傾向等は熱中症リスクを高める。 | 記載どおり。\n（2） | 誤り | 日射ありの式には乾球温度を用いる。 | 日射あり：0.7湿球＋0.2黒球＋0.1乾球。\n（3） | 正しい | 暑熱順化は一般に7日以上かけ、段階的にばく露時間・強度を増す。 | 記載どおり。\n（4） | 正しい | 代謝率が高いほど体内産熱が増えるので許容WBGT基準値は低くなる。 | 記載どおり。\n（5） | 正しい | 休憩で深部体温が十分に回復しない場合はばく露継続を避ける。 | 記載どおり。","trap":"","keywords":"日射あり＝0.7湿球＋0.2黒球＋0.1乾球／高代謝ほど基準値低い／順化7日以上","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question11/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-12","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":12,"question":"視覚に関する次の記述のうち、適切でないものはどれか。","options":["近視とは、眼球内に入ってきた平行光線が網膜の手前で焦点を結ぶ状態をいう。","乱視は、眼球内部を満たすゼリー状の硝子体のゆがみにより、焦点が複数できることで生じる。","眼球をカメラに例えると、水晶体はレンズ、網膜はフィルムに相当する。","眼は、外界の明るさの変化に対し、瞳孔径の変化と網膜の順応によって対応する。","視力検査には、遠見視力検査（５ｍ視力）に加え、近見視力検査（50cm視力又は30cm視力）がある。"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"近視、乱視、眼球構造、明暗への適応、遠見・近見視力検査の基礎を問う。乱視は主に角膜又は水晶体の屈折面の不均一で生じる。","conclusion":"（2）が不適切。乱視は硝子体のゆがみではなく、角膜や水晶体の曲率・屈折力が方向により異なるため焦点が一点に結ばれない状態である。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 近視では平行光線が網膜より手前で焦点を結ぶ。 | 記載どおり。\n（2） | 誤り | 原因の中心は角膜・水晶体の屈折面の非対称。 | 乱視は角膜又は水晶体の曲率が方向によって異なるため生じる。\n（3） | 正しい | 水晶体はレンズ、網膜は撮像面に相当。 | 記載どおり。\n（4） | 正しい | 瞳孔反射と網膜の明順応・暗順応で明るさに対応。 | 記載どおり。\n（5） | 正しい | 職業視機能評価では遠見に加え近見・中間視力が重要。 | 記載どおり。","trap":"","keywords":"近視＝網膜手前／遠視＝網膜後方／乱視＝角膜・水晶体の屈折力不均一","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question12/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-13","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":13,"question":"厚生労働省の「健康診断結果に基づき事業者が講ずべき措置に関する指針」に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは","options":["～（５）のうちどれか。ただし、医師等とは健康診断の結果についての意見の聴取を行う医師又は歯科医師をいうものとする。 イ　事業者は、医師等に対し、意見の聴取を行う上で必要となる労働者の業 務に関する情報を提供する必要がある。 ロ　事業者は、医師等に対し、健康診断個人票の医師等の意見欄に、就業上 の措置に関する意見を記入することを求める。 ハ　事業者は、就業区分に応じた就業上の措置を決定する場合には、あらか じめ当該労働者の意見を聴き、その労働者の了解が得られるよう努める。 ニ　事業者は、医師等の意見に基づき、労働者に就業制限を講じる場合には、 衛生委員会で当該労働者の健康診断の結果について調査審議し、具体的な内容を決定する。","イ ロ","イ ロ ハ","イ ハ ニ","ロ ハ ニ　（５）ロ ニ"],"correctIndex":1,"category":"統計・疫学","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"医師等への情報提供、健康診断個人票への意見記載、労働者本人の意見聴取、衛生委員会の役割を区別する。個別の就業措置は医師意見と本人事情を踏まえて事業者が決定する。","conclusion":"イ・ロ・ハが適切で（2）。ニは、衛生委員会で個人の健診結果そのものを審議して措置内容を決めるとする点が不適切で、プライバシーにも配慮が必要。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | イ・ロは正しいが、ハも正しい。 | イ・ロ・ハを選ぶ。\n（2） | 正しい | 業務情報提供、医師意見の記録、本人意見聴取はいずれも指針に沿う。 | 記載どおり。\n（3） | 誤り | ニが誤り。衛生委員会は制度・基準を審議するが、個人の健診結果を開示して措置を決定する場ではない。 | 個別措置は医師意見を勘案し、本人の実情を考慮して事業者が決定する。\n（4） | 誤り | ニが誤り。 | イ・ロ・ハが適切。\n（5） | 誤り | ニが誤り、イ・ハも適切。 | イ・ロ・ハ。","trap":"","keywords":"医師へ業務情報／個人票に意見／本人の意見・了解努力／個人情報保護","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question13/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-14","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":14,"question":"厚生労働省の「事業場における労働者の健康保持増進のための指針」に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～","options":["のうちどれか。 イ　労働者の高齢化を見据えた取組として、筋力や認知機能等の心身の活力 が低下するフレイルやロコモティブシンドロームの予防に取り組むことが重要である。 ロ　健康保持増進対策を継続的かつ計画的に行うための取組として、推進体 制の確立、課題の把握、目標の設定、措置の決定、計画の作成、計画の実施、実施結果の評価の７項目が定められている。 ハ　労働者の健康状態の把握においては、転倒等の労働災害を防止するため、 体力の状況を把握し、自らの身体機能の維持向上に取り組めるよう、ロコモ度テスト等の健康測定等を実施する。 ニ　健康指導は、運動指導、メンタルヘルスケア、栄養指導、口腔保健指導 及び保健指導を含むもの又はこれらに関係するものであり、全ての措置の実施が困難な場合には、可能なものから実施する。","イ ロ ハ","イ ロ ニ","イ ハ ニ","イ ハ　（５）ロ ニ"],"correctIndex":2,"category":"メンタルヘルス・過重労働","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"メンタルヘルス・過重労働","point":"THP指針の高齢化対応、PDCA型の継続的取組、健康測定、健康指導の内容を問う。令和5年改正でフレイル・ロコモ等の観点が明確化された。","conclusion":"イ・ハ・ニが適切で（3）。ロは、指針が定める基本事項を7項目としている点が誤りである。指針は「健康保持増進方針の表明」を先頭に置き、推進体制の確立から実施結果の評価まで、合計8項目を掲げている。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | ロは「健康保持増進方針の表明」を欠き、8項目を7項目としているため誤り。 | イ・ハ・ニを選ぶ。\n（2） | 誤り | ロが誤り、ハも適切。 | イ・ハ・ニ。\n（3） | 正しい | フレイル・ロコモ予防、ロコモ度テスト等、可能な健康指導から実施はいずれも指針に沿う。 | 記載どおり。\n（4） | 誤り | ニも適切。 | イ・ハ・ニ。\n（5） | 誤り | ロは「健康保持増進方針の表明」を欠くため誤りで、イ・ハも適切。 | イ・ハ・ニ。","trap":"","keywords":"基本事項8項目／方針表明→体制→課題→目標→措置→計画→実施→評価／フレイル・ロコモ／健康指導5領域","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question14/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-15","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":15,"question":"厚生労働省の「労働者の心の健康の保持増進のための指針」に関する次の記述のうち、適切でないものはどれか。","options":["メンタルヘルスケアを継続的かつ計画的に行うため、心の健康づくり計画を策定し、各事業場における労働安全衛生に関する計画の中に位置づける。","心の健康づくり計画の策定、実施体制の整備等の具体的な実施方策や個人情報の保護に関する規程等の策定等に当たっては、衛生委員会等において調査審議を行う。","産業医等は、対策の実施状況の把握、教育研修の企画及び実施、セルフケア及びラインによるケアの支援、情報の収集及び提供、健康情報の保護等を行う。","メンタルヘルス不調への気付きと対応のため、産業医は、労働者、管理監督者、家族等からの相談に対して対応できる体制を整備し、相談等により把握した情報を事業者が事業場外の医療機関に提供する。","事業者が把握した心の健康に関する情報を理由として、期間を定めて雇用される者について契約の更新をしないことは、不利益な取扱いに該当する。"],"correctIndex":3,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"心の健康づくり計画、衛生委員会、産業医等の役割、相談体制、健康情報の取扱い、不利益取扱いを問う。実施主体と情報提供の範囲がポイント。","conclusion":"（4）が不適切。相談体制の整備責任は事業者にあり、把握した健康情報を事業者が外部医療機関へ一律に提供するものではない。本人同意や必要性、個人情報保護が必要である。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 心の健康づくり計画を安全衛生計画に位置付け、継続的に実施する。 | 記載どおり。\n（2） | 正しい | 計画・体制・個人情報保護規程は衛生委員会等で調査審議する。 | 記載どおり。\n（3） | 正しい | 産業医等は専門的立場から計画、研修、ケア支援、情報保護等に関与する。 | 記載どおり。\n（4） | 誤り | 事業者の体制整備責任を産業医だけに負わせ、情報を外部機関へ提供する記述も不適切。 | 事業者は相談体制を整備し、健康情報は本人同意等を踏まえ必要最小限に取り扱う。\n（5） | 正しい | 心の健康情報を理由とする雇止めは不利益取扱いとして禁止される。 | 記載どおり。","trap":"","keywords":"四つのケア／心の健康づくり計画／不利益取扱い禁止／必要最小限の情報","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question15/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-16","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":16,"question":"自律神経活動に関する次の記述のうち、誤っているものはどれか。","options":["瞳孔は交感神経活動により散大し、副交感神経活動により縮小する。","心拍数は交感神経活動により増加し、副交感神経活動により減少する。","気管支平滑筋は交感神経活動により収縮し、副交感神経活動により弛緩する。","消化運動は交感神経活動により抑制され、副交感神経活動により促進される。","膀胱排尿筋は交感神経活動により弛緩し、副交感神経活動により収縮する。"],"correctIndex":2,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"交感神経と副交感神経の拮抗的作用を、瞳孔、心臓、気管支、消化管、膀胱で確認する。緊急時の「闘争・逃走」と休息・消化の方向性で整理する。","conclusion":"（3）が誤り。交感神経は気管支平滑筋を弛緩させ気道を拡張し、副交感神経は収縮させる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 交感神経で散瞳、副交感神経で縮瞳。 | 記載どおり。\n（2） | 正しい | 交感神経で心拍増加、副交感神経で減少。 | 記載どおり。\n（3） | 誤り | 作用が逆。 | 交感神経で気管支弛緩、副交感神経で収縮。\n（4） | 正しい | 交感神経は消化運動を抑制し、副交感神経は促進。 | 記載どおり。\n（5） | 正しい | 蓄尿時は交感神経で排尿筋弛緩、排尿時は副交感神経で収縮。 | 記載どおり。","trap":"","keywords":"交感：散瞳・頻脈・気管支拡張・消化抑制・蓄尿／副交感は概ね逆","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question16/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-17","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":17,"question":"有機溶剤の健康影響等に関する次の記述のうち、誤っているものはどれか。","options":["トルエンは、接着剤や塗料の溶剤などに使用され、代謝物である尿中のメチル馬尿酸は、生物学的モニタリングの指標として利用される。","ジクロロメタンは、金属部品の脱脂洗浄剤などとして使用され、慢性ばく露により、肝臓が障害される。","ノルマルヘキサンは、溶剤や接着剤などで使用され、代謝物は2,5-ヘキサンジオンであり、末梢神経障害を生じる。","Ｎ,Ｎ-ジメチルホルムアミドは、合成繊維などの製造工程で溶剤として使用され、慢性ばく露により、頭痛、めまい、消化不良、肝機能障害などがみられる。","二硫化炭素は、レーヨンの製造工程で溶剤として使用され、高濃度のばく露では精神障害を生じる。"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"代表的有機溶剤の用途、標的臓器、尿中代謝物を対応させる。トルエンとキシレンの代謝物の取り違えが典型的なひっかけ。","conclusion":"（1）が誤り。トルエンの指標は尿中馬尿酸で、尿中メチル馬尿酸はキシレンの指標である。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | トルエンとキシレンの代謝物を入れ替えている。 | トルエン＝尿中馬尿酸、キシレン＝尿中メチル馬尿酸。\n（2） | 正しい | ジクロロメタンは中枢神経抑制、肝障害等を起こし、体内で一酸化炭素も生成し得る。 | 記載どおり。\n（3） | 正しい | n-ヘキサン代謝物2,5-ヘキサンジオンが軸索障害性末梢神経障害を起こす。 | 記載どおり。\n（4） | 正しい | DMFは肝毒性が重要で、尿中N-メチルホルムアミドが指標。 | 記載どおり。\n（5） | 正しい | 二硫化炭素は高濃度で急性中枢神経症状、慢性で神経・心血管影響等。 | 記載どおり。","trap":"","keywords":"トルエン＝馬尿酸／キシレン＝メチル馬尿酸／n-ヘキサン＝2,5-ヘキサンジオン／DMF＝NMF","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question17/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-18","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":18,"question":"有機溶剤に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　シンナーは、一般に、異なる有機溶剤を混合したもので、成分の有機溶\n剤の種類や混合比率には様々なものがある。\nロ　有機溶剤の使用に当たっては、その蒸気を吸入すること以外に皮膚から\nの吸収にも注意する必要がある。\nハ　有機溶剤を含む排ガスの処理のための空気清浄装置には、主として、吸\n着式排ガス処理装置又は燃焼式排ガス処理装置が用いられる。\nニ　有機溶剤用の直結式防毒マスクは、有機溶剤の濃度が２％以下の大気中\nで使用するものである。","options":["イ ロ ハ","イ ロ ニ","イ ハ","ロ ニ","ハ ニ"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"混合溶剤、経皮吸収、排ガス処理、防毒マスクの使用限界を問う。防毒マスクは酸素欠乏、高濃度、未知濃度では使用できない。","conclusion":"イ・ロ・ハが適切で（1）。ニは誤りで、一般的な有機ガス用防毒マスクの使用可能濃度上限は、直結式では1％（アンモニア用は1.5％）であり、2％以下ではない。隔離式・直結式・直結式小型で使用濃度範囲が異なる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | シンナーの多成分性、経皮吸収、吸着・燃焼処理はいずれも適切。 | 記載どおり。\n（2） | 誤り | ニが誤り。 | イ・ロ・ハを選ぶ。\n（3） | 誤り | ロも正しい。 | イ・ロ・ハ。\n（4） | 誤り | ニが誤り、イ・ハも正しい。 | イ・ロ・ハ。\n（5） | 誤り | ニが誤り、イ・ロも正しい。 | イ・ロ・ハ。","trap":"","keywords":"シンナー＝混合物／吸着・燃焼処理／直結式1％・小型0.1％／防毒マスクは酸欠・未知濃度不可","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question18/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-19","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":19,"question":"作業環境測定に関する次の記述のうち、適切でないものはどれか。","options":["Ａ測定で、測定値が定量下限の値に満たない測定点があるときは、当該定量下限の値を当該測定点における測定値とみなして、管理区分の決定を行う。","Ｂ測定で、複数の作業位置でどこが最大濃度となるか予測できないときは、最大濃度となる可能性がある全ての点で測定を行い、得られた測定値の最大値をＢ測定値とする。","２日間測定を実施する場合、連続する２作業日に測定を行うことができない合理的な理由があるときは、必要最小限の間隔を空けた２作業日に測定を行ってよい。","Ｃ測定は、単位作業場所において、労働者にばく露される個人サンプリング法の対象物質の量が均一でないと見込まれる作業ごとに、それぞれ、５人以上の適切な数の労働者に対して行う。","Ｄ測定を行う場合は、作業が行われる時間のうち、対象となる個人サンプリング法の対象物質の濃度が最も高くなると思われる時間に、15分間のサンプリングを行う。"],"correctIndex":3,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"作業環境測定・換気","point":"A・B測定とC・D測定、定量下限の処理、測定日の間隔、均等ばく露作業の考え方を問う。C測定は作業場の平均的状態、D測定は高濃度短時間作業を把握する。","conclusion":"（4）が不適切。C測定はばく露が均等と見込まれる「均等ばく露作業」ごとに適切な労働者を選び、単位作業場所全体として必要な数の試料を得る。ばく露が均一でない作業を一括して5人以上測るという記述は逆。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 定量下限未満は定量下限値として評価に用いる。 | 記載どおり。\n（2） | 正しい | B測定の候補点が複数なら全て測定し、その最大値をB測定値とする。 | 記載どおり。\n（3） | 正しい | 合理的理由があれば必要最小限の間隔で2作業日に実施できる。 | 記載どおり。\n（4） | 誤り | 「均一でない作業ごと」という表現が誤り。均等ばく露作業を設定して測定する。 | C測定は、ばく露がほぼ均一と見込まれる作業群ごとに対象者を選び、原則5試料以上を確保する。\n（5） | 正しい | D測定は濃度が最も高くなると考えられる時間に15分間行う。 | 記載どおり。","trap":"","keywords":"C＝平均・均等ばく露作業・原則5試料以上／D＝最高濃度時間・15分","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question19/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-20","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":20,"question":"局所排気装置に関する次のイ～ニの記述について、適切でないものの組合せは、（１）～（５）のうちどれか。\nイ　外付け式フードでは、熱による上昇気流がある場合などを除き、一般に、\n上方吸引型より下方吸引型の方が有効である。\nロ　囲い式フードの制御風速は、フード開口面における最小風速である。\nハ　囲い式フードのうちのドラフトチェンバー型、カバー型及び建築ブース\n型では、建築ブース型が最も排気効果が高い。\nニ　抑制濃度とは、局所排気装置を稼働させた状態で、単位作業場所におい\nて、作業が行われる時間のうち、空気中の有害物の濃度が最も高くなると思われる位置及び時間において行われた測定によって得られた濃度である。","options":["イ ロ","イ ニ","ロ ハ","ロ ニ","ハ ニ"],"correctIndex":4,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"作業環境測定・換気","point":"外付け式・囲い式フードの吸引方向、制御風速、囲いの程度、抑制濃度の定義を問う。発散源をより囲うほど少ない排風量で高い捕集効果を得やすい。","conclusion":"ハとニが不適切で（5）。建築ブース型は開口が大きく、ドラフトチェンバー型やカバー型より排気効率が高いとはいえない。抑制濃度は法令で定める性能基準値であり、単に測定で得られた濃度そのものではない。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | イ・ロはいずれも適切。 | 不適切はハ・ニ。\n（2） | 誤り | イは適切、ニは不適切。ハも不適切。 | ハ・ニ。\n（3） | 誤り | ロは適切。 | ハ・ニ。\n（4） | 誤り | ロは適切、ハも不適切。 | ハ・ニ。\n（5） | 正しい | ハとニが不適切。 | 記載どおり。","trap":"","keywords":"囲うほど有利／制御風速＝基準位置の最低風速／抑制濃度＝性能基準値","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question20/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-21","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":21,"question":"照明に関する次の記述のうち、適切なものはどれか。","options":["照度とは、単位立体角当たりに放出される光束を観測方向から見た見掛けの面積で割った値のことである。","グレアとは、照明の光が明滅し、物がちらついて見えることをいう。","間接照明は、光線のほとんどが対象に向けて放射される照明方式で、コントラストの強い影ができる。","演色評価数は、標準光源の色の見え方と対象とする照明の色の見え方を比較して、その色のずれを数値で表したもので、色のずれが大きいほどその値は大きくなる。","照明の光色は色温度で表され、色温度が高いと青みを帯びた光色、色温度が低いと赤みを帯びた光色となる。"],"correctIndex":4,"category":"物理的因子","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"照度・輝度・グレア・間接照明・演色性・色温度の定義を問う。名称が似た光学量の単位と意味を整理する。","conclusion":"（5）が適切。色温度が高い光は青白く、低い光は赤みを帯びる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | 記述は輝度の定義に近い。照度は単位面積に入射する光束。 | 照度＝受照面の単位面積当たりの光束、単位lx。\n（2） | 誤り | グレアは過大な輝度・輝度差によるまぶしさや視認性低下。明滅はフリッカー。 | グレア＝不快感又は視認性低下を生じるまぶしさ。\n（3） | 誤り | 間接照明は天井・壁に光を当て反射光を利用し、影が柔らかい。 | 対象へ直接多く放射するのは直接照明。\n（4） | 誤り | 演色評価数は基準光との色ずれが小さいほど高い。 | 色の再現性が良いほど演色評価数は高い。\n（5） | 正しい | 高色温度＝青み、低色温度＝赤み。 | 記載どおり。","trap":"","keywords":"照度lx／輝度cd/m²／光束lm／高色温度＝青白、低色温度＝赤","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question21/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-22","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":22,"question":"化学物質等の有害性等に関する次の記述のうち、誤っているものはどれか。","options":["変異原性とは、有害要因が細胞の染色体や遺伝子に作用し、損傷したり変化などを起こさせる性質をいい、変異原性のある物質の多くは、発がん性を有している。","生殖細胞変異原性とは、次世代に受け継がれる可能性がある突然変異を誘発する性質である。","日本産業衛生学会及び米国産業衛生専門家会議（ＡＣＧＩＨ）は、ヒトへの発がん性を、グループ１、グループ２Ａ、グループ２Ｂ及びグループ３に分類している。","特定標的臓器毒性（単回ばく露）とは、単回ばく露によって起こる特定臓器に対する特異的な非致死性の毒性である。","生殖毒性とは、雌雄の成体の生殖機能及び受精能力に対し悪影響を及ぼす性質及び子の発生に対し悪影響を及ぼす性質である。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"変異原性、生殖細胞変異原性、発がん性分類、特定標的臓器毒性、生殖毒性の定義を問う。GHS、IARC、日本産業衛生学会、ACGIHの分類記号を混同しない。","conclusion":"（3）が誤り。グループ1、2A、2B、3は主にIARCの分類。日本産業衛生学会は第1群・第2群A/B、ACGIHはA1～A5を用いる。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 変異原性物質の多くは発がん性と関連するが、両者は同義ではない。 | 記載どおり。\n（2） | 正しい | 生殖細胞変異は次世代に遺伝する可能性がある。 | 記載どおり。\n（3） | 誤り | 分類体系を混同。 | IARC＝Group 1/2A/2B/3、日本産衛＝第1群/第2群A/B、ACGIH＝A1～A5。\n（4） | 正しい | 単回ばく露後の特定臓器に対する非致死性の毒性を対象とする。 | 記載どおり。\n（5） | 正しい | 生殖機能・受精能力及び児の発生への悪影響を含む。 | 記載どおり。","trap":"","keywords":"IARC 1/2A/2B/3／日本産衛 1/2A/2B／ACGIH A1～A5／GHS 1A/1B/2","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question22/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-23","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":23,"question":"安全データシート（SDS）に用いられる絵表示A～Cと、それらが表す危険有害性クラス・区分の組合せについて、正しいものはどれか。\nA：腐食性\nB：健康有害性（胸部に星形）\nC：感嘆符","options":["眼に対する重篤な損傷性（区分1）／発がん性（区分1）／誤えん有害性（区分1）","皮膚腐食性（区分1）／生殖毒性（区分1）／眼刺激性（区分2A）","誤えん有害性（区分1）／生殖細胞変異原性（区分1）／皮膚感作性（区分1）","皮膚腐食性（区分1）／発がん性（区分2）／生殖毒性（区分2）","皮膚刺激性（区分2）／発がん性（区分2）／呼吸器感作性（区分1）"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"三つのGHS絵表示が対応する健康有害性を判別する。絵表示は一つの有害性だけを意味せず、複数クラスに共通して使用される。","conclusion":"Aの腐食性は皮膚腐食性区分1、Bの健康有害性は生殖毒性区分1、Cの感嘆符は眼刺激性区分2Aを表し得るため（2）。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | Aは眼損傷区分1にも使われ得るが、Cの感嘆符は誤えん有害性区分1には用いない。 | 誤えん有害性区分1は健康有害性の絵表示。\n（2） | 正しい | A＝皮膚腐食性1、B＝生殖毒性1、C＝眼刺激性2Aの対応が全て正しい。 | 記載どおり。\n（3） | 誤り | 誤えん有害性はAではなくB。皮膚感作性はCでよいが全体は不一致。 | Aは腐食性、Bは発がん性・生殖毒性等、Cは刺激性・皮膚感作性等。\n（4） | 誤り | Cの感嘆符は生殖毒性区分2に用いず、Bを用いる。 | 生殖毒性区分2も健康有害性。\n（5） | 誤り | Aは皮膚刺激性2ではなく皮膚腐食性1。呼吸器感作性はB。 | 皮膚刺激性2はC、呼吸器感作性1はB。","trap":"","keywords":"腐食性＝皮膚腐食1・眼損傷1／健康有害性＝発がん・生殖・呼吸器感作／感嘆符＝眼刺激2A・皮膚刺激2","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question23/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-24","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":24,"question":"人力による重量物の運搬における負担軽減対策に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　荷物を台車に乗せて運搬するときに段差を越える際は、一般に、台車は\n押すよりも引くとよい。\nロ　荷物を持ち上げるときは、肩より上に持ち上げないようにする。\nハ　作業時には、床との接触面積が大きく、摩擦係数が高い靴を履く。\nニ　荷物を持ち運ぶ際は、小分けにして運搬回数を増やすより、荷物をまと\nめて運搬回数を減らす。","options":["イ ロ ハ","イ ロ","イ ハ ニ","ロ ハ ニ","ニ"],"correctIndex":0,"category":"人間工学・作業態様","cluster":"人間工学・作業態様","examLawDate":"2024-04-01","tags":["人間工学・作業態様"],"explanation":{"title":"人間工学・作業態様","point":"台車の扱い、持上げ高さ、履物、荷の分割を人間工学的に判断する。通常は押す方が有利だが、段差越えでは引いて前輪を操作する方法が適する場合がある。","conclusion":"イ・ロ・ハが適切で（1）。ニは一回の荷重を大きくして運搬回数を減らす考えで、腰部負担・急性損傷リスクを高める。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 段差時の引き操作、肩より上を避ける、高摩擦靴はいずれも適切。 | 記載どおり。\n（2） | 誤り | ハも適切。 | イ・ロ・ハ。\n（3） | 誤り | ニが誤り。 | イ・ロ・ハ。\n（4） | 誤り | ニが誤り、イも適切。 | イ・ロ・ハ。\n（5） | 誤り | ニのみでなく、ニ自体が誤り。 | 荷は小分けし、単位重量を減らす。","trap":"","keywords":"自動化・台車／男性体重の約40％／女性はその約60％／荷は身体に近く・肩上回避","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question24/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-25","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":25,"question":"呼吸用保護具に関する次の記述のうち、誤っているものはどれか。","options":["放射性物質による汚染のおそれのある区域内の作業で、オイルミストが混在する場合に使用する防じんマスクのろ過材の種類はＲＬ３である。","有機ガス用防毒マスクの吸収缶は、メタノール、二硫化炭素については、除毒能力試験の試験用ガスに比べて破過時間が長くなる傾向がある。","アンモニア用の直結式防毒マスクは、アンモニアの濃度が1.5％以下の大気中で使用するものである。","吸収缶の破過を知るために、有毒ガス等の臭いに頼ることは、そのばく露限界値にかかわらず、適切ではない。","ハロゲンガス用防毒マスクの吸収缶の色は灰色及び黒色で、二層に分けている。"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"生理・疾病","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"労働衛生管理総論","point":"防じんマスクのろ過材記号、防毒マスクの使用濃度、吸収缶の破過、交換管理、吸収缶の色を問う。破過時間は対象ガスごとに大きく異なる。","conclusion":"（2）が誤り。メタノール、二硫化炭素等は試験用ガスより破過時間が著しく短くなる傾向があり、長くなるのではない。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | オイルミストがあり高性能を要する放射性物質作業ではRL3を選ぶ。R＝オイルミスト可、L3＝高捕集効率。 | 記載どおり。\n（2） | 誤り | メタノール、二硫化炭素は短くなる。 | 試験用ガスより破過時間が著しく短いことがある。\n（3） | 正しい | アンモニア用直結式は一般ガスの直結式より上限が1.5倍となる区分がある。 | 記載どおり。\n（4） | 正しい | 臭覚には個人差・疲労・麻痺があり、交換指標にできない。 | 記載どおり。\n（5） | 正しい | ハロゲンガス用は灰色と黒色の二層表示。 | 記載どおり。","trap":"","keywords":"RL3＝オイルミスト可・高効率／メタノール・CS2は破過短い／臭いに頼らない","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question25/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-26","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":26,"question":"厚生労働省の「石綿使用建築物等解体等業務特別教育規程」における教育の科目及び範囲について、下表のＡ～Ｃに入る語句の組合せとして、正しいものは（１）～（５）のうちどれか。科目範囲石綿の有害性石綿の性状石綿による疾病の病理及び症状Ａ石綿等の使用状況石綿を含有する製品の種類及び用途Ｂ石綿等の粉じんの建築物、工作物又は船舶（鋼製の船舶に限る。）の解体等の発散を抑制する作業の方法Ｃ作業場所の隔離の方法その他石綿等ための措置の粉じんの発散を抑制するための措置について必要な事項保護具の使用方法保護具の種類、性能、使用方法及び管理その他石綿等の労働安全衛生法、労働安全衛生法施行令、労働安全衛生規則ばく露の防止に及び石綿障害予防規則中の関係条項石綿等による健康障害関し必要な事項を防止するため当該業務について必要な事項ＡＢＣ","options":["喫煙の影響事前調査の方法湿潤化の方法","喫煙の影響事前調査の方法局所排気装置等の点検の方法","喫煙の影響分析調査の結果湿潤化の方法","年齢の影響事前調査の方法湿潤化の方法","年齢の影響分析調査の結果局所排気装置等の点検の方法"],"correctIndex":0,"category":"統計・疫学","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"石綿使用建築物等解体等業務の特別教育で、各科目に含むべき範囲を法定規程から選ぶ。表の文言を正確に覚える問題。","conclusion":"Aは喫煙の影響、Bは事前調査の方法、Cは湿潤化の方法で（1）。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 特別教育規程の文言と一致。 | 記載どおり。\n（2） | 誤り | Cは局所排気装置等の点検ではなく湿潤化。 | A喫煙、B事前調査、C湿潤化。\n（3） | 誤り | Bは分析調査の結果ではなく事前調査の方法。 | 同上。\n（4） | 誤り | Aは年齢の影響ではなく喫煙の影響。 | 同上。\n（5） | 誤り | A・B・C全て不一致。 | 同上。","trap":"","keywords":"喫煙の影響／事前調査の方法／湿潤化の方法","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question26/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-27","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":27,"question":"疫学、統計等に関する次のイ～ニの記述について、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　健康管理統計において、「ある時点における有所見者の割合」は動態デ\nータである。\nロ　統計上、二つの事象の間に強い相関が認められても、それらの間に因果\n関係がないことがある。\nハ　疫学において、ある疾病とその原因との関係の仮説をたて、その仮説に\n基づいて、原因のある群とない群に分け、その後追跡調査をして、疾病の発生の相違を調べる調査方法は、前向き調査といわれる。\nニ　ある集団の体重の平均が60kg、標準偏差が５kgで、正規分布をしている\n場合、55～65kgの範囲内にいる人数の割合は、その集団の約95％である。","options":["イ ロ","イ ハ ニ","イ ニ","ロ ハ","ロ ハ ニ"],"correctIndex":3,"category":"統計・疫学","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"静態・動態統計、相関と因果、前向きコホート研究、正規分布の標準偏差を問う。研究デザインと基本統計をセットで整理する。","conclusion":"ロとハが正しく（4）。イはある時点の割合なので静態データ、ニの55～65kgは平均±1SDで約68％である。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | イが誤り、ロは正しい。 | ロ・ハが正しい。\n（2） | 誤り | イ・ニが誤り。 | ロ・ハ。\n（3） | 誤り | イ・ニが誤り。 | ロ・ハ。\n（4） | 正しい | 相関は因果を保証せず、原因あり/なしで追跡するのは前向きコホート。 | 記載どおり。\n（5） | 誤り | ニが誤り。 | 平均±1SDは約68％。","trap":"","keywords":"静態＝ある時点／動態＝一定期間の発生・移動／±1SD 68％、±2SD 95％","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question27/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-28","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["事業場トップは、まず事業場の安全衛生についての目標を設定させ、それを踏まえ、自らの安全衛生に対する姿勢を明確にした安全衛生方針を表明する。","事業場トップは、各級の管理監督者に必要な権限を委任した場合でも、それぞれの業務の履行状況の報告を求めるなどによって事業場の安全衛生管理の実状を把握し、必要な場合には改善などの措置を講じることを指示する。","日常的にＫＹＴ（危険予知訓練）を行う職場では、常日頃から危険要因を見出す訓練が行われ、危険に対する感受性が高まることから、リスクアセスメントの危険性又は有害性の特定がスムーズに行えるようになる。","５Ｓのうちのしつけは、４Ｓ（整理、整頓、清掃、清潔）が全員に徹底され、適切に実行されるようにするための基盤である。","ヒヤリ・ハット活動は、作業中にヒヤリとしたことやハッとしたことを危険情報として活用する安全衛生活動で、当事者の責任を追及するためではなく、危険情報の把握をねらいとしている。"],"correctIndex":0,"category":"安全衛生管理・法令","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["安全衛生管理・法令"],"explanation":{"title":"安全衛生管理・法令","point":"トップマネジメントの順序、KYTとリスクアセスメントの関係、5S、ヒヤリハット活動の目的を問う。方針が上位概念で、目標は方針から展開する。","conclusion":"（1）が不適切。事業場トップはまず安全衛生方針を表明し、その方針を具体化する安全衛生目標を設定する。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 誤り | 方針と目標の順序が逆。 | トップが方針を表明し、それを踏まえて目標を設定する。\n（2） | 正しい | 権限委任後もトップは実施状況を把握し、必要な改善を指示する。 | 記載どおり。\n（3） | 正しい | KYTで危険感受性が高まり、危険性・有害性の特定に役立つ。 | 記載どおり。\n（4） | 正しい | しつけは整理・整頓・清掃・清潔を習慣化する基盤。 | 記載どおり。\n（5） | 正しい | 責任追及でなく、潜在危険情報を共有し再発予防に用いる。 | 記載どおり。","trap":"","keywords":"方針→目標→計画／整理・整頓・清掃・清潔＋しつけ／ヒヤリハットは責任追及しない","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question28/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-29","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」の内容及びこれに基づく労働安全衛生マネジメントシステムの運用に関する次の記述のうち、適切でないものはどれか。","options":["安全衛生計画の実施状況等の日常的な点検とは、安全衛生計画が着実に実施されているかどうか、安全衛生目標は着実に達成されつつあるかどうかなどについて、安全衛生計画の実施事項の担当部門等が、点検を行うことである。","労働安全衛生マネジメントシステムに従って行う措置を適切に実施する体制の整備には、労働者に対して労働安全衛生マネジメントシステムに関する教育を行うことが含まれる。","指針は、事業者が取り組むべき事項を具体的に示すとともに、事業者の取組を国が支援するための事項を示している。","労働災害、事故等が発生した場合におけるこれらの原因の調査並びに問題点の把握及び改善を実施する手順には、いつ、誰が、何をどのようにするか等について定める。","事業場内部の者によるシステム監査は、事業場外部の者によるシステム監査に比べて、監査テーマを特定して、実態を詳しく調査し、評価することができる。"],"correctIndex":2,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"日常点検、教育、指針の目的、事故調査手順、内部監査と外部監査の特徴を問う。OSHMS指針は自主的活動の枠組みで、法定措置を具体的に定めるものではない。","conclusion":"（3）が不適切。指針は事業者が自主的に行うシステムを示すもので、国が事業者の取組を支援するための事項を規定する指針ではない。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | 担当部門等が計画実施・目標達成状況を日常的に点検する。 | 記載どおり。\n（2） | 正しい | 体制整備には労働者へのOSHMS教育も含む。 | 記載どおり。\n（3） | 誤り | 国の支援事項を示す指針ではない。 | 事業者の自主的かつ継続的な安全衛生活動の仕組みを示す。\n（4） | 正しい | 手順は時期、担当、対象、方法等を明確にする。 | 記載どおり。\n（5） | 正しい | 内部監査は事情に精通し、特定テーマを深掘りしやすい。外部監査は独立性・客観性に利点。 | 記載どおり。","trap":"","keywords":"方針→目標→計画→実施→点検・監査→見直し／自主的活動／法令遵守は前提","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question29/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"general-2024-30","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":30,"question":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、適切でないものはどれか。","options":["化学物質管理者を選任し、リスクアセスメント及びリスク低減措置に関する技術的事項を管理させる。","リスクアセスメント対象物の安全データシート（ＳＤＳ）を入手した場合には、ＳＤＳに記載されている情報を確認することにより、危険性又は有害性を特定する。","リスクアセスメント対象物による疾病のリスクの低減措置の検討においては、法令に定められた事項を行うことを前提として、リスクアセスメント対象物に係る機械設備等の密閉化を最優先とする。","リスクアセスメント対象物の「ばく露の程度」及び「有害性の程度」を考慮して行うリスクの見積りでは、ばく露の程度の把握に関し、気中濃度を実測する方法のほか、数理モデルを用いて推定する方法がある。","毎回異なる環境で作業を行う場合のリスクアセスメントの方法として、典型的な作業でのばく露濃度測定結果を基にリスク低減措置マニュアル等を作成し、これに定められた措置の実施状況を確認する方法がある。（終り）"],"correctIndex":2,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"統計・疫学","point":"化学物質管理者、SDSによる有害性特定、リスク低減措置の優先順位、実測・モデル推定、変動作業への適用を問う。密閉化より上位に「除去・中止・低有害物質への代替」がある。","conclusion":"（3）が不適切。法令事項を実施した上で、まず危険有害性の除去・使用中止・より低い物質への代替を検討し、その後に密閉化・局排等の工学的対策を検討する。","choicesExplain":"肢 | 判定 | 理由 | 正しく直すと\n（1） | 正しい | リスクアセスメント対象物の製造・取扱事業場では化学物質管理者を選任し技術的事項を管理。 | 記載どおり。\n（2） | 正しい | SDSの分類、危険有害性情報、ばく露限界等から危険性・有害性を特定する。 | 記載どおり。\n（3） | 誤り | 密閉化が最優先ではなく、除去・中止・代替が上位。 | ①除去・代替、②工学的対策、③管理的対策、④個人用保護具の順で検討する。\n（4） | 正しい | 濃度実測のほか、CREATE-SIMPLE等の数理モデル・推定法も用い得る。 | 記載どおり。\n（5） | 正しい | 典型作業の測定と標準手順・マニュアルで、毎回変動する作業を管理する方法がある。 | 記載どおり。","trap":"","keywords":"除去・代替→工学的→管理的→保護具／ハザード×ばく露＝リスク／SDS・実測・モデル","related":"","current":"【出題当時】当該年度の法令・統計・指針で判定する。\n【現在】後年の制度改正があり得るため、下の同問解説と e-Gov／厚生労働省の一次資料で現行規定を分けて確認する。","evidence":"安全衛生技術試験協会の公表過去問・公表正答を基礎に、e-Gov法令検索、厚生労働省資料等で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question30/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-01","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":1,"question":"常時300人の労働者を使用する造船業の事業場における安全衛生管理体制に関する次の文中のＡ～Ｃに入る語句又は数値の組合せとして、労働安全衛生法令上、正しいものは（１）～（５）のうちどれか。事業者は、Ａを選任し、その者に安全管理者、衛生管理者又は法令の規定により技術的な事項を管理する者の指揮をさせるとともに、所定の業務を統括管理させなければならない。また、Ａの選任は、Ａを選任すべき事由が発生した日からＢ日以内に行わなければならない。また、事業者は、安全委員会及び衛生委員会又はこれらに代えて安全衛生委員会を設置しなければならず、衛生委員会又は安全衛生委員会の委員は、Ｃのうちから事業者が指名した者を含めて構成しなければならない。ＡＢＣ","options":["総括安全衛生管理者14衛生管理者","総括安全衛生管理者14作業環境測定士","総括安全衛生管理者30作業環境測定士","統括安全衛生責任者14作業環境測定士","統括安全衛生責任者30衛生管理者"],"correctIndex":0,"category":"作業環境測定・換気","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"作業環境測定・換気","point":"作業環境測定では、単位作業場所、A測定・B測定、 n　原文：潜水器\nホ　正しい：記述どおり。\n　原文：工業用のガンマ線照射装置\n\n【組合せ肢の確認】\n（1）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ニ ホ：正答。求められた記述の集合と一致する。\n（4）ロ ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／規格・安全装置の具備が必要なのは、アンモニア用防毒マスク、潜水器、工業用ガンマ線照射装置である。保護具・装置ごとに、規格適合、型式検定、個別検定、定期自主検査のどれが掛かるかを分ける。\n数値チェック：１、５","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question02/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-03","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":3,"question":"労働者に危険又は健康障害を生ずるおそれのある物であって、譲渡し、又は提供する者が、その相手方に対して、文書の交付等の方法により名称、成分及び含有量その他所定の事項を通知しなければならないもの（以下「通知対象物」という。）に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、主として一般消費者の生活の用に供される製品として通知対象物を譲渡し、又は提供する場合ではないものとする。また、ロにおいて、有機溶剤とは、労働安全衛生法施行令別表第６の２に掲げる有機溶剤をいうものとする。\nイ　通知対象物を譲渡し、又は提供する者は、その相手方に所定の事項を\n通知する方法として、当該相手方の承諾を得ることなく、文書の交付に代えて、当該事項が記載されたホームページのアドレス及び当該アドレスに係るホームページの閲覧を求める旨の伝達とすることができる。\nロ　通知対象物を譲渡し、又は提供する者は、通知対象物のうち、有機溶\n剤の成分の含有量の通知を行うときは、重量パーセントの通知を、10パーセント未満の端数を切り捨てた数値と当該端数を切り上げた数値との範囲をもって行うことができる。\nハ　通知対象物を譲渡し、又は提供する者は、当該通知対象物の人体に及\nぼす作用について、直近の確認を行った日から起算して５年以内ごとに１回、最新の科学的知見に基づき、変更を行う必要性の有無を確認し、変更を行う必要があると認めるときは、当該確認をした日から１年以内に、当該事項に変更を行わなければならない。\nニ　通知対象物を製造し、又は取り扱う設備（移動式以外のものに限る。）\nの改造、修理、清掃等で、当該設備の内部に立ち入る作業に係る仕事の注文者（その仕事を他の者から請け負わないで注文している者に限る。）は、当該通知対象物の危険性及び有害性、当該仕事の作業において注意すべき安全又は衛生に関する事項等所定の事項を記載した文書を作成し、これをその請負人に交付しなければならない。","options":["イ ロ ハ ニ","イ ロ","イ ハ ニ","ロ ニ","ハ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。正しいのはイ・ハ・ニ。SDS情報は一定の電子的方法で提供でき、人体作用は5年以内ごとに見直し、変更が必要なら1年以内に更新する。設備内部作業の注文者には危険有害性等の文書交付義務がある。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：通知対象物を譲渡し、又は提供する者は、その相手方に所定の事項を 通知する方法として、当該相手方の承諾を得ることなく、文書の交付に代えて、当該事項が記載されたホームページのアドレス及び当該アドレスに係るホームページの閲覧を求める旨の伝達とすることができる。\nロ　誤り：有機溶剤成分の含有量は、任意に10％幅へ丸めて通知できるわけではない。SDSの含有量表示ルールに従う。\n　原文：通知対象物を譲渡し、又は提供する者は、通知対象物のうち、有機溶 剤の成分の含有量の通知を行うときは、重量パーセントの通知を、10パーセント未満の端数を切り捨てた数値と当該端数を切り上げた数値との範囲をもって行うことができる。\nハ　正しい：記述どおり。\n　原文：通知対象物を譲渡し、又は提供する者は、当該通知対象物の人体に及 ぼす作用について、直近の確認を行った日から起算して５年以内ごとに１回、最新の科学的知見に基づき、変更を行う必要性の有無を確認し、変更を行う必要があると認めるときは、当該確認をした日から１年以内に、当該事項に変更を行わなければならない。\nニ　正しい：記述どおり。\n　原文：通知対象物を製造し、又は取り扱う設備（移動式以外のものに限る。） の改造、修理、清掃等で、当該設備の内部に立ち入る作業に係る仕事の注文者（その仕事を他の者から請け負わないで注文している者に限る。）は、当該通知対象物の危険性及び有害性、当該仕事の作業において注意すべき安全又は衛生に関する事項等所定の事項を記載した文書を作成し、これをその請負人に交付しなければならない。\n\n【組合せ肢の確認】\n（1）イ ロ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ロ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ハ ニ：正答。求められた記述の集合と一致する。\n（4）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／正しいのはイ・ハ・ニ。SDS情報は一定の電子的方法で提供でき、人体作用は5年以内ごとに見直し、変更が必要なら1年以内に更新する。設備内部作業の注文者には危険有害性等の文書交付義務がある。\n数値チェック：１、５、６、２、10、５年、１回、１年、5年、1年","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question03/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-04","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":4,"question":"労働安全衛生法令に基づく健康診断のうち、労働者に対しその業務内容にかかわらず実施する健康診断（以下「一般健康診断」という。）に関する次の記述のうち、労働安全衛生法令上、正しいものはどれか。","options":["常時50人以上の労働者を使用する事業者は、一般健康診断を行わなければならないが、常時使用する労働者の数が50人未満の場合であっても、事業者は同様の健康診断を実施するよう努めなければならない。","一般健康診断は、所定の項目について実施しなければならないが、あらかじめ対象労働者の同意を得た場合には一部の項目を省略することができる。","事業者は、一般健康診断の結果、特に健康の保持に努める必要があると認められる労働者に対し、医師又は保健師による保健指導を行うよう努めなければならない。","事業者は、事業者の指定した医師が行う一般健康診断を受診していない労働者を業務に従事させる場合には、遅滞なく、所轄労働基準監督署長に届け出なければならない。","事業者は、一般健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は当該事業場の労働者の過半数で組織する労働組合への報告その他の適切な措置を講じなければならない。"],"correctIndex":2,"category":"健康管理・健康診断","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["健康管理・健康診断"],"explanation":{"title":"健康管理・健康診断","point":"健康診断は、対象者、実施時期、一次・二次項目、結果通知、医師意見、事後措置、記録保存、監督署報告を順に確認する。一般健診、特殊健診、じん肺健診、面接指導、ストレスチェックは別制度である。","conclusion":"正答は（3）です。一般健康診断後、特に健康保持に努める必要がある労働者には、医師又は保健師による保健指導を行うよう努める。健診義務は50人以上に限られず、項目省略は本人同意では決まらない。","choicesExplain":"（1）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　常時50人以上の労働者を使用する事業者は、一般健康診断を行わなければならないが、常時使用する労働者の数が50人未満の場合であっても、事業者は同様の健康診断を実施するよう努めなければならない。\n\n（2）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　一般健康診断は、所定の項目について実施しなければならないが、あらかじめ対象労働者の同意を得た場合には一部の項目を省略することができる。\n\n（3）正しい：特に健康保持に努める必要がある者への保健指導は努力義務として規定される。\n　事業者は、一般健康診断の結果、特に健康の保持に努める必要があると認められる労働者に対し、医師又は保健師による保健指導を行うよう努めなければならない。\n\n（4）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　事業者は、事業者の指定した医師が行う一般健康診断を受診していない労働者を業務に従事させる場合には、遅滞なく、所轄労働基準監督署長に届け出なければならない。\n\n（5）誤り：誤り。記述中の対象、数値、主体、頻度又は分類が基準と一致しない。\n　事業者は、一般健康診断の結果に基づく医師の意見を勘案し、その必要があると認めるときは、労働者の実情を考慮して、就業場所の変更等の措置を講ずるほか、当該医師の意見の衛生委員会若しくは安全衛生委員会又は当該事業場の労働者の過半数で組織する労働組合への報告その他の適切な措置を講じなければならない。","trap":"健診項目の省略は、本人同意ではなく法令上の基準と医師判断による。医師意見聴取と本人への結果通知は別手続である。","keywords":"正答（3）／一般健康診断後、特に健康保持に努める必要がある労働者には、医師又は保健師による保健指導を行うよう努める。健診義務は50人以上に限られず、項目省略は本人同意では決まらない。\n数値チェック：50人","related":"健康診断は、対象者、実施時期、一次・二次項目、結果通知、医師意見、事後措置、記録保存、監督署報告を順に確認する。一般健診、特殊健診、じん肺健診、面接指導、ストレスチェックは別制度である。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question04/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-05","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":5,"question":"労働安全衛生法令に基づき事業者が行わなければならない作業環境測定等に関する次のイ～ホの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　金属アーク溶接等作業を行う屋内作業場について、当該金属アーク溶\n接等作業に従事する労働者の身体に装着する試料採取機器等を用いて行う測定により、６か月以内ごとに１回、空気中の溶接ヒュームの濃度を測定しなければならない。\nロ　地下室の内部において、吹付けによる第三種有機溶剤等に係る有機溶\n剤業務に労働者を従事させるときは、当該作業場について、６か月以内ごとに１回、定期に、当該有機溶剤の濃度を測定しなければならない。\nハ　廃棄物の焼却施設に設置された廃棄物焼却炉、集じん機等の設備の保\n守点検等の業務を行う作業場について、６か月以内ごとに１回、定期に、当該作業場における空気中のダイオキシン類の濃度を測定しなければならない。\nニ　労働者を常時就業させる室で、事務所衛生基準規則の適用のあるもの\nの建築を行ったときは、当該室におけるホルムアルデヒドの量について、当該建築を完了し、当該室の使用を開始した日以後最初に到来する６月から９月までの期間に１回、測定しなければならない。\nホ　陶磁器、レンガ等を焼成する業務を行う屋内作業場について、１か月\n以内ごとに１回、定期に、当該屋内作業場における気温、湿度及び輻射熱を測定しなければならない。","options":["イ ロ ハ","イ ハ ニ","イ ニ ホ","ロ ホ","ハ ニ"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（5）です。正しいのはダイオキシン類の定期測定と、事務所の新築・改築後に行うホルムアルデヒド測定。溶接ヒューム測定は作業方法の新規採用・変更時等の個人ばく露測定で、単純な6か月定期測定ではない。","choicesExplain":"【記述ごとの判定】\nイ　誤り：溶接ヒューム測定は6か月ごとの定期測定ではなく、作業方法の新規採用・変更時等に行う個人ばく露測定である。\n　原文：金属アーク溶接等作業を行う屋内作業場について、当該金属アーク溶 接等作業に従事する労働者の身体に装着する試料採取機器等を用いて行う測定により、６か月以内ごとに１回、空気中の溶接ヒュームの濃度を測定しなければならない。\nロ　誤り：第三種有機溶剤であっても、場所・業務条件を踏まえた規定であり、本記述の一律6か月測定は正しくない。\n　原文：地下室の内部において、吹付けによる第三種有機溶剤等に係る有機溶 剤業務に労働者を従事させるときは、当該作業場について、６か月以内ごとに１回、定期に、当該有機溶剤の濃度を測定しなければならない。\nハ　正しい：記述どおり。\n　原文：廃棄物の焼却施設に設置された廃棄物焼却炉、集じん機等の設備の保 守点検等の業務を行う作業場について、６か月以内ごとに１回、定期に、当該作業場における空気中のダイオキシン類の濃度を測定しなければならない。\nニ　正しい：記述どおり。\n　原文：労働者を常時就業させる室で、事務所衛生基準規則の適用のあるもの の建築を行ったときは、当該室におけるホルムアルデヒドの量について、当該建築を完了し、当該室の使用を開始した日以後最初に到来する６月から９月までの期間に１回、測定しなければならない。\nホ　誤り：気温・湿度・輻射熱の測定を1か月ごととする一般規定ではない。\n　原文：陶磁器、レンガ等を焼成する業務を行う屋内作業場について、１か月 以内ごとに１回、定期に、当該屋内作業場における気温、湿度及び輻射熱を測定しなければならない。\n\n【組合せ肢の確認】\n（1）イ ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ニ：正答。求められた記述の集合と一致する。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（5）／正しいのはダイオキシン類の定期測定と、事務所の新築・改築後に行うホルムアルデヒド測定。溶接ヒューム測定は作業方法の新規採用・変更時等の個人ばく露測定で、単純な6か月定期測定ではない。\n数値チェック：１、５、６、１回、６月、９月、6","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question05/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-06","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":6,"question":"労働安全衛生法令に基づく免許に関する次のイ～ニの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　事業者は、潜水作業者への送気の調節を行うためのバルブ又はコック\nを操作する業務については、潜水士免許を受けた者でなければ、就かせてはならない。\nロ　事業者は、医師、歯科医師及び労働衛生コンサルタントについては、\n第一種衛生管理者免許を受けていない者であっても、衛生管理者として選任することができる。\nハ　満20歳に満たない者は、エックス線作業主任者免許を受けることがで\nきない。\nニ　高圧室内作業主任者がその職務に従事するときは、高圧室内作業主任\n者免許証その他その資格を証する書面を携帯していなければならない。","options":["イ ハ ニ","イ ニ","ロ ハ","ロ ニ","ロ"],"correctIndex":4,"category":"物理的因子","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（5）です。医師、歯科医師、労働衛生コンサルタントは、第一種衛生管理者免許がなくても衛生管理者に選任できる。送気調節業務は潜水士免許の対象そのものではなく、免許年齢・携帯義務も条文を確認する。","choicesExplain":"【記述ごとの判定】\nイ　誤り：送気調節バルブ等の操作は潜水士免許そのものの就業制限業務ではない。\n　原文：事業者は、潜水作業者への送気の調節を行うためのバルブ又はコック を操作する業務については、潜水士免許を受けた者でなければ、就かせてはならない。\nハ　誤り：免許交付の年齢要件を20歳未満一律不可とするのは誤り。\n　原文：満20歳に満たない者は、エックス線作業主任者免許を受けることがで きない。\nニ　誤り：主任者が職務中に免許証を常時携帯するとの一般的義務ではない。\n　原文：高圧室内作業主任者がその職務に従事するときは、高圧室内作業主任 者免許証その他その資格を証する書面を携帯していなければならない。\nロ　正しい：記述どおり。\n　原文：事業者は、医師、歯科医師及び労働衛生コンサルタントについては、 第一種衛生管理者免許を受けていない者であっても、衛生管理者として選任することができる。\n\n【組合せ肢の確認】\n（1）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ：正答。求められた記述の集合と一致する。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（5）／医師、歯科医師、労働衛生コンサルタントは、第一種衛生管理者免許がなくても衛生管理者に選任できる。送気調節業務は潜水士免許の対象そのものではなく、免許年齢・携帯義務も条文を確認する。\n数値チェック：１、５、20","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question06/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-07","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":7,"question":"次のイ～ニの機械等のうち、設置しようとするとき、労働安全衛生法令に基づき、その計画を所轄労働基準監督署長に届け出なければならないもののみを全て挙げたものは（１）～（５）のうちどれか。ただし、所轄労働基準監督署長による計画の届出の免除認定を受けていないものとする。\nイ　石綿等の粉じんが発散する屋内作業場に設ける発散抑制の設備\nロ　事務所に設置される空気調和設備で中央管理方式のもの\nハ　ダイオキシン類を発生するおそれのある廃棄物の焼却施設に設置する\n廃棄物焼却炉\nニ　塩酸を含有する排液を中和方式により処理する排液処理装置","options":["イ ロ ハ ニ","イ ロ ハ","イ ロ ニ","イ ハ ニ","ロ ニ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。届出対象は、石綿粉じん発散抑制設備、中央管理方式の空気調和設備、塩酸排液の中和処理装置。設備届は原則として工事開始30日前までに所轄労基署長へ提出する。","choicesExplain":"【記述ごとの判定】\nイ　正しい：記述どおり。\n　原文：石綿等の粉じんが発散する屋内作業場に設ける発散抑制の設備\nロ　正しい：記述どおり。\n　原文：事務所に設置される空気調和設備で中央管理方式のもの\nハ　誤り：誤り。主体・数値・対象又は分類を正しい規定に置き換える。\n　原文：ダイオキシン類を発生するおそれのある廃棄物の焼却施設に設置する 廃棄物焼却炉\nニ　正しい：記述どおり。\n　原文：塩酸を含有する排液を中和方式により処理する排液処理装置\n\n【組合せ肢の確認】\n（1）イ ロ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）イ ロ ニ：正答。求められた記述の集合と一致する。\n（4）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／届出対象は、石綿粉じん発散抑制設備、中央管理方式の空気調和設備、塩酸排液の中和処理装置。設備届は原則として工事開始30日前までに所轄労基署長へ提出する。\n数値チェック：１、５、30日","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question07/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-08","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":8,"question":"労働安全衛生規則の衛生基準に関する次のイ～ホの記述について、労働安全衛生法令上、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　事業者は、強烈な騒音を発する場所において、業務の一部を請負人に\n請け負わせるときは、当該業務を行う労働者と請負人に使用させるために必要な数の耳栓その他の保護具を備えなければならない。\nロ　事業者は、高温による健康障害を防止するために必要な措置を講じて\n人命救助又は危害防止に関する作業をさせるときを除き、坑内における気温は28度以下としなければならない。\nハ　事業者は、有害な光線又は超音波にさらされる場所には、関係者以外\nの者が立ち入ることを禁止しなければならない。\nニ　事業者は、労働者を屋外で就業させる場合には、塩及び労働者の飲用\nに供する水その他の飲料を、十分供給するようにしなければならない。\nホ　同時に就業する労働者の数が常時10人以内である事業場においては、\n四方を壁等で囲まれた一個の便房により構成される独立個室型の便所を１か所設ければ、男性用、女性用に区別した便所を設ける必要はない。","options":["イ ロ ハ","イ ハ ニ","ロ ニ ホ","ロ ホ","ハ ホ"],"correctIndex":4,"category":"物理的因子","cluster":"騒音・振動","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"物理的因子","point":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","conclusion":"正答は（5）です。正しいのは、有害光線・超音波の場所への関係者以外の立入禁止と、常時10人以内の事業場における独立個室型便所の特例。塩・飲料水は「屋外就業一般」ではなく多量発汗作業等の要件で判断する。","choicesExplain":"【記述ごとの判定】\nイ　誤り：元方事業者等の請負関係規定と、事業者が自ら使用する労働者へ備える保護具の規定を分ける。\n　原文：事業者は、強烈な騒音を発する場所において、業務の一部を請負人に 請け負わせるときは、当該業務を行う労働者と請負人に使用させるために必要な数の耳栓その他の保護具を備えなければならない。\nロ　誤り：坑内気温を常に28℃以下とする規定ではない。\n　原文：事業者は、高温による健康障害を防止するために必要な措置を講じて 人命救助又は危害防止に関する作業をさせるときを除き、坑内における気温は28度以下としなければならない。\nハ　正しい：記述どおり。\n　原文：事業者は、有害な光線又は超音波にさらされる場所には、関係者以外 の者が立ち入ることを禁止しなければならない。\nニ　誤り：屋外就業一般ではなく、多量発汗作業等で塩・飲料水を備える。\n　原文：事業者は、労働者を屋外で就業させる場合には、塩及び労働者の飲用 に供する水その他の飲料を、十分供給するようにしなければならない。\nホ　正しい：記述どおり。\n　原文：同時に就業する労働者の数が常時10人以内である事業場においては、 四方を壁等で囲まれた一個の便房により構成される独立個室型の便所を１か所設ければ、男性用、女性用に区別した便所を設ける必要はない。\n\n【組合せ肢の確認】\n（1）イ ロ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ニ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（4）ロ ホ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ホ：正答。求められた記述の集合と一致する。","trap":"「発生時」「潜降時」「浮上時」など時間軸を読む。単位（dB、mSv、kPa、％）と測定対象を入れ替えない。","keywords":"正答（5）／正しいのは、有害光線・超音波の場所への関係者以外の立入禁止と、常時10人以内の事業場における独立個室型便所の特例。塩・飲料水は「屋外就業一般」ではなく多量発汗作業等の要件で判断する。\n数値チェック：１、５、28、10人","related":"物理的因子は、因子→生体影響→測定指標→基準値→低減措置の順で覚える。騒音は内耳、振動は末梢循環・末梢神経・運動器、赤外線は熱作用・水晶体、電離放射線は実効線量と組織別等価線量が中心となる。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question08/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-09","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":9,"question":"有機溶剤中毒予防規則に関する次のイ～ニの記述について、労働安全衛生法令上、正しいものの組合せは（１）～（５）のうちどれか。ただし、有機溶剤中毒予防規則に定める適用の除外及び設備の特例はないものとする。\nイ　屋内作業場において第二種有機溶剤等に係る有機溶剤業務を行う作業\n場所に設置する上方吸引型の外付け式フードの局所排気装置は、0.5メートル／秒の制御風速を出し得る能力を有するものでなければならない。\nロ　事業者は、作業環境測定の評価の結果、第三管理区分に区分された場\n所については、直ちに、施設、作業方法等の点検を行い、その結果に基づき、作業環境を改善するため必要な措置を講じ、当該場所の管理区分が第一管理区分又は第二管理区分となるようにしなければならない。\nハ　事業者は、ずい道の内部において第三種有機溶剤等を用いて行う有機\n溶剤業務に常時従事する労働者に対し、６か月以内ごとに１回、定期に、所定の項目について医師による健康診断を行わなければならない。\nニ　事業者は、有機溶剤等を入れたことのあるタンクで有機溶剤の蒸気の\n発散するおそれがあるものの内部における業務に労働者を従事させるときは、当該業務に従事する労働者に、有機ガス用の防毒機能を有する電動ファン付き呼吸用保護具を使用させなければならない。","options":["イ ハ","イ ニ","ロ ハ","ロ ニ","ハ ニ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（3）です。第三管理区分では点検・改善措置を行い、第一又は第二管理区分となるようにする。ずい道内の第三種有機溶剤業務の常時従事者には6か月以内ごとの健診が必要。上方吸引型外付け式フードの制御風速は0.5 m/sではない。","choicesExplain":"【記述ごとの判定】\nイ　誤り：上方吸引型外付け式フードは0.5 m/sではなく、上方吸引に対応する制御風速を用いる。\n　原文：屋内作業場において第二種有機溶剤等に係る有機溶剤業務を行う作業 場所に設置する上方吸引型の外付け式フードの局所排気装置は、0.5メートル／秒の制御風速を出し得る能力を有するものでなければならない。\nハ　正しい：記述どおり。\n　原文：事業者は、ずい道の内部において第三種有機溶剤等を用いて行う有機 溶剤業務に常時従事する労働者に対し、６か月以内ごとに１回、定期に、所定の項目について医師による健康診断を行わなければならない。\nニ　誤り：酸素欠乏や高濃度のおそれがあるタンク内部では、電動ファン付き防毒機能だけでは不十分で、給気式等を用いる。\n　原文：事業者は、有機溶剤等を入れたことのあるタンクで有機溶剤の蒸気の 発散するおそれがあるものの内部における業務に労働者を従事させるときは、当該業務に従事する労働者に、有機ガス用の防毒機能を有する電動ファン付き呼吸用保護具を使用させなければならない。\nロ　正しい：記述どおり。\n　原文：事業者は、作業環境測定の評価の結果、第三管理区分に区分された場 所については、直ちに、施設、作業方法等の点検を行い、その結果に基づき、作業環境を改善するため必要な措置を講じ、当該場所の管理区分が第一管理区分又は第二管理区分となるようにしなければならない。\n\n【組合せ肢の確認】\n（1）イ ハ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（2）イ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（3）ロ ハ：正答。求められた記述の集合と一致する。\n（4）ロ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。\n（5）ハ ニ：不正解。判定が逆の記述を含むか、必要な記述が欠ける。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（3）／第三管理区分では点検・改善措置を行い、第一又は第二管理区分となるようにする。ずい道内の第三種有機溶剤業務の常時従事者には6か月以内ごとの健診が必要。上方吸引型外付け式フードの制御風速は0.5 m/sではない。\n数値チェック：１、５、0.5、６、１回、6、0.5 m/s","related":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","current":"過去問の正誤は、原則として当該試験年度の4月1日時点の法令・制度で判定する。現在の実務では、最新のe-Gov法令検索、厚生労働省通知、改正省令の施行日を確認する。","evidence":"公式問題・正答は安全衛生技術試験協会、法令本文はe-Gov、通知・指針・統計は厚生労働省・都道府県労働局の資料で確認する。"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question09/","sourceType":"公表過去問＋濃厚解説データ","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"濃厚"},{"id":"law-2024-10","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":10,"question":"鉛中毒予防のため事業者が講ずべき措置に関する次の記述のうち、労働安全衛生法令上、違反となるものはどれか。ただし、鉛業務は遠隔操作によって行う隔離室におけるものではなく、また、鉛中毒予防規則に定める適用の除外及び設備の特例はないものとする。","options":["鉛化合物を含有する釉薬を用いて行う施釉又は当該施釉を行った物の焼成の業務（臨時に行う業務を除く。）を行う屋内作業場について、１年以内ごとに１回、定期に、空気中における鉛の濃度を測定していない。","屋内作業場で自然換気が不十分な場所におけるはんだ付けの業務に労働者を従事させるとき、当該業務を行う作業場所に、全体換気装置を設けているが、局所排気装置又はプッシュプル型換気装置のいずれも設けていない。","鉛ライニングの業務に常時従事する労働者に対する医師による特別の項目についての健康診断（６か月以内ごとに１回、定期に行うものに限る。以下「健康診断」という。）について、前回の健康診断において血液中の鉛の量の検査及び尿中のデルタアミノレブリン酸の量の検査を受けた者については、医師が必要でないと認めるときは、当該検査を省略している。","鉛化合物を製造する工程において、鉛等の鋳造を行う鉛業務に労働者を従事させるとき、当該業務を行う屋内の作業場所に有効な局所排気装置を設け、これを稼働させているが、当該労働者に有効な呼吸用保護具を使用させていない。","電線又はケーブルを製造する工程における鉛の溶融の業務に労働者を従事させるとき、鉛の溶融を行う屋内の作業場所にプッシュプル型換気装置を設けているが、当該換気装置に、ろ過除じん方式の除じん装置又はこれと同等以上の性能を有する除じん装置を設けていない。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質・毒性","point":"化学物質問題は、①物質・作業、②ばく露経路、③標的臓器・症状、④設備・測定、⑤健康診断、⑥記録保存の順で整理する。ハザードとリスク、管理濃度とばく露限界、作業環境測定と個人ばく露測定を混同しない。","conclusion":"正答は（4）です。違反となるのは、鉛等の鋳造作業で局所排気装置だけを設け、必要な呼吸用保護具を使用させていない場合。設備対策があっても、条文が保護具使用を重ねて要求する作業では両方が必要となる。","choicesExplain":"（1）正しい：記述どおり。設問の基準・定義に合致する。\n　鉛化合物を含有する釉薬を用いて行う施釉又は当該施釉を行った物の焼成の業務（臨時に行う業務を除く。）を行う屋内作業場について、１年以内ごとに１回、定期に、空気中における鉛の濃度を測定していない。\n\n（2）正しい：記述どおり。設問の基準・定義に合致する。\n　屋内作業場で自然換気が不十分な場所におけるはんだ付けの業務に労働者を従事させるとき、当該業務を行う作業場所に、全体換気装置を設けているが、局所排気装置又はプッシュプル型換気装置のいずれも設けていない。\n\n（3）正しい：記述どおり。設問の基準・定義に合致する。\n　鉛ライニングの業務に常時従事する労働者に対する医師による特別の項目についての健康診断（６か月以内ごとに１回、定期に行うものに限る。以下「健康診断」という。）について、前回の健康診断において血液中の鉛の量の検査及び尿中のデルタアミノレブリン酸の量の検査を受けた者については、医師が必要でないと認めるときは、当該検査を省略している。\n\n（4）誤り：鉛等の鋳造作業では、局所排気装置に加えて有効な呼吸用保護具の使用が必要なため違反。\n　鉛化合物を製造する工程において、鉛等の鋳造を行う鉛業務に労働者を従事させるとき、当該業務を行う屋内の作業場所に有効な局所排気装置を設け、これを稼働させているが、当該労働者に有効な呼吸用保護具を使用させていない。\n\n（5）正しい：記述どおり。設問の基準・定義に合致する。\n　電線又はケーブルを製造する工程における鉛の溶融の業務に労働者を従事させるとき、鉛の溶融を行う屋内の作業場所にプッシュプル型換気装置を設けているが、当該換気装置に、ろ過除じん方式の除じん装置又はこれと同等以上の性能を有する除じん装置を設けていない。","trap":"有害性が高いことと、実際のリスクが高いことは同義ではない。設備対策より先に除去・代替を検討し、保護具だけで管理を完結させない。","keywords":"正答（4）／違反となるのは、鉛等の鋳造作業で局所排気装置だけを設け、必
