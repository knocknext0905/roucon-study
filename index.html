/list/dl/r04-46-50_gaikyo.pdf"},{"label":"第14次労働災害防止計画","url":"https://www.mhlw.go.jp/content/11200000/001116307.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question03/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question03/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-04","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":4,"question":"有害物の性状、測定等に関する次のイ～ホの記述について、誤っているものの組合せは（１）～（５）のうちどれか。\nイ　環境空気中の有害物質の濃度の分布は、一般に、正規分布に従う。\nロ　1,4-ジオキサンは、脂溶性と水溶性の双方を有している。\nハ　アセトンは、トルエンより極性が大きい。\nニ　空気中の有機溶剤の体積分率0.5％は、5000ppmに相当する。\nホ　粉じんの相対沈降径は、光学的観察による粉じん粒径の測定により求め\nる。","options":["イ ハ","イ ホ","ロ ニ","ロ ハ","ニ ホ"],"correctIndex":1,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"有害物質の性状・粒径","point":"作業場の有害物濃度は、発散源との距離や気流の影響で低値が多く高値側に裾を引くため、一般に対数正規分布として扱います。1,4-ジオキサンは水にも有機溶媒にもなじみ、アセトンはトルエンより極性が大きい物質です。0.5％は0.005で、ppmでは5,000 ppmです。相対沈降径は、同じ終末沈降速度をもつ単位密度球の径で表す概念で、単純な光学観察径ではありません。","conclusion":"正答（2）：イ・ホが誤り。","choicesExplain":"（1）— 非正答肢\n　イ ハ\n\n（2）◎ 公式公表正答\n　イ ホ\n\n（3）— 非正答肢\n　ロ ニ\n\n（4）— 非正答肢\n　ロ ハ\n\n（5）— 非正答肢\n　ニ ホ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"作業環境評価基準","url":"https://www.mhlw.go.jp/web/t_doc?dataId=74088000"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question04/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question04/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-05","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":5,"question":"石綿に関する次の記述のうち、誤っているものはどれか。","options":["クロシドライトは、これまでに使用されてきた石綿の９割以上を占める。","石綿繊維は極めて細いため、長さ数十μmの石綿繊維が肺内に検出されることも少なくない。","石綿関連疾患には、石綿肺、肺がん、中皮腫、良性石綿胸水が含まれる。","石綿ばく露によって生じる肺がんの発生部位、病理組織型は、通常の肺がんと差異はない。","胸膜プラークや、肺組織中の石綿小体は、過去の石綿ばく露の指標となる。"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"石綿の種類と関連疾患","point":"わが国で多く使用された石綿は白石綿のクリソタイルで、使用量の9割以上を占めました。クロシドライト（青石綿）は中皮腫リスクが高い種類ですが、使用量の大半という記述は誤りです。石綿関連疾患には石綿肺、肺がん、中皮腫、良性石綿胸水等があり、胸膜プラークや石綿小体は過去のばく露の指標になります。","conclusion":"正答（1）：使用量の大半はクリソタイルであり、クロシドライトではない。","choicesExplain":"（1）◎ 公式公表正答\n　クロシドライトは、これまでに使用されてきた石綿の９割以上を占める。\n\n（2）— 非正答肢\n　石綿繊維は極めて細いため、長さ数十μmの石綿繊維が肺内に検出されることも少なくない。\n\n（3）— 非正答肢\n　石綿関連疾患には、石綿肺、肺がん、中皮腫、良性石綿胸水が含まれる。\n\n（4）— 非正答肢\n　石綿ばく露によって生じる肺がんの発生部位、病理組織型は、通常の肺がんと差異はない。\n\n（5）— 非正答肢\n　胸膜プラークや、肺組織中の石綿小体は、過去の石綿ばく露の指標となる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：石綿に関するQ&A","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/sekimen/topics/tp050729-1.html"},{"label":"石綿障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/417M60000100021?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question05/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question05/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-06","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":6,"question":"けい肺症に関する次の記述のうち、適切でないものはどれか。","options":["遊離結晶性シリカの吸入により生じる。","採石場労働者、石切り工、研磨作業員、ガラス職人に多い。","肺結核及び非結核性肺抗酸菌症を発症するリスクが高い。","急性けい肺症は、短期間（数か月～数年）の多量の原因物質ばく露により引き起こされる。","胸部エックス線写真で下肺野に線状影が多く見られる。"],"correctIndex":4,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"けい肺症","point":"けい肺は遊離結晶性シリカの吸入によるじん肺で、採石、石切り、研磨、鋳物・ガラス関連などにみられます。慢性型では胸部X線上、上肺野優位の小円形陰影が典型で、進行すると大陰影を形成します。肺結核や非結核性抗酸菌症の合併リスクが高く、短期間の高濃度ばく露では急性けい肺が生じます。","conclusion":"正答（5）：典型的には上肺野優位の小結節影であり、下肺野の線状影ではない。","choicesExplain":"（1）— 非正答肢\n　遊離結晶性シリカの吸入により生じる。\n\n（2）— 非正答肢\n　採石場労働者、石切り工、研磨作業員、ガラス職人に多い。\n\n（3）— 非正答肢\n　肺結核及び非結核性肺抗酸菌症を発症するリスクが高い。\n\n（4）— 非正答肢\n　急性けい肺症は、短期間（数か月～数年）の多量の原因物質ばく露により引き起こされる。\n\n（5）◎ 公式公表正答\n　胸部エックス線写真で下肺野に線状影が多く見られる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"じん肺法（e-Gov）","url":"https://laws.e-gov.go.jp/law/335AC0000000030?occasion_date=20240401"},{"label":"粉じん障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/354M50002000018?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question06/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question06/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-07","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":7,"question":"電離放射線の生体影響に関する次の記述のうち、誤っているものはどれか。","options":["細胞分裂が盛んな組織は、放射線感受性が高い。","しきい線量以下では、確定的影響は見られない。","眼の水晶体の混濁は、確定的影響かつ晩発影響である。","最も放射線感受性が高い細胞は、卵巣の濾胞上皮細胞である。","放射線誘発がんの代表的なものとして、白血病が挙げられる。"],"correctIndex":3,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"電離放射線の生体影響","point":"放射線感受性は、一般に分裂頻度が高く未分化な細胞ほど高く、リンパ球や造血系細胞、生殖細胞などが高感受性です。確定的影響にはしきい線量があり、水晶体混濁は晩発性の確定的影響です。一方、白血病などの発がんは確率的影響として扱います。","conclusion":"正答（4）：最も放射線感受性が高い細胞を卵巣の濾胞上皮細胞とする点が誤り。","choicesExplain":"（1）— 非正答肢\n　細胞分裂が盛んな組織は、放射線感受性が高い。\n\n（2）— 非正答肢\n　しきい線量以下では、確定的影響は見られない。\n\n（3）— 非正答肢\n　眼の水晶体の混濁は、確定的影響かつ晩発影響である。\n\n（4）◎ 公式公表正答\n　最も放射線感受性が高い細胞は、卵巣の濾胞上皮細胞である。\n\n（5）— 非正答肢\n　放射線誘発がんの代表的なものとして、白血病が挙げられる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"電離放射線障害防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000041?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question07/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question07/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-08","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":8,"question":"減圧症に関する次の記述のうち、適切でないものはどれか。","options":["窒素は、脂肪含量の高い組織に溶解しやすい。","減圧症は、圧力が急速に減少することにより、血液又は組織に溶解していたガスが気泡を形成することで生じる。","心臓内の右左短絡は、減圧症の危険因子である。","スクイーズと呼ばれる息切れ、胸痛などの呼吸器症状が生じる。","減圧性の骨壊死が生じる。"],"correctIndex":3,"category":"労働衛生管理総論","cluster":"酸欠・高気圧","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"減圧症・気圧外傷","point":"減圧症は、高圧下で血液・組織に溶けた主に窒素が、急な減圧により気泡化して生じます。息切れ、胸痛、咳などの重い呼吸器症状は「チョークス」と呼ばれます。スクイーズは降下時などに閉鎖腔内外の圧差で起こる耳・副鼻腔・マスク内などの圧外傷です。脂肪組織への窒素溶解、右左短絡、骨壊死も重要です。","conclusion":"正答（4）：「スクイーズ」は呼吸器症状の名称ではない。","choicesExplain":"（1）— 非正答肢\n　窒素は、脂肪含量の高い組織に溶解しやすい。\n\n（2）— 非正答肢\n　減圧症は、圧力が急速に減少することにより、血液又は組織に溶解していたガスが気泡を形成することで生じる。\n\n（3）— 非正答肢\n　心臓内の右左短絡は、減圧症の危険因子である。\n\n（4）◎ 公式公表正答\n　スクイーズと呼ばれる息切れ、胸痛などの呼吸器症状が生じる。\n\n（5）— 非正答肢\n　減圧性の骨壊死が生じる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"高気圧作業安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000040?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question08/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question08/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-09","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":9,"question":"酸素欠乏症及び硫化水素中毒とその予防に関する次の記述のうち、適切でないものはどれか。","options":["酵母など発酵する物を入れてある醸造槽の内部での作業は、酸素欠乏症の危険がある。","空気中の酸素濃度が12～16％程度では、一般に、集中力の低下や、頭痛、吐き気などの症状がみられる。","硫化水素は無色で、その比重は空気より大であり、滞留性がある。","高濃度の硫化水素は、脳細胞内の呼吸酵素の働きを阻害し、意識消失を瞬時に引き起こす。","空気中の硫化水素濃度が１～５ppmで、嗅覚麻痺が生じる。"],"correctIndex":4,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"酸素欠乏症・硫化水素中毒","point":"硫化水素は無色、空気より重く、低所に滞留しやすいガスです。低濃度では腐卵臭を感じますが、高濃度では嗅覚疲労・嗅神経麻痺が起こり、臭いを感じなくなります。1～5 ppm程度で嗅覚麻痺とするのは誤りです。高濃度では細胞呼吸を阻害し、急速な意識消失を起こします。発酵槽などは酸素消費・ガス発生により酸欠危険があります。","conclusion":"正答（5）：1～5 ppmで嗅覚麻痺は起こらない。","choicesExplain":"（1）— 非正答肢\n　酵母など発酵する物を入れてある醸造槽の内部での作業は、酸素欠乏症の危険がある。\n\n（2）— 非正答肢\n　空気中の酸素濃度が12～16％程度では、一般に、集中力の低下や、頭痛、吐き気などの症状がみられる。\n\n（3）— 非正答肢\n　硫化水素は無色で、その比重は空気より大であり、滞留性がある。\n\n（4）— 非正答肢\n　高濃度の硫化水素は、脳細胞内の呼吸酵素の働きを阻害し、意識消失を瞬時に引き起こす。\n\n（5）◎ 公式公表正答\n　空気中の硫化水素濃度が１～５ppmで、嗅覚麻痺が生じる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"酸素欠乏症等防止規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000042?occasion_date=20240401"},{"label":"厚生労働省：酸素欠乏症等防止対策","url":"https://www.mhlw.go.jp/new-info/kobetu/roudou/gyousei/anzen/dl/040325-3a.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question09/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question09/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-10","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":10,"question":"振動障害の診断に用いられる検査項目として、適切でないものは次のうちどれか。","options":["握力（最大握力、瞬発握力）","手指の皮膚温","血圧","爪圧迫","24時間心電図"],"correctIndex":4,"category":"物理的因子","cluster":"騒音・振動","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"振動障害の検査","point":"振動障害では、末梢循環・末梢神経・運動機能を評価します。握力、手指皮膚温、血圧、爪圧迫試験、振動覚・痛覚、冷水負荷などが用いられます。24時間心電図は不整脈等の循環器評価に用いる検査であり、振動障害の診断項目としては通常位置づけません。","conclusion":"正答（5）：24時間心電図は標準的な振動障害検査項目ではない。","choicesExplain":"（1）— 非正答肢\n　握力（最大握力、瞬発握力）\n\n（2）— 非正答肢\n　手指の皮膚温\n\n（3）— 非正答肢\n　血圧\n\n（4）— 非正答肢\n　爪圧迫\n\n（5）◎ 公式公表正答\n　24時間心電図","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場における労働衛生対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzeneisei03.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question10/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question10/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-11","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":11,"question":"職場における熱中症予防に関する次の記述のうち、適切でないものはどれか。","options":["糖尿病で血糖値が高い場合は、発症のリスクが高い。","日射がある場合、ＷＢＧＴ値を求める計算において、気温（乾球温度）は算出に用いない。","暑熱順化は、暑熱順化していない状態から７日以上かけて熱へのばく露時間を次第に長くすることで行う。","身体作業強度（代謝率レベル）が高くなるほど、適用すべきＷＢＧＴ基準値は低くなる。","休憩中の体温が作業開始前の体温に戻らない場合は、熱へのばく露を止める。"],"correctIndex":1,"category":"物理的因子","cluster":"温熱・気象","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"熱中症予防とWBGT","point":"屋外で日射がある場合は、WBGT＝0.7×自然湿球温度＋0.2×黒球温度＋0.1×乾球温度です。屋内又は日射がない場合は乾球温度を使わず、0.7×自然湿球＋0.3×黒球です。身体作業強度が高いほど許容されるWBGT基準値は低くなります。糖尿病、脱水、未順化などはリスク要因で、休憩で体温が戻らない場合はばく露を中止します。","conclusion":"正答（2）：日射がある場合のWBGT算出にも乾球温度を用いる。","choicesExplain":"（1）— 非正答肢\n　糖尿病で血糖値が高い場合は、発症のリスクが高い。\n\n（2）◎ 公式公表正答\n　日射がある場合、ＷＢＧＴ値を求める計算において、気温（乾球温度）は算出に用いない。\n\n（3）— 非正答肢\n　暑熱順化は、暑熱順化していない状態から７日以上かけて熱へのばく露時間を次第に長くすることで行う。\n\n（4）— 非正答肢\n　身体作業強度（代謝率レベル）が高くなるほど、適用すべきＷＢＧＴ基準値は低くなる。\n\n（5）— 非正答肢\n　休憩中の体温が作業開始前の体温に戻らない場合は、熱へのばく露を止める。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：職場における熱中症予防情報","url":"https://neccyusho.mhlw.go.jp/"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question11/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question11/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-12","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":12,"question":"視覚に関する次の記述のうち、適切でないものはどれか。","options":["近視とは、眼球内に入ってきた平行光線が網膜の手前で焦点を結ぶ状態をいう。","乱視は、眼球内部を満たすゼリー状の硝子体のゆがみにより、焦点が複数できることで生じる。","眼球をカメラに例えると、水晶体はレンズ、網膜はフィルムに相当する。","眼は、外界の明るさの変化に対し、瞳孔径の変化と網膜の順応によって対応する。","視力検査には、遠見視力検査（５ｍ視力）に加え、近見視力検査（50cm視力又は30cm視力）がある。"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"視覚・屈折異常","point":"乱視は主に角膜や水晶体の曲率が方向によって異なるため、光が一点に結像しない状態です。硝子体のゆがみを主因とする説明は不適切です。近視は平行光線が網膜の手前で結像します。水晶体はレンズ、網膜はフィルムに相当し、明暗への適応は瞳孔径の変化と網膜の明順応・暗順応によります。","conclusion":"正答（2）：乱視の主因を硝子体のゆがみとする点が誤り。","choicesExplain":"（1）— 非正答肢\n　近視とは、眼球内に入ってきた平行光線が網膜の手前で焦点を結ぶ状態をいう。\n\n（2）◎ 公式公表正答\n　乱視は、眼球内部を満たすゼリー状の硝子体のゆがみにより、焦点が複数できることで生じる。\n\n（3）— 非正答肢\n　眼球をカメラに例えると、水晶体はレンズ、網膜はフィルムに相当する。\n\n（4）— 非正答肢\n　眼は、外界の明るさの変化に対し、瞳孔径の変化と網膜の順応によって対応する。\n\n（5）— 非正答肢\n　視力検査には、遠見視力検査（５ｍ視力）に加え、近見視力検査（50cm視力又は30cm視力）がある。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"情報機器作業における労働衛生管理ガイドライン","url":"https://www.mhlw.go.jp/content/000539604.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question12/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question12/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-13","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":13,"question":"厚生労働省の「健康診断結果に基づき事業者が講ずべき措置に関する指針」に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nただし、医師等とは健康診断の結果についての意見の聴取を行う医師又は歯科医師をいうものとする。\n\nイ　事業者は、医師等に対し、意見の聴取を行う上で必要となる労働者の業務に関する情報を提供する必要がある。\nロ　事業者は、医師等に対し、健康診断個人票の医師等の意見欄に、就業上の措置に関する意見を記入することを求める。\nハ　事業者は、就業区分に応じた就業上の措置を決定する場合には、あらかじめ当該労働者の意見を聴き、その労働者の了解が得られるよう努める。\nニ　事業者は、医師等の意見に基づき、労働者に就業制限を講じる場合には、衛生委員会で当該労働者の健康診断の結果について調査審議し、具体的な内容を決定する。","options":["イ　ロ","イ　ロ　ハ","イ　ハ　ニ","ロ　ハ　ニ","ロ　ニ"],"correctIndex":1,"category":"統計・疫学","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"健康診断後の措置","point":"事業者は医師等が適切に意見を述べられるよう、業務内容・作業環境・労働時間等の情報を提供し、健康診断個人票に就業上の措置に関する意見の記載を求めます。就業上の措置を決定するときは、労働者本人の意見を聴き、理解・了解が得られるよう努めます。一方、個人の健康診断結果そのものを衛生委員会で個別に調査審議して決定するものではありません。","conclusion":"正答（2）：イ・ロ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ　ロ\n\n（2）◎ 公式公表正答\n　イ　ロ　ハ\n\n（3）— 非正答肢\n　イ　ハ　ニ\n\n（4）— 非正答肢\n　ロ　ハ　ニ\n\n（5）— 非正答肢\n　ロ　ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"健康診断結果に基づき事業者が講ずべき措置に関する指針","url":"https://www.mhlw.go.jp/hourei/doc/kouji/K170417K0020.pdf"},{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question13/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question13/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-14","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":14,"question":"厚生労働省の「事業場における労働者の健康保持増進のための指針」に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\n\nイ　労働者の高齢化を見据えた取組として、筋力や認知機能等の心身の活力が低下するフレイルやロコモティブシンドロームの予防に取り組むことが重要である。\nロ　健康保持増進対策を継続的かつ計画的に行うための取組として、推進体制の確立、課題の把握、目標の設定、措置の決定、計画の作成、計画の実施、実施結果の評価の７項目が定められている。\nハ　労働者の健康状態の把握においては、転倒等の労働災害を防止するため、体力の状況を把握し、自らの身体機能の維持向上に取り組めるよう、ロコモ度テスト等の健康測定等を実施する。\nニ　健康指導は、運動指導、メンタルヘルスケア、栄養指導、口腔保健指導及び保健指導を含むもの又はこれらに関係するものであり、全ての措置の実施が困難な場合には、可能なものから実施する。","options":["イ　ロ　ハ","イ　ロ　ニ","イ　ハ　ニ","イ　ハ","ロ　ニ"],"correctIndex":2,"category":"メンタルヘルス・過重労働","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["メンタルヘルス・過重労働"],"explanation":{"title":"健康保持増進（THP）","point":"高齢化を見据え、フレイル・ロコモティブシンドロームの予防や体力状況の把握を行い、可能な健康指導から実施する考え方は適切です。継続的な健康保持増進は、健康保持増進方針の表明から始まり、推進体制、課題、目標、措置、計画、実施、評価・見直しへつなげます。ロは方針の表明や計画の見直しが抜けた不完全な列挙です。","conclusion":"正答（3）：イ・ハ・ニ。","choicesExplain":"（1）— 非正答肢\n　イ　ロ　ハ\n\n（2）— 非正答肢\n　イ　ロ　ニ\n\n（3）◎ 公式公表正答\n　イ　ハ　ニ\n\n（4）— 非正答肢\n　イ　ハ\n\n（5）— 非正答肢\n　ロ　ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"事業場における労働者の健康保持増進のための指針","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tb3637&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question14/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question14/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-15","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":15,"question":"厚生労働省の「労働者の心の健康の保持増進のための指針」に関する次の記述のうち、適切でないものはどれか。","options":["メンタルヘルスケアを継続的かつ計画的に行うため、心の健康づくり計画を策定し、各事業場における労働安全衛生に関する計画の中に位置づける。","心の健康づくり計画の策定、実施体制の整備等の具体的な実施方策や個人情報の保護に関する規程等の策定等に当たっては、衛生委員会等において調査審議を行う。","産業医等は、対策の実施状況の把握、教育研修の企画及び実施、セルフケア及びラインによるケアの支援、情報の収集及び提供、健康情報の保護等を行う。","メンタルヘルス不調への気付きと対応のため、産業医は、労働者、管理監督者、家族等からの相談に対して対応できる体制を整備し、相談等により把握した情報を事業者が事業場外の医療機関に提供する。","事業者が把握した心の健康に関する情報を理由として、期間を定めて雇用される者について契約の更新をしないことは、不利益な取扱いに該当する。"],"correctIndex":3,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"メンタルヘルス指針","point":"メンタルヘルスケアでは、心の健康づくり計画、衛生委員会等での調査審議、教育研修、相談体制、職場環境改善、個人情報保護を一体的に進めます。相談情報は機微性が高く、本人の同意や利用目的、必要最小限の取扱いを踏まえる必要があります。事業者が把握情報を当然に外部医療機関へ提供するという仕組みではありません。","conclusion":"正答（4）：把握した相談情報を事業者が外部医療機関へ提供するという記述が不適切。","choicesExplain":"（1）— 非正答肢\n　メンタルヘルスケアを継続的かつ計画的に行うため、心の健康づくり計画を策定し、各事業場における労働安全衛生に関する計画の中に位置づける。\n\n（2）— 非正答肢\n　心の健康づくり計画の策定、実施体制の整備等の具体的な実施方策や個人情報の保護に関する規程等の策定等に当たっては、衛生委員会等において調査審議を行う。\n\n（3）— 非正答肢\n　産業医等は、対策の実施状況の把握、教育研修の企画及び実施、セルフケア及びラインによるケアの支援、情報の収集及び提供、健康情報の保護等を行う。\n\n（4）◎ 公式公表正答\n　メンタルヘルス不調への気付きと対応のため、産業医は、労働者、管理監督者、家族等からの相談に対して対応できる体制を整備し、相談等により把握した情報を事業者が事業場外の医療機関に提供する。\n\n（5）— 非正答肢\n　事業者が把握した心の健康に関する情報を理由として、期間を定めて雇用される者について契約の更新をしないことは、不利益な取扱いに該当する。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"職場における心の健康づくり","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000055195_00002.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question15/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question15/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-16","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":16,"question":"自律神経活動に関する次の記述のうち、誤っているものはどれか。","options":["瞳孔は交感神経活動により散大し、副交感神経活動により縮小する。","心拍数は交感神経活動により増加し、副交感神経活動により減少する。","気管支平滑筋は交感神経活動により収縮し、副交感神経活動により弛緩する。","消化運動は交感神経活動により抑制され、副交感神経活動により促進される。","膀胱排尿筋は交感神経活動により弛緩し、副交感神経活動により収縮する。"],"correctIndex":2,"category":"労働衛生管理総論","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"自律神経活動","point":"交感神経は「活動・闘争逃走」に適した方向に働き、瞳孔散大、心拍増加、気管支平滑筋弛緩（気管支拡張）、消化運動抑制、膀胱排尿筋弛緩を起こします。副交感神経は概ね逆方向で、瞳孔縮小、心拍減少、気管支収縮、消化運動促進、排尿筋収縮を起こします。","conclusion":"正答（3）：交感神経は気管支を拡張し、副交感神経は収縮させる。","choicesExplain":"（1）— 非正答肢\n　瞳孔は交感神経活動により散大し、副交感神経活動により縮小する。\n\n（2）— 非正答肢\n　心拍数は交感神経活動により増加し、副交感神経活動により減少する。\n\n（3）◎ 公式公表正答\n　気管支平滑筋は交感神経活動により収縮し、副交感神経活動により弛緩する。\n\n（4）— 非正答肢\n　消化運動は交感神経活動により抑制され、副交感神経活動により促進される。\n\n（5）— 非正答肢\n　膀胱排尿筋は交感神経活動により弛緩し、副交感神経活動により収縮する。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働省：職場における労働衛生対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/anzeneisei03.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question16/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question16/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-17","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":17,"question":"有機溶剤の健康影響等に関する次の記述のうち、誤っているものはどれか。","options":["トルエンは、接着剤や塗料の溶剤などに使用され、代謝物である尿中のメチル馬尿酸は、生物学的モニタリングの指標として利用される。","ジクロロメタンは、金属部品の脱脂洗浄剤などとして使用され、慢性ばく露により、肝臓が障害される。","ノルマルヘキサンは、溶剤や接着剤などで使用され、代謝物は2,5-ヘキサンジオンであり、末梢神経障害を生じる。","Ｎ,Ｎ-ジメチルホルムアミドは、合成繊維などの製造工程で溶剤として使用され、慢性ばく露により、頭痛、めまい、消化不良、肝機能障害などがみられる。","二硫化炭素は、レーヨンの製造工程で溶剤として使用され、高濃度のばく露では精神障害を生じる。"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"有機溶剤の健康影響・代謝物","point":"トルエンの生物学的モニタリングでは尿中馬尿酸が古典的指標です。尿中メチル馬尿酸はキシレンばく露の指標であり、物質と代謝物を入れ替えた選択肢です。ジクロロメタンは肝障害等、n-ヘキサンは2,5-ヘキサンジオンを介した末梢神経障害、DMFは肝機能障害、二硫化炭素は高濃度で精神・神経症状を生じます。","conclusion":"正答（1）：トルエンの代表的代謝物は尿中馬尿酸で、メチル馬尿酸はキシレン。","choicesExplain":"（1）◎ 公式公表正答\n　トルエンは、接着剤や塗料の溶剤などに使用され、代謝物である尿中のメチル馬尿酸は、生物学的モニタリングの指標として利用される。\n\n（2）— 非正答肢\n　ジクロロメタンは、金属部品の脱脂洗浄剤などとして使用され、慢性ばく露により、肝臓が障害される。\n\n（3）— 非正答肢\n　ノルマルヘキサンは、溶剤や接着剤などで使用され、代謝物は2,5-ヘキサンジオンであり、末梢神経障害を生じる。\n\n（4）— 非正答肢\n　Ｎ,Ｎ-ジメチルホルムアミドは、合成繊維などの製造工程で溶剤として使用され、慢性ばく露により、頭痛、めまい、消化不良、肝機能障害などがみられる。\n\n（5）— 非正答肢\n　二硫化炭素は、レーヨンの製造工程で溶剤として使用され、高濃度のばく露では精神障害を生じる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question17/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question17/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-18","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":18,"question":"有機溶剤に関する次のイ～ニの記述について、適切なもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　シンナーは、一般に、異なる有機溶剤を混合したもので、成分の有機溶\n剤の種類や混合比率には様々なものがある。\nロ　有機溶剤の使用に当たっては、その蒸気を吸入すること以外に皮膚から\nの吸収にも注意する必要がある。\nハ　有機溶剤を含む排ガスの処理のための空気清浄装置には、主として、吸\n着式排ガス処理装置又は燃焼式排ガス処理装置が用いられる。\nニ　有機溶剤用の直結式防毒マスクは、有機溶剤の濃度が２％以下の大気中\nで使用するものである。","options":["イ ロ ハ","イ ロ ニ","イ ハ","ロ ニ","ハ ニ"],"correctIndex":0,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"有機溶剤の性質・排ガス処理","point":"シンナーは複数の有機溶剤の混合物で、製品ごとに組成が異なります。有機溶剤は蒸気吸入だけでなく、皮膚吸収にも注意が必要です。排ガス処理には活性炭等による吸着式や、燃焼分解する燃焼式が用いられます。防毒マスクの使用上限は、隔離式・直結式・直結式小型の別やガスの種類で定められ、一律に「直結式は2％以下」とはできません。","conclusion":"正答（1）：イ・ロ・ハ。","choicesExplain":"（1）◎ 公式公表正答\n　イ ロ ハ\n\n（2）— 非正答肢\n　イ ロ ニ\n\n（3）— 非正答肢\n　イ ハ\n\n（4）— 非正答肢\n　ロ ニ\n\n（5）— 非正答肢\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20240401"},{"label":"呼吸用保護具の選択・使用","url":"https://www.mhlw.go.jp/content/11300000/001107730.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question18/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question18/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-19","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":19,"question":"作業環境測定に関する次の記述のうち、適切でないものはどれか。","options":["Ａ測定で、測定値が定量下限の値に満たない測定点があるときは、当該定量下限の値を当該測定点における測定値とみなして、管理区分の決定を行う。","Ｂ測定で、複数の作業位置でどこが最大濃度となるか予測できないときは、最大濃度となる可能性がある全ての点で測定を行い、得られた測定値の最大値をＢ測定値とする。","２日間測定を実施する場合、連続する２作業日に測定を行うことができない合理的な理由があるときは、必要最小限の間隔を空けた２作業日に測定を行ってよい。","Ｃ測定は、単位作業場所において、労働者にばく露される個人サンプリング法の対象物質の量が均一でないと見込まれる作業ごとに、それぞれ、５人以上の適切な数の労働者に対して行う。","Ｄ測定を行う場合は、作業が行われる時間のうち、対象となる個人サンプリング法の対象物質の濃度が最も高くなると思われる時間に、15分間のサンプリングを行う。"],"correctIndex":3,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"作業環境測定のA・B・C・D測定","point":"C測定は個人サンプリング法で、同様の作業を行い、ばく露が概ね均等と見込まれる労働者群から適切な人数を選び、作業時間を通じたばく露を把握します。「ばく露量が均一でないと見込まれる作業ごと」という説明は不適切です。D測定は、濃度が最も高くなると見込まれる作業・時間に15分間測定し、短時間の高濃度ばく露を評価します。","conclusion":"正答（4）：C測定の対象集団の説明が逆。","choicesExplain":"（1）— 非正答肢\n　Ａ測定で、測定値が定量下限の値に満たない測定点があるときは、当該定量下限の値を当該測定点における測定値とみなして、管理区分の決定を行う。\n\n（2）— 非正答肢\n　Ｂ測定で、複数の作業位置でどこが最大濃度となるか予測できないときは、最大濃度となる可能性がある全ての点で測定を行い、得られた測定値の最大値をＢ測定値とする。\n\n（3）— 非正答肢\n　２日間測定を実施する場合、連続する２作業日に測定を行うことができない合理的な理由があるときは、必要最小限の間隔を空けた２作業日に測定を行ってよい。\n\n（4）◎ 公式公表正答\n　Ｃ測定は、単位作業場所において、労働者にばく露される個人サンプリング法の対象物質の量が均一でないと見込まれる作業ごとに、それぞれ、５人以上の適切な数の労働者に対して行う。\n\n（5）— 非正答肢\n　Ｄ測定を行う場合は、作業が行われる時間のうち、対象となる個人サンプリング法の対象物質の濃度が最も高くなると思われる時間に、15分間のサンプリングを行う。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"個人サンプリング法による作業環境測定","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc4770&dataType=1&pageNo=1"},{"label":"作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question19/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question19/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-20","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":20,"question":"局所排気装置に関する次のイ～ニの記述について、適切でないものの組合せは、（１）～（５）のうちどれか。\nイ　外付け式フードでは、熱による上昇気流がある場合などを除き、一般に、\n上方吸引型より下方吸引型の方が有効である。\nロ　囲い式フードの制御風速は、フード開口面における最小風速である。\nハ　囲い式フードのうちのドラフトチェンバー型、カバー型及び建築ブース\n型では、建築ブース型が最も排気効果が高い。\nニ　抑制濃度とは、局所排気装置を稼働させた状態で、単位作業場所におい\nて、作業が行われる時間のうち、空気中の有害物の濃度が最も高くなると思われる位置及び時間において行われた測定によって得られた濃度である。","options":["イ ロ","イ ニ","ロ ハ","ロ ニ","ハ ニ"],"correctIndex":4,"category":"作業環境測定・換気","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"局所排気装置・フード","point":"外付け式フードは、有害物を作業者の呼吸域を通過させない配置が重要で、一般には上方吸引より側方・下方吸引が有効です。囲い式フードの制御風速は開口面の最小風速です。囲いの程度が高いほど少ない排風量で捕捉でき、建築ブース型が常に最も排気効果が高いわけではありません。また抑制濃度は特定の設備方式の性能要件として定める濃度で、単位作業場所の最高位置・時間で得た値という定義ではありません。","conclusion":"正答（5）：ハ・ニが不適切。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ニ\n\n（3）— 非正答肢\n　ロ ハ\n\n（4）— 非正答肢\n　ロ ニ\n\n（5）◎ 公式公表正答\n　ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"有機溶剤中毒予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000036?occasion_date=20240401"},{"label":"作業環境測定・評価の手引き","url":"https://www.mhlw.go.jp/content/11300000/001240051.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question20/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question20/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-21","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":21,"question":"照明に関する次の記述のうち、適切なものはどれか。","options":["照度とは、単位立体角当たりに放出される光束を観測方向から見た見掛けの面積で割った値のことである。","グレアとは、照明の光が明滅し、物がちらついて見えることをいう。","間接照明は、光線のほとんどが対象に向けて放射される照明方式で、コントラストの強い影ができる。","演色評価数は、標準光源の色の見え方と対象とする照明の色の見え方を比較して、その色のずれを数値で表したもので、色のずれが大きいほどその値は大きくなる。","照明の光色は色温度で表され、色温度が高いと青みを帯びた光色、色温度が低いと赤みを帯びた光色となる。"],"correctIndex":4,"category":"物理的因子","cluster":"その他・総合","examLawDate":"2024-04-01","tags":["物理的因子"],"explanation":{"title":"照明・色温度","point":"照度は単位面積に入射する光束で、単位はlxです。輝度は観測方向から見た見かけの面積当たりの光度です。グレアはまぶしさによる不快・見えにくさで、単なる明滅ではありません。間接照明は天井・壁で反射させ、影やグレアを弱めます。演色評価数は基準光に近いほど高く、色温度は高いほど青白く、低いほど暖色になります。","conclusion":"正答（5）：色温度が高いほど青み、低いほど赤みを帯びる。","choicesExplain":"（1）— 非正答肢\n　照度とは、単位立体角当たりに放出される光束を観測方向から見た見掛けの面積で割った値のことである。\n\n（2）— 非正答肢\n　グレアとは、照明の光が明滅し、物がちらついて見えることをいう。\n\n（3）— 非正答肢\n　間接照明は、光線のほとんどが対象に向けて放射される照明方式で、コントラストの強い影ができる。\n\n（4）— 非正答肢\n　演色評価数は、標準光源の色の見え方と対象とする照明の色の見え方を比較して、その色のずれを数値で表したもので、色のずれが大きいほどその値は大きくなる。\n\n（5）◎ 公式公表正答\n　照明の光色は色温度で表され、色温度が高いと青みを帯びた光色、色温度が低いと赤みを帯びた光色となる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"事務所衛生基準規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000043?occasion_date=20240401"},{"label":"情報機器作業ガイドライン","url":"https://www.mhlw.go.jp/content/000539604.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question21/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question21/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-22","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":22,"question":"化学物質等の有害性等に関する次の記述のうち、誤っているものはどれか。","options":["変異原性とは、有害要因が細胞の染色体や遺伝子に作用し、損傷したり変化などを起こさせる性質をいい、変異原性のある物質の多くは、発がん性を有している。","生殖細胞変異原性とは、次世代に受け継がれる可能性がある突然変異を誘発する性質である。","日本産業衛生学会及び米国産業衛生専門家会議（ＡＣＧＩＨ）は、ヒトへの発がん性を、グループ１、グループ２Ａ、グループ２Ｂ及びグループ３に分類している。","特定標的臓器毒性（単回ばく露）とは、単回ばく露によって起こる特定臓器に対する特異的な非致死性の毒性である。","生殖毒性とは、雌雄の成体の生殖機能及び受精能力に対し悪影響を及ぼす性質及び子の発生に対し悪影響を及ぼす性質である。"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"化学物質の有害性分類","point":"変異原性、生殖細胞変異原性、特定標的臓器毒性、生殖毒性の説明はGHSの考え方に沿っています。IARCは発がんハザードをGroup 1、2A、2B、3に分類します。日本産業衛生学会は第1群・第2群A・第2群B等、ACGIHはA1～A5等を用い、名称と分類基準は同一ではありません。","conclusion":"正答（3）：Group 1・2A・2B・3はIARCの分類で、日産衛・ACGIHの共通分類ではない。","choicesExplain":"（1）— 非正答肢\n　変異原性とは、有害要因が細胞の染色体や遺伝子に作用し、損傷したり変化などを起こさせる性質をいい、変異原性のある物質の多くは、発がん性を有している。\n\n（2）— 非正答肢\n　生殖細胞変異原性とは、次世代に受け継がれる可能性がある突然変異を誘発する性質である。\n\n（3）◎ 公式公表正答\n　日本産業衛生学会及び米国産業衛生専門家会議（ＡＣＧＩＨ）は、ヒトへの発がん性を、グループ１、グループ２Ａ、グループ２Ｂ及びグループ３に分類している。\n\n（4）— 非正答肢\n　特定標的臓器毒性（単回ばく露）とは、単回ばく露によって起こる特定臓器に対する特異的な非致死性の毒性である。\n\n（5）— 非正答肢\n　生殖毒性とは、雌雄の成体の生殖機能及び受精能力に対し悪影響を及ぼす性質及び子の発生に対し悪影響を及ぼす性質である。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"IARC：発がん性分類一覧","url":"https://monographs.iarc.who.int/agents-classified-by-the-iarc/"},{"label":"厚生労働省：SDS・GHS","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question22/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question22/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"deta んマスクのろ過材の種類はＲＬ３である。","有機ガス用防毒マスクの吸収缶は、メタノール、二硫化炭素については、除毒能力試験の試験用ガスに比べて破過時間が長くなる傾向がある。","アンモニア用の直結式防毒マスクは、アンモニアの濃度が1.5％以下の大気中で使用するものである。","吸収缶の破過を知るために、有毒ガス等の臭いに頼ることは、そのばく露限界値にかかわらず、適切ではない。","ハロゲンガス用防毒マスクの吸収缶の色は灰色及び黒色で、二層に分けている。"],"correctIndex":1,"category":"労働衛生管理総論","cluster":"生理・疾病","examLawDate":"2024-04-01","tags":["労働衛生管理総論"],"explanation":{"title":"呼吸用保護具","point":"吸収缶の破過時間はガスの種類、濃度、湿度、温度、呼吸量で変わります。メタノールや二硫化炭素は有機ガス用吸収缶で保持されにくく、標準試験ガスより破過が早くなる傾向があり、専用缶や送気式を含めた選定が必要です。臭いは個人差・嗅覚疲労があり、交換時期の判断に使えません。RL3は油性ミスト・放射性粉じん等に対応する高性能ろ過材です。","conclusion":"正答（2）：メタノール・二硫化炭素は標準試験ガスより破過が早くなることがある。","choicesExplain":"（1）— 非正答肢\n　放射性物質による汚染のおそれのある区域内の作業で、オイルミストが混在する場合に使用する防じんマスクのろ過材の種類はＲＬ３である。\n\n（2）◎ 公式公表正答\n　有機ガス用防毒マスクの吸収缶は、メタノール、二硫化炭素については、除毒能力試験の試験用ガスに比べて破過時間が長くなる傾向がある。\n\n（3）— 非正答肢\n　アンモニア用の直結式防毒マスクは、アンモニアの濃度が1.5％以下の大気中で使用するものである。\n\n（4）— 非正答肢\n　吸収缶の破過を知るために、有毒ガス等の臭いに頼ることは、そのばく露限界値にかかわらず、適切ではない。\n\n（5）— 非正答肢\n　ハロゲンガス用防毒マスクの吸収缶の色は灰色及び黒色で、二層に分けている。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"呼吸用保護具の選択・使用","url":"https://www.mhlw.go.jp/content/11300000/001107730.pdf"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question25/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question25/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-26","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":26,"question":"厚生労働省の「石綿使用建築物等解体等業務特別教育規程」における教育の科目及び範囲について、下表のＡ～Ｃに入る語句の組合せとして、正しいものは（１）～（５）のうちどれか。\n\n【科目】｜【範囲】\n石綿の有害性｜石綿の性状、石綿による疾病の病理及び症状、Ａ\n石綿等の使用状況｜石綿を含有する製品の種類及び用途、Ｂ\n石綿等の粉じんの発散を抑制するための措置｜建築物、工作物又は船舶（鋼製の船舶に限る。）の解体等の作業の方法、Ｃ、作業場所の隔離の方法、その他石綿等の粉じんの発散を抑制するための措置について必要な事項\n保護具の使用方法｜保護具の種類、性能、使用方法及び管理\nその他石綿等のばく露の防止に関し必要な事項｜労働安全衛生法、労働安全衛生法施行令、労働安全衛生規則及び石綿障害予防規則中の関係条項、石綿等による健康障害を防止するため当該業務について必要な事項","options":["Ａ：喫煙の影響\nＢ：事前調査の方法\nＣ：湿潤化の方法","Ａ：喫煙の影響\nＢ：事前調査の方法\nＣ：局所排気装置等の点検の方法","Ａ：喫煙の影響\nＢ：分析調査の結果\nＣ：湿潤化の方法","Ａ：年齢の影響\nＢ：事前調査の方法\nＣ：湿潤化の方法","Ａ：年齢の影響\nＢ：分析調査の結果\nＣ：局所排気装置等の点検の方法"],"correctIndex":0,"category":"統計・疫学","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"石綿特別教育","point":"石綿解体等業務の特別教育では、石綿の性状・疾病に加えて喫煙の影響、石綿含有建材等の使用状況と事前調査の方法、粉じん発散抑制として作業方法・湿潤化・隔離等、保護具、関係法令を学びます。局所排気装置の点検が表の空欄に入るのではなく、解体等で中心となる湿潤化の方法が入ります。","conclusion":"正答（1）：A＝喫煙の影響、B＝事前調査の方法、C＝湿潤化の方法。","choicesExplain":"（1）◎ 公式公表正答\n　Ａ：喫煙の影響\nＢ：事前調査の方法\nＣ：湿潤化の方法\n\n（2）— 非正答肢\n　Ａ：喫煙の影響\nＢ：事前調査の方法\nＣ：局所排気装置等の点検の方法\n\n（3）— 非正答肢\n　Ａ：喫煙の影響\nＢ：分析調査の結果\nＣ：湿潤化の方法\n\n（4）— 非正答肢\n　Ａ：年齢の影響\nＢ：事前調査の方法\nＣ：湿潤化の方法\n\n（5）— 非正答肢\n　Ａ：年齢の影響\nＢ：分析調査の結果\nＣ：局所排気装置等の点検の方法","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"石綿障害予防規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/417M60000100021?occasion_date=20240401"},{"label":"厚生労働省：石綿対策","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/roudoukijun/sekimen/topics/tp050729-1.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question26/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question26/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-27","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":27,"question":"疫学、統計等に関する次のイ～ニの記述について、正しいもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　健康管理統計において、「ある時点における有所見者の割合」は動態デ\nータである。\nロ　統計上、二つの事象の間に強い相関が認められても、それらの間に因果\n関係がないことがある。\nハ　疫学において、ある疾病とその原因との関係の仮説をたて、その仮説に\n基づいて、原因のある群とない群に分け、その後追跡調査をして、疾病の発生の相違を調べる調査方法は、前向き調査といわれる。\nニ　ある集団の体重の平均が60kg、標準偏差が５kgで、正規分布をしている\n場合、55～65kgの範囲内にいる人数の割合は、その集団の約95％である。","options":["イ ロ","イ ハ ニ","イ ニ","ロ ハ","ロ ハ ニ"],"correctIndex":3,"category":"統計・疫学","cluster":"健康診断・健康管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"疫学・統計","point":"ある時点の有所見者割合は静態データ（有病割合）です。相関が強くても、交絡や偶然、逆因果などにより因果関係がないことがあります。原因へのばく露群・非ばく露群を設定し、その後の疾病発生を追跡するのは前向きコホート研究です。正規分布では平均±1標準偏差に約68％、±2標準偏差に約95％が含まれます。","conclusion":"正答（4）：ロ・ハ。","choicesExplain":"（1）— 非正答肢\n　イ ロ\n\n（2）— 非正答肢\n　イ ハ ニ\n\n（3）— 非正答肢\n　イ ニ\n\n（4）◎ 公式公表正答\n　ロ ハ\n\n（5）— 非正答肢\n　ロ ハ ニ","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"厚生労働統計一覧","url":"https://www.mhlw.go.jp/toukei/itiran/"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question27/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question27/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-28","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":28,"question":"安全管理等に関する次の記述のうち、適切でないものはどれか。","options":["事業場トップは、まず事業場の安全衛生についての目標を設定させ、それを踏まえ、自らの安全衛生に対する姿勢を明確にした安全衛生方針を表明する。","事業場トップは、各級の管理監督者に必要な権限を委任した場合でも、それぞれの業務の履行状況の報告を求めるなどによって事業場の安全衛生管理の実状を把握し、必要な場合には改善などの措置を講じることを指示する。","日常的にＫＹＴ（危険予知訓練）を行う職場では、常日頃から危険要因を見出す訓練が行われ、危険に対する感受性が高まることから、リスクアセスメントの危険性又は有害性の特定がスムーズに行えるようになる。","５Ｓのうちのしつけは、４Ｓ（整理、整頓、清掃、清潔）が全員に徹底され、適切に実行されるようにするための基盤である。","ヒヤリ・ハット活動は、作業中にヒヤリとしたことやハッとしたことを危険情報として活用する安全衛生活動で、当事者の責任を追及するためではなく、危険情報の把握をねらいとしている。"],"correctIndex":0,"category":"安全衛生管理・法令","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["安全衛生管理・法令"],"explanation":{"title":"安全衛生方針・KYT・5S","point":"トップはまず安全衛生方針を表明し、その方針を具体化する安全衛生目標・計画を定めます。順序を逆にした（1）が不適切です。権限を委任してもトップの統括責任は残ります。KYTは危険感受性を高め、5Sの「しつけ」は4Sを習慣化する基盤です。ヒヤリ・ハットは責任追及ではなく、潜在危険の共有・改善が目的です。","conclusion":"正答（1）：安全衛生方針を先に表明し、それに基づき目標を設定する。","choicesExplain":"（1）◎ 公式公表正答\n　事業場トップは、まず事業場の安全衛生についての目標を設定させ、それを踏まえ、自らの安全衛生に対する姿勢を明確にした安全衛生方針を表明する。\n\n（2）— 非正答肢\n　事業場トップは、各級の管理監督者に必要な権限を委任した場合でも、それぞれの業務の履行状況の報告を求めるなどによって事業場の安全衛生管理の実状を把握し、必要な場合には改善などの措置を講じることを指示する。\n\n（3）— 非正答肢\n　日常的にＫＹＴ（危険予知訓練）を行う職場では、常日頃から危険要因を見出す訓練が行われ、危険に対する感受性が高まることから、リスクアセスメントの危険性又は有害性の特定がスムーズに行えるようになる。\n\n（4）— 非正答肢\n　５Ｓのうちのしつけは、４Ｓ（整理、整頓、清掃、清潔）が全員に徹底され、適切に実行されるようにするための基盤である。\n\n（5）— 非正答肢\n　ヒヤリ・ハット活動は、作業中にヒヤリとしたことやハッとしたことを危険情報として活用する安全衛生活動で、当事者の責任を追及するためではなく、危険情報の把握をねらいとしている。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生マネジメントシステム指針","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc4379&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question28/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question28/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-29","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":29,"question":"厚生労働省の「労働安全衛生マネジメントシステムに関する指針」の内容及びこれに基づく労働安全衛生マネジメントシステムの運用に関する次の記述のうち、適切でないものはどれか。","options":["安全衛生計画の実施状況等の日常的な点検とは、安全衛生計画が着実に実施されているかどうか、安全衛生目標は着実に達成されつつあるかどうかなどについて、安全衛生計画の実施事項の担当部門等が、点検を行うことである。","労働安全衛生マネジメントシステムに従って行う措置を適切に実施する体制の整備には、労働者に対して労働安全衛生マネジメントシステムに関する教育を行うことが含まれる。","指針は、事業者が取り組むべき事項を具体的に示すとともに、事業者の取組を国が支援するための事項を示している。","労働災害、事故等が発生した場合におけるこれらの原因の調査並びに問題点の把握及び改善を実施する手順には、いつ、誰が、何をどのようにするか等について定める。","事業場内部の者によるシステム監査は、事業場外部の者によるシステム監査に比べて、監査テーマを特定して、実態を詳しく調査し、評価することができる。"],"correctIndex":2,"category":"統計・疫学","cluster":"疫学・統計","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"労働安全衛生マネジメントシステム","point":"OSHMS指針は、事業者が方針、目標、計画、実施体制、日常点検、システム監査、見直し等を継続的に運用するための枠組みを示します。国が事業者を支援するための事項を示すことが直接の内容ではありません。事故原因調査の手順は「いつ、誰が、何を、どのように」を明確にし、内部監査には事業場の実態を詳細に把握しやすい利点があります。","conclusion":"正答（3）：指針は事業者のシステム運用事項を示すもので、国の支援事項を定める指針ではない。","choicesExplain":"（1）— 非正答肢\n　安全衛生計画の実施状況等の日常的な点検とは、安全衛生計画が着実に実施されているかどうか、安全衛生目標は着実に達成されつつあるかどうかなどについて、安全衛生計画の実施事項の担当部門等が、点検を行うことである。\n\n（2）— 非正答肢\n　労働安全衛生マネジメントシステムに従って行う措置を適切に実施する体制の整備には、労働者に対して労働安全衛生マネジメントシステムに関する教育を行うことが含まれる。\n\n（3）◎ 公式公表正答\n　指針は、事業者が取り組むべき事項を具体的に示すとともに、事業者の取組を国が支援するための事項を示している。\n\n（4）— 非正答肢\n　労働災害、事故等が発生した場合におけるこれらの原因の調査並びに問題点の把握及び改善を実施する手順には、いつ、誰が、何をどのようにするか等について定める。\n\n（5）— 非正答肢\n　事業場内部の者によるシステム監査は、事業場外部の者によるシステム監査に比べて、監査テーマを特定して、実態を詳しく調査し、評価することができる。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生マネジメントシステム指針","url":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc4379&dataType=1&pageNo=1"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question29/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question29/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"general-2024-30","subject":"労働衛生一般","year":2024,"yearLabel":"令和6年度","round":52,"number":30,"question":"厚生労働省の「化学物質等による危険性又は有害性等の調査等に関する指針」に関する次の記述のうち、適切でないものはどれか。","options":["化学物質管理者を選任し、リスクアセスメント及びリスク低減措置に関する技術的事項を管理させる。","リスクアセスメント対象物の安全データシート（ＳＤＳ）を入手した場合には、ＳＤＳに記載されている情報を確認することにより、危険性又は有害性を特定する。","リスクアセスメント対象物による疾病のリスクの低減措置の検討においては、法令に定められた事項を行うことを前提として、リスクアセスメント対象物に係る機械設備等の密閉化を最優先とする。","リスクアセスメント対象物の「ばく露の程度」及び「有害性の程度」を考慮して行うリスクの見積りでは、ばく露の程度の把握に関し、気中濃度を実測する方法のほか、数理モデルを用いて推定する方法がある。","毎回異なる環境で作業を行う場合のリスクアセスメントの方法として、典型的な作業でのばく露濃度測定結果を基にリスク低減措置マニュアル等を作成し、これに定められた措置の実施状況を確認する方法がある。"],"correctIndex":2,"category":"統計・疫学","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["統計・疫学"],"explanation":{"title":"化学物質リスクアセスメント","point":"法令で定める措置を確実に実施した上で、リスク低減措置は、①危険有害性の低い物質への代替・化学物質の除去、②密閉化・局排等の工学的対策、③作業手順・時間・立入管理等の管理的対策、④個人用保護具の順に検討します。SDSで有害性を特定し、実測又は数理モデルでばく露を見積もり、作業が変動する場合は標準手順で管理状況を確認します。","conclusion":"正答（3）：最優先は除去・代替であり、機械設備の密閉化ではない。","choicesExplain":"（1）— 非正答肢\n　化学物質管理者を選任し、リスクアセスメント及びリスク低減措置に関する技術的事項を管理させる。\n\n（2）— 非正答肢\n　リスクアセスメント対象物の安全データシート（ＳＤＳ）を入手した場合には、ＳＤＳに記載されている情報を確認することにより、危険性又は有害性を特定する。\n\n（3）◎ 公式公表正答\n　リスクアセスメント対象物による疾病のリスクの低減措置の検討においては、法令に定められた事項を行うことを前提として、リスクアセスメント対象物に係る機械設備等の密閉化を最優先とする。\n\n（4）— 非正答肢\n　リスクアセスメント対象物の「ばく露の程度」及び「有害性の程度」を考慮して行うリスクの見積りでは、ばく露の程度の把握に関し、気中濃度を実測する方法のほか、数理モデルを用いて推定する方法がある。\n\n（5）— 非正答肢\n　毎回異なる環境で作業を行う場合のリスクアセスメントの方法として、典型的な作業でのばく露濃度測定結果を基にリスク低減措置マニュアル等を作成し、これに定められた措置の実施状況を確認する方法がある。","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"化学物質リスクアセスメント指針","url":"https://www.mhlw.go.jp/content/11300000/001091557.pdf"},{"label":"厚生労働省：新たな化学物質規制","url":"https://www.mhlw.go.jp/stf/newpage_11237.html"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/gen-question30/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/gen-question30/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-01","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":1,"question":"常時300人の労働者を使用する造船業の事業場における安全衛生管理体制に関する次の文中のＡ～Ｃに入る語句又は数値の組合せとして、労働安全衛生法令上、正しいものは（１）～（５）のうちどれか。\n\n事業者は、Ａを選任し、その者に安全管理者、衛生管理者又は法令の規定により技術的な事項を管理する者の指揮をさせるとともに、所定の業務を統括管理させなければならない。\n\nまた、Ａの選任は、Ａを選任すべき事由が発生した日からＢ日以内に行わなければならない。\n\nさらに、事業者は、安全委員会及び衛生委員会又はこれらに代えて安全衛生委員会を設置しなければならず、衛生委員会又は安全衛生委員会の委員は、Ｃのうちから事業者が指名した者を含めて構成しなければならない。","options":["Ａ：総括安全衛生管理者\nＢ：14日\nＣ：衛生管理者","Ａ：総括安全衛生管理者\nＢ：14日\nＣ：作業環境測定士","Ａ：総括安全衛生管理者\nＢ：30日\nＣ：作業環境測定士","Ａ：統括安全衛生責任者\nＢ：14日\nＣ：作業環境測定士","Ａ：統括安全衛生責任者\nＢ：30日\nＣ：衛生管理者"],"correctIndex":0,"category":"作業環境測定・換気","cluster":"管理・マネジメント","examLawDate":"2024-04-01","tags":["作業環境測定・換気"],"explanation":{"title":"造船業の安全衛生管理体制","point":"造船業は常時300人以上で総括安全衛生管理者の選任が必要です。選任すべき事由が発生した日から14日以内に選任します。総括安全衛生管理者は安全管理者・衛生管理者等を指揮し、業務を統括管理します。衛生委員会又は安全衛生委員会は、衛生管理者のうちから事業者が指名した者を委員に含めます。","conclusion":"正答（1）：総括安全衛生管理者・14日・衛生管理者。","choicesExplain":"（1）◎ 公式公表正答\n　Ａ：総括安全衛生管理者\nＢ：14日\nＣ：衛生管理者\n\n（2）— 非正答肢\n　Ａ：総括安全衛生管理者\nＢ：14日\nＣ：作業環境測定士\n\n（3）— 非正答肢\n　Ａ：総括安全衛生管理者\nＢ：30日\nＣ：作業環境測定士\n\n（4）— 非正答肢\n　Ａ：統括安全衛生責任者\nＢ：14日\nＣ：作業環境測定士\n\n（5）— 非正答肢\n　Ａ：統括安全衛生責任者\nＢ：30日\nＣ：衛生管理者","trap":"","keywords":"","related":"","current":"【出題当時】2024-04-01時点を基準に採点し、公式公表正答を保持する。\n【現在】2026-10-18時点。出題後に制度変更が確認できた問題は、この下の改正カードで別表示する。改正の影響を過去問の正答へ遡及させない。","evidence":"正答番号は安全衛生技術試験協会の公表問題と再照合。解説本文は、各年度の公的資料URL付きレビュー資料と照合した。各肢について一次資料で個別確認していない修正文は掲載しない。","refs":[{"label":"労働安全衛生法（e-Gov）","url":"https://laws.e-gov.go.jp/law/347AC0000000057?occasion_date=20240401"},{"label":"労働安全衛生規則（e-Gov）","url":"https://laws.e-gov.go.jp/law/347M50002000032?occasion_date=20240401"},{"label":"安全衛生技術試験協会 公表問題","url":"https://www.exam.or.jp/cskohyo/"},{"label":"OSH-Management 同年度・同問（参考）","url":"https://osh-management.com/consultant/health/2024/low-question01/"}],"audit":"2026-10-18 公式正答＋公的資料URL付き年度別レビュー再照合","choicesVerified":false,"auditBadge":"✅ 公式正答照合済｜📚 解説は公的資料レビュー照合済"},"oshUrl":"https://osh-management.com/consultant/health/2024/low-question01/","sourceType":"公表問題（公式正答照合済）＋公的資料レビュー","currentBadge":"現行差分を確認","currentUpdates":[],"detailLevel":"公的資料レビュー照合済","answerVerified":"安全衛生技術試験協会の公表問題（○印）と再照合済","lawLinks":[]},{"id":"law-2024-02","subject":"労働衛生関係法令","year":2024,"yearLabel":"令和6年度","round":52,"number":2,"question":"次のイ～ホに掲げる機械等のうち、労働安全衛生法令上、厚生労働大臣が定める規格又は安全装置を具備しなければ、譲渡し、貸与し、又は設置してはならない機械等に該当するもののみを全て挙げたものは（１）～（５）のうちどれか。\nイ　アンモニア用防毒マスク\nロ　硫化水素用防毒マスク\nハ　空気呼吸器\nニ　潜水器\nホ　工業用のガンマ線照射装置","options":["イ ロ","イ ハ ニ","イ ニ ホ","ロ ニ ホ","ハ ホ"],"correctIndex":2,"category":"化学物質・毒性","cluster":"化学物質管理","examLawDate":"2024-04-01","tags":["化学物質・毒性"],"explanation":{"title":"譲渡等制限を受ける機械等","point":"法第42条の対象は、厚生労働大臣が定める規格又は安全装置を備えなければ譲渡・貸与・設置できない機械等です。本問の選択肢では、アンモニア用防毒マスク、潜水器、工業用ガンマ線照射装置が該当します。硫化水素用防毒マスク、空気呼吸器は、令和6年4月1日時点の列挙では本問の対象に含まれません。","conclusion":"正答（3）：アンモニア用防毒マスク・潜水器・工業用ガンマ線照射装置。","cho
